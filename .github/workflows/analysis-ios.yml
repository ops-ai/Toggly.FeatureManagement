name: iOS SDK - Analysis

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.iOS/**'
      - '.github/workflows/analysis-ios.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.iOS/**'
      - '.github/workflows/analysis-ios.yml'
  workflow_dispatch:

env:
  SDK_ROOT: Toggly.FeatureManagement.iOS

jobs:
  build-and-test:
    runs-on: macos-15
    strategy:
      matrix:
        xcode: ['16.1', '16.2']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show Swift version
        run: swift --version

      - name: Resolve package dependencies
        working-directory: ${{ env.SDK_ROOT }}
        run: swift package resolve

      - name: Build all packages
        working-directory: ${{ env.SDK_ROOT }}
        run: swift build -v

      - name: Run tests
        working-directory: ${{ env.SDK_ROOT }}
        run: swift test -v --enable-code-coverage

      - name: Generate code coverage report
        if: matrix.xcode == '16.2'
        working-directory: ${{ env.SDK_ROOT }}
        run: |
          xcrun llvm-cov export \
            .build/debug/TogglyPackageTests.xctest/Contents/MacOS/TogglyPackageTests \
            -instr-profile .build/debug/codecov/default.profdata \
            -format lcov \
            -ignore-filename-regex '.build|Tests' \
            2>/dev/null \
            | sed "s|${GITHUB_WORKSPACE}/||g" \
            > coverage.lcov || true

      - name: Upload coverage to Codecov
        if: matrix.xcode == '16.2'
        uses: codecov/codecov-action@v4
        with:
          file: ${{ env.SDK_ROOT }}/coverage.lcov
          flags: ios-sdk
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: matrix.xcode == '16.2'
        uses: actions/upload-artifact@v4
        with:
          name: ios-coverage
          path: ${{ env.SDK_ROOT }}/coverage.lcov
          retention-days: 7
          if-no-files-found: ignore

  lint:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        working-directory: ${{ env.SDK_ROOT }}
        run: swiftlint lint --reporter github-actions-logging || true

      - name: Generate SwiftLint report for SonarQube
        working-directory: ${{ env.SDK_ROOT }}
        run: |
          swiftlint lint 2>/dev/null \
            | sed "s|${GITHUB_WORKSPACE}/||g" \
            > swiftlint-report.txt || true

      - name: Upload SwiftLint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-swiftlint
          path: ${{ env.SDK_ROOT }}/swiftlint-report.txt
          retention-days: 7
          if-no-files-found: ignore

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: 'toggly-sdks-ios'
          path: ${{ env.SDK_ROOT }}
          format: 'XML'
          out: 'dependency-check-reports'
          args: >
            --disableAssembly
            --disableRubygems
            --disableBundleAudit
            --disableNodeJS
            --disableNodeAudit
            --disablePyPkg
            --disablePyDist
        continue-on-error: true

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report-ios
          path: dependency-check-reports/
          retention-days: 7
          if-no-files-found: ignore

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [build-and-test, lint, dependency-check]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: ios-coverage
          path: coverage-artifacts/
        continue-on-error: true

      - name: Download SwiftLint report
        uses: actions/download-artifact@v4
        with:
          name: ios-swiftlint
          path: swiftlint-artifacts/
        continue-on-error: true

      - name: Download Dependency Check report
        uses: actions/download-artifact@v4
        with:
          name: dependency-check-report-ios
          path: dependency-check-reports/
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-ios
            -Dsonar.organization=ops-ai
            -Dsonar.projectName="Toggly SDKs - iOS"
            -Dsonar.sources=${{ env.SDK_ROOT }}
            -Dsonar.exclusions=**/.build/**,**/Package.resolved
            -Dsonar.test.inclusions=**/Tests/**
            -Dsonar.swift.coverage.reportPaths=coverage-artifacts/${{ env.SDK_ROOT }}/coverage.lcov
            -Dsonar.swift.swiftlint.report=swiftlint-artifacts/swiftlint-report.txt
        continue-on-error: true

      - name: SonarQube Server Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-ios
            -Dsonar.projectName="Toggly SDKs - iOS"
            -Dsonar.sources=${{ env.SDK_ROOT }}
            -Dsonar.exclusions=**/.build/**,**/Package.resolved
            -Dsonar.test.inclusions=**/Tests/**
            -Dsonar.swift.coverage.reportPaths=coverage-artifacts/${{ env.SDK_ROOT }}/coverage.lcov
            -Dsonar.swift.swiftlint.report=swiftlint-artifacts/swiftlint-report.txt
            -Dsonar.dependencyCheck.reportPath=dependency-check-reports/dependency-check-report.xml
        continue-on-error: true

  build-platforms:
    runs-on: macos-15
    strategy:
      matrix:
        destination:
          - 'platform=iOS Simulator,name=iPhone 16,OS=18.1'
          - 'platform=macOS'
          - 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=18.1'
          - 'platform=watchOS Simulator,name=Apple Watch Series 10 (46mm),OS=11.1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.1.app

      - name: Build for platform
        working-directory: ${{ env.SDK_ROOT }}
        run: |
          xcodebuild build \
            -scheme Toggly-Package \
            -destination '${{ matrix.destination }}' \
            -skipPackagePluginValidation \
            | xcpretty || true
