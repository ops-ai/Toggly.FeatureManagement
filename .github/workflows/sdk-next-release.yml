name: Next.js SDK - Build & Publish

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'publish = use manifest version; auto_bump = legacy CI bump'
        required: false
        default: 'publish'
        type: choice
        options:
          - publish
          - auto_bump
      bump_type:
        description: 'Bump type (only used when release_mode is auto_bump)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      packages:
        description: 'Packages to publish (comma-separated, or "all")'
        required: false
        default: 'all'
        type: string

permissions:
  contents: write
  id-token: write

env:
  SDK_ROOT: Toggly.FeatureManagement.Next
  CORE_MANIFEST: Toggly.FeatureManagement.Next/nextjs-toggly-core/package.json
  ALL_PACKAGES: nextjs-toggly-core nextjs-toggly-server nextjs-toggly-client nextjs-toggly-edge

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    defaults:
      run:
        working-directory: ${{ env.SDK_ROOT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Resolve release version
        id: release
        uses: ./.github/actions/resolve-release-version
        with:
          manifest_path: ${{ env.CORE_MANIFEST }}
          registry: npm
          package_name: '@ops-ai/nextjs-toggly-core'
          release_mode: ${{ github.event.inputs.release_mode || 'publish' }}
          bump_type: ${{ github.event.inputs.bump_type || 'patch' }}

      - name: Sync monorepo package versions
        if: steps.release.outputs.manifest_changed == 'true'
        run: |
          TARGET="${{ steps.release.outputs.version }}"
          for pkg in nextjs-toggly-server nextjs-toggly-client nextjs-toggly-edge; do
            cd "$pkg"
            npm version "$TARGET" --no-git-tag-version --allow-same-version
            cd ..
          done

      # Core may already be on npm (action=skip) while sibling packages still need
      # a version bump publish. Gate only on fail; package-level checks decide work.
      - name: Note independent package versions
        if: steps.release.outputs.action != 'fail'
        run: |
          TARGET="${{ steps.release.outputs.version }}"
          echo "Core resolved version: $TARGET (action=${{ steps.release.outputs.action }})"
          for pkg in ${{ env.ALL_PACKAGES }}; do
            VER=$(node -p "require('./$pkg/package.json').version")
            echo "$pkg@$VER"
          done

      - name: Install dependencies
        if: steps.release.outputs.action != 'fail'
        run: pnpm install --frozen-lockfile

      - name: Determine unpublished packages
        if: steps.release.outputs.action != 'fail'
        id: packages
        run: |
          INPUT="${{ github.event.inputs.packages || 'all' }}"
          if [ "$INPUT" == "all" ]; then
            CANDIDATES="${{ env.ALL_PACKAGES }}"
          else
            CANDIDATES=$(echo "$INPUT" | tr ',' ' ')
          fi
          LIST=""
          for pkg in $CANDIDATES; do
            NAME=$(node -p "require('./$pkg/package.json').name")
            VER=$(node -p "require('./$pkg/package.json').version")
            if npm view "${NAME}@${VER}" version >/dev/null 2>&1; then
              echo "Already published: ${NAME}@${VER}"
            else
              LIST="$LIST $pkg"
            fi
          done
          LIST=$(echo "$LIST" | xargs)
          echo "list=$LIST" >> $GITHUB_OUTPUT
          echo "Unpublished: ${LIST:-none}"

      # Build the whole workspace before type checking: dependent packages resolve
      # @ops-ai/nextjs-toggly-core through its dist declarations, and a filtered
      # build would skip a dependency that is already published.
      - name: Build all packages
        if: steps.release.outputs.action != 'fail' && steps.packages.outputs.list != ''
        run: pnpm build

      - name: Type check
        if: steps.release.outputs.action != 'fail' && steps.packages.outputs.list != ''
        run: pnpm typecheck

      - name: Run tests
        if: steps.release.outputs.action != 'fail' && steps.packages.outputs.list != ''
        run: pnpm test

      # pnpm publish rewrites workspace:* to concrete versions. npm publish does not,
      # and would ship uninstallable packages (see OPS-777). Wait for core on the
      # registry before publishing dependents that resolve to an exact core version.
      - name: Publish packages to npm
        if: steps.release.outputs.action != 'fail' && steps.packages.outputs.list != ''
        working-directory: ${{ env.SDK_ROOT }}
        run: |
          ROOT="${GITHUB_WORKSPACE}/${{ env.SDK_ROOT }}"
          for pkg in ${{ steps.packages.outputs.list }}; do
            echo "Publishing $pkg..."
            cd "$ROOT/$pkg"

            if [ "$pkg" != "nextjs-toggly-core" ]; then
              CORE_NAME=$(node -p "require('${ROOT}/nextjs-toggly-core/package.json').name")
              CORE_VER=$(node -p "require('${ROOT}/nextjs-toggly-core/package.json').version")
              DEP_RETRY=0
              until npm view "${CORE_NAME}@${CORE_VER}" version >/dev/null 2>&1; do
                DEP_RETRY=$((DEP_RETRY + 1))
                if [ $DEP_RETRY -ge 10 ]; then
                  echo "Timed out waiting for ${CORE_NAME}@${CORE_VER}"
                  exit 1
                fi
                sleep 6
              done
            fi

            # Reject unpublishable protocol specs before they hit the registry.
            BAD=$(node -e "
              const m = require('./package.json');
              const deps = { ...m.dependencies, ...m.peerDependencies, ...m.optionalDependencies };
              const bad = Object.entries(deps).filter(([, v]) => /^(workspace|file|link):/.test(String(v)));
              // workspace:* is OK in the working tree — pnpm publish rewrites it.
              // file:/link: must never ship.
              const fatal = bad.filter(([, v]) => /^(file|link):/.test(String(v)));
              console.log(fatal.map(([k, v]) => k + '@' + v).join(', '));
            ")
            if [ -n "$BAD" ]; then
              echo "::error::Refusing to publish $pkg with local-path dependencies: $BAD"
              exit 1
            fi

            pnpm publish --access public --no-git-checks --provenance || pnpm publish --access public --no-git-checks
            sleep 3
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        if: steps.release.outputs.action == 'publish' && steps.release.outputs.manifest_changed == 'true'
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "${{ steps.import_gpg.outputs.name }}"
          git config user.email "${{ steps.import_gpg.outputs.email }}"

          for pkg in ${{ env.ALL_PACKAGES }}; do
            git add ${{ env.SDK_ROOT }}/$pkg/package.json
          done

          git commit -S -m "Bumped Next.js SDK to v${{ steps.release.outputs.version }} (auto_bump) [skip ci]"

          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if git pull --rebase --autostash origin develop && git push origin develop; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            RETRY_COUNT=$((RETRY_COUNT + 1))
            sleep 2
          done
          exit 1

      - name: Publish summary
        if: always()
        run: |
          echo "## Next.js SDK Release" >> $GITHUB_STEP_SUMMARY
          echo "| Core action | ${{ steps.release.outputs.action }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Core version | ${{ steps.release.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ steps.release.outputs.reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Packages published | ${{ steps.packages.outputs.list || 'none' }} |" >> $GITHUB_STEP_SUMMARY
