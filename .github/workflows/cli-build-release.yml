name: Build and Release CLI

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'publish = use manifest version; auto_bump = legacy CI bump'
        required: false
        default: 'publish'
        type: choice
        options:
          - publish
          - auto_bump
      bump_type:
        description: 'Bump type (only used when release_mode is auto_bump)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      action: ${{ steps.release.outputs.action }}
      reason: ${{ steps.release.outputs.reason }}
      manifest_changed: ${{ steps.release.outputs.manifest_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        uses: ./.github/actions/resolve-release-version
        with:
          manifest_path: Toggly.CLI/VERSION
          registry: none
          package_name: toggly-cli
          tag_prefix: cli-v
          release_mode: ${{ github.event.inputs.release_mode || 'publish' }}
          bump_type: ${{ github.event.inputs.bump_type || 'patch' }}

  build:
    needs: validate
    if: needs.validate.outputs.action == 'publish'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact-name: toggly-cli-linux-x64
            binary-name: toggly-cli
          - os: ubuntu-latest
            rid: linux-arm64
            artifact-name: toggly-cli-linux-arm64
            binary-name: toggly-cli
          - os: windows-latest
            rid: win-x64
            artifact-name: toggly-cli-windows-x64
            binary-name: toggly-cli.exe
          - os: macos-latest
            rid: osx-x64
            artifact-name: toggly-cli-macos-x64
            binary-name: toggly-cli
          - os: macos-latest
            rid: osx-arm64
            artifact-name: toggly-cli-macos-arm64
            binary-name: toggly-cli

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install dependencies (Linux ARM64)
        if: matrix.rid == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc-aarch64-linux-gnu zlib1g-dev

      - name: Restore dependencies
        run: dotnet restore Toggly.CLI/Toggly.CLI.csproj

      - name: Build and publish
        shell: bash
        run: |
          dotnet publish Toggly.CLI/Toggly.CLI.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained \
            -p:PublishSingleFile=true \
            -p:PublishAot=true \
            -p:PublishTrimmed=true \
            -p:InvariantGlobalization=true \
            -p:StripSymbols=false \
            -o ./publish/${{ matrix.rid }}

          cd ./publish/${{ matrix.rid }}
          TARGET_BIN="${{ matrix.binary-name }}"
          DEFAULT_BIN="Toggly.CLI"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            DEFAULT_BIN="Toggly.CLI.exe"
          fi

          if [[ ! -f "$TARGET_BIN" && -f "$DEFAULT_BIN" ]]; then
            mv "$DEFAULT_BIN" "$TARGET_BIN"
          elif [[ ! -f "$TARGET_BIN" ]]; then
            ls -R
            exit 1
          fi

      - name: Create archive (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd ./publish/${{ matrix.rid }}
          chmod +x ${{ matrix.binary-name }}
          tar -czf ../../${{ matrix.artifact-name }}.tar.gz ${{ matrix.binary-name }}

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd ./publish/${{ matrix.rid }}
          Compress-Archive -Path ${{ matrix.binary-name }} -DestinationPath ../../${{ matrix.artifact-name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}.*
          retention-days: 30

  create-release:
    needs: [build, validate]
    if: needs.validate.outputs.action == 'publish'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: toggly-cli-*
          merge-multiple: false

      - name: Commit version bump
        if: needs.validate.outputs.manifest_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Toggly.CLI/VERSION
          git commit -m "Bumped CLI to v${{ needs.validate.outputs.version }} (auto_bump) [skip ci]" || true
          git push origin develop || true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: cli-v${{ needs.validate.outputs.version }}
          name: Toggly CLI ${{ needs.validate.outputs.version }}
          body: |
            ## Toggly CLI ${{ needs.validate.outputs.version }}

            See the [CLI documentation](https://docs.toggly.io/docs/using-toggly/cli) for installation instructions.
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## CLI Release" >> $GITHUB_STEP_SUMMARY
          echo "| Action | ${{ needs.validate.outputs.action }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ needs.validate.outputs.reason }} |" >> $GITHUB_STEP_SUMMARY
