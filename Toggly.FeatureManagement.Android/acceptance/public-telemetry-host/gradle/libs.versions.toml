[versions]
toggly = "1.9.0"
compose-bom = "2026.09.00"
activity = "1.13.0"
lifecycle = "2.11.0"
appcompat = "1.8.0"
androidx-test-junit = "1.3.0"
androidx-test-runner = "1.7.0"
espresso = "3.7.0"
# Align with SDK OkHttp 5.x so the app APK does not ship OkHttp 4 (from the
# published io.toggly AARs) ahead of mockwebserver 5 on the instrumentation
# classpath — otherwise MockWebServer fails looking up OkHttp 5 internals.
okhttp = "5.5.1"
mockwebserver = "5.5.1"

[libraries]
toggly-core = { module = "io.toggly:toggly-android-core", version.ref = "toggly" }
toggly-compose = { module = "io.toggly:toggly-compose", version.ref = "toggly" }
toggly-views = { module = "io.toggly:toggly-views", version.ref = "toggly" }
toggly-room = { module = "io.toggly:toggly-room", version.ref = "toggly" }
toggly-datastore = { module = "io.toggly:toggly-datastore", version.ref = "toggly" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-material3 = { module = "androidx.compose.material3:material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserver" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
