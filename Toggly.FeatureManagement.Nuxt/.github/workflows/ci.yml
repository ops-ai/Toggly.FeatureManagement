name: Nuxt SDK - Tests & Analysis

on:
  push:
    branches: [develop, main]
    paths:
      - 'Toggly.FeatureManagement.Nuxt/**'
      - '.github/workflows/ci-nuxt.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'Toggly.FeatureManagement.Nuxt/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: Toggly.FeatureManagement.Nuxt

jobs:
  test:
    name: Test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: nuxt-toggly-core
            name: Core
          - package: nuxt-toggly-server
            name: Server
          - package: nuxt-toggly-client
            name: Client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: Toggly.FeatureManagement.Nuxt/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm build:core
        if: matrix.package != 'nuxt-toggly-core'

      - name: Run tests with coverage
        run: pnpm --filter @ops-ai/${{ matrix.package }} test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.package }}
          path: Toggly.FeatureManagement.Nuxt/${{ matrix.package }}/coverage/lcov.info
          retention-days: 7

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test
    if: always() && !cancelled()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: coverage-artifacts

      - name: Organize coverage files
        run: |
          mkdir -p coverage
          # Fix paths in lcov files for SonarCloud
          for pkg in nuxt-toggly-core nuxt-toggly-server nuxt-toggly-client; do
            if [ -f "coverage-artifacts/coverage-$pkg/lcov.info" ]; then
              sed "s|SF:|SF:Toggly.FeatureManagement.Nuxt/$pkg/|g" \
                "coverage-artifacts/coverage-$pkg/lcov.info" > "coverage/$pkg.lcov.info"
            fi
          done

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-nuxt
            -Dsonar.organization=ops-ai
            -Dsonar.projectName=Toggly SDKs - Nuxt
            -Dsonar.sources=Toggly.FeatureManagement.Nuxt/nuxt-toggly-core/src,Toggly.FeatureManagement.Nuxt/nuxt-toggly-server/src,Toggly.FeatureManagement.Nuxt/nuxt-toggly-client/src,Toggly.FeatureManagement.Nuxt/nuxt-toggly/src
            -Dsonar.tests=Toggly.FeatureManagement.Nuxt/nuxt-toggly-core/tests,Toggly.FeatureManagement.Nuxt/nuxt-toggly-server/tests,Toggly.FeatureManagement.Nuxt/nuxt-toggly-client/tests
            -Dsonar.javascript.lcov.reportPaths=coverage/nuxt-toggly-core.lcov.info,coverage/nuxt-toggly-server.lcov.info,coverage/nuxt-toggly-client.lcov.info
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.spec.ts,**/playground/**
            -Dsonar.test.inclusions=**/*.test.ts,**/*.spec.ts
        continue-on-error: true

  summary:
    name: Analysis Summary
    needs: [test, sonarcloud]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate summary
        run: |
          echo "## Nuxt SDK Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Core | ${{ needs.test.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Server | ${{ needs.test.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Client | ${{ needs.test.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SonarCloud | ${{ needs.sonarcloud.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View SonarCloud Analysis](https://sonarcloud.io/project/overview?id=toggly-sdks-nuxt)" >> $GITHUB_STEP_SUMMARY
