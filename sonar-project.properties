# SonarCloud Configuration for JavaScript/TypeScript SDKs
# This is the root configuration that can be used for local analysis

sonar.projectKey=toggly-sdks-javascript
sonar.organization=ops-ai
sonar.projectName=Toggly SDKs - JavaScript/TypeScript

# Source directories (relative to this file)
sonar.sources=Toggly.FeatureManagement.Angular,Toggly.FeatureManagement.React,Toggly.FeatureManagement.Vue,Toggly.FeatureManagement.Svelte,Toggly.FeatureManagement.Astro,toggly-docusaurus-edge-sdk,Toggly.FeatureManagement.Javascript

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/example/**,**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,**/coverage/**,**/*.config.js,**/*.config.ts,**/build/**,**/rollup.config.js,**/webpack.config.js,**/jest.config.js

# Test inclusions
sonar.tests=.
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,**/*.spec.js,**/*.test.js

# Coverage paths (LCOV format)
sonar.javascript.lcov.reportPaths=coverage/*-lcov.info,**/coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/*-lcov.info,**/coverage/lcov.info

# Language versions
sonar.javascript.node.maxspace=4096
