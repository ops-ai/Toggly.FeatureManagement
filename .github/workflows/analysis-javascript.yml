          curl -sS -u "${SONAR_TOKEN}:" "$status_url" | tee /tmp/sonar-qg.json
          echo
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/sonar-qg.json").read_text())
          status = data.get("projectStatus", {})
          print(f"**Status:** `{status.get('status')}`")
          print("")
          print("| Metric | Status | Actual | Threshold |")
          print("|---|---|---|---|")
          for condition in status.get("conditions", []):
              print(
                  f"| `{condition.get('metricKey')}` | {condition.get('status')} | "
                  f"{condition.get('actualValue')} | {condition.get('errorThreshold')} |"
              )
          PY
          echo
          echo "Open issues:"
          curl -sS -u "${SONAR_TOKEN}:" "$issues_url" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("total", d.get("total"));
          [print(i.get("rule"), i.get("severity"), i.get("component","").split(":")[-1], i.get("line"), (i.get("message") or "")[:120]) for i in d.get("issues",[])]'
          if [ -n "$pr" ]; then
            hotspots_url="${SONAR_HOST_URL}/api/hotspots/search?projectKey=${SONAR_PROJECT_KEY}&pullRequest=${pr}&status=TO_REVIEW&ps=20"
          else
            hotspots_url="${SONAR_HOST_URL}/api/hotspots/search?projectKey=${SONAR_PROJECT_KEY}&branch=${GITHUB_REF_NAME}&status=TO_REVIEW&ps=20"
          fi
          echo
          echo "Open security hotspots:"
          curl -sS -u "${SONAR_TOKEN}:" "$hotspots_url" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("total", d.get("paging",{}).get("total", len(d.get("hotspots",[]))));
          [print(h.get("ruleKey"), h.get("vulnerabilityProbability"), h.get("component","").split(":")[-1], h.get("line"), (h.get("message") or "")[:120]) for h in d.get("hotspots",[])]'

  dependency-check:
    name: OWASP Dependency Check
    needs: [prepare]
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Cache OWASP Dependency Check database
        uses: actions/cache@v6
        with:
          path: /home/runner/OWASP-Dependency-Check/data/
          key: dependency-check-db-${{ runner.os }}-v6
          restore-keys: |
            dependency-check-db-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ${{ needs.prepare.outputs.sonar_project_key }}
          path: ${{ needs.prepare.outputs.owasp_scan_paths }}
          format: 'ALL'
          args: >-
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableExperimental
            --disableAssembly
            --disableRubygems
            --disableBundleAudit
            --disablePyPkg
            --disablePyDist
            --disableNodeAudit
            --exclude '**/host-fixtures/**'
            --exclude '**/node_modules/**'
            --exclude '**/packaging/**'

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report-javascript
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
        continue-on-error: true

  summary:
    name: Analysis Summary
    runs-on: ubuntu-latest
    needs: [prepare, test, test-node-server, smoke-test, smoke-test-node-server, solidstart-host, test-current-browser-hosts, test-docusaurus-host, test-astro-hosts, sonar, dependency-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Verify required jobs passed
        uses: ./.github/actions/verify-required-jobs
        with:
          needs-json: ${{ toJSON(needs) }}
          required-jobs: ${{ needs.prepare.outputs.required_jobs }}
          allow-skipped: none

      - name: Check test results
        run: |
          echo "## JavaScript/TypeScript SDK Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend SDKs" >> $GITHUB_STEP_SUMMARY
          echo "- Angular" >> $GITHUB_STEP_SUMMARY
          echo "- React" >> $GITHUB_STEP_SUMMARY
          echo "- Vue" >> $GITHUB_STEP_SUMMARY
          echo "- Svelte" >> $GITHUB_STEP_SUMMARY
          echo "- SvelteKit" >> $GITHUB_STEP_SUMMARY
          echo "- SolidJS" >> $GITHUB_STEP_SUMMARY
          echo "- Astro" >> $GITHUB_STEP_SUMMARY
          echo "- JavaScript (vanilla)" >> $GITHUB_STEP_SUMMARY
          echo "- Docusaurus" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Node.js Server SDKs" >> $GITHUB_STEP_SUMMARY
          echo "- @ops-ai/toggly-node-core" >> $GITHUB_STEP_SUMMARY
          echo "- @ops-ai/toggly-express" >> $GITHUB_STEP_SUMMARY
          echo "- @ops-ai/toggly-fastify" >> $GITHUB_STEP_SUMMARY
          echo "- @ops-ai/toggly-hono" >> $GITHUB_STEP_SUMMARY
          echo "- @ops-ai/toggly-koa" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Utilities" >> $GITHUB_STEP_SUMMARY
          echo "- Hooks Types" >> $GITHUB_STEP_SUMMARY
          echo "- Local Gates" >> $GITHUB_STEP_SUMMARY
          echo "- Clarity Hook" >> $GITHUB_STEP_SUMMARY
          echo "- GA4 Hook" >> $GITHUB_STEP_SUMMARY
          echo "- Application Insights Hook" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarCloud for detailed results: https://sonarcloud.io/project/overview?id=${{ needs.prepare.outputs.sonar_project_key }}" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarQube Server for detailed results: ${{ secrets.SONAR_HOST_URL }}/dashboard?id=${{ needs.prepare.outputs.sonar_project_key }}" >> $GITHUB_STEP_SUMMARY

  solidstart-host:
    name: SolidStart packed production host
    needs: [prepare]
    if: needs.prepare.outputs.run_solidstart_host == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Toggly.FeatureManagement.Solid
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install locked dependencies with local client-telemetry
        uses: ./.github/actions/install-local-client-telemetry
        with:
          package-dir: Toggly.FeatureManagement.Solid
      - run: npm run build
      # Registry packed-host gate: unset local tarball so install-host.mjs
      # resolves @ops-ai/toggly-client-telemetry from public npm.
      - name: Verify packed SolidStart host against public registry
        env:
          TOGGLY_CLIENT_TELEMETRY_TARBALL: ''
        run: |
          unset TOGGLY_CLIENT_TELEMETRY_TARBALL
          node tests/install-host.mjs
