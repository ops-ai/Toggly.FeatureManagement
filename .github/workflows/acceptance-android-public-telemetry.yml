name: Android public telemetry acceptance

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'Toggly.FeatureManagement.Android/acceptance/public-telemetry-host/**'
      - '.github/workflows/acceptance-android-public-telemetry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build registry-only app and instrumentation APK
        working-directory: Toggly.FeatureManagement.Android/acceptance/public-telemetry-host
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Exercise the public SDKs on Android API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-linux-hw-accel: false
          disable-animations: true
          working-directory: Toggly.FeatureManagement.Android/acceptance/public-telemetry-host
          script: bash tool/run_android_coverage.sh
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-public-telemetry-results
          path: Toggly.FeatureManagement.Android/acceptance/public-telemetry-host/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
