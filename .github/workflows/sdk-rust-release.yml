name: Rust SDK - Build & Publish

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      packages:
        description: 'Crates to publish (comma-separated, or "all")'
        required: false
        default: 'all'
        type: string
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  SDK_ROOT: toggly-rust
  # Publish order matters: macros first, then core, then framework integrations
  ALL_CRATES: toggly-macros toggly toggly-actix toggly-axum toggly-rocket

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      bump_type: ${{ steps.version.outputs.bump_type }}
      crates: ${{ steps.crates.outputs.list }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version from bump type
        id: version
        run: |
          BUMP_TYPE="${{ github.event.inputs.bump_type || 'patch' }}"

          LATEST_TAG=$(git tag -l "rust-sdk-v*" --sort=-version:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            CURRENT_VERSION="0.0.0"
          else
            CURRENT_VERSION="${LATEST_TAG#rust-sdk-v}"
          fi

          BASE_VERSION="${CURRENT_VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "Invalid bump type: $BUMP_TYPE"; exit 1 ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"
          echo "New version: $NEW_VERSION"

      - name: Check if tag exists
        run: |
          if git rev-parse "rust-sdk-v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag rust-sdk-v${{ steps.version.outputs.version }} already exists"
            exit 1
          fi

      - name: Determine crates to publish
        id: crates
        run: |
          INPUT="${{ github.event.inputs.packages || 'all' }}"
          if [ "$INPUT" == "all" ]; then
            echo "list=${{ env.ALL_CRATES }}" >> $GITHUB_OUTPUT
          else
            echo "list=$(echo "$INPUT" | tr ',' ' ')" >> $GITHUB_OUTPUT
          fi

  build-and-test:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust-version: ['stable', 'beta']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust ${{ matrix.rust-version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust-version }}
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.SDK_ROOT }}/target
          key: ${{ runner.os }}-cargo-${{ matrix.rust-version }}-${{ hashFiles('toggly-rust/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust-version }}-

      - name: Check formatting
        working-directory: ${{ env.SDK_ROOT }}
        run: cargo fmt --all -- --check

      - name: Build workspace
        working-directory: ${{ env.SDK_ROOT }}
        run: cargo build --workspace

      - name: Run clippy
        working-directory: ${{ env.SDK_ROOT }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        working-directory: ${{ env.SDK_ROOT }}
        run: cargo test --workspace

  release:
    needs: [build-and-test, validate]
    runs-on: ubuntu-latest
    environment: crates-publish
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Update workspace version
        run: |
          NEW_VERSION="${{ needs.validate.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" ${{ env.SDK_ROOT }}/Cargo.toml
          sed -i "s/^toggly = { version = \".*\", path = \"toggly\" }/toggly = { version = \"$NEW_VERSION\", path = \"toggly\" }/" ${{ env.SDK_ROOT }}/Cargo.toml
          sed -i "s/^toggly-macros = { version = \".*\", path = \"toggly-macros\" }/toggly-macros = { version = \"$NEW_VERSION\", path = \"toggly-macros\" }/" ${{ env.SDK_ROOT }}/Cargo.toml
          echo "Updated workspace version to $NEW_VERSION"

      - name: Publish crates to crates.io
        working-directory: ${{ env.SDK_ROOT }}
        run: |
          NEW_VERSION="${{ needs.validate.outputs.version }}"

          for crate in ${{ needs.validate.outputs.crates }}; do
            STATUS_CODE=$(curl -sS -o /tmp/cratesio-version-check.json -w "%{http_code}" \
              -H "User-Agent: toggly-rust-release-workflow" \
              "https://crates.io/api/v1/crates/$crate/$NEW_VERSION")

            if [ "$STATUS_CODE" = "200" ]; then
              echo "Skipping $crate@$NEW_VERSION (already published)"
              continue
            fi
            if [ "$STATUS_CODE" != "404" ]; then
              echo "Warning: crates.io version check returned HTTP $STATUS_CODE for $crate@$NEW_VERSION"
              echo "Proceeding with publish attempt."
            fi

            echo "Publishing $crate@$NEW_VERSION..."
            cargo publish -p "$crate" --allow-dirty
            # crates.io needs time to index before dependents can be published
            echo "Waiting for crates.io index to update..."
            sleep 30
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "${{ steps.import_gpg.outputs.name }}"
          git config user.email "${{ steps.import_gpg.outputs.email }}"

      - name: Commit version bump and tag
        run: |
          git add ${{ env.SDK_ROOT }}/Cargo.toml

          git commit -S -m "Bumped Rust SDK to v${{ needs.validate.outputs.version }} (${{ needs.validate.outputs.bump_type }}) [skip ci]" || true

          git tag -s -m "Rust SDK v${{ needs.validate.outputs.version }}" "rust-sdk-v${{ needs.validate.outputs.version }}"

          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if git pull --rebase --autostash origin develop; then
              if git push origin develop && git push origin "rust-sdk-v${{ needs.validate.outputs.version }}"; then
                echo "Successfully pushed version bump and tag"
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Retry attempt $RETRY_COUNT of $MAX_RETRIES..."
              sleep 2
            fi
          done

          echo "Failed to push after $MAX_RETRIES attempts"
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rust-sdk-v${{ needs.validate.outputs.version }}
          name: Rust SDK v${{ needs.validate.outputs.version }}
          body: |
            ## Rust SDK v${{ needs.validate.outputs.version }}

            ### Installation

            ```toml
            [dependencies]
            toggly = "${{ needs.validate.outputs.version }}"
            ```

            ### Framework integrations

            ```toml
            toggly-actix = "${{ needs.validate.outputs.version }}"   # Actix Web
            toggly-axum = "${{ needs.validate.outputs.version }}"    # Axum
            toggly-rocket = "${{ needs.validate.outputs.version }}"  # Rocket
            ```

            ### Features

            - Zero-cost abstractions for feature flag evaluation
            - Procedural macros for declarative feature gating
            - Actix Web, Axum, and Rocket framework integrations
            - WebSocket live updates
            - Targeting rules and percentage rollouts

            ### Requirements

            - Rust 1.88+

            ### Links

            - [crates.io](https://crates.io/crates/toggly)
            - [docs.rs](https://docs.rs/toggly)
            - [Documentation](https://docs.toggly.io/docs/sdks/rust)
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    needs: [release, validate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Rust SDK Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bump type | ${{ needs.validate.outputs.bump_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | rust-sdk-v${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Crates | ${{ needs.validate.outputs.crates }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-release | ${{ github.event.inputs.prerelease }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View on crates.io](https://crates.io/crates/toggly)" >> $GITHUB_STEP_SUMMARY
