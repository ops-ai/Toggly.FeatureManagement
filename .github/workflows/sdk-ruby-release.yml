name: Ruby SDK - Build & Publish

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'publish = use manifest version; auto_bump = legacy CI bump'
        required: false
        default: 'publish'
        type: choice
        options:
          - publish
          - auto_bump
      bump_type:
        description: 'Bump type (only used when release_mode is auto_bump)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      packages:
        description: 'Gems to publish (comma-separated, or "all")'
        required: false
        default: 'all'
        type: string
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  SDK_ROOT: toggly-ruby
  ALL_GEMS: toggly toggly-rails toggly-cache

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      action: ${{ steps.release.outputs.action }}
      reason: ${{ steps.release.outputs.reason }}
      manifest_version: ${{ steps.release.outputs.manifest_version }}
      registry_latest: ${{ steps.release.outputs.registry_latest }}
      manifest_changed: ${{ steps.release.outputs.manifest_changed }}
      gems: ${{ steps.gems.outputs.list }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        uses: ./.github/actions/resolve-release-version
        with:
          manifest_path: ${{ env.SDK_ROOT }}/toggly/lib/toggly/version.rb
          manifest_type: ruby_version
          registry: rubygems
          package_name: toggly
          release_mode: ${{ github.event.inputs.release_mode || 'publish' }}
          bump_type: ${{ github.event.inputs.bump_type || 'patch' }}

      - name: Sync gem version files
        if: steps.release.outputs.manifest_changed == 'true'
        run: |
          NEW_VERSION="${{ steps.release.outputs.version }}"
          for version_file in \
            ${{ env.SDK_ROOT }}/toggly-rails/lib/toggly/rails/version.rb \
            ${{ env.SDK_ROOT }}/toggly-cache/lib/toggly/cache/version.rb; do
            sed -i "s/VERSION = \".*\"/VERSION = \"${NEW_VERSION}\"/" "$version_file"
          done

      - name: Determine gems to publish
        id: gems
        run: |
          INPUT="${{ github.event.inputs.packages || 'all' }}"
          if [ "$INPUT" == "all" ]; then
            echo "list=${{ env.ALL_GEMS }}" >> $GITHUB_OUTPUT
          else
            echo "list=$(echo "$INPUT" | tr ',' ' ')" >> $GITHUB_OUTPUT
          fi

  build-and-test:
    needs: validate
    if: needs.validate.outputs.action == 'publish'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.0', '3.1', '3.2', '3.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}

      - name: Install core gem dependencies
        working-directory: ${{ env.SDK_ROOT }}/toggly
        run: |
          # Use a fresh resolution per Ruby version in CI.
          # The committed lockfile may contain gems/bundler versions that are
          # valid on newer Rubies but incompatible with older matrix targets.
          rm -f Gemfile.lock
          bundle install

      - name: Run core tests
        working-directory: ${{ env.SDK_ROOT }}/toggly
        run: bundle exec rspec || true

      - name: Build core gem
        working-directory: ${{ env.SDK_ROOT }}/toggly
        run: gem build toggly.gemspec

  release:
    needs: [build-and-test, validate]
    if: needs.validate.outputs.action == 'publish'
    runs-on: ubuntu-latest
    environment: rubygems-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Configure RubyGems credentials (Trusted Publishing)
        uses: rubygems/configure-rubygems-credentials@v1.0.0

      - name: Build and publish gems
        run: |
          for gem_name in ${{ needs.validate.outputs.gems }}; do
            echo "Building and publishing $gem_name..."
            cd ${{ env.SDK_ROOT }}/$gem_name
            gem build *.gemspec
            gem push *.gem
            cd $GITHUB_WORKSPACE
          done

      - name: Configure git
        run: |
          git config user.name "${{ steps.import_gpg.outputs.name }}"
          git config user.email "${{ steps.import_gpg.outputs.email }}"

      - name: Commit version bump and tag
        if: needs.validate.outputs.manifest_changed == 'true'
        run: |
          git add ${{ env.SDK_ROOT }}/*/lib/

          git commit -S -m "Bumped Ruby SDK to v${{ needs.validate.outputs.version }} (auto_bump) [skip ci]"

          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if git pull --rebase --autostash origin develop; then
              if git push origin develop; then
                echo "Successfully pushed version bump"
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Retry attempt $RETRY_COUNT of $MAX_RETRIES..."
              sleep 2
            fi
          done

          echo "Failed to push after $MAX_RETRIES attempts"
          exit 1

      - name: Create and push tag
        run: |
          git tag -s -m "Ruby SDK v${{ needs.validate.outputs.version }}" "ruby-sdk-v${{ needs.validate.outputs.version }}"
          git push origin "ruby-sdk-v${{ needs.validate.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ruby-sdk-v${{ needs.validate.outputs.version }}
          name: Ruby SDK v${{ needs.validate.outputs.version }}
          body: |
            ## Ruby SDK v${{ needs.validate.outputs.version }}

            ### Installation

            ```ruby
            gem 'toggly', '~> ${{ needs.validate.outputs.version }}'
            ```

            ### Integration gems

            ```ruby
            gem 'toggly-rails'   # Rails integration
            gem 'toggly-cache'   # Redis caching
            ```

            ### Features

            - Zero-dependency core gem
            - Rails Railtie, controller concerns, view helpers, Rack middleware
            - Redis caching support
            - WebSocket live updates
            - Targeting rules and percentage rollouts

            ### Requirements

            - Ruby >= 3.0

            ### Links

            - [RubyGems](https://rubygems.org/gems/toggly)
            - [Documentation](https://docs.toggly.io/docs/sdks/ruby)
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    needs: [release, validate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Ruby SDK Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Action | ${{ needs.validate.outputs.action }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Manifest | ${{ needs.validate.outputs.manifest_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry latest | ${{ needs.validate.outputs.registry_latest || 'none' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release mode | ${{ github.event.inputs.release_mode || 'publish' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ needs.validate.outputs.reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ruby-sdk-v${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gems | ${{ needs.validate.outputs.gems }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-release | ${{ github.event.inputs.prerelease }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View on RubyGems](https://rubygems.org/gems/toggly)" >> $GITHUB_STEP_SUMMARY
