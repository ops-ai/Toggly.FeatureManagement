name: Flutter SDK - Build & Publish

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  SDK_ROOT: Toggly.FeatureManagement.Flutter/toggly

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      bump_type: ${{ steps.version.outputs.bump_type }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version from bump type
        id: version
        run: |
          BUMP_TYPE="${{ github.event.inputs.bump_type || 'patch' }}"

          LATEST_TAG=$(git tag -l "flutter-sdk-v*" --sort=-version:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            CURRENT_VERSION="0.0.0"
          else
            CURRENT_VERSION="${LATEST_TAG#flutter-sdk-v}"
          fi

          BASE_VERSION="${CURRENT_VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

          case "$BUMP_TYPE" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
            *)
              echo "Invalid bump type: $BUMP_TYPE"
              exit 1
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"
          echo "New version: $NEW_VERSION"

      - name: Check if tag exists
        run: |
          if git rev-parse "flutter-sdk-v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag flutter-sdk-v${{ steps.version.outputs.version }} already exists"
            exit 1
          fi

  build-and-test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        working-directory: ${{ env.SDK_ROOT }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.SDK_ROOT }}
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        working-directory: ${{ env.SDK_ROOT }}
        run: flutter test
        continue-on-error: true

  publish:
    needs: [build-and-test, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Update version in pubspec.yaml
        working-directory: ${{ env.SDK_ROOT }}
        run: |
          sed -i "s/^version: .*/version: ${{ needs.validate.outputs.version }}/" pubspec.yaml
          echo "Updated pubspec.yaml to version ${{ needs.validate.outputs.version }}"

      - name: Install dependencies
        working-directory: ${{ env.SDK_ROOT }}
        run: flutter pub get

      - name: Dry run publish
        working-directory: ${{ env.SDK_ROOT }}
        run: flutter pub publish --dry-run

      - name: Publish to pub.dev
        working-directory: ${{ env.SDK_ROOT }}
        run: flutter pub publish --force
        env:
          PUB_TOKEN: ${{ secrets.PUB_DEV_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "${{ steps.import_gpg.outputs.name }}"
          git config user.email "${{ steps.import_gpg.outputs.email }}"

      - name: Commit version update
        run: |
          git add ${{ env.SDK_ROOT }}/pubspec.yaml
          git commit -S -m "Released Flutter SDK v${{ needs.validate.outputs.version }} (${{ needs.validate.outputs.bump_type }}) [skip ci]" || echo "No changes to commit"

          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if git pull --rebase --autostash origin develop; then
              if git push origin develop; then
                echo "Successfully pushed version update"
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              sleep 2
            fi
          done

          echo "Failed to push after $MAX_RETRIES attempts"
          exit 1

      - name: Create and push tag
        run: |
          git tag -s -m "Flutter SDK v${{ needs.validate.outputs.version }}" "flutter-sdk-v${{ needs.validate.outputs.version }}"
          git push origin "flutter-sdk-v${{ needs.validate.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-sdk-v${{ needs.validate.outputs.version }}
          name: Flutter SDK v${{ needs.validate.outputs.version }}
          body: |
            ## Flutter SDK v${{ needs.validate.outputs.version }}

            ### Installation

            Add to your `pubspec.yaml`:

            ```yaml
            dependencies:
              feature_flags_toggly: ^${{ needs.validate.outputs.version }}
            ```

            Or install via command line:

            ```bash
            flutter pub add feature_flags_toggly
            ```

            ### Requirements

            - Dart SDK >=2.18.2 <4.0.0
            - Flutter >=1.17.0

            ### Links

            - [pub.dev package](https://pub.dev/packages/feature_flags_toggly)
            - [Documentation](https://docs.toggly.io/docs/sdks/flutter)
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    needs: [publish, validate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Flutter SDK Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bump type | ${{ needs.validate.outputs.bump_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | flutter-sdk-v${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Package | feature_flags_toggly |" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-release | ${{ github.event.inputs.prerelease }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View on pub.dev](https://pub.dev/packages/feature_flags_toggly)" >> $GITHUB_STEP_SUMMARY
