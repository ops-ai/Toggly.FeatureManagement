name: Go SDK - Tests & Analysis

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'toggly-go/**'
      - 'toggly-go-mongodb-v2/**'
      - '.github/workflows/analysis-go.yml'
      - '.github/workflows/analysis-go.test.mjs'
  workflow_dispatch:
    inputs:
      bootstrap_mongodb_v2_main:
        description: 'Scan the develop checkout as the MongoDB v2 Sonar main baseline'
        type: boolean
        default: false
  workflow_call:
    inputs:
      run_reporting:
        description: 'When false, skip Sonar and OWASP reporting jobs'
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    if: ${{ !inputs.bootstrap_mongodb_v2_main }}
    defaults:
      run:
        working-directory: toggly-go
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: toggly
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: toggly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toggly -d toggly_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_TEST_URL: postgres://toggly:${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/toggly_test?sslmode=disable
      MONGO_TEST_URI: mongodb://127.0.0.1:27017
      REDIS_TEST_ADDR: 127.0.0.1:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for SonarCloud
      
      - name: Setup Node for workflow tests
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Test workflow gate behavior
        working-directory: .
        run: node --test .github/workflows/analysis-go.test.mjs

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: toggly-go/go.sum
      
      - name: Download dependencies
        run: go mod download
      
      - name: Verify dependencies
        run: go mod verify
      
      - name: Run go vet
        run: go vet ./...
      
      - name: Run gofmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files must be formatted with gofmt. Please run:"
            echo "  gofmt -w ."
            gofmt -d .
            exit 1
          fi
      
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=5m
          working-directory: toggly-go
      
      - name: Run all tests with raw coverage
        run: go test -v -race -timeout 5m -coverprofile=coverage-raw.out -covermode=atomic ./...

      - name: Measure authored module coverage
        run: |
          packages="$(go list ./... | grep -vE '/examples/|/metricspb$|/usagepb$')"
          mapfile -t package_array <<< "$packages"
          go test -race -timeout 5m -coverprofile=coverage.out -covermode=atomic "${package_array[@]}"

      - name: Display coverage
        run: |
          echo 'All packages, including generated protobuf and examples:'
          go tool cover -func=coverage-raw.out | tail -1
          echo 'Authored publishable module:'
          go tool cover -func=coverage.out | tail -1
          go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); if ($3 <= 80) exit 1; found=1} END {if (!found) exit 1}'
      
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: |
            toggly-go/coverage.out
            toggly-go/coverage-raw.out
          retention-days: 7

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    if: ${{ !inputs.bootstrap_mongodb_v2_main }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: toggly-go

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: toggly-go/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run smoke tests
        timeout-minutes: 2
        env:
          TOGGLY_SMOKE_APP_KEY_BACKEND: ${{ secrets.TOGGLY_SMOKE_APP_KEY_BACKEND }}
        run: go test -v -run '^TestSmoke_' ./toggly

  current-runtime:
    name: Current Go 1.27 Runtime
    runs-on: ubuntu-latest
    if: ${{ !inputs.bootstrap_mongodb_v2_main }}
    defaults:
      run:
        working-directory: toggly-go

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: toggly-go/go.sum

      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Build, vet, and test with the race detector
        run: |
          go build ./...
          go vet ./...
          go test -v -race -timeout 5m ./...

  mongodb-v2:
    name: MongoDB Driver v2 (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    if: ${{ !inputs.bootstrap_mongodb_v2_main }}
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25.x', '1.27.x']
    defaults:
      run:
        working-directory: toggly-go-mongodb-v2
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      MONGO_TEST_URI: mongodb://127.0.0.1:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: toggly-go-mongodb-v2/go.sum

      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            gofmt -d .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=5m
          working-directory: toggly-go-mongodb-v2

      - name: Run all tests with the race detector and raw coverage
        run: go test -v -race -timeout 5m -coverprofile=coverage-raw.out -covermode=atomic ./...

      - name: Measure MongoDB v2 module coverage
        run: go test -race -timeout 5m -coverprofile=coverage.out -covermode=atomic .

      - name: Display module coverage
        run: |
          echo 'All packages, including example:'
          go tool cover -func=coverage-raw.out | tail -1
          echo 'Publishable MongoDB v2 adapter:'
          go tool cover -func=coverage.out | tail -1
          go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); if ($3 <= 80) exit 1; found=1} END {if (!found) exit 1}'

      - name: Upload MongoDB v2 coverage artifact
        if: matrix.go-version == '1.25.x'
        uses: actions/upload-artifact@v7
        with:
          name: go-mongodb-v2-coverage
          path: |
            toggly-go-mongodb-v2/coverage.out
            toggly-go-mongodb-v2/coverage-raw.out
          retention-days: 7

  mongodb-v2-consumer:
    name: MongoDB Driver v2 Packed Module Consumer
    runs-on: ubuntu-latest
    if: ${{ !inputs.bootstrap_mongodb_v2_main }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'

      - name: Build a consumer from the archived module contents
        shell: bash
        run: |
          set -euo pipefail
          adapter_dir="$RUNNER_TEMP/toggly-go-mongodb-v2"
          host_dir="$RUNNER_TEMP/toggly-go-mongodb-v2-host"
          mkdir -p "$adapter_dir" "$host_dir"
          git archive --format=tar HEAD:toggly-go-mongodb-v2 | tar -xf - -C "$adapter_dir"
          cat > "$host_dir/go.mod" <<EOF
          module example.com/toggly-go-mongodb-v2-host

          go 1.27.0

          require github.com/ops-ai/Toggly.FeatureManagement/toggly-go-mongodb-v2 v0.2.0

          replace github.com/ops-ai/Toggly.FeatureManagement/toggly-go-mongodb-v2 => $adapter_dir
          EOF
          cat > "$host_dir/main.go" <<'EOF'
          package main

          import (
              "context"

              "github.com/ops-ai/Toggly.FeatureManagement/toggly-go/toggly/snapshot"
              mongodbv2 "github.com/ops-ai/Toggly.FeatureManagement/toggly-go-mongodb-v2"
              "go.mongodb.org/mongo-driver/v2/mongo"
              "go.mongodb.org/mongo-driver/v2/mongo/options"
          )

          func main() {
              client, err := mongo.Connect(options.Client().ApplyURI("mongodb://localhost:27017"))
              if err != nil {
                  panic(err)
              }
              defer func() { _ = client.Disconnect(context.Background()) }()

              var provider snapshot.Provider = mongodbv2.NewMongoDBProvider(mongodbv2.MongoDBOptions{
                  Collection: client.Database("toggly").Collection("snapshots"),
              })
              _ = provider
          }
          EOF
          (
            cd "$host_dir"
            go get github.com/ops-ai/Toggly.FeatureManagement/toggly-go@v0.8.1
            go get golang.org/x/crypto@latest golang.org/x/net@latest
            go mod tidy
            go mod verify
            go build ./...
            go test ./...
          )

  toggly-go-consumer:
    name: Current x/net Packed Module Consumer
    runs-on: ubuntu-latest
    if: ${{ !inputs.bootstrap_mongodb_v2_main }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'

      - name: Build a consumer with latest x/crypto and x/net
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="$RUNNER_TEMP/toggly-go"
          host_dir="$RUNNER_TEMP/toggly-go-host"
          mkdir -p "$sdk_dir" "$host_dir"
          git archive --format=tar HEAD:toggly-go | tar -xf - -C "$sdk_dir"
          cat > "$host_dir/go.mod" <<EOF
          module example.com/toggly-go-host

          go 1.27.0

          require github.com/ops-ai/Toggly.FeatureManagement/toggly-go v0.8.0

          replace github.com/ops-ai/Toggly.FeatureManagement/toggly-go => $sdk_dir
          EOF
          cat > "$host_dir/main.go" <<'EOF'
          package main

          import (
              "fmt"

              "github.com/ops-ai/Toggly.FeatureManagement/toggly-go/toggly"
          )

          func main() {
              fmt.Println(toggly.SDKUserAgent())
          }
          EOF
          (
            cd "$host_dir"
            go get github.com/ops-ai/Toggly.FeatureManagement/toggly-go@v0.8.0
            go get golang.org/x/crypto@latest golang.org/x/net@latest
            go mod tidy
            go build ./...
          )

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [test, dependency-check]
    if: ${{ always() && !inputs.bootstrap_mongodb_v2_main && toJSON(inputs.run_reporting) != 'false' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: go-coverage
          path: toggly-go/
        continue-on-error: true

      # Generated protobuf/grpc bindings are never hand-edited; analyze authored Go.
      - name: Resolve Sonar project version
        id: sonar_version
        uses: ./.github/actions/sonar-project-version
        with:
          manifest: toggly-go/VERSION
          suffix: ${{ vars.SONAR_PROJECT_VERSION_SUFFIX }}

      - name: Validate SonarCloud credentials
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "${SONAR_TOKEN}" || { echo "SonarCloud token is required"; exit 1; }

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: toggly-go
          args: >
            -Dsonar.projectKey=toggly-sdks-go
            -Dsonar.projectVersion=${{ steps.sonar_version.outputs.version }}
            -Dsonar.organization=ops-ai
            -Dsonar.projectName="Toggly SDKs - Go"
            -Dsonar.sources=.
            -Dsonar.exclusions=**/*_test.go,**/vendor/**,**/examples/**,**/*.pb.go
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*_test.go
            -Dsonar.go.coverage.reportPaths=coverage.out
            -Dsonar.qualitygate.wait=true

      - name: Download Dependency Check report (for SonarQube Server)
        if: ${{ !cancelled() && (success() || failure()) }}
        uses: actions/download-artifact@v8
        with:
          name: dependency-check-report-go
          path: dependency-check-reports/
        continue-on-error: true

      - name: Validate SonarQube Server credentials
        id: validate-sonarqube-server-credentials
        if: ${{ !cancelled() && (success() || failure()) }}
        env:
          SONAR_SERVER_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: test -n "${SONAR_SERVER_TOKEN}" && test -n "${SONAR_HOST_URL}" || { echo "SonarQube Server credentials are required"; exit 1; }

      - name: SonarQube Server Scan
        if: ${{ !cancelled() && (success() || failure()) && steps.validate-sonarqube-server-credentials.outcome == 'success' }}
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: toggly-go
          args: >
            -Dsonar.projectKey=toggly-sdks-go
            -Dsonar.projectVersion=${{ steps.sonar_version.outputs.version }}
            -Dsonar.projectName="Toggly SDKs - Go"
            -Dsonar.sources=.
            -Dsonar.exclusions=**/*_test.go,**/vendor/**,**/examples/**,**/*.pb.go
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*_test.go
            -Dsonar.go.coverage.reportPaths=coverage.out
            -Dsonar.dependencyCheck.reportPath=../dependency-check-reports/dependency-check-report.xml
            -Dsonar.qualitygate.wait=true

      - name: Report SonarQube Server quality gate
        if: ${{ failure() }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          pr="${{ github.event.pull_request.number }}"
          host="${SONAR_HOST_URL%/}"
          if [ -n "$pr" ]; then
            status_url="${host}/api/qualitygates/project_status?projectKey=toggly-sdks-go&pullRequest=${pr}"
            issues_url="${host}/api/issues/search?componentKeys=toggly-sdks-go&pullRequest=${pr}&resolved=false&ps=20&s=SEVERITY&asc=false"
          else
            status_url="${host}/api/qualitygates/project_status?projectKey=toggly-sdks-go&branch=${GITHUB_REF_NAME}"
            issues_url="${host}/api/issues/search?componentKeys=toggly-sdks-go&branch=${GITHUB_REF_NAME}&resolved=false&ps=20&s=SEVERITY&asc=false"
          fi
          curl -sS -H "Accept: application/json" -H "Authorization: Bearer ${SONAR_TOKEN}" "$status_url" -o /tmp/sonar-qg.json || curl -sS -H "Accept: application/json" -u "${SONAR_TOKEN}:" "$status_url" -o /tmp/sonar-qg.json || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          raw = Path("/tmp/sonar-qg.json").read_text()
          try:
              data = json.loads(raw)
          except json.JSONDecodeError:
              print(raw[:500])
              raise SystemExit(0)
          status = data.get("projectStatus", {})
          print(f"Status: {status.get('status')}")
          for condition in status.get("conditions", []):
              print(
                  f"QG {condition.get('metricKey')} {condition.get('status')} "
                  f"actual={condition.get('actualValue')} threshold={condition.get('errorThreshold')}",
                  flush=True,
              )
          PY
          curl -sS -H "Accept: application/json" -H "Authorization: Bearer ${SONAR_TOKEN}" "$issues_url" \
            | python3 -c 'import json,sys; raw=sys.stdin.read();
          try: d=json.loads(raw)
          except Exception: print(raw[:300]); raise SystemExit(0)
          print("total", d.get("total"));
          [print(i.get("rule"), i.get("severity"), i.get("component","").split(":")[-1], i.get("line"), (i.get("message") or "")[:120]) for i in d.get("issues",[])]' || true
          exit 0

  sonar-mongodb-v2:
    name: SonarQube Analysis - MongoDB Driver v2
    runs-on: ubuntu-latest
    needs: [mongodb-v2]
    if: ${{ always() && !inputs.bootstrap_mongodb_v2_main && toJSON(inputs.run_reporting) != 'false' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download MongoDB v2 coverage report
        uses: actions/download-artifact@v8
        with:
          name: go-mongodb-v2-coverage
          path: toggly-go-mongodb-v2/

      - name: Resolve Sonar project version
        id: sonar_version
        uses: ./.github/actions/sonar-project-version
        with:
          manifest: toggly-go-mongodb-v2/VERSION
          suffix: ${{ vars.SONAR_PROJECT_VERSION_SUFFIX }}

      - name: SonarCloud Scan - MongoDB Driver v2
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: toggly-go-mongodb-v2
          args: >
            -Dsonar.projectKey=toggly-sdks-go-mongodb-v2
            -Dsonar.projectVersion=${{ steps.sonar_version.outputs.version }}
            -Dsonar.organization=ops-ai
            -Dsonar.projectName="Toggly SDKs - Go MongoDB Driver v2"
            -Dsonar.sources=.
            -Dsonar.exclusions=**/*_test.go,**/examples/**
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*_test.go
            -Dsonar.go.coverage.reportPaths=coverage.out
            -Dsonar.qualitygate.wait=true

      - name: SonarQube Server Scan - MongoDB Driver v2
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: toggly-go-mongodb-v2
          args: >
            -Dsonar.projectKey=toggly-sdks-go-mongodb-v2
            -Dsonar.projectVersion=${{ steps.sonar_version.outputs.version }}
            -Dsonar.projectName="Toggly SDKs - Go MongoDB Driver v2"
            -Dsonar.sources=.
            -Dsonar.exclusions=**/*_test.go,**/examples/**
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*_test.go
            -Dsonar.go.coverage.reportPaths=coverage.out
            -Dsonar.qualitygate.wait=true

  mongodb-v2-sonar-main:
    name: MongoDB v2 Sonar main baseline
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_mongodb_v2_main }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toggly-go-mongodb-v2
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      MONGO_TEST_URI: mongodb://127.0.0.1:27017

    steps:
      - name: Checkout develop baseline
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Verify baseline revision
        id: baseline
        working-directory: .
        run: |
          test "$(git branch --show-current)" = develop
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/develop)"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Go 1.25
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: toggly-go-mongodb-v2/go.sum

      - name: Verify and test MongoDB v2 with coverage
        id: coverage
        run: |
          go mod download
          go mod verify
          go vet ./...
          go test -race -count=1 -timeout 5m -coverprofile=coverage.out -covermode=atomic .
          test -s coverage.out
          go tool cover -func=coverage.out | tail -1

      - name: Resolve Sonar project version
        id: sonar_version
        uses: ./.github/actions/sonar-project-version
        with:
          manifest: toggly-go-mongodb-v2/VERSION
          suffix: ${{ vars.SONAR_PROJECT_VERSION_SUFFIX }}

      - name: SonarCloud main analysis
        if: ${{ always() && steps.coverage.outcome == 'success' }}
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: toggly-go-mongodb-v2
          args: >
            -Dsonar.projectKey=toggly-sdks-go-mongodb-v2
            -Dsonar.projectVersion=${{ steps.sonar_version.outputs.version }}
            -Dsonar.organization=ops-ai
            -Dsonar.projectName="Toggly SDKs - Go MongoDB Driver v2"
            -Dsonar.sources=.
            -Dsonar.exclusions=**/*_test.go,**/examples/**
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*_test.go
            -Dsonar.go.coverage.reportPaths=coverage.out
            -Dsonar.branch.name=main
            -Dsonar.scm.revision=${{ steps.baseline.outputs.sha }}
            -Dsonar.qualitygate.wait=true

      - name: SonarQube Server main analysis
        if: ${{ always() && steps.coverage.outcome == 'success' }}
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: toggly-go-mongodb-v2
          args: >
            -Dsonar.projectKey=toggly-sdks-go-mongodb-v2
            -Dsonar.projectVersion=${{ steps.sonar_version.outputs.version }}
            -Dsonar.projectName="Toggly SDKs - Go MongoDB Driver v2"
            -Dsonar.sources=.
            -Dsonar.exclusions=**/*_test.go,**/examples/**
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*_test.go
            -Dsonar.go.coverage.reportPaths=coverage.out
            -Dsonar.branch.name=main
            -Dsonar.scm.revision=${{ steps.baseline.outputs.sha }}
            -Dsonar.qualitygate.wait=true

  build:
    name: Build Examples
    runs-on: ubuntu-latest
    if: ${{ !inputs.bootstrap_mongodb_v2_main }}
    defaults:
      run:
        working-directory: toggly-go
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: toggly-go/go.sum
      
      - name: Build examples
        run: |
          if [ -d "examples" ]; then
            for example in examples/*.go; do
              if [ -f "$example" ]; then
                echo "Building $example"
                go build -v "$example"
              fi
            done
          else
            echo "No examples directory found"
          fi

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    if: ${{ !inputs.bootstrap_mongodb_v2_main && toJSON(inputs.run_reporting) != 'false' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache OWASP Dependency Check database
        uses: actions/cache@v6
        with:
          path: /home/runner/OWASP-Dependency-Check/data/
          key: dependency-check-db-${{ runner.os }}-v6
          restore-keys: |
            dependency-check-db-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'toggly-sdks-go'
          path: 'toggly-go'
          format: 'ALL'
          args: >-
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableExperimental
            --disableAssembly
            --disableRubygems
            --disableBundleAudit
            --disableNodeJS
            --disableNodeAudit
            --disablePyPkg
            --disablePyDist

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report-go
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
        continue-on-error: true

  summary:
    name: Analysis Summary
    runs-on: ubuntu-latest
    needs: [test, smoke-test, current-runtime, mongodb-v2, mongodb-v2-consumer, toggly-go-consumer, sonar, sonar-mongodb-v2, build, dependency-check]
    if: ${{ always() && !inputs.bootstrap_mongodb_v2_main }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify required jobs passed
        uses: ./.github/actions/verify-required-jobs
        with:
          needs-json: ${{ toJSON(needs) }}
          required-jobs: test,smoke-test,current-runtime,mongodb-v2,mongodb-v2-consumer,toggly-go-consumer,build,dependency-check,sonar,sonar-mongodb-v2
          allow-skipped: ${{ (toJSON(inputs.run_reporting) == 'false' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'sonar,sonar-mongodb-v2,dependency-check' || 'none' }}

      - name: Generate summary
        if: ${{ always() }}
        working-directory: .
        env:
          TEST_RESULT: ${{ needs.test.result }}
          SMOKE_RESULT: ${{ needs.smoke-test.result }}
          CURRENT_RUNTIME_RESULT: ${{ needs.current-runtime.result }}
          MONGODB_V2_RESULT: ${{ needs.mongodb-v2.result }}
          MONGODB_V2_CONSUMER_RESULT: ${{ needs.mongodb-v2-consumer.result }}
          TOGGLY_GO_CONSUMER_RESULT: ${{ needs.toggly-go-consumer.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPENDENCY_CHECK_RESULT: ${{ needs.dependency-check.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          MONGODB_V2_SONAR_RESULT: ${{ needs.sonar-mongodb-v2.result }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
          RUN_REPORTING: ${{ toJSON(inputs.run_reporting) }}
        run: |
          {
            echo "## Go SDK Analysis Summary"
            echo ""
            echo "- Tests and lint: ${TEST_RESULT}"
            echo "- Smoke test: ${SMOKE_RESULT}"
            echo "- Go 1.27 current runtime: ${CURRENT_RUNTIME_RESULT}"
            echo "- MongoDB Driver v2 tests: ${MONGODB_V2_RESULT}"
            echo "- Archived MongoDB Driver v2 consumer: ${MONGODB_V2_CONSUMER_RESULT}"
            echo "- Archived core consumer: ${TOGGLY_GO_CONSUMER_RESULT}"
            echo "- Example build: ${BUILD_RESULT}"
            echo "- OWASP: ${DEPENDENCY_CHECK_RESULT}"
            echo "- Core Sonar: ${SONAR_RESULT}"
            echo "- MongoDB Driver v2 Sonar: ${MONGODB_V2_SONAR_RESULT}"
            echo ""
            if [ "${RUN_REPORTING}" = "false" ]; then
              echo "Reporting was explicitly disabled with run_reporting=false; authenticated Sonar gates were not checked. OWASP reporting was also skipped."
            elif [ "${FORK_PR}" = "true" ]; then
              echo "Credentialed SonarCloud and SonarQube Server scans were skipped for this fork PR; authenticated Sonar gates were not checked. OWASP reporting was also skipped."
            fi
            echo ""
            echo "### Packages Analyzed"
            echo "- toggly (core)"
            echo "- togglyctx (context support)"
            echo "- togglyhttp (HTTP integration)"
            echo "- togglytemplate (template helpers)"
            echo "- toggly-go-mongodb-v2 (MongoDB Driver v2 adapter)"
            echo ""
            echo "Check SonarCloud for detailed results: https://sonarcloud.io/project/overview?id=toggly-sdks-go"
          } >> "$GITHUB_STEP_SUMMARY"
