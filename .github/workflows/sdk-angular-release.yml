name: Angular SDK - Build & Publish

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'publish = use manifest version; auto_bump = legacy CI bump'
        required: false
        default: 'publish'
        type: choice
        options:
          - publish
          - auto_bump
      bump_type:
        description: 'Bump type (only used when release_mode is auto_bump)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

env:
  SDK_ROOT: Toggly.FeatureManagement.Angular
  MANIFEST: Toggly.FeatureManagement.Angular/projects/ngx-feature-flags-toggly/package.json
  NPM_PACKAGE: '@ops-ai/ngx-feature-flags-toggly'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    defaults:
      run:
        working-directory: ${{ env.SDK_ROOT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve release version
        id: release
        uses: ./.github/actions/resolve-release-version
        with:
          manifest_path: ${{ env.MANIFEST }}
          registry: npm
          package_name: ${{ env.NPM_PACKAGE }}
          release_mode: ${{ github.event.inputs.release_mode || 'publish' }}
          bump_type: ${{ github.event.inputs.bump_type || 'patch' }}

      - name: Clear NPM cache
        if: steps.release.outputs.action == 'publish'
        run: npm cache clean --force

      - name: Install dependencies
        if: steps.release.outputs.action == 'publish'
        run: npm install

      - name: Lint
        if: steps.release.outputs.action == 'publish'
        run: npm run lint

      - name: Build library
        if: steps.release.outputs.action == 'publish'
        run: npm run build-lib

      - name: Run tests
        if: steps.release.outputs.action == 'publish'
        run: npm test -- ngx-feature-flags-toggly --watch=false --browsers=ChromeHeadless


      - name: Verify packed tarball
        if: steps.release.outputs.action == 'publish'
        uses: ./.github/actions/verify-package-tarball
        with:
          package_dir: ${{ env.SDK_ROOT }}/dist/ngx-feature-flags-toggly
          skip_import: 'true'

      - name: Publish to npm
        if: steps.release.outputs.action == 'publish'
        working-directory: ${{ env.SDK_ROOT }}/dist/ngx-feature-flags-toggly
        run: npm publish --provenance --access public || npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        if: steps.release.outputs.action == 'publish' && steps.release.outputs.manifest_changed == 'true'
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "${{ steps.import_gpg.outputs.name }}"
          git config user.email "${{ steps.import_gpg.outputs.email }}"

          git add ${{ env.MANIFEST }}
          git add ${{ env.SDK_ROOT }}/package.json
          git add ${{ env.SDK_ROOT }}/package-lock.json

          git commit -S -m "Bumped Angular SDK to v${{ steps.release.outputs.version }} (auto_bump) [skip ci]"

          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if git pull --rebase --autostash origin develop; then
              if git push origin develop; then
                echo "Successfully pushed version bump"
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            sleep 2
          done
          exit 1

      - name: Publish summary
        if: always()
        run: |
          echo "## Angular SDK Release" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Action | ${{ steps.release.outputs.action }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.release.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Manifest | ${{ steps.release.outputs.manifest_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry latest | ${{ steps.release.outputs.registry_latest || 'none' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ steps.release.outputs.reason }} |" >> $GITHUB_STEP_SUMMARY
