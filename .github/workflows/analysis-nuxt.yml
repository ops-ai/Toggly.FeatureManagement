name: Nuxt SDKs - Tests & Analysis

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.Nuxt/**'
      - 'toggly-eval/**'
      - 'toggly-signed-defs/**'
      - '.github/workflows/analysis-nuxt.yml'
      - '.github/workflows/sdk-nuxt-release.yml'
      - '.github/actions/build-shared-js-deps/**'
      - '.github/actions/upload-shared-js-deps/**'
      - '.github/actions/download-shared-js-deps/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      run_reporting:
        description: 'When false, skip Sonar and OWASP reporting jobs'
        type: boolean
        default: true

env:
  SDK_ROOT: Toggly.FeatureManagement.Nuxt

defaults:
  run:
    working-directory: Toggly.FeatureManagement.Nuxt

permissions:
  contents: read
  security-events: write

jobs:
  build-shared-js-deps:
    name: Build shared JS deps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build shared packages
        uses: ./.github/actions/build-shared-js-deps
        with:
          packages: signed-defs,eval
          node-version: '20'

      - name: Upload shared package dist artifacts
        uses: ./.github/actions/upload-shared-js-deps

  test:
    name: Test (${{ matrix.package }})
    needs: [build-shared-js-deps]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: nuxt-toggly-core
            name: Core
          - package: nuxt-toggly-server
            name: Server
          - package: nuxt-toggly-client
            name: Client
          - package: nuxt-toggly
            name: Module

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: ${{ env.SDK_ROOT }}/pnpm-lock.yaml

      - name: Restore shared JS deps
        uses: ./.github/actions/download-shared-js-deps

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package dependencies
        run: |
          if [ "${{ matrix.package }}" = "nuxt-toggly" ]; then
            pnpm build:core
            pnpm build:server
            pnpm build:client
          elif [ "${{ matrix.package }}" != "nuxt-toggly-core" ]; then
            pnpm build:core
          fi

      - name: Type check package
        run: pnpm --filter @ops-ai/${{ matrix.package }} typecheck

      - name: Run tests with coverage
        run: pnpm --filter @ops-ai/${{ matrix.package }} test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-nuxt-${{ matrix.package }}
          path: ${{ env.SDK_ROOT }}/${{ matrix.package }}/coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  packed-host:
    name: Packed Nuxt ${{ matrix.nuxt-version }} host (Node ${{ matrix.node-version }})
    needs: [build-shared-js-deps]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - nuxt-version: 3.21.1
            lock-mode: locked
            node-version: '24'
          - nuxt-version: 4.5.2
            lock-mode: locked
            node-version: '24'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: ${{ env.SDK_ROOT }}/pnpm-lock.yaml

      # npm 11 rewrites the public lock graph while rebinding packed SDK tarballs.
      - name: Pin npm for recorded consumer locks
        run: npm install --global npm@10.2.3

      - name: Restore shared JS deps
        uses: ./.github/actions/download-shared-js-deps

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packed SDK candidates
        run: pnpm build

      - name: Install Chromium system dependencies
        run: npx --yes playwright install-deps chromium

      - name: Verify packed host
        run: node tests/hosts/run.mjs ${{ matrix.nuxt-version }} ${{ matrix.lock-mode }}

  smoke-test:
    name: Smoke Test
    needs: [build-shared-js-deps]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: ${{ env.SDK_ROOT }}/pnpm-lock.yaml

      - name: Restore shared JS deps
        uses: ./.github/actions/download-shared-js-deps

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm build:core

      - name: Run smoke test
        timeout-minutes: 2
        working-directory: ${{ env.SDK_ROOT }}/nuxt-toggly-core
        env:
          TOGGLY_SMOKE_APP_KEY_FRONTEND: ${{ secrets.TOGGLY_SMOKE_APP_KEY_FRONTEND }}
        run: pnpm vitest run --config vitest.smoke.config.ts tests/smoke.test.ts tests/smoke-ws.test.ts

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [build-shared-js-deps, test, packed-host, dependency-check]
    if: ${{ always() && toJSON(inputs.run_reporting) != 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Restore shared JS deps
        if: needs.build-shared-js-deps.result == 'success'
        uses: ./.github/actions/download-shared-js-deps

      - name: Install dependencies for TypeScript analysis
        working-directory: ${{ env.SDK_ROOT }}
        run: pnpm install --ignore-scripts || true
        continue-on-error: true

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-nuxt-*
          path: coverage-artifacts/
        continue-on-error: true

      - name: Organize coverage files
        run: |
          mkdir -p coverage
          for pkg in nuxt-toggly-core nuxt-toggly-server nuxt-toggly-client nuxt-toggly; do
            if [ -f "coverage-artifacts/coverage-nuxt-$pkg/lcov.info" ]; then
              sed "s|SF:|SF:${{ env.SDK_ROOT }}/$pkg/|g" \
                "coverage-artifacts/coverage-nuxt-$pkg/lcov.info" > "coverage/$pkg.lcov.info"
            fi
          done
          echo "Coverage files:"
          ls -la coverage/ || echo "No coverage files found"
        working-directory: .
        continue-on-error: true

      - name: Resolve Sonar project version
        id: sonar_version
        uses: ./.github/actions/sonar-project-version
        with:
          manifest: Toggly.FeatureManagement.Nuxt/nuxt-toggly-core/package.json
          suffix: ${{ vars.SONAR_PROJECT_VERSION_SUFFIX }}

      - name: Validate SonarCloud credentials
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "${SONAR_TOKEN}" || { echo "SonarCloud token is required"; exit 1; }

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-nuxt
            -Dsonar.projectVersion=${{ steps.sonar_version.outputs.version }}
            -Dsonar.organization=ops-ai
            -Dsonar.projectName="Toggly SDKs - Nuxt"
            -Dsonar.sources=${{ env.SDK_ROOT }}/nuxt-toggly-core/src,${{ env.SDK_ROOT }}/nuxt-toggly-server/src,${{ env.SDK_ROOT }}/nuxt-toggly-client/src,${{ env.SDK_ROOT }}/nuxt-toggly/src
            -Dsonar.tests=${{ env.SDK_ROOT }}/nuxt-toggly-core/tests,${{ env.SDK_ROOT }}/nuxt-toggly-server/tests,${{ env.SDK_ROOT }}/nuxt-toggly-client/tests,${{ env.SDK_ROOT }}/nuxt-toggly/tests
            -Dsonar.javascript.lcov.reportPaths=coverage/nuxt-toggly-core.lcov.info,coverage/nuxt-toggly-server.lcov.info,coverage/nuxt-toggly-client.lcov.info,coverage/nuxt-toggly.lcov.info
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.spec.ts,**/playground/**
            -Dsonar.test.inclusions=**/*.test.ts,**/*.spec.ts
            -Dsonar.issue.ignore.multicriteria=hookAwait
            -Dsonar.issue.ignore.multicriteria.hookAwait.ruleKey=typescript:S9382
            -Dsonar.issue.ignore.multicriteria.hookAwait.resourceKey=**/hooks.ts
            -Dsonar.qualitygate.wait=true

      - name: Download Dependency Check report (for SonarQube Server)
        if: ${{ success() || failure() }}
        uses: actions/download-artifact@v8
        with:
          name: dependency-check-report-nuxt
          path: dependency-check-reports/
        continue-on-error: true

      - name: Validate SonarQube Server credentials
        id: validate-sonarqube-server-credentials
        if: ${{ success() || failure() }}
        env:
          SONAR_SERVER_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: test -n "${SONAR_SERVER_TOKEN}" && test -n "${SONAR_HOST_URL}" || { echo "SonarQube Server credentials are required"; exit 1; }

      - name: SonarQube Server Scan
        if: ${{ (success() || failure()) && steps.validate-sonarqube-server-credentials.outcome == 'success' }}
        uses: SonarSource/sonarqube-scan-action@v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-nuxt
            -Dsonar.projectVersion=${{ steps.sonar_version.outputs.version }}
            -Dsonar.projectName="Toggly SDKs - Nuxt"
            -Dsonar.sources=${{ env.SDK_ROOT }}/nuxt-toggly-core/src,${{ env.SDK_ROOT }}/nuxt-toggly-server/src,${{ env.SDK_ROOT }}/nuxt-toggly-client/src,${{ env.SDK_ROOT }}/nuxt-toggly/src
            -Dsonar.tests=${{ env.SDK_ROOT }}/nuxt-toggly-core/tests,${{ env.SDK_ROOT }}/nuxt-toggly-server/tests,${{ env.SDK_ROOT }}/nuxt-toggly-client/tests,${{ env.SDK_ROOT }}/nuxt-toggly/tests
            -Dsonar.javascript.lcov.reportPaths=coverage/nuxt-toggly-core.lcov.info,coverage/nuxt-toggly-server.lcov.info,coverage/nuxt-toggly-client.lcov.info,coverage/nuxt-toggly.lcov.info
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.spec.ts,**/playground/**
            -Dsonar.test.inclusions=**/*.test.ts,**/*.spec.ts
            -Dsonar.dependencyCheck.reportPath=dependency-check-reports/dependency-check-report.xml
            -Dsonar.issue.ignore.multicriteria=hookAwait
            -Dsonar.issue.ignore.multicriteria.hookAwait.ruleKey=typescript:S9382
            -Dsonar.issue.ignore.multicriteria.hookAwait.resourceKey=**/hooks.ts
            -Dsonar.qualitygate.wait=true

      - name: Report SonarQube Server quality gate
        if: ${{ failure() && steps.validate-sonarqube-server-credentials.outcome == 'success' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          pr="${{ github.event.pull_request.number }}"
          echo "## SonarQube Server quality gate (toggly-sdks-nuxt)" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$pr" ]; then
            status_url="${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=toggly-sdks-nuxt&pullRequest=${pr}"
            issues_url="${SONAR_HOST_URL}/api/issues/search?componentKeys=toggly-sdks-nuxt&pullRequest=${pr}&resolved=false&ps=20&s=SEVERITY&asc=false"
          else
            status_url="${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=toggly-sdks-nuxt&branch=${GITHUB_REF_NAME}"
            issues_url="${SONAR_HOST_URL}/api/issues/search?componentKeys=toggly-sdks-nuxt&branch=${GITHUB_REF_NAME}&resolved=false&ps=20&s=SEVERITY&asc=false"
          fi
          echo "GET ${status_url}"
          curl -sS -u "${SONAR_TOKEN}:" "$status_url" | tee /tmp/sonar-qg.json
          echo
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/sonar-qg.json").read_text())
          status = data.get("projectStatus", {})
          print(f"**Status:** `{status.get('status')}`")
          print("")
          print("| Metric | Status | Actual | Threshold |")
          print("|---|---|---|---|")
          for condition in status.get("conditions", []):
              print(
                  f"| `{condition.get('metricKey')}` | {condition.get('status')} | "
                  f"{condition.get('actualValue')} | {condition.get('errorThreshold')} |"
              )
          PY
          echo
          echo "Open issues:"
          curl -sS -u "${SONAR_TOKEN}:" "$issues_url" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("total", d.get("total"));
          [print(i.get("rule"), i.get("severity"), i.get("component","").split(":")[-1], i.get("line"), (i.get("message") or "")[:120]) for i in d.get("issues",[])]'

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    if: ${{ toJSON(inputs.run_reporting) != 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache OWASP Dependency Check database
        uses: actions/cache@v6
        with:
          path: /home/runner/OWASP-Dependency-Check/data/
          key: dependency-check-db-${{ runner.os }}-v6
          restore-keys: |
            dependency-check-db-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'toggly-sdks-nuxt'
          path: ${{ env.SDK_ROOT }}
          format: 'ALL'
          args: >-
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableExperimental
            --disableAssembly
            --disableRubygems
            --disableBundleAudit
            --disablePyPkg
            --disablePyDist
            --disableNodeAudit
            --exclude '**/host-fixtures/**'
            --exclude '**/node_modules/**'
            --exclude '**/packaging/**'

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report-nuxt
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
        continue-on-error: true

  summary:
    name: Analysis Summary
    runs-on: ubuntu-latest
    needs: [test, smoke-test, packed-host, sonar, dependency-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify required jobs passed
        uses: ./.github/actions/verify-required-jobs
        with:
          needs-json: ${{ toJSON(needs) }}
          required-jobs: test,smoke-test,packed-host,sonar,dependency-check
          allow-skipped: ${{ toJSON(inputs.run_reporting) == 'false' && 'sonar,dependency-check' || 'none' }}

      - name: Generate summary
        working-directory: .
        run: |
          echo "## Nuxt SDK Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Analysis workflow completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages Analyzed" >> $GITHUB_STEP_SUMMARY
          echo "- @ops-ai/nuxt-toggly-core" >> $GITHUB_STEP_SUMMARY
          echo "- @ops-ai/nuxt-toggly-server" >> $GITHUB_STEP_SUMMARY
          echo "- @ops-ai/nuxt-toggly-client" >> $GITHUB_STEP_SUMMARY
          echo "- @ops-ai/nuxt-toggly" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarCloud for detailed results: https://sonarcloud.io/project/overview?id=toggly-sdks-nuxt" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarQube Server for detailed results: ${{ secrets.SONAR_HOST_URL }}/dashboard?id=toggly-sdks-nuxt" >> $GITHUB_STEP_SUMMARY
