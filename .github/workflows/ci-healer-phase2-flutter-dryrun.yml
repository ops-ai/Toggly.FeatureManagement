name: CI Healer (Phase 2 — Flutter dry-run)

# Phase 2 rollout workflow: Flutter analysis only, no pushes.
# During Phase 2: disable or remove ci-healer.yml and use this file instead.
# After validation: delete this file and enable ci-healer.yml for Phase 3.
# See .github/ci-healer/README.md

on:
  workflow_run:
    workflows:
      - Flutter SDK - Tests & Analysis
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: ci-healer-phase2-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  heal:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch != '' &&
      !startsWith(github.event.workflow_run.head_branch, 'ci-heal/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout failing branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run greencheck (dry-run)
        id: greencheck
        uses: braedonsaunders/greencheck@v0
        with:
          agent: claude
          agent-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          trigger-token: ${{ secrets.CI_HEALER_PAT || github.token }}
          max-passes: 5
          max-cost: "$5.00"
          timeout: 45m
          dry-run: true

      - name: Report to Linear
        if: always()
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM: opsAI
          LINEAR_PROJECT: Toggly
          LINEAR_CI_HEALER_EPIC: ${{ vars.LINEAR_CI_HEALER_EPIC || 'OPS-274' }}
          WORKFLOW_RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GREENCHECK_FIXED: ${{ steps.greencheck.outputs.fixed }}
          GREENCHECK_PASSES: ${{ steps.greencheck.outputs.passes }}
          GREENCHECK_COMMITS: ${{ steps.greencheck.outputs.commits }}
          GREENCHECK_COST: ${{ steps.greencheck.outputs.cost }}
          GREENCHECK_FAILURES_FOUND: ${{ steps.greencheck.outputs.failures-found }}
          GREENCHECK_FAILURES_FIXED: ${{ steps.greencheck.outputs.failures-fixed }}
          CI_HEALER_DRY_RUN: 'true'
        run: node .github/ci-healer/report-to-linear.mjs
