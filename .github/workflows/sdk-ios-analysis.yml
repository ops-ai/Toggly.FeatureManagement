name: iOS SDK - Analysis

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.iOS/**'
      - '.github/workflows/sdk-ios-*.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.iOS/**'
      - '.github/workflows/sdk-ios-*.yml'
  workflow_dispatch:

env:
  SDK_ROOT: Toggly.FeatureManagement.iOS

jobs:
  build-and-test:
    runs-on: macos-14
    strategy:
      matrix:
        xcode: ['15.4', '16.0']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show Swift version
        run: swift --version

      - name: Resolve package dependencies
        working-directory: ${{ env.SDK_ROOT }}
        run: swift package resolve

      - name: Build all packages
        working-directory: ${{ env.SDK_ROOT }}
        run: swift build -v

      - name: Run tests
        working-directory: ${{ env.SDK_ROOT }}
        run: swift test -v --enable-code-coverage

      - name: Generate code coverage report
        if: matrix.xcode == '16.0'
        working-directory: ${{ env.SDK_ROOT }}
        run: |
          xcrun llvm-cov export \
            .build/debug/TogglyPackageTests.xctest/Contents/MacOS/TogglyPackageTests \
            -instr-profile .build/debug/codecov/default.profdata \
            -format lcov \
            -ignore-filename-regex '.build|Tests' \
            > coverage.lcov || true

      - name: Upload coverage to Codecov
        if: matrix.xcode == '16.0'
        uses: codecov/codecov-action@v4
        with:
          file: ${{ env.SDK_ROOT }}/coverage.lcov
          flags: ios-sdk
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        working-directory: ${{ env.SDK_ROOT }}
        run: swiftlint lint --reporter github-actions-logging || true

  build-platforms:
    runs-on: macos-14
    strategy:
      matrix:
        destination:
          - 'platform=iOS Simulator,name=iPhone 15,OS=17.5'
          - 'platform=macOS'
          - 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=17.5'
          - 'platform=watchOS Simulator,name=Apple Watch Series 9 (45mm),OS=10.5'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build for platform
        working-directory: ${{ env.SDK_ROOT }}
        run: |
          xcodebuild build \
            -scheme Toggly-Package \
            -destination '${{ matrix.destination }}' \
            -skipPackagePluginValidation \
            | xcpretty || true
