name: Download shared JS deps
description: >-
  Restore shared JS package dist/ trees uploaded by the build-shared-js-deps job.

inputs:
  artifact-name:
    description: Artifact name produced by the shared build job
    required: false
    default: shared-js-deps

runs:
  using: composite
  steps:
    - name: Download shared JS deps artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: .
