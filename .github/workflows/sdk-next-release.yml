name: Next.js SDK - Build & Publish

on:
  push:
    branches:
      - develop
    paths:
      - 'Toggly.FeatureManagement.Next/**'
      - '.github/workflows/sdk-next-release.yml'
      - '.github/workflows/analysis-next.yml'
      - '.github/actions/build-shared-js-deps/**'
      - '.github/actions/upload-shared-js-deps/**'
      - '.github/actions/download-shared-js-deps/**'
      - '.github/actions/resolve-release-version/**'
      - '.github/actions/verify-package-tarball/**'
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'publish = use manifest version; auto_bump = legacy CI bump'
        required: false
        default: 'publish'
        type: choice
        options:
          - publish
          - auto_bump
      bump_type:
        description: 'Bump type (only used when release_mode is auto_bump)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      packages:
        description: 'Packages to publish (comma-separated, or "all")'
        required: false
        default: 'all'
        type: string

permissions:
  contents: write
  id-token: write
  security-events: write

concurrency:
  group: next-sdk-release
  cancel-in-progress: false

env:
  SDK_ROOT: Toggly.FeatureManagement.Next
  CORE_MANIFEST: Toggly.FeatureManagement.Next/nextjs-toggly-core/package.json
  ALL_PACKAGES: nextjs-toggly-core nextjs-toggly-server nextjs-toggly-client nextjs-toggly-edge

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.release.outputs.action }}
      version: ${{ steps.release.outputs.version }}
      reason: ${{ steps.release.outputs.reason }}
      manifest_version: ${{ steps.release.outputs.manifest_version }}
      registry_latest: ${{ steps.release.outputs.registry_latest }}
      manifest_changed: ${{ steps.release.outputs.manifest_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve release version
        id: release
        uses: ./.github/actions/resolve-release-version
        with:
          manifest_path: ${{ env.CORE_MANIFEST }}
          registry: npm
          package_name: '@ops-ai/nextjs-toggly-core'
          release_mode: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode || 'publish' }}
          bump_type: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bump_type || 'patch' }}

      - name: Resolve summary
        if: always()
        run: |
          echo "## Next.js SDK resolve" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Core action | ${{ steps.release.outputs.action }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Core version | ${{ steps.release.outputs.version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Reason | ${{ steps.release.outputs.reason }} |" >> "$GITHUB_STEP_SUMMARY"

  gates:
    needs: resolve
    if: needs.resolve.outputs.action != 'fail'
    uses: ./.github/workflows/analysis-next.yml
    with:
      run_reporting: false
    secrets: inherit

  publish:
    needs: [resolve, gates]
    if: needs.resolve.outputs.action != 'fail' && needs.gates.result == 'success'
    runs-on: ubuntu-latest
    environment: npm-publish
    defaults:
      run:
        working-directory: ${{ env.SDK_ROOT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Sync monorepo package versions
        if: needs.resolve.outputs.manifest_changed == 'true'
        run: |
          TARGET="${{ needs.resolve.outputs.version }}"
          for pkg in nextjs-toggly-server nextjs-toggly-client nextjs-toggly-edge; do
            cd "$pkg"
            npm version "$TARGET" --no-git-tag-version --allow-same-version
            cd ..
          done

      - name: Note independent package versions
        run: |
          TARGET="${{ needs.resolve.outputs.version }}"
          echo "Core resolved version: $TARGET (action=${{ needs.resolve.outputs.action }})"
          for pkg in ${{ env.ALL_PACKAGES }}; do
            VER=$(node -p "require('./$pkg/package.json').version")
            echo "$pkg@$VER"
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine unpublished packages
        id: packages
        run: |
          INPUT="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.packages || 'all' }}"
          if [ "$INPUT" == "all" ]; then
            CANDIDATES="${{ env.ALL_PACKAGES }}"
          else
            CANDIDATES=$(echo "$INPUT" | tr ',' ' ')
          fi
          LIST=""
          for pkg in $CANDIDATES; do
            NAME=$(node -p "require('./$pkg/package.json').name")
            VER=$(node -p "require('./$pkg/package.json').version")
            if npm view "${NAME}@${VER}" version >/dev/null 2>&1; then
              echo "Already published: ${NAME}@${VER}"
            else
              LIST="$LIST $pkg"
            fi
          done
          LIST=$(echo "$LIST" | xargs)
          echo "list=$LIST" >> $GITHUB_OUTPUT
          echo "Unpublished: ${LIST:-none}"

      # Build the whole workspace: dependent packages resolve
      # @ops-ai/nextjs-toggly-core through its dist declarations, and a filtered
      # build would skip a dependency that is already published.
      - name: Build all packages
        if: steps.packages.outputs.list != ''
        run: pnpm build

      - name: Verify packed tarballs
        if: steps.packages.outputs.list != ''
        working-directory: ${{ github.workspace }}
        run: |
          for pkg in ${{ steps.packages.outputs.list }}; do
            echo "Verifying $pkg..."
            PACKAGE_DIR="${{ env.SDK_ROOT }}/$pkg" SKIP_IMPORT=true \
              node .github/actions/verify-package-tarball/verify.mjs
          done

      # pnpm publish rewrites workspace:* to concrete versions. npm publish does not,
      # and would ship uninstallable packages (see OPS-777). Wait for core on the
      # registry before publishing dependents that resolve to an exact core version.
      - name: Publish packages to npm
        if: steps.packages.outputs.list != ''
        working-directory: ${{ env.SDK_ROOT }}
        run: |
          ROOT="${GITHUB_WORKSPACE}/${{ env.SDK_ROOT }}"
          for pkg in ${{ steps.packages.outputs.list }}; do
            echo "Publishing $pkg..."
            cd "$ROOT/$pkg"

            if [ "$pkg" != "nextjs-toggly-core" ]; then
              CORE_NAME=$(node -p "require('${ROOT}/nextjs-toggly-core/package.json').name")
              CORE_VER=$(node -p "require('${ROOT}/nextjs-toggly-core/package.json').version")
              bash "${GITHUB_WORKSPACE}/.github/scripts/wait-for-npm-version.sh" "${CORE_NAME}@${CORE_VER}"
            fi

            # Reject unpublishable protocol specs before they hit the registry.
            BAD=$(node -e "
              const m = require('./package.json');
              const deps = { ...m.dependencies, ...m.peerDependencies, ...m.optionalDependencies };
              const bad = Object.entries(deps).filter(([, v]) => /^(workspace|file|link):/.test(String(v)));
              // workspace:* is OK in the working tree — pnpm publish rewrites it.
              // file:/link: must never ship.
              const fatal = bad.filter(([, v]) => /^(file|link):/.test(String(v)));
              console.log(fatal.map(([k, v]) => k + '@' + v).join(', '));
            ")
            if [ -n "$BAD" ]; then
              echo "::error::Refusing to publish $pkg with local-path dependencies: $BAD"
              exit 1
            fi

            pnpm publish --access public --no-git-checks --provenance
            sleep 3
          done
        env:
          NODE_AUTH_TOKEN: ''

      - name: Commit version bump
        if: needs.resolve.outputs.action == 'publish' && needs.resolve.outputs.manifest_changed == 'true'
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "${{ steps.import_gpg.outputs.name }}"
          git config user.email "${{ steps.import_gpg.outputs.email }}"

          for pkg in ${{ env.ALL_PACKAGES }}; do
            git add ${{ env.SDK_ROOT }}/$pkg/package.json
          done

          git commit -S -m "Bumped Next.js SDK to v${{ needs.resolve.outputs.version }} (auto_bump) [skip ci]"

          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if git pull --rebase --autostash origin develop && git push origin develop; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            RETRY_COUNT=$((RETRY_COUNT + 1))
            sleep 2
          done
          exit 1

      - name: Publish summary
        if: always()
        run: |
          echo "## Next.js SDK Release" >> $GITHUB_STEP_SUMMARY
          echo "| Core action | ${{ needs.resolve.outputs.action }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Core version | ${{ needs.resolve.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ needs.resolve.outputs.reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Packages published | ${{ steps.packages.outputs.list || 'none' }} |" >> $GITHUB_STEP_SUMMARY
