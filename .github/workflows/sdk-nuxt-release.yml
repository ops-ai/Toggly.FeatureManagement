name: Nuxt SDK - Build & Publish

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'publish = use manifest version; auto_bump = legacy CI bump'
        required: false
        default: 'publish'
        type: choice
        options:
          - publish
          - auto_bump
      bump_type:
        description: 'Bump type (only used when release_mode is auto_bump)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      packages:
        description: 'Packages to publish (comma-separated, or "all")'
        required: false
        default: 'all'
        type: string

permissions:
  contents: write
  id-token: write

env:
  SDK_ROOT: Toggly.FeatureManagement.Nuxt
  CORE_MANIFEST: Toggly.FeatureManagement.Nuxt/nuxt-toggly-core/package.json
  ALL_PACKAGES: nuxt-toggly-core nuxt-toggly-server nuxt-toggly-client nuxt-toggly

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    defaults:
      run:
        working-directory: ${{ env.SDK_ROOT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
          cache-dependency-path: ${{ env.SDK_ROOT }}/pnpm-lock.yaml

      - name: Resolve release version
        id: release
        uses: ./.github/actions/resolve-release-version
        with:
          manifest_path: ${{ env.CORE_MANIFEST }}
          registry: npm
          package_name: '@ops-ai/nuxt-toggly-core'
          release_mode: ${{ github.event.inputs.release_mode || 'publish' }}
          bump_type: ${{ github.event.inputs.bump_type || 'patch' }}

      - name: Sync monorepo package versions
        if: steps.release.outputs.manifest_changed == 'true'
        run: |
          TARGET="${{ steps.release.outputs.version }}"
          for pkg in nuxt-toggly-server nuxt-toggly-client nuxt-toggly; do
            cd "$pkg"
            npm version "$TARGET" --no-git-tag-version --allow-same-version
            cd ..
          done

      # Core may already be on npm (action=skip) while sibling packages still need
      # a version bump publish. Gate only on fail; package-level checks decide work.
      - name: Note independent package versions
        if: steps.release.outputs.action != 'fail'
        run: |
          TARGET="${{ steps.release.outputs.version }}"
          echo "Core resolved version: $TARGET (action=${{ steps.release.outputs.action }})"
          for pkg in ${{ env.ALL_PACKAGES }}; do
            VER=$(node -p "require('./$pkg/package.json').version")
            echo "$pkg@$VER"
          done

      - name: Install dependencies
        if: steps.release.outputs.action != 'fail'
        run: pnpm install --frozen-lockfile

      - name: Determine unpublished packages
        if: steps.release.outputs.action != 'fail'
        id: packages
        run: |
          INPUT="${{ github.event.inputs.packages || 'all' }}"
          if [ "$INPUT" == "all" ]; then
            CANDIDATES="${{ env.ALL_PACKAGES }}"
          else
            CANDIDATES=$(echo "$INPUT" | tr ',' ' ')
          fi
          LIST=""
          for pkg in $CANDIDATES; do
            NAME=$(node -p "require('./$pkg/package.json').name")
            VER=$(node -p "require('./$pkg/package.json').version")
            if npm view "${NAME}@${VER}" version >/dev/null 2>&1; then
              echo "Already published: ${NAME}@${VER}"
            else
              LIST="$LIST $pkg"
            fi
          done
          LIST=$(echo "$LIST" | xargs)
          echo "list=$LIST" >> $GITHUB_OUTPUT
          echo "Unpublished: ${LIST:-none}"

      - name: Type check unpublished packages
        if: steps.release.outputs.action != 'fail' && steps.packages.outputs.list != ''
        run: |
          for pkg in ${{ steps.packages.outputs.list }}; do
            # nuxt-toggly typecheck runs nuxi against playground; skip in release gate
            if [ "$pkg" = "nuxt-toggly" ]; then
              echo "Skipping playground typecheck for $pkg"
              continue
            fi
            pnpm --filter "./$pkg" typecheck
          done

      - name: Build unpublished packages
        if: steps.release.outputs.action != 'fail' && steps.packages.outputs.list != ''
        run: |
          LIST="${{ steps.packages.outputs.list }}"
          # Meta module resolves sibling package dist at build time. Always build
          # workspace deps first when publishing nuxt-toggly, even if those deps
          # are already on npm and not in the unpublished list.
          if echo " $LIST " | grep -q ' nuxt-toggly '; then
            for dep in nuxt-toggly-core nuxt-toggly-server nuxt-toggly-client; do
              echo "Building workspace dependency $dep for meta package..."
              pnpm --filter "./$dep" build
            done
          fi
          for pkg in $LIST; do
            if [ "$pkg" = "nuxt-toggly" ]; then
              # Already built deps above; build meta last.
              pnpm --filter "./$pkg" build
              continue
            fi
            # Skip if already built as a meta dependency.
            if echo " $LIST " | grep -q ' nuxt-toggly ' && \
               { [ "$pkg" = "nuxt-toggly-core" ] || [ "$pkg" = "nuxt-toggly-server" ] || [ "$pkg" = "nuxt-toggly-client" ]; }; then
              echo "Already built $pkg as meta dependency"
              continue
            fi
            pnpm --filter "./$pkg" build
          done

      - name: Test unpublished packages
        if: steps.release.outputs.action != 'fail' && steps.packages.outputs.list != ''
        run: |
          for pkg in ${{ steps.packages.outputs.list }}; do
            pnpm --filter "./$pkg" test
          done


      - name: Verify packed tarballs
        if: steps.release.outputs.action != 'fail' && steps.packages.outputs.list != ''
        working-directory: ${{ github.workspace }}
        run: |
          for pkg in ${{ steps.packages.outputs.list }}; do
            echo "Verifying $pkg..."
            PACKAGE_DIR="${{ env.SDK_ROOT }}/$pkg" SKIP_IMPORT=true \
              node .github/actions/verify-package-tarball/verify.mjs
          done
      - name: Publish packages to npm
        if: steps.release.outputs.action != 'fail' && steps.packages.outputs.list != ''
        run: |
          ROOT="${GITHUB_WORKSPACE}/${{ env.SDK_ROOT }}"
          for pkg in ${{ steps.packages.outputs.list }}; do
            echo "Publishing $pkg..."
            cd "$ROOT/$pkg"

            if [ "$pkg" = "nuxt-toggly" ]; then
              for dep_dir in nuxt-toggly-core nuxt-toggly-server nuxt-toggly-client; do
                DEP=$(node -p "require('${ROOT}/$dep_dir/package.json').name")
                DEP_VER=$(node -p "require('${ROOT}/$dep_dir/package.json').version")
                DEP_RETRY=0
                until npm view "${DEP}@${DEP_VER}" version >/dev/null 2>&1; do
                  DEP_RETRY=$((DEP_RETRY + 1))
                  if [ $DEP_RETRY -ge 10 ]; then
                    echo "Timed out waiting for ${DEP}@${DEP_VER}"
                    exit 1
                  fi
                  sleep 6
                done
              done
            fi

            pnpm publish --access public --no-git-checks --provenance || pnpm publish --access public --no-git-checks
            sleep 3
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        if: steps.release.outputs.action == 'publish' && steps.release.outputs.manifest_changed == 'true'
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "${{ steps.import_gpg.outputs.name }}"
          git config user.email "${{ steps.import_gpg.outputs.email }}"

          for pkg in ${{ env.ALL_PACKAGES }}; do
            git add ${{ env.SDK_ROOT }}/$pkg/package.json
          done

          git commit -S -m "Bumped Nuxt SDK to v${{ steps.release.outputs.version }} (auto_bump) [skip ci]"

          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if git pull --rebase --autostash origin develop && git push origin develop; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            RETRY_COUNT=$((RETRY_COUNT + 1))
            sleep 2
          done
          exit 1

      - name: Publish summary
        if: always()
        run: |
          echo "## Nuxt SDK Release" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| Core action | ${{ steps.release.outputs.action }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Core version | ${{ steps.release.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Manifest | ${{ steps.release.outputs.manifest_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry latest | ${{ steps.release.outputs.registry_latest || 'none' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ steps.release.outputs.reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Packages published | ${{ steps.packages.outputs.list || 'none' }} |" >> $GITHUB_STEP_SUMMARY
