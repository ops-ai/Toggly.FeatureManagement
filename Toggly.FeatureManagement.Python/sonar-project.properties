# SonarQube Configuration for Toggly Python SDK

# Project identification
sonar.projectKey=toggly-python-sdk
sonar.projectName=Toggly Python SDK
sonar.projectVersion=0.1.0

# Source paths (comma-separated)
sonar.sources=toggly/src,toggly-django/src,toggly-flask/src,toggly-fastapi/src,toggly-cache/src

# Test paths
sonar.tests=toggly/tests,toggly-django/tests,toggly-flask/tests,toggly-fastapi/tests,toggly-cache/tests

# Source encoding
sonar.sourceEncoding=UTF-8

# Python specific settings
sonar.python.version=3.8,3.9,3.10,3.11,3.12,3.13

# Coverage reports (generated by pytest-cov)
sonar.python.coverage.reportPaths=toggly/coverage.xml,toggly-django/coverage.xml,toggly-flask/coverage.xml,toggly-fastapi/coverage.xml,toggly-cache/coverage.xml

# Exclude test files from duplication detection
sonar.cpd.exclusions=**/tests/**

# Exclude __pycache__ and other generated files
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/dist/**,**/build/**,**/*.egg-info/**

# Quality gate settings
sonar.qualitygate.wait=true

# Duplications exclusions
sonar.duplications.exclusions=**/tests/**

# Issue assignment
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S125
sonar.issue.ignore.multicriteria.e1.resourceKey=**/tests/**
