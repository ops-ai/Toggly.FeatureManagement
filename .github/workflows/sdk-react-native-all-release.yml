          git add ${{ env.SDK_ROOT }}/storage-mmkv/package.json ${{ env.SDK_ROOT }}/storage-mmkv/package-lock.json
          git commit -S -m "Bumped @ops-ai/react-native-toggly-storage-mmkv to ${{ steps.version.outputs.new_version }} [skip ci]"
