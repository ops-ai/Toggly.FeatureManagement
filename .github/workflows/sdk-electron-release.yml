name: Electron SDK - Build & Publish

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'publish = use manifest version; auto_bump = legacy CI bump'
        required: false
        default: 'publish'
        type: choice
        options:
          - publish
          - auto_bump
      bump_type:
        description: 'Bump type (only used when release_mode is auto_bump)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

env:
  SDK_DIR: Toggly.FeatureManagement.Electron
  NPM_PACKAGE: '@ops-ai/electron-feature-flags-toggly'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    defaults:
      run:
        working-directory: ${{ env.SDK_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve release version
        id: release
        uses: ./.github/actions/resolve-release-version
        with:
          manifest_path: ${{ env.SDK_DIR }}/package.json
          registry: npm
          package_name: ${{ env.NPM_PACKAGE }}
          release_mode: ${{ github.event.inputs.release_mode || 'publish' }}
          bump_type: ${{ github.event.inputs.bump_type || 'patch' }}

      - name: Install dependencies
        if: steps.release.outputs.action == 'publish'
        run: npm install

      - name: Build
        if: steps.release.outputs.action == 'publish'
        run: npm run build

      - name: Run tests
        if: steps.release.outputs.action == 'publish'
        run: npm test

      - name: Verify packed tarball
        if: steps.release.outputs.action == 'publish'
        uses: ./.github/actions/verify-package-tarball
        with:
          package_dir: ${{ env.SDK_DIR }}
          skip_import: 'false'

      - name: Publish to npm
        if: steps.release.outputs.action == 'publish'
        run: npm publish --provenance --access public || npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        if: steps.release.outputs.action == 'publish' && steps.release.outputs.manifest_changed == 'true'
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "${{ steps.import_gpg.outputs.name }}"
          git config user.email "${{ steps.import_gpg.outputs.email }}"
          git add ${{ env.SDK_DIR }}/package.json ${{ env.SDK_DIR }}/package-lock.json ${{ env.SDK_DIR }}/CHANGELOG.md || true
          git commit -S -m "Bump ${{ env.NPM_PACKAGE }} to ${{ steps.release.outputs.version }} [skip ci]" || true
          git push || (
            git pull --rebase origin HEAD &&
            git push
          )
