name: Flutter SDKs - Build & Publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Which package to publish'
        required: true
        default: core
        type: choice
        options:
          - core
          - secure_storage
          - disk
          - sqlite
          - isar
      release_mode:
        description: 'publish = use manifest version; auto_bump = legacy CI bump'
        required: false
        default: 'publish'
        type: choice
        options:
          - publish
          - auto_bump
      bump_type:
        description: 'Bump type (only used when release_mode is auto_bump)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'flutter-sdk-v*'
      - 'flutter-secure_storage-v*'
      - 'flutter-disk-v*'
      - 'flutter-sqlite-v*'
      - 'flutter-isar-v*'

permissions:
  contents: write
  id-token: write

env:
  FLUTTER_ROOT_DIR: Toggly.FeatureManagement.Flutter

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      action: ${{ steps.release.outputs.action }}
      reason: ${{ steps.release.outputs.reason }}
      manifest_version: ${{ steps.release.outputs.manifest_version }}
      registry_latest: ${{ steps.release.outputs.registry_latest }}
      manifest_changed: ${{ steps.release.outputs.manifest_changed }}
      dir: ${{ steps.map.outputs.dir }}
      package: ${{ steps.map.outputs.package }}
      tag_prefix: ${{ steps.map.outputs.tag_prefix }}
      is_provider: ${{ steps.map.outputs.is_provider }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Map package input to paths
        id: map
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            case "$TAG" in
              flutter-sdk-v*) PACKAGE_INPUT="core" ;;
              flutter-secure_storage-v*) PACKAGE_INPUT="secure_storage" ;;
              flutter-disk-v*) PACKAGE_INPUT="disk" ;;
              flutter-sqlite-v*) PACKAGE_INPUT="sqlite" ;;
              flutter-isar-v*) PACKAGE_INPUT="isar" ;;
              *)
                echo "Unrecognized tag prefix: $TAG"
                exit 1
                ;;
            esac
            echo "Resolved package from tag: $PACKAGE_INPUT ($TAG)"
          else
            PACKAGE_INPUT="${{ github.event.inputs.package }}"
          fi

          case "$PACKAGE_INPUT" in
            core)
              DIR="toggly"
              PKG="feature_flags_toggly"
              TAG_PREFIX="flutter-sdk-v"
              IS_PROVIDER="false"
              ;;
            secure_storage)
              DIR="toggly_secure_storage"
              PKG="feature_flags_toggly_secure_storage"
              TAG_PREFIX="flutter-secure_storage-v"
              IS_PROVIDER="true"
              ;;
            disk)
              DIR="toggly_disk"
              PKG="feature_flags_toggly_disk"
              TAG_PREFIX="flutter-disk-v"
              IS_PROVIDER="true"
              ;;
            sqlite)
              DIR="toggly_sqlite"
              PKG="feature_flags_toggly_sqlite"
              TAG_PREFIX="flutter-sqlite-v"
              IS_PROVIDER="true"
              ;;
            isar)
              DIR="toggly_isar"
              PKG="feature_flags_toggly_isar"
              TAG_PREFIX="flutter-isar-v"
              IS_PROVIDER="true"
              ;;
            *)
              echo "Invalid package: $PACKAGE_INPUT"
              exit 1
              ;;
          esac
          echo "dir=$DIR" >> $GITHUB_OUTPUT
          echo "package=$PKG" >> $GITHUB_OUTPUT
          echo "tag_prefix=$TAG_PREFIX" >> $GITHUB_OUTPUT
          echo "is_provider=$IS_PROVIDER" >> $GITHUB_OUTPUT
          echo "Selected package: $PKG ($DIR)"

      - name: Resolve release version
        id: release
        uses: ./.github/actions/resolve-release-version
        with:
          manifest_path: ${{ env.FLUTTER_ROOT_DIR }}/${{ steps.map.outputs.dir }}/pubspec.yaml
          registry: pub
          package_name: ${{ steps.map.outputs.package }}
          release_mode: ${{ github.event.inputs.release_mode || 'publish' }}
          bump_type: ${{ github.event.inputs.bump_type || 'patch' }}

  build-and-test:
    needs: validate
    if: needs.validate.outputs.action == 'publish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      # Provider packages use committed pubspec_overrides.yaml (path: ../toggly).
      - name: Install dependencies
        working-directory: ${{ env.FLUTTER_ROOT_DIR }}/${{ needs.validate.outputs.dir }}
        run: flutter pub get

      - name: Run code generation (if needed)
        if: needs.validate.outputs.is_provider == 'true'
        working-directory: ${{ env.FLUTTER_ROOT_DIR }}/${{ needs.validate.outputs.dir }}
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            flutter pub run build_runner build --delete-conflicting-outputs
          else
            echo "No build_runner found, skipping code generation"
          fi

      - name: Analyze
        working-directory: ${{ env.FLUTTER_ROOT_DIR }}/${{ needs.validate.outputs.dir }}
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        working-directory: ${{ env.FLUTTER_ROOT_DIR }}/${{ needs.validate.outputs.dir }}
        run: flutter test
        continue-on-error: true

  # Branch dispatch: validate, test, then push a signed tag. Tag push triggers publish via OIDC.
  tag-and-push:
    needs: [build-and-test, validate]
    if: |
      needs.validate.outputs.action == 'publish' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Configure git
        run: |
          git config user.name "${{ steps.import_gpg.outputs.name }}"
          git config user.email "${{ steps.import_gpg.outputs.email }}"

      - name: Commit version bump
        if: needs.validate.outputs.manifest_changed == 'true'
        run: |
          if [ "${{ needs.validate.outputs.is_provider }}" = "true" ]; then
            git checkout -- "${{ env.FLUTTER_ROOT_DIR }}/${{ needs.validate.outputs.dir }}/pubspec_overrides.yaml" 2>/dev/null || true
          fi

          git add "${{ env.FLUTTER_ROOT_DIR }}/${{ needs.validate.outputs.dir }}/pubspec.yaml"

          if [ "${{ needs.validate.outputs.is_provider }}" = "true" ]; then
            COMMIT_MSG="Bumped ${{ needs.validate.outputs.package }} to v${{ needs.validate.outputs.version }} (auto_bump) [skip ci]"
          else
            COMMIT_MSG="Bumped Flutter SDK to v${{ needs.validate.outputs.version }} (auto_bump) [skip ci]"
          fi

          git commit -S -m "$COMMIT_MSG"

          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if git pull --rebase --autostash origin develop; then
              if git push origin develop; then
                echo "Successfully pushed version bump"
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              sleep 2
            fi
          done

          echo "Failed to push after $MAX_RETRIES attempts"
          exit 1

      - name: Create and push tag
        run: |
          TAG="${{ needs.validate.outputs.tag_prefix }}${{ needs.validate.outputs.version }}"
          if [ "${{ needs.validate.outputs.is_provider }}" = "true" ]; then
            TAG_MSG="${{ needs.validate.outputs.package }} v${{ needs.validate.outputs.version }}"
          else
            TAG_MSG="Flutter SDK v${{ needs.validate.outputs.version }}"
          fi
          git tag -s -m "$TAG_MSG" "$TAG"
          git push origin "$TAG"
          echo "Pushed tag $TAG — publish will run automatically on the tag push event."

  # Tag ref only: pub.dev OIDC auth requires github.ref_type == tag.
  publish:
    needs: [build-and-test, validate]
    if: |
      needs.validate.outputs.action == 'publish' &&
      github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          EXPECTED="${{ needs.validate.outputs.tag_prefix }}${{ needs.validate.outputs.version }}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::Tag $TAG does not match expected $EXPECTED from pubspec.yaml"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      # setup-dart must run before Flutter so OIDC credentials are registered for pub.dev.
      - name: Setup Dart (OIDC for pub.dev)
        uses: dart-lang/setup-dart@v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      # Strip the local path override so provider packages resolve the base SDK from pub.dev.
      - name: Remove local dependency overrides
        if: needs.validate.outputs.is_provider == 'true'
        working-directory: ${{ env.FLUTTER_ROOT_DIR }}/${{ needs.validate.outputs.dir }}
        run: |
          rm -f pubspec_overrides.yaml
          echo "Removed pubspec_overrides.yaml (if present)"

      - name: Install dependencies
        working-directory: ${{ env.FLUTTER_ROOT_DIR }}/${{ needs.validate.outputs.dir }}
        run: flutter pub get

      # Generate Isar (or other) codegen so *.g.dart files are present in the published archive.
      - name: Run code generation (if needed)
        if: needs.validate.outputs.is_provider == 'true'
        working-directory: ${{ env.FLUTTER_ROOT_DIR }}/${{ needs.validate.outputs.dir }}
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            flutter pub run build_runner build --delete-conflicting-outputs
          else
            echo "No build_runner found, skipping code generation"
          fi

      - name: Dry run publish
        working-directory: ${{ env.FLUTTER_ROOT_DIR }}/${{ needs.validate.outputs.dir }}
        run: flutter pub publish --dry-run

      - name: Publish to pub.dev
        working-directory: ${{ env.FLUTTER_ROOT_DIR }}/${{ needs.validate.outputs.dir }}
        run: flutter pub publish --force

      - name: Create GitHub Release (core)
        if: needs.validate.outputs.is_provider != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag_prefix }}${{ needs.validate.outputs.version }}
          name: Flutter SDK v${{ needs.validate.outputs.version }}
          body: |
            ## Flutter SDK v${{ needs.validate.outputs.version }}

            ### Installation

            Add to your `pubspec.yaml`:

            ```yaml
            dependencies:
              feature_flags_toggly: ^${{ needs.validate.outputs.version }}
            ```

            Or install via command line:

            ```bash
            flutter pub add feature_flags_toggly
            ```

            ### Requirements

            - Dart SDK >=2.18.2 <4.0.0
            - Flutter >=1.17.0

            ### Links

            - [pub.dev package](https://pub.dev/packages/feature_flags_toggly)
            - [Documentation](https://docs.toggly.io/docs/sdks/flutter)
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (provider)
        if: needs.validate.outputs.is_provider == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag_prefix }}${{ needs.validate.outputs.version }}
          name: ${{ needs.validate.outputs.package }} v${{ needs.validate.outputs.version }}
          body: |
            ## ${{ needs.validate.outputs.package }} v${{ needs.validate.outputs.version }}

            Persistence backend for the Toggly Flutter SDK.

            ### Installation

            ```yaml
            dependencies:
              feature_flags_toggly: ^1.2.0
              ${{ needs.validate.outputs.package }}: ^${{ needs.validate.outputs.version }}
            ```

            ### Links

            - [pub.dev package](https://pub.dev/packages/${{ needs.validate.outputs.package }})
            - [Documentation](https://docs.toggly.io/docs/sdks/flutter)
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    needs: [publish, tag-and-push, validate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Flutter SDKs Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} (${{ github.ref_type }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| Action | ${{ needs.validate.outputs.action }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Package | ${{ needs.validate.outputs.package }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Manifest | ${{ needs.validate.outputs.manifest_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry latest | ${{ needs.validate.outputs.registry_latest || 'none' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release mode | ${{ github.event.inputs.release_mode || 'publish' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ needs.validate.outputs.reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ needs.validate.outputs.tag_prefix }}${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-release | ${{ github.event.inputs.prerelease || 'false' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.ref_type }}" = "branch" ] && [ "${{ needs.tag-and-push.result }}" = "success" ]; then
            echo "Tag pushed. **Publish runs automatically** when the tag push workflow starts." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View on pub.dev](https://pub.dev/packages/${{ needs.validate.outputs.package }})" >> $GITHUB_STEP_SUMMARY
