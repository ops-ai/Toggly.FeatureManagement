name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish (toggly, toggly-django, toggly-flask, toggly-fastapi, toggly-cache, all)"
        required: true
        default: "all"

env:
  PYTHON_VERSION: "3.11"

jobs:
  publish-toggly:
    name: Publish toggly
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.package == 'all' || github.event.inputs.package == 'toggly'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: |
          cd toggly
          python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          cd toggly
          twine upload dist/*

  publish-toggly-django:
    name: Publish toggly-django
    runs-on: ubuntu-latest
    needs: publish-toggly
    if: github.event_name == 'release' || github.event.inputs.package == 'all' || github.event.inputs.package == 'toggly-django'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: |
          cd toggly-django
          python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          cd toggly-django
          twine upload dist/*

  publish-toggly-flask:
    name: Publish toggly-flask
    runs-on: ubuntu-latest
    needs: publish-toggly
    if: github.event_name == 'release' || github.event.inputs.package == 'all' || github.event.inputs.package == 'toggly-flask'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: |
          cd toggly-flask
          python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          cd toggly-flask
          twine upload dist/*

  publish-toggly-fastapi:
    name: Publish toggly-fastapi
    runs-on: ubuntu-latest
    needs: publish-toggly
    if: github.event_name == 'release' || github.event.inputs.package == 'all' || github.event.inputs.package == 'toggly-fastapi'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: |
          cd toggly-fastapi
          python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          cd toggly-fastapi
          twine upload dist/*

  publish-toggly-cache:
    name: Publish toggly-cache
    runs-on: ubuntu-latest
    needs: publish-toggly
    if: github.event_name == 'release' || github.event.inputs.package == 'all' || github.event.inputs.package == 'toggly-cache'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: |
          cd toggly-cache
          python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          cd toggly-cache
          twine upload dist/*
