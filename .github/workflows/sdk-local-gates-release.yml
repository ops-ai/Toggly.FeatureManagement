name: Local Gates Package - Build & Publish

on:
  push:
    branches:
      - develop
    paths:
      - 'toggly-local-gates/**'
      - '.github/workflows/sdk-local-gates-release.yml'
      - '.github/actions/resolve-release-version/**'
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'publish = use manifest version; auto_bump = legacy CI bump'
        required: false
        default: 'publish'
        type: choice
        options:
          - publish
          - auto_bump
      bump_type:
        description: 'Bump type (only used when release_mode is auto_bump)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: local-gates-sdk-release
  cancel-in-progress: false

env:
  SDK_DIR: toggly-local-gates
  NPM_PACKAGE: '@ops-ai/toggly-local-gates'

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.release.outputs.action }}
      version: ${{ steps.release.outputs.version }}
      reason: ${{ steps.release.outputs.reason }}
      manifest_version: ${{ steps.release.outputs.manifest_version }}
      registry_latest: ${{ steps.release.outputs.registry_latest }}
      manifest_changed: ${{ steps.release.outputs.manifest_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve release version
        id: release
        uses: ./.github/actions/resolve-release-version
        with:
          manifest_path: ${{ env.SDK_DIR }}/package.json
          registry: npm
          package_name: ${{ env.NPM_PACKAGE }}
          release_mode: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode || 'publish' }}
          bump_type: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bump_type || 'patch' }}

      - name: Resolve summary
        if: always()
        run: |
          echo "## Local Gates resolve" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Action | ${{ steps.release.outputs.action }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | ${{ steps.release.outputs.version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Reason | ${{ steps.release.outputs.reason }} |" >> "$GITHUB_STEP_SUMMARY"

  # toggly-local-gates is not in the analysis-javascript.yml matrix, so its
  # existing install/typecheck/test/build/verify commands are preserved here
  # as a standalone gate (no environment) instead of a reusable workflow call.
  gates:
    needs: resolve
    if: needs.resolve.outputs.action == 'publish'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SDK_DIR }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify build outputs
        run: |
          for file in dist/cjs/index.js dist/cjs/index.d.ts dist/esm/index.js dist/esm/index.d.ts; do
            if [ ! -f "$file" ]; then
              echo "::error::Build verification failed - missing $file"
              exit 1
            fi
          done
          # Node resolves module type from the nearest package.json, so the ESM
          # output is parsed as CommonJS without this marker.
          if [ "$(node -p "require('./dist/esm/package.json').type")" != "module" ]; then
            echo "::error::dist/esm/package.json must declare \"type\": \"module\""
            exit 1
          fi
          echo "Build outputs verified"

  publish:
    needs: [resolve, gates]
    if: needs.resolve.outputs.action == 'publish' && needs.gates.result == 'success'
    runs-on: ubuntu-latest
    environment: npm-publish
    defaults:
      run:
        working-directory: ${{ env.SDK_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      # A dry-run publish accepts unusable specifiers, so install the real tarball
      # in an isolated directory instead. See OPS-777.
      - name: Verify packed tarball installs
        run: |
          TARBALL="$(npm pack --silent --pack-destination "$RUNNER_TEMP")"
          PACKED="$RUNNER_TEMP/$TARBALL"

          BAD=$(tar -xzOf "$PACKED" package/package.json \
            | node -e "
              const m = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              const deps = { ...m.dependencies, ...m.peerDependencies, ...m.optionalDependencies };
              const bad = Object.entries(deps).filter(([, v]) => /^(workspace|file|link):/.test(v));
              console.log(bad.map(([k, v]) => k + '@' + v).join(', '));
            ")
          if [ -n "$BAD" ]; then
            echo "::error::Packed manifest contains unpublishable specifiers: $BAD"
            exit 1
          fi

          PROBE="$RUNNER_TEMP/install-probe"
          rm -rf "$PROBE" && mkdir -p "$PROBE"
          cd "$PROBE"
          npm init -y >/dev/null
          npm install "$PACKED"
          npm ls --all

          node -e "const m = require('${{ env.NPM_PACKAGE }}'); if (!Object.keys(m).length) { throw new Error('CJS entry point exported nothing') }"
          node --input-type=module -e "const m = await import('${{ env.NPM_PACKAGE }}'); if (!Object.keys(m).length) { throw new Error('ESM entry point exported nothing') }"
          echo "Packed tarball verified"

      # Trusted Publisher not yet configured for this package; keep token +
      # provenance with non-provenance fallback until OIDC is verified.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ''

      - name: Commit version bump
        if: needs.resolve.outputs.manifest_changed == 'true'
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "${{ steps.import_gpg.outputs.name }}"
          git config user.email "${{ steps.import_gpg.outputs.email }}"

          git add ${{ env.SDK_DIR }}/package.json
          git add ${{ env.SDK_DIR }}/package-lock.json 2>/dev/null || true

          git commit -S -m "Bumped local gates package to v${{ needs.resolve.outputs.version }} (auto_bump) [skip ci]"

          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if git pull --rebase --autostash origin develop; then
              if git push origin develop; then
                echo "Successfully pushed version bump"
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              sleep 2
            fi
          done

          echo "Failed to push after $MAX_RETRIES attempts"
          exit 1

      - name: Publish summary
        if: always()
        run: |
          echo "## Local Gates Package Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Action | ${{ needs.resolve.outputs.action }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.resolve.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Manifest | ${{ needs.resolve.outputs.manifest_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry latest | ${{ needs.resolve.outputs.registry_latest || 'none' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ needs.resolve.outputs.reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package**: ${{ env.NPM_PACKAGE }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View on NPM](https://www.npmjs.com/package/${{ env.NPM_PACKAGE }})" >> $GITHUB_STEP_SUMMARY
