[versions]
toggly = "1.8.0"
compose-bom = "2024.12.01"
activity = "1.9.3"
lifecycle = "2.8.7"
appcompat = "1.7.0"
androidx-test-junit = "1.3.0"
androidx-test-runner = "1.7.0"
espresso = "3.7.0"
