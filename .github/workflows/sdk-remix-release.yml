name: Remix SDK - Build & Publish

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'publish = use manifest version; auto_bump = legacy CI bump'
        required: false
        default: 'publish'
        type: choice
        options:
          - publish
          - auto_bump
      bump_type:
        description: 'Bump type (only used when release_mode is auto_bump)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      packages:
        description: 'Packages to publish (comma-separated, or "all")'
        required: false
        default: 'all'
        type: string

permissions:
  contents: write
  id-token: write

env:
  SDK_ROOT: Toggly.FeatureManagement.Remix
  CORE_MANIFEST: Toggly.FeatureManagement.Remix/remix-toggly-core/package.json
  ALL_PACKAGES: remix-toggly-core remix-toggly-server remix-toggly-client

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve release version
        id: release
        uses: ./.github/actions/resolve-release-version
        with:
          manifest_path: ${{ env.CORE_MANIFEST }}
          registry: npm
          package_name: '@ops-ai/remix-toggly-core'
          release_mode: ${{ github.event.inputs.release_mode || 'publish' }}
          bump_type: ${{ github.event.inputs.bump_type || 'patch' }}

      - name: Sync monorepo package versions
        if: steps.release.outputs.manifest_changed == 'true'
        run: |
          TARGET="${{ steps.release.outputs.version }}"
          for pkg in remix-toggly-server remix-toggly-client; do
            cd "${{ env.SDK_ROOT }}/$pkg"
            npm version "$TARGET" --no-git-tag-version --allow-same-version
          done

      # Core may already be on npm (action=skip) while sibling packages still need
      # a version bump publish. Gate only on fail; package-level checks decide work.
      - name: Note independent package versions
        if: steps.release.outputs.action != 'fail'
        run: |
          TARGET="${{ steps.release.outputs.version }}"
          echo "Core resolved version: $TARGET (action=${{ steps.release.outputs.action }})"
          for pkg in ${{ env.ALL_PACKAGES }}; do
            VER=$(node -p "require('./${{ env.SDK_ROOT }}/$pkg/package.json').version")
            echo "$pkg@$VER"
          done

      - name: Determine unpublished packages
        if: steps.release.outputs.action != 'fail'
        id: packages
        run: |
          INPUT="${{ github.event.inputs.packages || 'all' }}"
          if [ "$INPUT" == "all" ]; then
            CANDIDATES="${{ env.ALL_PACKAGES }}"
          else
            CANDIDATES=$(echo "$INPUT" | tr ',' ' ')
          fi
          LIST=""
          for pkg in $CANDIDATES; do
            NAME=$(node -p "require('./${{ env.SDK_ROOT }}/$pkg/package.json').name")
            VER=$(node -p "require('./${{ env.SDK_ROOT }}/$pkg/package.json').version")
            if npm view "${NAME}@${VER}" version >/dev/null 2>&1; then
              echo "Already published: ${NAME}@${VER}"
            else
              LIST="$LIST $pkg"
            fi
          done
          LIST=$(echo "$LIST" | xargs)
          echo "list=$LIST" >> $GITHUB_OUTPUT
          echo "Unpublished: ${LIST:-none}"

      - name: Install and build core
        if: steps.release.outputs.action != 'fail' && steps.packages.outputs.list != ''
        working-directory: ${{ env.SDK_ROOT }}/remix-toggly-core
        run: npm install && npm run build

      - name: Install and build server
        if: steps.release.outputs.action != 'fail' && contains(steps.packages.outputs.list, 'remix-toggly-server')
        working-directory: ${{ env.SDK_ROOT }}/remix-toggly-server
        run: npm install && npm run build

      - name: Install and build client
        if: steps.release.outputs.action != 'fail' && contains(steps.packages.outputs.list, 'remix-toggly-client')
        working-directory: ${{ env.SDK_ROOT }}/remix-toggly-client
        run: npm install && npm run build

      - name: Test core
        if: steps.release.outputs.action != 'fail' && contains(steps.packages.outputs.list, 'remix-toggly-core')
        working-directory: ${{ env.SDK_ROOT }}/remix-toggly-core
        run: npm test

      - name: Test server
        if: steps.release.outputs.action != 'fail' && contains(steps.packages.outputs.list, 'remix-toggly-server')
        working-directory: ${{ env.SDK_ROOT }}/remix-toggly-server
        run: npm test

      - name: Test client
        if: steps.release.outputs.action != 'fail' && contains(steps.packages.outputs.list, 'remix-toggly-client')
        working-directory: ${{ env.SDK_ROOT }}/remix-toggly-client
        run: npm test

      - name: Publish packages to npm
        if: steps.release.outputs.action != 'fail' && steps.packages.outputs.list != ''
        run: |
          ROOT="${GITHUB_WORKSPACE}/${{ env.SDK_ROOT }}"
          for pkg in ${{ steps.packages.outputs.list }}; do
            cd "$ROOT/$pkg"
            PACKAGE_NAME=$(node -p "require('./package.json').name")
            PACKAGE_VERSION=$(node -p "require('./package.json').version")
            if [ "$pkg" != "remix-toggly-core" ]; then
              CORE_NAME=$(node -p "require('${ROOT}/remix-toggly-core/package.json').name")
              CORE_VER=$(node -p "require('${ROOT}/remix-toggly-core/package.json').version")
              DEP_RETRY=0
              until npm view "${CORE_NAME}@${CORE_VER}" version >/dev/null 2>&1; do
                DEP_RETRY=$((DEP_RETRY + 1))
                if [ $DEP_RETRY -ge 10 ]; then
                  echo "Timed out waiting for ${CORE_NAME}@${CORE_VER}"
                  exit 1
                fi
                sleep 6
              done
            fi
            PACKAGE_DIR="$ROOT/$pkg" SKIP_IMPORT=true \
              node "${GITHUB_WORKSPACE}/.github/actions/verify-package-tarball/verify.mjs"
            npm publish --provenance --access public || npm publish --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        if: steps.release.outputs.action != 'fail' && steps.release.outputs.manifest_changed == 'true' && steps.packages.outputs.list != ''
        run: |
          git config user.name "${{ steps.import_gpg.outputs.name }}"
          git config user.email "${{ steps.import_gpg.outputs.email }}"

          for pkg in ${{ env.ALL_PACKAGES }}; do
            git add ${{ env.SDK_ROOT }}/$pkg/package.json
            git add ${{ env.SDK_ROOT }}/$pkg/package-lock.json 2>/dev/null || true
          done

          git commit -S -m "Bumped Remix SDK to v${{ steps.release.outputs.version }} (auto_bump) [skip ci]"

          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if git pull --rebase --autostash origin develop && git push origin develop; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            RETRY_COUNT=$((RETRY_COUNT + 1))
            sleep 2
          done
          exit 1

      - name: Publish summary
        if: always()
        run: |
          echo "## Remix SDK Release" >> $GITHUB_STEP_SUMMARY
          echo "| Action | ${{ steps.release.outputs.action }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.release.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ steps.release.outputs.reason }} |" >> $GITHUB_STEP_SUMMARY
