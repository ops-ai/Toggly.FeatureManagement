# SonarCloud Configuration for Nuxt SDK
sonar.projectKey=toggly-sdks-nuxt
sonar.organization=ops-ai
sonar.projectName=Toggly SDKs - Nuxt

# Source directories
sonar.sources=nuxt-toggly-core/src,nuxt-toggly-server/src,nuxt-toggly-client/src,nuxt-toggly/src

# Test directories
sonar.tests=nuxt-toggly-core/tests,nuxt-toggly-server/tests,nuxt-toggly-client/tests

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.spec.ts,**/playground/**

# Test inclusions
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

# Coverage report paths
sonar.javascript.lcov.reportPaths=nuxt-toggly-core/coverage/lcov.info,nuxt-toggly-server/coverage/lcov.info,nuxt-toggly-client/coverage/lcov.info

# TypeScript version
sonar.typescript.tsconfigPath=nuxt-toggly-core/tsconfig.json
