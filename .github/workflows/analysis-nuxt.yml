name: Nuxt SDKs - Tests & Analysis

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.Nuxt/**'
      - '.github/workflows/analysis-nuxt.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.Nuxt/**'
      - '.github/workflows/analysis-nuxt.yml'
  workflow_dispatch:

env:
  SDK_ROOT: Toggly.FeatureManagement.Nuxt

defaults:
  run:
    working-directory: Toggly.FeatureManagement.Nuxt

jobs:
  test:
    name: Test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: nuxt-toggly-core
            name: Core
          - package: nuxt-toggly-server
            name: Server
          - package: nuxt-toggly-client
            name: Client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: ${{ env.SDK_ROOT }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        if: matrix.package != 'nuxt-toggly-core'
        run: pnpm build:core

      - name: Run tests with coverage
        run: pnpm --filter @ops-ai/${{ matrix.package }} test:coverage
        continue-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-nuxt-${{ matrix.package }}
          path: ${{ env.SDK_ROOT }}/${{ matrix.package }}/coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: ${{ env.SDK_ROOT }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm build:core

      - name: Run smoke test
        working-directory: ${{ env.SDK_ROOT }}/nuxt-toggly-core
        env:
          TOGGLY_SMOKE_APP_KEY_FRONTEND: ${{ secrets.TOGGLY_SMOKE_APP_KEY_FRONTEND }}
        run: pnpm vitest run tests/smoke.test.ts tests/smoke-ws.test.ts

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [test, dependency-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies for TypeScript analysis
        working-directory: ${{ env.SDK_ROOT }}
        run: pnpm install --ignore-scripts || true
        continue-on-error: true

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-nuxt-*
          path: coverage-artifacts/
        continue-on-error: true

      - name: Organize coverage files
        run: |
          mkdir -p coverage
          for pkg in nuxt-toggly-core nuxt-toggly-server nuxt-toggly-client; do
            if [ -f "coverage-artifacts/coverage-nuxt-$pkg/lcov.info" ]; then
              sed "s|SF:|SF:${{ env.SDK_ROOT }}/$pkg/|g" \
                "coverage-artifacts/coverage-nuxt-$pkg/lcov.info" > "coverage/$pkg.lcov.info"
            fi
          done
          echo "Coverage files:"
          ls -la coverage/ || echo "No coverage files found"
        working-directory: .
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-nuxt
            -Dsonar.organization=ops-ai
            -Dsonar.projectName="Toggly SDKs - Nuxt"
            -Dsonar.sources=${{ env.SDK_ROOT }}/nuxt-toggly-core/src,${{ env.SDK_ROOT }}/nuxt-toggly-server/src,${{ env.SDK_ROOT }}/nuxt-toggly-client/src,${{ env.SDK_ROOT }}/nuxt-toggly/src
            -Dsonar.tests=${{ env.SDK_ROOT }}/nuxt-toggly-core/tests,${{ env.SDK_ROOT }}/nuxt-toggly-server/tests,${{ env.SDK_ROOT }}/nuxt-toggly-client/tests
            -Dsonar.javascript.lcov.reportPaths=coverage/nuxt-toggly-core.lcov.info,coverage/nuxt-toggly-server.lcov.info,coverage/nuxt-toggly-client.lcov.info
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.spec.ts,**/playground/**
            -Dsonar.test.inclusions=**/*.test.ts,**/*.spec.ts
        continue-on-error: true

      - name: Download Dependency Check report (for SonarQube Server)
        uses: actions/download-artifact@v4
        with:
          name: dependency-check-report-nuxt
          path: dependency-check-reports/
        continue-on-error: true

      - name: SonarQube Server Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-nuxt
            -Dsonar.projectName="Toggly SDKs - Nuxt"
            -Dsonar.sources=${{ env.SDK_ROOT }}/nuxt-toggly-core/src,${{ env.SDK_ROOT }}/nuxt-toggly-server/src,${{ env.SDK_ROOT }}/nuxt-toggly-client/src,${{ env.SDK_ROOT }}/nuxt-toggly/src
            -Dsonar.tests=${{ env.SDK_ROOT }}/nuxt-toggly-core/tests,${{ env.SDK_ROOT }}/nuxt-toggly-server/tests,${{ env.SDK_ROOT }}/nuxt-toggly-client/tests
            -Dsonar.javascript.lcov.reportPaths=coverage/nuxt-toggly-core.lcov.info,coverage/nuxt-toggly-server.lcov.info,coverage/nuxt-toggly-client.lcov.info
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.spec.ts,**/playground/**
            -Dsonar.test.inclusions=**/*.test.ts,**/*.spec.ts
            -Dsonar.dependencyCheck.reportPath=dependency-check-reports/dependency-check-report.xml
        continue-on-error: true

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache OWASP Dependency Check database
        uses: actions/cache@v4
        with:
          path: /home/runner/OWASP-Dependency-Check/data/
          key: dependency-check-db-${{ runner.os }}-v6
          restore-keys: |
            dependency-check-db-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'toggly-sdks-nuxt'
          path: ${{ env.SDK_ROOT }}
          format: 'ALL'
          args: >-
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableExperimental
            --disableAssembly
            --disableRubygems
            --disableBundleAudit
            --disablePyPkg
            --disablePyDist
        continue-on-error: true

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report-nuxt
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
        continue-on-error: true

  summary:
    name: Analysis Summary
    runs-on: ubuntu-latest
    needs: [test, smoke-test, sonar, dependency-check]
    if: always()

    steps:
      - name: Generate summary
        working-directory: .
        run: |
          echo "## Nuxt SDK Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Analysis workflow completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages Analyzed" >> $GITHUB_STEP_SUMMARY
          echo "- @ops-ai/nuxt-toggly-core" >> $GITHUB_STEP_SUMMARY
          echo "- @ops-ai/nuxt-toggly-server" >> $GITHUB_STEP_SUMMARY
          echo "- @ops-ai/nuxt-toggly-client" >> $GITHUB_STEP_SUMMARY
          echo "- @ops-ai/nuxt-toggly" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarCloud for detailed results: https://sonarcloud.io/project/overview?id=toggly-sdks-nuxt" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarQube Server for detailed results: ${{ secrets.SONAR_HOST_URL }}/dashboard?id=toggly-sdks-nuxt" >> $GITHUB_STEP_SUMMARY
