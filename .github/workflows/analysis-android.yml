name: Android SDK - Analysis

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.Android/**'
      - '.github/workflows/analysis-android.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.Android/**'
      - '.github/workflows/analysis-android.yml'
  workflow_dispatch:

env:
  SDK_ROOT: Toggly.FeatureManagement.Android

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        working-directory: ${{ env.SDK_ROOT }}
        run: chmod +x gradlew

      - name: Build all modules
        working-directory: ${{ env.SDK_ROOT }}
        run: ./gradlew build -x test

      - name: Run unit tests
        working-directory: ${{ env.SDK_ROOT }}
        run: ./gradlew test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java-${{ matrix.java }}
          path: |
            ${{ env.SDK_ROOT }}/**/build/reports/tests/
            ${{ env.SDK_ROOT }}/**/build/test-results/

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        working-directory: ${{ env.SDK_ROOT }}
        run: chmod +x gradlew

      - name: Run Android Lint
        working-directory: ${{ env.SDK_ROOT }}
        run: ./gradlew lint

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: ${{ env.SDK_ROOT }}/**/build/reports/lint-results*.html

  code-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        working-directory: ${{ env.SDK_ROOT }}
        run: chmod +x gradlew

      - name: Run tests with coverage
        working-directory: ${{ env.SDK_ROOT }}
        run: ./gradlew testDebugUnitTest koverXmlReport || ./gradlew test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ${{ env.SDK_ROOT }}/**/build/reports/kover/report.xml
          flags: android-sdk
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-coverage
          path: ${{ env.SDK_ROOT }}/**/build/reports/kover/report.xml
          retention-days: 7
          if-no-files-found: ignore

  build-samples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        working-directory: ${{ env.SDK_ROOT }}
        run: chmod +x gradlew

      - name: Build release artifacts
        working-directory: ${{ env.SDK_ROOT }}
        run: ./gradlew assembleRelease

      - name: Verify AAR artifacts
        working-directory: ${{ env.SDK_ROOT }}
        run: |
          echo "Checking for AAR files..."
          find . -name "*.aar" -type f | head -20

  api-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        working-directory: ${{ env.SDK_ROOT }}
        run: chmod +x gradlew

      - name: Check API compatibility
        working-directory: ${{ env.SDK_ROOT }}
        run: ./gradlew apiCheck || echo "API check not configured yet"

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: 'toggly-sdks-android'
          path: ${{ env.SDK_ROOT }}
          format: 'XML'
          out: 'dependency-check-reports'
          args: >
            --disableAssembly
            --disableRubygems
            --disableBundleAudit
            --disableNodeJS
            --disableNodeAudit
            --disablePyPkg
            --disablePyDist
        continue-on-error: true

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report-android
          path: dependency-check-reports/
          retention-days: 7
          if-no-files-found: ignore

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [code-coverage, dependency-check]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: android-coverage
          path: coverage-artifacts/
        continue-on-error: true

      - name: Download Dependency Check report
        uses: actions/download-artifact@v4
        with:
          name: dependency-check-report-android
          path: dependency-check-reports/
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-android
            -Dsonar.organization=ops-ai
            -Dsonar.projectName="Toggly SDKs - Android"
            -Dsonar.sources=${{ env.SDK_ROOT }}
            -Dsonar.exclusions=**/build/**,**/test/**,**/androidTest/**,**/*.bak
            -Dsonar.test.inclusions=**/src/test/**,**/src/androidTest/**
            -Dsonar.coverage.jacoco.xmlReportPaths=coverage-artifacts/**/build/reports/kover/report.xml
        continue-on-error: true

      - name: SonarQube Server Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-android
            -Dsonar.projectName="Toggly SDKs - Android"
            -Dsonar.sources=${{ env.SDK_ROOT }}
            -Dsonar.exclusions=**/build/**,**/test/**,**/androidTest/**,**/*.bak
            -Dsonar.test.inclusions=**/src/test/**,**/src/androidTest/**
            -Dsonar.coverage.jacoco.xmlReportPaths=coverage-artifacts/**/build/reports/kover/report.xml
            -Dsonar.dependencyCheck.reportPath=dependency-check-reports/dependency-check-report.xml
        continue-on-error: true
