name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-core:
    name: Test toggly (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.0', '3.1', '3.2', '3.3']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: toggly

      - name: Run tests
        working-directory: toggly
        run: bundle exec rspec --format documentation

      - name: Upload coverage
        if: matrix.ruby == '3.3'
        uses: codecov/codecov-action@v4
        with:
          files: toggly/coverage/.resultset.json
          flags: toggly-core
          token: ${{ secrets.CODECOV_TOKEN }}

  test-rails:
    name: Test toggly-rails (Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3']
        rails: ['7.0', '7.1', '7.2', '8.0']
        exclude:
          - ruby: '3.0'
            rails: '8.0'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: toggly-rails

      - name: Install specific Rails version
        working-directory: toggly-rails
        run: |
          bundle config set --local without ''
          bundle add rails --version "~> ${{ matrix.rails }}" --skip-install
          bundle install

      - name: Run tests
        working-directory: toggly-rails
        run: bundle exec rspec --format documentation

  test-cache:
    name: Test toggly-cache (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.0', '3.1', '3.2', '3.3']

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: toggly-cache

      - name: Run tests
        working-directory: toggly-cache
        run: bundle exec rspec --format documentation
        env:
          REDIS_URL: redis://localhost:6379

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: toggly

      - name: Run RuboCop on toggly
        working-directory: toggly
        run: bundle exec rubocop --parallel
        continue-on-error: true

      - name: Run RuboCop on toggly-rails
        working-directory: toggly-rails
        run: bundle exec rubocop --parallel
        continue-on-error: true

      - name: Run RuboCop on toggly-cache
        working-directory: toggly-cache
        run: bundle exec rubocop --parallel
        continue-on-error: true

  all-tests-pass:
    name: All Tests Pass
    needs: [test-core, test-rails, test-cache, lint]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All tests passed!"
