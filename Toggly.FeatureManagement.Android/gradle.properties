# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Retry transient Maven/Google repository fetches (connection drops, 5xx).
# HTTP 429 is not retried by Gradle itself — CI smoke wraps gradlew with backoff.
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=2000

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 defaults: built-in Kotlin + new DSL (no kotlin-android plugin).

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# Maven Publishing
POM_NAME=Toggly Android SDK
POM_DESCRIPTION=Feature flags SDK for Android applications
POM_URL=https://github.com/ops-ai/Toggly.FeatureManagement
POM_SCM_URL=https://github.com/ops-ai/Toggly.FeatureManagement
POM_SCM_CONNECTION=scm:git:git://github.com/ops-ai/Toggly.FeatureManagement.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://github.com/ops-ai/Toggly.FeatureManagement.git
POM_LICENCE_NAME=MIT License
POM_LICENCE_URL=https://opensource.org/licenses/MIT
POM_DEVELOPER_ID=toggly
POM_DEVELOPER_NAME=Toggly
POM_DEVELOPER_EMAIL=hello@toggly.io
