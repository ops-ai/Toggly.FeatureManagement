name: CI Healer

on:
  workflow_run:
    workflows:
      - Flutter SDKs - Tests & Analysis
      - Next.js SDKs - Tests & Analysis
      - Ruby SDKs - Tests & Analysis
      - Remix SDKs - Tests & Analysis
      - React Native SDKs - Tests & Analysis
      - PHP SDK - Tests & Analysis
      - Nuxt SDKs - Tests & Analysis
      - JavaScript/TypeScript SDKs - Tests & Analysis
      - Go SDK - Tests & Analysis
      - .NET SDKs - Tests & Analysis
      - iOS SDK - Analysis
      - Rust SDKs - Tests & Analysis
      - Java SDK - Tests & Analysis
      - Android SDK - Analysis
      - Python SDKs - Tests & Analysis
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: ci-healer-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  heal:
    # Phase 3: set repository variable CI_HEALER_LIVE=true after Phase 2 validation.
    # Phase 2 uses ci-healer-phase2-flutter-dryrun.yml instead.
    if: >-
      vars.CI_HEALER_LIVE == 'true' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch != '' &&
      !startsWith(github.event.workflow_run.head_branch, 'ci-heal/') &&
      github.event.workflow_run.name != 'CI Healer'
    runs-on: ubuntu-latest
    env:
      # Phase 2: set repository variable CI_HEALER_DRY_RUN=true and temporarily
      # reduce workflow_run.workflows to Flutter SDK only (see README rollout).
      # Phase 3 (default): CI_HEALER_DRY_RUN=false, all analysis workflows listed above.
      CI_HEALER_DRY_RUN: ${{ vars.CI_HEALER_DRY_RUN || 'false' }}
    steps:
      - name: Checkout failing branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run greencheck
        id: greencheck
        uses: braedonsaunders/greencheck@v0
        with:
          agent: claude
          agent-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          trigger-token: ${{ secrets.CI_HEALER_PAT || github.token }}
          max-passes: 5
          max-cost: "$5.00"
          timeout: 45m
          dry-run: ${{ env.CI_HEALER_DRY_RUN == 'true' }}

      - name: Report to Linear
        if: always()
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM: opsAI
          LINEAR_PROJECT: Toggly
          LINEAR_CI_HEALER_EPIC: ${{ vars.LINEAR_CI_HEALER_EPIC || 'OPS-274' }}
          WORKFLOW_RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GREENCHECK_FIXED: ${{ steps.greencheck.outputs.fixed }}
          GREENCHECK_PASSES: ${{ steps.greencheck.outputs.passes }}
          GREENCHECK_COMMITS: ${{ steps.greencheck.outputs.commits }}
          GREENCHECK_COST: ${{ steps.greencheck.outputs.cost }}
          GREENCHECK_FAILURES_FOUND: ${{ steps.greencheck.outputs.failures-found }}
          GREENCHECK_FAILURES_FIXED: ${{ steps.greencheck.outputs.failures-fixed }}
          CI_HEALER_DRY_RUN: ${{ env.CI_HEALER_DRY_RUN }}
        run: node .github/ci-healer/report-to-linear.mjs
