name: Python SDKs - Tests & Analysis

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.Python/**'
      - '.github/workflows/analysis-python.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.Python/**'
      - '.github/workflows/analysis-python.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  SDK_ROOT: Toggly.FeatureManagement.Python

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SDK_ROOT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Lint toggly
        run: ruff check toggly/src

      - name: Lint toggly-django
        run: ruff check toggly-django/src

      - name: Lint toggly-flask
        run: ruff check toggly-flask/src

      - name: Lint toggly-fastapi
        run: ruff check toggly-fastapi/src

      - name: Lint toggly-cache
        run: ruff check toggly-cache/src

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SDK_ROOT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install mypy
        run: pip install mypy

      - name: Install dependencies
        run: |
          pip install -e toggly/
          pip install django flask fastapi starlette redis pymemcache

      - name: Type check toggly
        run: mypy toggly/src --ignore-missing-imports

      - name: Type check toggly-cache
        run: mypy toggly-cache/src --ignore-missing-imports

  test-core:
    name: Test Core (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: ${{ env.SDK_ROOT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd toggly
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          cd toggly
          pytest tests/ -v --cov=src/toggly --cov-report=xml --cov-report=term-missing

      - name: Upload coverage (Python 3.11 only)
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-core
          path: ${{ env.SDK_ROOT }}/toggly/coverage.xml
          retention-days: 7

  test-django:
    name: Test Django (Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        django-version: ["4.2", "5.0", "5.1"]
        exclude:
          - python-version: "3.8"
            django-version: "5.0"
          - python-version: "3.9"
            django-version: "5.0"
          - python-version: "3.8"
            django-version: "5.1"
          - python-version: "3.9"
            django-version: "5.1"
    defaults:
      run:
        working-directory: ${{ env.SDK_ROOT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e toggly/
          pip install django==${{ matrix.django-version }}.*
          cd toggly-django
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          cd toggly-django
          pytest tests/ -v --cov=src/toggly_django --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11' && matrix.django-version == '5.0'
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-django
          path: ${{ env.SDK_ROOT }}/toggly-django/coverage.xml
          retention-days: 7

  test-flask:
    name: Test Flask (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: ${{ env.SDK_ROOT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e toggly/
          cd toggly-flask
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          cd toggly-flask
          pytest tests/ -v --cov=src/toggly_flask --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-flask
          path: ${{ env.SDK_ROOT }}/toggly-flask/coverage.xml
          retention-days: 7

  test-fastapi:
    name: Test FastAPI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: ${{ env.SDK_ROOT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e toggly/
          cd toggly-fastapi
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          cd toggly-fastapi
          pytest tests/ -v --cov=src/toggly_fastapi --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-fastapi
          path: ${{ env.SDK_ROOT }}/toggly-fastapi/coverage.xml
          retention-days: 7

  test-cache:
    name: Test Cache (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: ${{ env.SDK_ROOT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e toggly/
          cd toggly-cache
          pip install -e ".[all,dev]"

      - name: Run tests
        run: |
          cd toggly-cache
          pytest tests/ -v --cov=src/toggly_cache --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-cache
          path: ${{ env.SDK_ROOT }}/toggly-cache/coverage.xml
          retention-days: 7

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SDK_ROOT }}
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      memcached:
        image: memcached:1.6
        ports:
          - 11211:11211
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install all packages
        run: |
          pip install -e toggly/
          pip install -e toggly-cache/[all]
          pip install -e toggly-django/
          pip install -e toggly-flask/
          pip install -e toggly-fastapi/
          pip install pytest pytest-asyncio

      - name: Run integration tests
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          MEMCACHED_HOST: localhost
          MEMCACHED_PORT: 11211
        run: |
          echo "Integration tests would run here"
          # pytest tests/integration/ -v

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ${{ env.SDK_ROOT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install core package
        run: |
          cd toggly
          pip install -e ".[dev]"

      - name: Run smoke tests
        timeout-minutes: 2
        env:
          TOGGLY_SMOKE_APP_KEY_BACKEND: ${{ secrets.TOGGLY_SMOKE_APP_KEY_BACKEND }}
        run: |
          cd toggly
          pytest tests/test_smoke.py -v

  build:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: [lint, test-core, test-django, test-flask, test-fastapi, test-cache]
    defaults:
      run:
        working-directory: ${{ env.SDK_ROOT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: pip install build twine

      - name: Build toggly
        run: |
          cd toggly
          python -m build
          twine check dist/*

      - name: Build toggly-django
        run: |
          cd toggly-django
          python -m build
          twine check dist/*

      - name: Build toggly-flask
        run: |
          cd toggly-flask
          python -m build
          twine check dist/*

      - name: Build toggly-fastapi
        run: |
          cd toggly-fastapi
          python -m build
          twine check dist/*

      - name: Build toggly-cache
        run: |
          cd toggly-cache
          python -m build
          twine check dist/*

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [test-core, test-django, test-flask, test-fastapi, test-cache, dependency-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all coverage reports
        uses: actions/download-artifact@v4
        with:
          pattern: python-coverage-*
          path: coverage-artifacts/
        continue-on-error: true

      - name: Organize coverage files
        run: |
          mkdir -p coverage
          # Copy coverage files with path adjustments
          for pkg in core django flask fastapi cache; do
            if [ -f "coverage-artifacts/python-coverage-$pkg/coverage.xml" ]; then
              cp "coverage-artifacts/python-coverage-$pkg/coverage.xml" "coverage/$pkg-coverage.xml"
            fi
          done
          echo "Coverage files:"
          ls -la coverage/ || echo "No coverage files found"
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-python
            -Dsonar.organization=ops-ai
            -Dsonar.projectName="Toggly SDKs - Python"
            -Dsonar.sources=${{ env.SDK_ROOT }}
            -Dsonar.exclusions=**/venv/**,**/.venv/**,**/dist/**,**/build/**,**/*.egg-info/**,**/tests/**,**/__pycache__/**,**/.pytest_cache/**
            -Dsonar.tests=${{ env.SDK_ROOT }}
            -Dsonar.test.inclusions=**/tests/**
            -Dsonar.python.coverage.reportPaths=coverage/*-coverage.xml
        continue-on-error: true

      - name: Download Dependency Check report (for SonarQube Server)
        uses: actions/download-artifact@v4
        with:
          name: dependency-check-report-python
          path: dependency-check-reports/
        continue-on-error: true

      - name: SonarQube Server Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-python
            -Dsonar.projectName="Toggly SDKs - Python"
            -Dsonar.sources=${{ env.SDK_ROOT }}
            -Dsonar.exclusions=**/venv/**,**/.venv/**,**/dist/**,**/build/**,**/*.egg-info/**,**/tests/**,**/__pycache__/**,**/.pytest_cache/**
            -Dsonar.tests=${{ env.SDK_ROOT }}
            -Dsonar.test.inclusions=**/tests/**
            -Dsonar.python.coverage.reportPaths=coverage/*-coverage.xml
            -Dsonar.dependencyCheck.reportPath=dependency-check-reports/dependency-check-report.xml
        continue-on-error: true

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache OWASP Dependency Check database
        uses: actions/cache@v4
        with:
          path: /home/runner/OWASP-Dependency-Check/data/
          key: dependency-check-db-${{ runner.os }}-v6
          restore-keys: |
            dependency-check-db-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'toggly-sdks-python'
          path: ${{ env.SDK_ROOT }}
          format: 'ALL'
          args: >-
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableExperimental
            --disableAssembly
            --disableRubygems
            --disableBundleAudit
            --disableNodeJS
            --disableNodeAudit
        continue-on-error: true

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report-python
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
        continue-on-error: true

  summary:
    name: Analysis Summary
    runs-on: ubuntu-latest
    needs: [test-core, test-django, test-flask, test-fastapi, test-cache, smoke-test, build, sonar, dependency-check]
    if: always()

    steps:
      - name: Generate summary
        working-directory: .
        run: |
          echo "## Python SDK Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Analysis workflow completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages Analyzed" >> $GITHUB_STEP_SUMMARY
          echo "- toggly (Core)" >> $GITHUB_STEP_SUMMARY
          echo "- toggly-django" >> $GITHUB_STEP_SUMMARY
          echo "- toggly-flask" >> $GITHUB_STEP_SUMMARY
          echo "- toggly-fastapi" >> $GITHUB_STEP_SUMMARY
          echo "- toggly-cache" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Python Versions Tested" >> $GITHUB_STEP_SUMMARY
          echo "- 3.8, 3.9, 3.10, 3.11, 3.12, 3.13" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarCloud for detailed results: https://sonarcloud.io/project/overview?id=toggly-sdks-python" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarQube Server for detailed results: ${{ secrets.SONAR_HOST_URL }}/dashboard?id=toggly-sdks-python" >> $GITHUB_STEP_SUMMARY
