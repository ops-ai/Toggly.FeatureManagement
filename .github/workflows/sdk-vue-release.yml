name: Vue SDK - Build & Publish

on:
  push:
    branches:
      - develop
    paths:
      - 'Toggly.FeatureManagement.Vue/**'
      - '.github/workflows/sdk-vue-release.yml'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: sdk-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    defaults:
      run:
        working-directory: Toggly.FeatureManagement.Vue/vue-feature-flags-toggly

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Check if version was manually bumped
        id: check_version
        run: |
          # Get current version from package.json
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          
          # Get version from previous commit (HEAD~1)
          # This checks if version changed in the commits being pushed
          PREVIOUS_VERSION=$(git show HEAD~1:Toggly.FeatureManagement.Vue/vue-feature-flags-toggly/package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf-8')).version" || echo "$CURRENT_VERSION")
          
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "previous_version=$PREVIOUS_VERSION" >> $GITHUB_OUTPUT
          
          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "manually_bumped=true" >> $GITHUB_OUTPUT
            echo "Version was manually bumped from $PREVIOUS_VERSION to $CURRENT_VERSION"
          else
            echo "manually_bumped=false" >> $GITHUB_OUTPUT
            echo "No manual version bump detected"
          fi

      - name: Bump version (if not manually bumped)
        id: auto_version
        if: steps.check_version.outputs.manually_bumped == 'false'
        run: |
          # Determine bump type (default to patch for automatic runs)
          BUMP_TYPE="${{ github.event.inputs.bump_type || 'patch' }}"
          echo "Bumping $BUMP_TYPE version..."
          
          # Bump version and capture the new version
          NEW_VERSION=$(npm version $BUMP_TYPE --no-git-tag-version)
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumped to version $NEW_VERSION"
      
      - name: Set version output (manual bump)
        id: manual_version
        if: steps.check_version.outputs.manually_bumped == 'true'
        run: |
          echo "new_version=v${{ steps.check_version.outputs.current_version }}" >> $GITHUB_OUTPUT
      
      - name: Set final version
        id: version
        run: |
          if [ "${{ steps.check_version.outputs.manually_bumped }}" == "true" ]; then
            echo "new_version=${{ steps.manual_version.outputs.new_version }}" >> $GITHUB_OUTPUT
          else
            echo "new_version=${{ steps.auto_version.outputs.new_version }}" >> $GITHUB_OUTPUT
          fi

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        if: steps.check_version.outputs.manually_bumped == 'false'
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "${{ steps.import_gpg.outputs.name }}"
          git config user.email "${{ steps.import_gpg.outputs.email }}"
          
          # Pull latest changes before committing
          git pull --rebase origin develop
          
          # Add version bump changes
          git add Toggly.FeatureManagement.Vue/vue-feature-flags-toggly/package.json Toggly.FeatureManagement.Vue/vue-feature-flags-toggly/package-lock.json
          
          # Commit with bump type
          BUMP_TYPE="${{ github.event.inputs.bump_type || 'patch' }}"
          git commit -S -m "Bumped Vue SDK to ${{ steps.version.outputs.new_version }} ($BUMP_TYPE) [skip ci]" || true
          
          # Push with retry logic
          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if git push origin develop; then
              echo "Successfully pushed version bump"
              exit 0
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Push failed, attempt $RETRY_COUNT of $MAX_RETRIES"
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              git pull --rebase origin develop
              sleep 2
            fi
          done
          echo "Failed to push after $MAX_RETRIES attempts"
          exit 1
