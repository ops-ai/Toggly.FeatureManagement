name: npm Package Registry Contracts

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - '.github/package-registry/**'
      - '.github/workflows/sdk-*-release.yml'
      - '.github/workflows/npm-package-registry-contracts.yml'
      - '**/package.json'
      - '**/CHANGELOG.md'
      - 'Toggly.FeatureManagement.Blazor/**'
      - 'Toggly.FeatureManagement.NET/**/*.csproj'
      - 'Toggly.FeatureManagement.NET/Directory.Build.props'
      - 'Toggly.FeatureManagement.NET/assets/**'
  push:
    branches:
      - develop
      - main
    paths:
      - '.github/package-registry/**'
      - '.github/workflows/sdk-*-release.yml'
      - '.github/workflows/npm-package-registry-contracts.yml'
      - '**/package.json'
      - '**/CHANGELOG.md'
      - 'Toggly.FeatureManagement.Blazor/**'
      - 'Toggly.FeatureManagement.NET/**/*.csproj'
      - 'Toggly.FeatureManagement.NET/Directory.Build.props'
      - 'Toggly.FeatureManagement.NET/assets/**'

permissions:
  contents: read

jobs:
  verify-npm-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.14.0'

      - name: Verify npm metadata inventory and contract
        run: node --test .github/package-registry/verify-npm-metadata.test.mjs

      - name: Verify npm trusted publishing contract
        run: node --test .github/package-registry/verify-npm-trusted-publishing.test.mjs

      - name: Verify NuGet metadata inventory and contract
        run: node --test .github/package-registry/verify-nuget-metadata.test.mjs

      - name: Verify NuGet CI props for GitHub Actions
        run: node --test .github/package-registry/verify-nuget-ci-props.test.mjs

      - name: Verify NuGet SourceLink, deterministic packs, and signing coverage
        run: node --test .github/package-registry/verify-nuget-sourcelink.test.mjs

      - name: Verify NuGet trusted publishing contract
        run: node --test .github/package-registry/verify-nuget-trusted-publishing.test.mjs

      - name: Verify Blazor NuGet family
        run: node --test .github/package-registry/verify-nuget-blazor.test.mjs
