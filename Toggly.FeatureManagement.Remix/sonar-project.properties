# SonarQube Configuration for Remix Toggly SDK

sonar.projectKey=toggly-remix-sdk
sonar.projectName=Toggly Remix SDK
sonar.projectVersion=1.0.0

# Organization
sonar.organization=ops-ai

# Source directories
sonar.sources=remix-toggly-core/src,remix-toggly-server/src,remix-toggly-client/src

# Test directories
sonar.tests=remix-toggly-core/tests,remix-toggly-server/tests,remix-toggly-client/tests

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx

# Test inclusions for coverage
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx

# Coverage reports
sonar.javascript.lcov.reportPaths=remix-toggly-core/coverage/lcov.info,remix-toggly-server/coverage/lcov.info,remix-toggly-client/coverage/lcov.info

# TypeScript configuration
sonar.typescript.tsconfigPaths=remix-toggly-core/tsconfig.json,remix-toggly-server/tsconfig.json,remix-toggly-client/tsconfig.json

# Encoding
sonar.sourceEncoding=UTF-8

# Language
sonar.language=ts

# Quality Gate
sonar.qualitygate.wait=true

# Duplicate detection
sonar.cpd.exclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx

# Issue handling
sonar.issue.ignore.multicriteria=e1,e2

# Ignore type-only imports warnings
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1128
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.ts

# Ignore JSX-specific rules in non-JSX files
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S6478
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.ts
