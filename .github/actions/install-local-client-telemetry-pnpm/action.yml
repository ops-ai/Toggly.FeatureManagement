name: Install local client-telemetry (pnpm)
description: >-
  Install the pnpm workspace against published client-telemetry, then overlay
  the in-repo built package into every store copy so unpublished APIs are
  available without file: overrides that force unbuild to bundle the package.

inputs:
  workspace-dir:
    description: pnpm workspace root (relative to repo root, or absolute)
    required: true

runs:
  using: composite
  steps:
    - name: Install and overlay local client-telemetry
      shell: bash
      run: |
        set -euo pipefail
        wd="${{ inputs.workspace-dir }}"
        if [[ "$wd" != /* ]]; then
          wd="$GITHUB_WORKSPACE/$wd"
        fi
        telemetry="$GITHUB_WORKSPACE/toggly-client-telemetry"
        pack_dir="${RUNNER_TEMP:-/tmp}/toggly-client-telemetry-pack"
        mkdir -p "$pack_dir"
        (cd "$telemetry" && (npm ci || npm install) && npm run build && npm pack --pack-destination "$pack_dir")
        tgz="$(ls -1 "$pack_dir"/ops-ai-toggly-client-telemetry-*.tgz | head -1)"
        test -f "$tgz"
        echo "TOGGLY_CLIENT_TELEMETRY_TARBALL=$tgz" >> "$GITHUB_ENV"
        echo "Exported TOGGLY_CLIENT_TELEMETRY_TARBALL=$tgz"
        WD="$wd" node -e "
          const fs = require('fs');
          const path = require('path');
          const pkgPath = path.join(process.env.WD, 'package.json');
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          const pin = (obj) => {
            if (obj && obj['@ops-ai/toggly-client-telemetry']) {
              obj['@ops-ai/toggly-client-telemetry'] = '^1.1.2';
            }
          };
          pin(pkg.dependencies);
          pin(pkg.devDependencies);
          if (pkg.pnpm && pkg.pnpm.overrides) {
            delete pkg.pnpm.overrides['@ops-ai/toggly-client-telemetry'];
          }
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          // Also pin workspace package manifests that declare the dependency.
          const walk = (dir) => {
            for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
              if (ent.name === 'node_modules' || ent.name === '.git') continue;
              const full = path.join(dir, ent.name);
              if (ent.isDirectory()) walk(full);
              else if (ent.name === 'package.json') {
                const p = JSON.parse(fs.readFileSync(full, 'utf8'));
                let changed = false;
                for (const key of ['dependencies', 'devDependencies', 'peerDependencies']) {
                  if (p[key] && p[key]['@ops-ai/toggly-client-telemetry']) {
                    p[key]['@ops-ai/toggly-client-telemetry'] = '^1.1.2';
                    changed = true;
                  }
                }
                if (changed) fs.writeFileSync(full, JSON.stringify(p, null, 2) + '\n');
              }
            }
          };
          walk(process.env.WD);
        "
        (cd "$wd" && pnpm install --no-frozen-lockfile)
        # Overlay every pnpm store copy + any flat node_modules link.
        while IFS= read -r dest; do
          [[ -e "$dest" ]] || continue
          rm -rf "$dest"
          mkdir -p "$dest"
          cp "$telemetry/package.json" "$dest/package.json"
          rm -rf "$dest/dist"
          cp -R "$telemetry/dist" "$dest/dist"
          echo "Overlaid local toggly-client-telemetry into $dest"
        done < <(find "$wd" -type d -path '*/node_modules/@ops-ai/toggly-client-telemetry' 2>/dev/null || true)
