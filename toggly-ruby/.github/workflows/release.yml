name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-core:
    name: Release toggly
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: toggly

      - name: Run tests
        working-directory: toggly
        run: bundle exec rspec

      - name: Build gem
        working-directory: toggly
        run: gem build toggly.gemspec

      - name: Publish to RubyGems
        working-directory: toggly
        run: |
          mkdir -p ~/.gem
          echo "---" > ~/.gem/credentials
          echo ":rubygems_api_key: ${{ secrets.RUBYGEMS_API_KEY }}" >> ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          gem push *.gem
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}

  release-rails:
    name: Release toggly-rails
    runs-on: ubuntu-latest
    needs: release-core
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: toggly-rails

      - name: Run tests
        working-directory: toggly-rails
        run: bundle exec rspec

      - name: Build gem
        working-directory: toggly-rails
        run: gem build toggly-rails.gemspec

      - name: Publish to RubyGems
        working-directory: toggly-rails
        run: |
          mkdir -p ~/.gem
          echo "---" > ~/.gem/credentials
          echo ":rubygems_api_key: ${{ secrets.RUBYGEMS_API_KEY }}" >> ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          gem push *.gem
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}

  release-cache:
    name: Release toggly-cache
    runs-on: ubuntu-latest
    needs: release-core
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: toggly-cache

      - name: Run tests
        working-directory: toggly-cache
        run: bundle exec rspec

      - name: Build gem
        working-directory: toggly-cache
        run: gem build toggly-cache.gemspec

      - name: Publish to RubyGems
        working-directory: toggly-cache
        run: |
          mkdir -p ~/.gem
          echo "---" > ~/.gem/credentials
          echo ":rubygems_api_key: ${{ secrets.RUBYGEMS_API_KEY }}" >> ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          gem push *.gem
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release-core, release-rails, release-cache]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
