name: Python SDK - Build & Publish

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'publish = use manifest version; auto_bump = legacy CI bump'
        required: false
        default: 'publish'
        type: choice
        options:
          - publish
          - auto_bump
      bump_type:
        description: 'Bump type (only used when release_mode is auto_bump)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      packages:
        description: 'Packages to publish (comma-separated, or "all")'
        required: false
        default: 'all'
        type: string
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

env:
  SDK_ROOT: Toggly.FeatureManagement.Python
  ALL_PACKAGES: toggly toggly-django toggly-flask toggly-fastapi toggly-cache

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      action: ${{ steps.release.outputs.action }}
      reason: ${{ steps.release.outputs.reason }}
      manifest_version: ${{ steps.release.outputs.manifest_version }}
      registry_latest: ${{ steps.release.outputs.registry_latest }}
      manifest_changed: ${{ steps.release.outputs.manifest_changed }}
      packages: ${{ steps.packages.outputs.list }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        uses: ./.github/actions/resolve-release-version
        with:
          manifest_path: ${{ env.SDK_ROOT }}/toggly/pyproject.toml
          registry: pypi
          package_name: toggly
          release_mode: ${{ github.event.inputs.release_mode || 'publish' }}
          bump_type: ${{ github.event.inputs.bump_type || 'patch' }}

      - name: Sync monorepo package versions
        if: steps.release.outputs.manifest_changed == 'true'
        run: |
          NEW_VERSION="${{ steps.release.outputs.version }}"
          for pkg in toggly-django toggly-flask toggly-fastapi toggly-cache; do
            PYPROJECT="${{ env.SDK_ROOT }}/$pkg/pyproject.toml"
            if [ -f "$PYPROJECT" ]; then
              sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" "$PYPROJECT"
            fi
          done

      - name: Determine packages to publish
        id: packages
        run: |
          INPUT="${{ github.event.inputs.packages || 'all' }}"
          if [ "$INPUT" == "all" ]; then
            echo "list=${{ env.ALL_PACKAGES }}" >> $GITHUB_OUTPUT
          else
            echo "list=$(echo "$INPUT" | tr ',' ' ')" >> $GITHUB_OUTPUT
          fi

  build-and-test:
    needs: validate
    if: needs.validate.outputs.action == 'publish'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools
        run: pip install build setuptools wheel

      - name: Build and test core package
        working-directory: ${{ env.SDK_ROOT }}/toggly
        run: |
          pip install -e ".[dev]"
          python -m pytest

      - name: Build integration packages
        run: |
          for pkg in toggly-django toggly-flask toggly-fastapi toggly-cache; do
            echo "Building $pkg..."
            cd ${{ env.SDK_ROOT }}/$pkg
            pip install -e ".[dev]" 2>/dev/null || pip install -e "." || true
            cd $GITHUB_WORKSPACE
          done

  publish:
    needs: [build-and-test, validate]
    if: needs.validate.outputs.action == 'publish'
    runs-on: ubuntu-latest
    environment: pypi-publish
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Build packages
        run: |
          for pkg in ${{ needs.validate.outputs.packages }}; do
            echo "Building $pkg..."
            cd ${{ env.SDK_ROOT }}/$pkg
            python -m build
            cd $GITHUB_WORKSPACE
          done

      - name: Publish packages to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ env.SDK_ROOT }}/toggly/dist/
          skip-existing: true

      - name: Publish toggly-django to PyPI
        if: contains(needs.validate.outputs.packages, 'toggly-django')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ env.SDK_ROOT }}/toggly-django/dist/
          skip-existing: true

      - name: Publish toggly-flask to PyPI
        if: contains(needs.validate.outputs.packages, 'toggly-flask')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ env.SDK_ROOT }}/toggly-flask/dist/
          skip-existing: true

      - name: Publish toggly-fastapi to PyPI
        if: contains(needs.validate.outputs.packages, 'toggly-fastapi')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ env.SDK_ROOT }}/toggly-fastapi/dist/
          skip-existing: true

      - name: Publish toggly-cache to PyPI
        if: contains(needs.validate.outputs.packages, 'toggly-cache')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ env.SDK_ROOT }}/toggly-cache/dist/
          skip-existing: true

      - name: Configure git
        run: |
          git config user.name "${{ steps.import_gpg.outputs.name }}"
          git config user.email "${{ steps.import_gpg.outputs.email }}"

      - name: Commit version bump and tag
        if: needs.validate.outputs.manifest_changed == 'true'
        run: |
          git add ${{ env.SDK_ROOT }}/*/pyproject.toml
          git commit -S -m "Bumped Python SDK to v${{ needs.validate.outputs.version }} (auto_bump) [skip ci]"

          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if git pull --rebase --autostash origin develop; then
              if git push origin develop; then
                echo "Successfully pushed version bump"
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Retry attempt $RETRY_COUNT of $MAX_RETRIES..."
              sleep 2
            fi
          done

          echo "Failed to push after $MAX_RETRIES attempts"
          exit 1

      - name: Create and push tag
        run: |
          git tag -s -m "Python SDK v${{ needs.validate.outputs.version }}" "python-sdk-v${{ needs.validate.outputs.version }}"
          git push origin "python-sdk-v${{ needs.validate.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: python-sdk-v${{ needs.validate.outputs.version }}
          name: Python SDK v${{ needs.validate.outputs.version }}
          body: |
            ## Python SDK v${{ needs.validate.outputs.version }}

            ### Installation

            ```bash
            pip install toggly
            ```

            ### Integration packages

            ```bash
            pip install toggly-django
            pip install toggly-flask
            pip install toggly-fastapi
            pip install toggly-cache
            ```

            ### Features

            - Zero-dependency core library
            - Django, Flask, and FastAPI integrations
            - Redis caching support
            - WebSocket live updates
            - Targeting rules and percentage rollouts

            ### Requirements

            - Python >= 3.8

            ### Links

            - [PyPI](https://pypi.org/project/toggly/)
            - [Documentation](https://docs.toggly.io/docs/sdks/python)
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    needs: [publish, validate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Python SDK Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Action | ${{ needs.validate.outputs.action }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Manifest | ${{ needs.validate.outputs.manifest_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry latest | ${{ needs.validate.outputs.registry_latest || 'none' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release mode | ${{ github.event.inputs.release_mode || 'publish' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ needs.validate.outputs.reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | python-sdk-v${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Packages | ${{ needs.validate.outputs.packages }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-release | ${{ github.event.inputs.prerelease }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View on PyPI](https://pypi.org/project/toggly/)" >> $GITHUB_STEP_SUMMARY
