name: Nuxt SDK - Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to release'
        required: true
        type: choice
        options:
          - '@ops-ai/nuxt-toggly-core'
          - '@ops-ai/nuxt-toggly-server'
          - '@ops-ai/nuxt-toggly-client'
          - '@ops-ai/nuxt-toggly'
          - 'all'
      bump_type:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

defaults:
  run:
    working-directory: Toggly.FeatureManagement.Nuxt

jobs:
  release:
    name: Release ${{ inputs.package }}
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
          cache-dependency-path: Toggly.FeatureManagement.Nuxt/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Bump version and publish (core)
        if: inputs.package == '@ops-ai/nuxt-toggly-core' || inputs.package == 'all'
        run: |
          cd nuxt-toggly-core
          npm version ${{ inputs.bump_type }} --no-git-tag-version
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Bump version and publish (server)
        if: inputs.package == '@ops-ai/nuxt-toggly-server' || inputs.package == 'all'
        run: |
          cd nuxt-toggly-server
          npm version ${{ inputs.bump_type }} --no-git-tag-version
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Bump version and publish (client)
        if: inputs.package == '@ops-ai/nuxt-toggly-client' || inputs.package == 'all'
        run: |
          cd nuxt-toggly-client
          npm version ${{ inputs.bump_type }} --no-git-tag-version
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Bump version and publish (module)
        if: inputs.package == '@ops-ai/nuxt-toggly' || inputs.package == 'all'
        run: |
          cd nuxt-toggly
          npm version ${{ inputs.bump_type }} --no-git-tag-version
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version changes
        run: |
          git add -A
          git commit -S -m "Bumped Nuxt SDK versions [${{ inputs.bump_type }}] [skip ci]" || echo "No changes to commit"

      - name: Push changes
        run: |
          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            git pull --rebase && git push && break
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Push failed, retrying ($RETRY_COUNT/$MAX_RETRIES)..."
            sleep 5
          done
