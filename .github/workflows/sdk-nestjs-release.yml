name: NestJS SDK - Build and Publish

on:
  push:
    branches:
      - develop
    paths:
      - 'Toggly.FeatureManagement.NestJS/**'
      - '.github/workflows/sdk-nestjs-release.yml'
      - '.github/workflows/analysis-javascript.yml'
      - '.github/package-registry/analysis-js-filter.mjs'
      - '.github/actions/resolve-release-version/**'
      - '.github/actions/verify-package-tarball/**'
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'publish = use manifest version; auto_bump = legacy CI bump'
        required: false
        default: 'publish'
        type: choice
        options:
          - publish
          - auto_bump
      bump_type:
        description: 'Bump type (only used when release_mode is auto_bump)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write
  security-events: write

concurrency:
  group: nestjs-sdk-release
  cancel-in-progress: false

env:
  SDK_DIR: Toggly.FeatureManagement.NestJS
  NPM_PACKAGE: '@ops-ai/toggly-nestjs'

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.release.outputs.action }}
      version: ${{ steps.release.outputs.version }}
      reason: ${{ steps.release.outputs.reason }}
      manifest_version: ${{ steps.release.outputs.manifest_version }}
      registry_latest: ${{ steps.release.outputs.registry_latest }}
      manifest_changed: ${{ steps.release.outputs.manifest_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve release version
        id: release
        uses: ./.github/actions/resolve-release-version
        with:
          manifest_path: ${{ env.SDK_DIR }}/package.json
          registry: npm
          package_name: ${{ env.NPM_PACKAGE }}
          release_mode: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode || 'publish' }}
          bump_type: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bump_type || 'patch' }}

      - name: Resolve summary
        if: always()
        run: |
          echo "## NestJS SDK resolve" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Action | ${{ steps.release.outputs.action }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | ${{ steps.release.outputs.version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Reason | ${{ steps.release.outputs.reason }} |" >> "$GITHUB_STEP_SUMMARY"

  # Compat matrix across supported @nestjs major versions. This is unique to
  # this SDK and not covered by analysis-javascript.yml, so it is kept as an
  # additional required gate alongside the reusable analysis workflow.
  compat-test:
    needs: resolve
    if: needs.resolve.outputs.action == 'publish'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
        nest: [10, 11]
    defaults:
      run:
        working-directory: Toggly.FeatureManagement.NestJS
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: Toggly.FeatureManagement.NestJS/package-lock.json
      - run: npm ci
      - name: Install host compatibility version
        run: npm install --no-save --package-lock=false @nestjs/common@${{ matrix.nest }} @nestjs/core@${{ matrix.nest }} @nestjs/testing@${{ matrix.nest }} @nestjs/platform-express@${{ matrix.nest }}
      - run: npm run typecheck && npm run build && npm run test:coverage && npm run test:packed

  gates:
    needs: resolve
    if: needs.resolve.outputs.action == 'publish'
    uses: ./.github/workflows/analysis-javascript.yml
    with:
      sdks: NestJS
      run_reporting: false
    secrets: inherit

  publish:
    needs: [resolve, compat-test, gates]
    if: needs.resolve.outputs.action == 'publish' && needs.compat-test.result == 'success' && needs.gates.result == 'success'
    runs-on: ubuntu-latest
    environment: npm-publish
    defaults:
      run:
        working-directory: ${{ env.SDK_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - run: npm ci && npm run build

      - name: Verify package
        uses: ./.github/actions/verify-package-tarball
        with:
          package_dir: Toggly.FeatureManagement.NestJS

      - name: Publish manifest version
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ''

      - name: Commit version bump
        if: needs.resolve.outputs.manifest_changed == 'true'
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "${{ steps.import_gpg.outputs.name }}"
          git config user.email "${{ steps.import_gpg.outputs.email }}"

          git add ${{ env.SDK_DIR }}/package.json
          git add ${{ env.SDK_DIR }}/package-lock.json 2>/dev/null || true

          git commit -S -m "Bumped NestJS SDK to v${{ needs.resolve.outputs.version }} (auto_bump) [skip ci]"

          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if git pull --rebase --autostash origin develop; then
              if git push origin develop; then
                echo "Successfully pushed version bump"
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              sleep 2
            fi
          done

          echo "Failed to push after $MAX_RETRIES attempts"
          exit 1

      - name: Publish summary
        if: always()
        run: |
          echo "## NestJS SDK Release" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| Action | ${{ needs.resolve.outputs.action }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.resolve.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ needs.resolve.outputs.reason }} |" >> $GITHUB_STEP_SUMMARY
