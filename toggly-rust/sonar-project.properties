# SonarQube Configuration for Toggly Rust SDK

sonar.projectKey=ops-ai_toggly-rust
sonar.projectName=Toggly Rust SDK
sonar.projectVersion=0.2.0

# Source directories
sonar.sources=toggly/src,toggly-macros/src,toggly-actix/src,toggly-axum/src,toggly-rocket/src

# Test directories
sonar.tests=toggly/src,toggly-macros/src,toggly-actix/src,toggly-axum/src,toggly-rocket/src
sonar.test.inclusions=**/*_test.rs,**/tests/**

# Exclusions
sonar.exclusions=**/target/**,**/*.lock

# Coverage report
sonar.rust.coverage.reportPaths=lcov.info

# Language
sonar.language=rust

# Encoding
sonar.sourceEncoding=UTF-8

# Links
sonar.links.homepage=https://toggly.io
sonar.links.scm=https://github.com/ops-ai/toggly-feature-flags
sonar.links.issue=https://github.com/ops-ai/toggly-feature-flags/issues
sonar.links.ci=https://github.com/ops-ai/toggly-feature-flags/actions
