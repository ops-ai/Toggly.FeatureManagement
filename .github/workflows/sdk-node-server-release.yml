name: Node.js Server SDKs - Build & Publish

on:
  push:
    branches:
      - develop
    paths:
      - 'Toggly.FeatureManagement.Node/**'
      - '.github/workflows/sdk-node-server-release.yml'
      - '.github/workflows/analysis-javascript.yml'
      - '.github/package-registry/analysis-js-filter.mjs'
      - '.github/package-registry/node-release-selection.mjs'
      - '.github/actions/resolve-release-version/**'
      - '.github/actions/verify-package-tarball/**'
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'publish = use manifest version; auto_bump = legacy CI bump'
        required: false
        default: 'publish'
        type: choice
        options:
          - publish
          - auto_bump
      bump_type:
        description: 'Bump type (only used when release_mode is auto_bump)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      packages:
        description: 'Packages to release (comma-separated: core,express,fastify,hono,koa or "all")'
        required: false
        default: 'all'
        type: string

permissions:
  contents: write
  id-token: write
  security-events: write

concurrency:
  group: node-server-sdk-release
  cancel-in-progress: false

env:
  SDK_ROOT: Toggly.FeatureManagement.Node

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set package matrix
        id: set-matrix
        env:
          RELEASE_PACKAGES: ${{ github.event.inputs.packages || 'all' }}
        run: node .github/package-registry/node-release-selection.mjs matrix

  # Node.js server SDKs are covered by analysis-javascript.yml's node-server
  # special filter (test-node-server + smoke-test-node-server), which runs a
  # broader compatibility matrix than the release workflow's own build/test.
  gates:
    needs: prepare
    uses: ./.github/workflows/analysis-javascript.yml
    with:
      sdks: node-server
      run_reporting: false
    secrets: inherit

  publish:
    runs-on: ubuntu-latest
    needs: [prepare, gates]
    environment: npm-publish
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ env.SDK_ROOT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
          cache-dependency-path: ${{ env.SDK_ROOT }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Build all packages
        run: pnpm -r build

      - name: Read npm package name
        id: pkg
        working-directory: ${{ env.SDK_ROOT }}/${{ matrix.package }}
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT

      - name: Resolve release version
        id: release
        uses: ./.github/actions/resolve-release-version
        with:
          manifest_path: ${{ env.SDK_ROOT }}/${{ matrix.package }}/package.json
          registry: npm
          package_name: ${{ steps.pkg.outputs.name }}
          release_mode: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode || 'publish' }}
          bump_type: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bump_type || 'patch' }}


      - name: Verify packed tarball
        if: steps.release.outputs.action == 'publish'
        uses: ./.github/actions/verify-package-tarball
        with:
          package_dir: ${{ env.SDK_ROOT }}/${{ matrix.package }}
          skip_import: 'true'
      - name: Publish to npm
        if: steps.release.outputs.action == 'publish'
        working-directory: ${{ env.SDK_ROOT }}/${{ matrix.package }}
        run: |
          # pnpm publish rewrites workspace:*; npm publish does not (OPS-777).
          if [ "${{ matrix.package }}" != "toggly-node-core" ]; then
            CORE_NAME=$(node -p "require('../toggly-node-core/package.json').name")
            CORE_VER=$(node -p "require('../toggly-node-core/package.json').version")
            bash "${GITHUB_WORKSPACE}/.github/scripts/wait-for-npm-version.sh" "${CORE_NAME}@${CORE_VER}"
          fi

          BAD=$(node -e "
            const m = require('./package.json');
            const deps = { ...m.dependencies, ...m.peerDependencies, ...m.optionalDependencies };
            const fatal = Object.entries(deps)
              .filter(([, v]) => /^(file|link):/.test(String(v)))
              .map(([k, v]) => k + '@' + v);
            console.log(fatal.join(', '));
          ")
          if [ -n "$BAD" ]; then
            echo "::error::Refusing to publish ${{ matrix.package }} with local-path dependencies: $BAD"
            exit 1
          fi

          pnpm publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ''

      - name: Commit version bump
        if: steps.release.outputs.action == 'publish' && steps.release.outputs.manifest_changed == 'true'
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "${{ steps.import_gpg.outputs.name }}"
          git config user.email "${{ steps.import_gpg.outputs.email }}"

          git add ${{ env.SDK_ROOT }}/${{ matrix.package }}/package.json

          git commit -S -m "Bumped ${{ matrix.package }} to v${{ steps.release.outputs.version }} (auto_bump) [skip ci]"

          MAX_RETRIES=5
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            git fetch origin develop
            if ! git rebase origin/develop; then
              git rebase --abort 2>/dev/null || true
              sleep 3
              RETRY_COUNT=$((RETRY_COUNT + 1))
              continue
            fi

            if git push origin develop; then
              echo "Successfully pushed version bump for ${{ matrix.package }}"
              exit 0
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            sleep 3
          done

          echo "Failed to push after $MAX_RETRIES attempts"
          exit 1

      - name: Package summary
        if: always()
        run: |
          echo "### ${{ matrix.package }}" >> $GITHUB_STEP_SUMMARY
          echo "- Action: ${{ steps.release.outputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ steps.release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Reason: ${{ steps.release.outputs.reason }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

  summary:
    runs-on: ubuntu-latest
    needs: [prepare, publish]
    if: always()
    steps:
      - name: Create summary
        run: |
          echo "## Node.js Server SDK Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Release mode: ${{ github.event.inputs.release_mode || 'publish' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          PACKAGES='${{ needs.prepare.outputs.matrix }}'
          echo "$PACKAGES" | jq -r '.[]' | while read pkg; do
            echo "- @ops-ai/$pkg" >> $GITHUB_STEP_SUMMARY
          done
