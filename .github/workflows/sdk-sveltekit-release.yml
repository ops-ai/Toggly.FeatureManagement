name: SvelteKit SDK - Build & Publish
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    defaults:
      run:
        working-directory: Toggly.FeatureManagement.SvelteKit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: ./.github/actions/resolve-release-version
        id: release
        with:
          manifest_path: Toggly.FeatureManagement.SvelteKit/package.json
          registry: npm
          package_name: '@ops-ai/toggly-sveltekit'
          release_mode: publish
      - run: npm install
      - run: npm run build
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:host
      - run: npm pack --dry-run
      - name: Publish manifest version
        if: steps.release.outputs.action == 'publish'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
