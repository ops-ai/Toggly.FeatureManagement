name: Flutter SDKs - Tests & Analysis

on:
  push:
    branches:
      - develop
    paths:
      - 'Toggly.FeatureManagement.Flutter/**'
      - '.github/workflows/analysis-flutter.yml'
      - '.github/workflows/analysis-flutter.test.mjs'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.Flutter/**'
      - '.github/workflows/analysis-flutter.yml'
      - '.github/workflows/analysis-flutter.test.mjs'
  workflow_dispatch:
    inputs:
      bootstrap_server_main:
        description: 'Scan the develop checkout as the SonarQube Server main baseline for Flutter providers'
        type: boolean
        default: false
  workflow_call:
    inputs:
      run_reporting:
        description: 'When false, skip Sonar and OWASP reporting jobs'
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Test & Analyze
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' && !inputs.bootstrap_server_main }}
    defaults:
      run:
        working-directory: Toggly.FeatureManagement.Flutter/toggly
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for SonarCloud
      
      - name: Setup Node for workflow tests
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test workflow gate behavior
        working-directory: .
        run: node --test .github/workflows/analysis-flutter.test.mjs

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Verify dependencies
        run: flutter pub get --enforce-lockfile
      
      - name: Run code generation (if needed)
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            flutter pub run build_runner build --delete-conflicting-outputs
          else
            echo "No build_runner found, skipping code generation"
          fi
      
      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      
      - name: Run tests with coverage
        run: flutter test --coverage --test-randomize-ordering-seed random
      
      - name: Display coverage summary
        if: always()
        run: |
          if [ -f "coverage/lcov.info" ]; then
            echo "Coverage file generated successfully"
            lcov --list coverage/lcov.info 2>/dev/null || echo "Install lcov for detailed coverage report"
          else
            echo "No coverage file generated"
          fi
      
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage
          path: Toggly.FeatureManagement.Flutter/toggly/coverage/
          retention-days: 7
          if-no-files-found: warn

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [analyze, dependency-check]
    if: ${{ always() && github.event_name != 'push' && !inputs.bootstrap_server_main && toJSON(inputs.run_reporting) != 'false' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        working-directory: Toggly.FeatureManagement.Flutter/toggly
        run: flutter pub get

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: flutter-coverage
          path: Toggly.FeatureManagement.Flutter/toggly/coverage/
        continue-on-error: true

      - name: Verify coverage file
        run: |
          if [ -f "Toggly.FeatureManagement.Flutter/toggly/coverage/lcov.info" ]; then
            echo "Coverage file found"
            ls -lh Toggly.FeatureManagement.Flutter/toggly/coverage/lcov.info
          else
            echo "Coverage file not found"
          fi

      - name: Resolve Sonar project version
        id: sonar_version
        uses: ./.github/actions/sonar-project-version
        with:
          manifest: Toggly.FeatureManagement.Flutter/toggly/pubspec.yaml
          suffix: ${{ vars.SONAR_PROJECT_VERSION_SUFFIX }}

      - name: Validate SonarCloud credentials
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "${SONAR_TOKEN}" || { echo "SonarCloud token is required"; exit 1; }

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: Toggly.FeatureManagement.Flutter/toggly
          args: >
            -Dsonar.projectKey=toggly-sdks-flutter
            -Dsonar.projectVersion=${{ steps.sonar_version.outputs.version }}
            -Dsonar.organization=ops-ai
            -Dsonar.projectName="Toggly SDKs - Flutter/Dart"
            -Dsonar.sources=lib
            -Dsonar.tests=test
            -Dsonar.exclusions=**/.*/**,**/example/**,**/benchmark/**,**/*.g.dart,**/*.freezed.dart
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true

      - name: Download Dependency Check report (for SonarQube Server)
        if: ${{ !cancelled() && (success() || failure()) }}
        uses: actions/download-artifact@v8
        with:
          name: dependency-check-report-flutter
          path: dependency-check-reports/
        continue-on-error: true

      - name: Validate SonarQube Server credentials
        id: validate-sonarqube-server-credentials
        if: ${{ !cancelled() && (success() || failure()) }}
        env:
          SONAR_SERVER_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: test -n "${SONAR_SERVER_TOKEN}" && test -n "${SONAR_HOST_URL}" || { echo "SonarQube Server credentials are required"; exit 1; }

      - name: SonarQube Server Scan
        if: ${{ !cancelled() && (success() || failure()) && steps.validate-sonarqube-server-credentials.outcome == 'success' }}
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: Toggly.FeatureManagement.Flutter/toggly
          args: >
            -Dsonar.projectKey=toggly-sdks-flutter
            -Dsonar.projectVersion=${{ steps.sonar_version.outputs.version }}
            -Dsonar.projectName="Toggly SDKs - Flutter/Dart"
            -Dsonar.sources=lib
            -Dsonar.tests=test
            -Dsonar.exclusions=**/.*/**,**/example/**,**/benchmark/**,**/*.g.dart,**/*.freezed.dart
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info
            -Dsonar.dart.analyzer.options.override=false
            -Dsonar.dependencyCheck.reportPath=../../dependency-check-reports/dependency-check-report.xml
            -Dsonar.qualitygate.wait=true

  build-platforms:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    if: ${{ github.event_name != 'push' && !inputs.bootstrap_server_main }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Web
            os: ubuntu-latest
            build-cmd: flutter build web
          - platform: Android
            os: ubuntu-latest
            build-cmd: flutter build apk --debug
          - platform: iOS
            os: macos-latest
            build-cmd: flutter build ios --debug --no-codesign
    defaults:
      run:
        working-directory: Toggly.FeatureManagement.Flutter/toggly/example
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Java (for Android)
        if: matrix.platform == 'Android'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        if: matrix.platform == 'iOS'
        run: |
          cd ios
          pod install
      
      - name: Build ${{ matrix.platform }}
        run: ${{ matrix.build-cmd }}

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' && !inputs.bootstrap_server_main }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: Toggly.FeatureManagement.Flutter/toggly

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run smoke test
        timeout-minutes: 2
        env:
          TOGGLY_SMOKE_APP_KEY_FRONTEND: ${{ secrets.TOGGLY_SMOKE_APP_KEY_FRONTEND }}
        run: flutter test test/smoke_test.dart

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' && !inputs.bootstrap_server_main && toJSON(inputs.run_reporting) != 'false' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache OWASP Dependency Check database
        uses: actions/cache@v6
        with:
          path: /home/runner/OWASP-Dependency-Check/data/
          key: dependency-check-db-${{ runner.os }}-v6
          restore-keys: |
            dependency-check-db-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'toggly-sdks-flutter'
          path: 'Toggly.FeatureManagement.Flutter/toggly'
          format: 'ALL'
          args: >-
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableExperimental
            --disableAssembly
            --disableRubygems
            --disableBundleAudit
            --disableNodeJS
            --disableNodeAudit
            --disablePyPkg
            --disablePyDist

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report-flutter
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
        continue-on-error: true

  analyze-providers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' && !inputs.bootstrap_server_main }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: toggly_secure_storage
            package: feature_flags_toggly_secure_storage
            sonarKey: toggly-sdks-flutter-secure-storage
            sonarName: "Toggly SDKs - Flutter Secure Storage Cache"
            name: Secure Storage
          - dir: toggly_disk
            package: feature_flags_toggly_disk
            sonarKey: toggly-sdks-flutter-disk
            sonarName: "Toggly SDKs - Flutter Disk Cache"
            name: Disk
          - dir: toggly_sqlite
            package: feature_flags_toggly_sqlite
            sonarKey: toggly-sdks-flutter-sqlite
            sonarName: "Toggly SDKs - Flutter SQLite Cache"
            name: SQLite
          - dir: toggly_isar
            package: feature_flags_toggly_isar
            sonarKey: toggly-sdks-flutter-isar
            sonarName: "Toggly SDKs - Flutter Isar Cache"
            name: Isar

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for SonarCloud

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      # Companion packages resolve the in-repo base SDK via pubspec_overrides.yaml.example.
      - name: Apply monorepo pubspec overrides
        working-directory: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
        run: |
          cp pubspec_overrides.yaml.example pubspec_overrides.yaml
          cp example/pubspec_overrides.yaml.example example/pubspec_overrides.yaml

      - name: Get dependencies
        working-directory: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
        run: flutter pub get

      - name: Run code generation (if needed)
        working-directory: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            flutter pub run build_runner build --delete-conflicting-outputs
          else
            echo "No build_runner found, skipping code generation"
          fi

      - name: Analyze code
        working-directory: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Check formatting
        working-directory: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run tests with coverage
        working-directory: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
        run: flutter test --coverage --test-randomize-ordering-seed random

      - name: Display coverage summary
        if: always()
        working-directory: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
        run: |
          if [ -f "coverage/lcov.info" ]; then
            echo "Coverage file generated successfully"
            lcov --list coverage/lcov.info 2>/dev/null || echo "Install lcov for detailed coverage report"
          else
            echo "No coverage file generated"
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage-${{ matrix.dir }}
          path: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}/coverage/
          retention-days: 7
          if-no-files-found: warn

      - name: Resolve Sonar project version
        id: sonar_version
        uses: ./.github/actions/sonar-project-version
        with:
          manifest: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}/pubspec.yaml
          suffix: ${{ vars.SONAR_PROJECT_VERSION_SUFFIX }}

      - name: Validate SonarCloud credentials
        if: ${{ toJSON(inputs.run_reporting) != 'false' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "${SONAR_TOKEN}" || { echo "SonarCloud token is required"; exit 1; }

      - name: SonarCloud Scan
        if: ${{ toJSON(inputs.run_reporting) != 'false' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
          args: >
            -Dsonar.projectKey=${{ matrix.sonarKey }}
            -Dsonar.projectVersion=${{ steps.sonar_version.outputs.version }}
            -Dsonar.organization=ops-ai
            -Dsonar.projectName="${{ matrix.sonarName }}"
            -Dsonar.sources=lib
            -Dsonar.tests=test
            -Dsonar.exclusions=**/.*/**,**/example/**,**/*.g.dart,**/*.freezed.dart
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true

      - name: Validate SonarQube Server credentials
        id: validate-sonarqube-server-credentials
        if: ${{ !cancelled() && (success() || failure()) && toJSON(inputs.run_reporting) != 'false' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        env:
          SONAR_SERVER_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: test -n "${SONAR_SERVER_TOKEN}" && test -n "${SONAR_HOST_URL}" || { echo "SonarQube Server credentials are required"; exit 1; }

      - name: SonarQube Server Scan
        if: ${{ !cancelled() && (success() || failure()) && toJSON(inputs.run_reporting) != 'false' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && steps.validate-sonarqube-server-credentials.outcome == 'success' }}
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
          args: >
            -Dsonar.projectKey=${{ matrix.sonarKey }}
            -Dsonar.projectVersion=${{ steps.sonar_version.outputs.version }}
            -Dsonar.projectName="${{ matrix.sonarName }}"
            -Dsonar.sources=lib
            -Dsonar.tests=test
            -Dsonar.exclusions=**/.*/**,**/example/**,**/*.g.dart,**/*.freezed.dart
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true

  secure-storage-version-matrix:
    name: Secure Storage Plugin ${{ matrix.version }}
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' && !inputs.bootstrap_server_main }}
    strategy:
      fail-fast: false
      matrix:
        version: ['9.0.0', '9.2.4', '10.3.3', '11.1.1']

    defaults:
      run:
        working-directory: Toggly.FeatureManagement.Flutter/toggly_secure_storage

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve the selected plugin major
        run: |
          cp pubspec_overrides.yaml.example pubspec_overrides.yaml
          printf '  flutter_secure_storage: %s\n' '${{ matrix.version }}' >> pubspec_overrides.yaml
          flutter pub get

      - name: Analyze and test the selected plugin major
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test --test-randomize-ordering-seed random

  dependency-check-providers:
    name: OWASP Dependency Check (${{ matrix.dir }})
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' && !inputs.bootstrap_server_main && toJSON(inputs.run_reporting) != 'false' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
    strategy:
      fail-fast: false
      matrix:
        dir:
          - toggly_secure_storage
          - toggly_disk
          - toggly_sqlite
          - toggly_isar

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache OWASP Dependency Check database
        uses: actions/cache@v6
        with:
          path: /home/runner/OWASP-Dependency-Check/data/
          key: dependency-check-db-${{ runner.os }}-v6
          restore-keys: |
            dependency-check-db-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'toggly-sdks-flutter-${{ matrix.dir }}'
          path: 'Toggly.FeatureManagement.Flutter/${{ matrix.dir }}'
          format: 'ALL'
          args: >-
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableExperimental
            --disableAssembly
            --disableRubygems
            --disableBundleAudit
            --disableNodeJS
            --disableNodeAudit
            --disablePyPkg
            --disablePyDist

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report-${{ matrix.dir }}
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
        continue-on-error: true

  provider-server-main:
    name: Server main baseline (${{ matrix.name }})
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.bootstrap_server_main) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: toggly_secure_storage
            sonarKey: toggly-sdks-flutter-secure-storage
            sonarName: "Toggly SDKs - Flutter Secure Storage Cache"
            name: Secure Storage
          - dir: toggly_disk
            sonarKey: toggly-sdks-flutter-disk
            sonarName: "Toggly SDKs - Flutter Disk Cache"
            name: Disk
          - dir: toggly_sqlite
            sonarKey: toggly-sdks-flutter-sqlite
            sonarName: "Toggly SDKs - Flutter SQLite Cache"
            name: SQLite
          - dir: toggly_isar
            sonarKey: toggly-sdks-flutter-isar
            sonarName: "Toggly SDKs - Flutter Isar Cache"
            name: Isar
    steps:
      - name: Checkout develop baseline
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Verify baseline revision
        id: baseline
        run: |
          test "$(git branch --show-current)" = develop
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/develop)"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply monorepo pubspec overrides
        working-directory: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
        run: |
          cp pubspec_overrides.yaml.example pubspec_overrides.yaml
          cp example/pubspec_overrides.yaml.example example/pubspec_overrides.yaml

      - name: Get dependencies
        working-directory: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
        run: flutter pub get

      - name: Generate Isar sources when configured
        working-directory: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
        run: |
          if grep -q build_runner pubspec.yaml; then
            flutter pub run build_runner build --delete-conflicting-outputs
          fi

      - name: Analyze and test with coverage
        working-directory: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          dart format --output=none --set-exit-if-changed lib test
          flutter test --coverage --test-randomize-ordering-seed random
          test -s coverage/lcov.info

      - name: Resolve Sonar project version
        id: sonar_version
        uses: ./.github/actions/sonar-project-version
        with:
          manifest: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}/pubspec.yaml
          suffix: ${{ vars.SONAR_PROJECT_VERSION_SUFFIX }}

      - name: SonarQube Server main analysis
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
          # A manual run may start from the PR ref; the checked-out source and
          # SCM revision above are develop, while these new Sonar projects
          # expect a main baseline before accepting PR analysis.
          args: >
            -Dsonar.projectKey=${{ matrix.sonarKey }}
            -Dsonar.projectVersion=${{ steps.sonar_version.outputs.version }}
            -Dsonar.projectName="${{ matrix.sonarName }}"
            -Dsonar.sources=lib
            -Dsonar.tests=test
            -Dsonar.exclusions=**/.*/**,**/example/**,**/*.g.dart,**/*.freezed.dart
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info
            -Dsonar.branch.name=main
            -Dsonar.scm.revision=${{ steps.baseline.outputs.sha }}
            -Dsonar.qualitygate.wait=true

  summary:
    name: Analysis Summary
    runs-on: ubuntu-latest
    needs: [analyze, sonar, build-platforms, smoke-test, dependency-check, analyze-providers, secure-storage-version-matrix, dependency-check-providers]
    if: ${{ always() && github.event_name != 'push' && !inputs.bootstrap_server_main }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify required jobs passed
        uses: ./.github/actions/verify-required-jobs
        with:
          needs-json: ${{ toJSON(needs) }}
          required-jobs: analyze,sonar,build-platforms,smoke-test,dependency-check,analyze-providers,secure-storage-version-matrix,dependency-check-providers
          allow-skipped: ${{ (toJSON(inputs.run_reporting) == 'false' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'sonar,dependency-check,dependency-check-providers' || 'none' }}

      - name: Generate summary
        if: ${{ always() }}
        working-directory: .
        env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          BUILD_RESULT: ${{ needs.build-platforms.result }}
          SMOKE_RESULT: ${{ needs.smoke-test.result }}
          DEPENDENCY_CHECK_RESULT: ${{ needs.dependency-check.result }}
          PROVIDERS_RESULT: ${{ needs.analyze-providers.result }}
          SECURE_STORAGE_RESULT: ${{ needs.secure-storage-version-matrix.result }}
          PROVIDERS_DEPENDENCY_CHECK_RESULT: ${{ needs.dependency-check-providers.result }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
          RUN_REPORTING: ${{ toJSON(inputs.run_reporting) }}
        run: |
          {
            echo "## Flutter SDKs Analysis Summary"
            echo ""
            echo "- Core tests and analysis: ${ANALYZE_RESULT}"
            echo "- Core Sonar: ${SONAR_RESULT}"
            echo "- Core platform builds: ${BUILD_RESULT}"
            echo "- Smoke test: ${SMOKE_RESULT}"
            echo "- Core OWASP: ${DEPENDENCY_CHECK_RESULT}"
            echo "- Provider tests, analysis and requested Sonar: ${PROVIDERS_RESULT}"
            echo "- Secure Storage plugin compatibility: ${SECURE_STORAGE_RESULT}"
            echo "- Provider OWASP: ${PROVIDERS_DEPENDENCY_CHECK_RESULT}"
            echo ""
            if [ "${RUN_REPORTING}" = "false" ]; then
              echo "Reporting was explicitly disabled with run_reporting=false; core and all four provider authenticated Sonar gates were not checked. OWASP reporting was also skipped."
              echo "Provider runtime success does not prove provider Sonar gates."
            elif [ "${FORK_PR}" = "true" ]; then
              echo "Credentialed SonarCloud and SonarQube Server scans were skipped for this fork PR; core and all four provider authenticated Sonar gates were not checked. OWASP reporting was also skipped."
              echo "Provider runtime success does not prove provider Sonar gates."
            fi
            echo ""
            echo "### Packages"
            echo "- feature_flags_toggly (core SDK)"
            echo "- feature_flags_toggly_secure_storage"
            echo "- feature_flags_toggly_disk"
            echo "- feature_flags_toggly_sqlite"
            echo "- feature_flags_toggly_isar"
            echo ""
            echo "Check SonarCloud for detailed results: https://sonarcloud.io/project/overview?id=toggly-sdks-flutter"
          } >> "$GITHUB_STEP_SUMMARY"
