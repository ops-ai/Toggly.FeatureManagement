name: Install local client-telemetry
description: >-
  Install consumer deps against the latest published client-telemetry, then
  overlay the in-repo built package so PR CI can exercise unpublished APIs
  without rewriting dependency ranges to file: (keeps bundlers treating it
  as an external package).

inputs:
  package-dir:
    description: Package directory containing package.json (relative or absolute)
    required: true
  use-npm-ci:
    description: Unused; kept for call-site compatibility.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install with overlaid local @ops-ai/toggly-client-telemetry
      shell: bash
      run: |
        set -euo pipefail
        wd="${{ inputs.package-dir }}"
        if [[ "$wd" != /* ]]; then
          wd="$GITHUB_WORKSPACE/$wd"
        fi
        telemetry="$GITHUB_WORKSPACE/toggly-client-telemetry"
        pkg_json="$wd/package.json"
        if [[ ! -f "$pkg_json" ]]; then
          echo "Missing package.json under $wd" >&2
          exit 1
        fi
        if ! PKG="$pkg_json" node -e "
          const p = require(process.env.PKG);
          const d = { ...p.dependencies, ...p.devDependencies, ...p.peerDependencies, ...p.optionalDependencies };
          process.exit(d['@ops-ai/toggly-client-telemetry'] ? 0 : 1);
        "; then
          echo "Skip local client-telemetry (not a dependency of $wd)"
          (cd "$wd" && (npm ci || npm install))
          exit 0
        fi
        (cd "$telemetry" && (npm ci || npm install) && npm run build)
        # Pin to a published range for install, then overlay in-repo dist/API.
        PKG="$pkg_json" node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync(process.env.PKG, 'utf8'));
          for (const key of ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies']) {
            if (pkg[key] && pkg[key]['@ops-ai/toggly-client-telemetry']) {
              pkg[key]['@ops-ai/toggly-client-telemetry'] = '^1.1.2';
            }
          }
          fs.writeFileSync(process.env.PKG, JSON.stringify(pkg, null, 2) + '\n');
        "
        (cd "$wd" && (npm ci || npm install))
        dest="$wd/node_modules/@ops-ai/toggly-client-telemetry"
        mkdir -p "$(dirname "$dest")"
        rm -rf "$dest"
        mkdir -p "$dest"
        # Copy package without nested node_modules.
        tar -C "$telemetry" -cf - \
          --exclude=node_modules --exclude=.git --exclude=coverage --exclude=tests \
          . | tar -C "$dest" -xf -
        echo "Overlaid local toggly-client-telemetry into $dest"
