name: Ruby SDKs - Tests & Analysis

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'toggly-ruby/**'
      - '.github/workflows/analysis-ruby.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      run_reporting:
        description: 'When false, skip Sonar and OWASP reporting jobs'
        type: boolean
        default: true

env:
  SDK_ROOT: toggly-ruby

permissions:
  contents: read
  security-events: write

jobs:
  test-core:
    name: Test toggly (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2.11', '3.3.12', '3.4.10', '4.0.6']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ${{ env.SDK_ROOT }}/toggly

      - name: Run tests
        working-directory: ${{ env.SDK_ROOT }}/toggly
        run: bundle exec rspec --format documentation

      - name: Upload coverage (Ruby 3.3 only)
        if: matrix.ruby == '3.3.12'
        uses: actions/upload-artifact@v7
        with:
          name: ruby-coverage-core
          path: ${{ env.SDK_ROOT }}/toggly/coverage/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skip native grpc/protobuf compile; smoke_spec does not need them.
    env:
      BUNDLE_WITHOUT: grpc_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ${{ env.SDK_ROOT }}/toggly

      - name: Run smoke tests
        timeout-minutes: 2
        working-directory: ${{ env.SDK_ROOT }}/toggly
        env:
          TOGGLY_SMOKE_APP_KEY_BACKEND: ${{ secrets.TOGGLY_SMOKE_APP_KEY_BACKEND }}
          DISABLE_SIMPLECOV: "true"
        run: bundle exec rspec spec/toggly/smoke_spec.rb --format documentation

  test-rails:
    name: Test toggly-rails (Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Retain every previously covered Ruby/Rails major combination while
          # freezing each representative current patch version.
          - { ruby: '3.2.11', rails: '7.0.10' }
          - { ruby: '3.3.12', rails: '7.0.10' }
          - { ruby: '3.4.10', rails: '7.0.10' }
          - { ruby: '3.2.11', rails: '7.1.6' }
          - { ruby: '3.3.12', rails: '7.1.6' }
          - { ruby: '3.4.10', rails: '7.1.6' }
          - { ruby: '3.2.11', rails: '7.2.3.2' }
          - { ruby: '3.3.12', rails: '7.2.3.2' }
          - { ruby: '3.4.10', rails: '7.2.3.2' }
          - { ruby: '3.2.11', rails: '8.0.5.1' }
          - { ruby: '3.3.12', rails: '8.0.5.1' }
          - { ruby: '3.4.10', rails: '8.0.5.1' }
          - { ruby: '4.0.6', rails: '8.1.3.1' }

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          working-directory: ${{ env.SDK_ROOT }}/toggly-rails

      - name: Install dependencies
        working-directory: ${{ env.SDK_ROOT }}/toggly-rails
        env:
          RAILS_VERSION: ${{ matrix.rails }}
        run: |
          bundle config set frozen false
          bundle install --jobs 4

      - name: Run tests
        working-directory: ${{ env.SDK_ROOT }}/toggly-rails
        run: bundle exec rspec --format documentation

      - name: Upload coverage (Ruby 3.3, Rails 8.0 only)
        if: matrix.ruby == '3.3.12' && matrix.rails == '8.0.5.1'
        uses: actions/upload-artifact@v7
        with:
          name: ruby-coverage-rails
          path: ${{ env.SDK_ROOT }}/toggly-rails/coverage/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  test-cache:
    name: Test toggly-cache (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2.11', '3.3.12', '3.4.10', '4.0.6']

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ${{ env.SDK_ROOT }}/toggly-cache

      - name: Run tests
        working-directory: ${{ env.SDK_ROOT }}/toggly-cache
        run: bundle exec rspec --format documentation
        env:
          REDIS_URL: redis://localhost:6379

      - name: Upload coverage (Ruby 3.3 only)
        if: matrix.ruby == '3.3.12'
        uses: actions/upload-artifact@v7
        with:
          name: ruby-coverage-cache
          path: ${{ env.SDK_ROOT }}/toggly-cache/coverage/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  test-packed-hosts:
    name: Test packed hosts (Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails }}, Redis ${{ matrix.redis }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: '3.2.11', rails: '7.0.10', redis: '4.8.1' }
          - { ruby: '4.0.6', rails: '8.1.3.1', redis: '6.0.0' }

    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Build gems and validate an isolated packaged host
        working-directory: ${{ env.SDK_ROOT }}
        env:
          RAILS_VERSION: ${{ matrix.rails }}
          REDIS_VERSION: ${{ matrix.redis }}
          REDIS_URL: redis://localhost:6379
        run: ruby host-fixtures/verify_packed_hosts.rb

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # RuboCop does not need native grpc/protobuf; keep install lean.
    env:
      BUNDLE_WITHOUT: grpc_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ${{ env.SDK_ROOT }}/toggly

      - name: Run RuboCop on toggly
        working-directory: ${{ env.SDK_ROOT }}/toggly
        run: bundle exec rubocop --parallel

      - name: Run RuboCop on packed host fixture
        working-directory: ${{ env.SDK_ROOT }}
        run: BUNDLE_GEMFILE=toggly/Gemfile bundle exec rubocop host-fixtures/verify_packed_hosts.rb

      - name: Install toggly-rails dependencies
        working-directory: ${{ env.SDK_ROOT }}/toggly-rails
        run: bundle install --jobs 4

      - name: Run RuboCop on toggly-rails
        working-directory: ${{ env.SDK_ROOT }}/toggly-rails
        run: bundle exec rubocop --parallel

      - name: Install toggly-cache dependencies
        working-directory: ${{ env.SDK_ROOT }}/toggly-cache
        run: bundle install --jobs 4

      - name: Run RuboCop on toggly-cache
        working-directory: ${{ env.SDK_ROOT }}/toggly-cache
        run: bundle exec rubocop --parallel

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [test-core, test-rails, test-cache, test-packed-hosts, dependency-check]
    if: ${{ always() && (github.event_name != 'workflow_call' || inputs.run_reporting) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download core coverage
        uses: actions/download-artifact@v8
        with:
          name: ruby-coverage-core
          path: coverage-artifacts/core/
        continue-on-error: true

      - name: Download rails coverage
        uses: actions/download-artifact@v8
        with:
          name: ruby-coverage-rails
          path: coverage-artifacts/rails/
        continue-on-error: true

      - name: Download cache coverage
        uses: actions/download-artifact@v8
        with:
          name: ruby-coverage-cache
          path: coverage-artifacts/cache/
        continue-on-error: true

      - name: Organize coverage files
        run: |
          mkdir -p coverage
          for pkg in core rails cache; do
            json=$(find coverage-artifacts/$pkg -name "coverage.json" 2>/dev/null | head -1)
            if [ -n "$json" ]; then
              cp "$json" "coverage/$pkg-coverage.json"
              echo "Found coverage for $pkg: $json"
            else
              echo "No coverage found for $pkg"
            fi
          done
          echo "Coverage files:"
          ls -la coverage/ || echo "No coverage files found"
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-ruby
            -Dsonar.organization=ops-ai
            -Dsonar.projectName="Toggly SDKs - Ruby"
            -Dsonar.sources=${{ env.SDK_ROOT }}
            -Dsonar.exclusions=**/vendor/**,**/spec/**,**/test/**,**/coverage/**,**/*.gemspec
            -Dsonar.tests=${{ env.SDK_ROOT }}
            -Dsonar.test.inclusions=**/spec/**,**/test/**,**/host-fixtures/**
            -Dsonar.ruby.coverage.reportPaths=coverage/core-coverage.json,coverage/rails-coverage.json,coverage/cache-coverage.json
        continue-on-error: true

      - name: Download Dependency Check report (for SonarQube Server)
        uses: actions/download-artifact@v8
        with:
          name: dependency-check-report-ruby
          path: dependency-check-reports/
        continue-on-error: true

      - name: SonarQube Server Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-ruby
            -Dsonar.projectName="Toggly SDKs - Ruby"
            -Dsonar.sources=${{ env.SDK_ROOT }}
            -Dsonar.exclusions=**/vendor/**,**/spec/**,**/test/**,**/coverage/**,**/*.gemspec
            -Dsonar.tests=${{ env.SDK_ROOT }}
            -Dsonar.test.inclusions=**/spec/**,**/test/**,**/host-fixtures/**
            -Dsonar.ruby.coverage.reportPaths=coverage/core-coverage.json,coverage/rails-coverage.json,coverage/cache-coverage.json
            -Dsonar.dependencyCheck.reportPath=dependency-check-reports/dependency-check-report.xml
        continue-on-error: true

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_call' || inputs.run_reporting }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache OWASP Dependency Check database
        uses: actions/cache@v6
        with:
          path: /home/runner/OWASP-Dependency-Check/data/
          key: dependency-check-db-${{ runner.os }}-v6
          restore-keys: |
            dependency-check-db-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'toggly-sdks-ruby'
          path: ${{ env.SDK_ROOT }}
          format: 'ALL'
          args: >-
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableExperimental
            --disableAssembly
            --disableNodeJS
            --disableNodeAudit
            --disablePyPkg
            --disablePyDist

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report-ruby
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
        continue-on-error: true

  summary:
    name: Analysis Summary
    runs-on: ubuntu-latest
    needs: [test-core, smoke-test, test-rails, test-cache, test-packed-hosts, lint, sonar, dependency-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify required jobs passed
        uses: ./.github/actions/verify-required-jobs
        with:
          needs-json: ${{ toJSON(needs) }}
          required-jobs: test-core,test-rails,test-cache,test-packed-hosts,smoke-test,lint,dependency-check

      - name: Generate summary
        run: |
          echo "## Ruby SDK Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Analysis workflow completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages Analyzed" >> $GITHUB_STEP_SUMMARY
          echo "- toggly (Core)" >> $GITHUB_STEP_SUMMARY
          echo "- toggly-rails" >> $GITHUB_STEP_SUMMARY
          echo "- toggly-cache" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Ruby Versions Tested" >> $GITHUB_STEP_SUMMARY
          echo "- 3.2.11, 3.3.12, 3.4.10, 4.0.6" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Rails Versions Tested" >> $GITHUB_STEP_SUMMARY
          echo "- 7.0.10, 7.1.6, 7.2.3.2, 8.0.5.1, 8.1.3.1" >> $GITHUB_STEP_SUMMARY
          echo "- Packed hosts: Redis 4.8.1 and 6.0.0" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarCloud for detailed results: https://sonarcloud.io/project/overview?id=toggly-sdks-ruby" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarQube Server for detailed results: ${{ secrets.SONAR_HOST_URL }}/dashboard?id=toggly-sdks-ruby" >> $GITHUB_STEP_SUMMARY
