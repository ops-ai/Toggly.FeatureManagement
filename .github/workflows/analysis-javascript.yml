name: JavaScript/TypeScript SDKs - Tests & Analysis

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.Angular/**'
      - 'Toggly.FeatureManagement.React/**'
      - 'Toggly.FeatureManagement.Vue/**'
      - 'Toggly.FeatureManagement.Svelte/**'
      - 'Toggly.FeatureManagement.Astro/**'
      - 'toggly-docusaurus-edge-sdk/**'
      - 'Toggly.FeatureManagement.Javascript/**'
      - 'Toggly.FeatureManagement.Node/**'
      - 'toggly-hooks-types/**'
      - 'toggly-signed-defs/**'
      - 'toggly-clarity-hook/**'
      - 'toggly-ga4-hook/**'
      - 'toggly-appinsights-hook/**'
      - '.github/workflows/analysis-javascript.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.Angular/**'
      - 'Toggly.FeatureManagement.React/**'
      - 'Toggly.FeatureManagement.Vue/**'
      - 'Toggly.FeatureManagement.Svelte/**'
      - 'Toggly.FeatureManagement.Astro/**'
      - 'toggly-docusaurus-edge-sdk/**'
      - 'Toggly.FeatureManagement.Javascript/**'
      - 'Toggly.FeatureManagement.Node/**'
      - 'toggly-hooks-types/**'
      - 'toggly-signed-defs/**'
      - 'toggly-clarity-hook/**'
      - 'toggly-ga4-hook/**'
      - 'toggly-appinsights-hook/**'
      - '.github/workflows/analysis-javascript.yml'
  workflow_dispatch:

jobs:
  test:
    name: Test ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: Angular
            path: Toggly.FeatureManagement.Angular
            test-cmd: npm test -- ngx-feature-flags-toggly --watch=false --browsers=ChromeHeadless --code-coverage --exclude='**/smoke*.spec.ts'
            has-lint: false
          - sdk: React
            path: Toggly.FeatureManagement.React
            test-cmd: npm test
            has-lint: false
          - sdk: Vue
            path: Toggly.FeatureManagement.Vue/vue-feature-flags-toggly
            test-cmd: npm test -- --coverage
            has-lint: false
          - sdk: Svelte
            path: Toggly.FeatureManagement.Svelte/svelte-feature-flags-toggly
            test-cmd: npx vitest run --coverage
            has-lint: false
          - sdk: Astro
            path: Toggly.FeatureManagement.Astro
            test-cmd: npm test -- --coverage
            has-lint: false
          - sdk: JavaScript
            path: Toggly.FeatureManagement.Javascript/feature_flags_toggly
            test-cmd: npm test -- --coverage
            has-lint: false
          - sdk: Docusaurus
            path: toggly-docusaurus-edge-sdk/libs/docusaurus-plugin
            test-cmd: npm test
            has-lint: false
          - sdk: Hooks-Types
            path: toggly-hooks-types
            test-cmd: npm test -- --coverage
            has-lint: false
          - sdk: Clarity-Hook
            path: toggly-clarity-hook
            test-cmd: npm test -- --coverage
            has-lint: false
          - sdk: GA4-Hook
            path: toggly-ga4-hook
            test-cmd: npm test -- --coverage
            has-lint: false
          - sdk: AppInsights-Hook
            path: toggly-appinsights-hook
            test-cmd: npm test -- --coverage
            has-lint: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SonarCloud

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Build shared toggly-hooks-types package
        working-directory: toggly-hooks-types
        run: npm ci || npm install && npm run build

      - name: Build shared toggly-signed-defs package
        working-directory: toggly-signed-defs
        run: (npm ci || npm install) && npm run build

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: npm ci || npm install

      - name: Build package (if needed)
        working-directory: ${{ matrix.path }}
        run: npm run build --if-present

      - name: Run TypeScript type check
        working-directory: ${{ matrix.path }}
        run: npm run typecheck --if-present

      - name: Run linter
        if: matrix.has-lint == true
        working-directory: ${{ matrix.path }}
        run: npm run lint
        continue-on-error: true

      - name: Run tests with coverage
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.test-cmd }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.sdk }}
          path: |
            ${{ matrix.path }}/coverage/
            ${{ matrix.path }}/coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  test-node-server:
    name: Test Node.js Server ${{ matrix.config.package }} (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18.x', '20.x', '22.x']
        config:
          - { package: Core, dir: toggly-node-core }
          - { package: Express, dir: toggly-express }
          - { package: Fastify, dir: toggly-fastify }
          - { package: Hono, dir: toggly-hono }
          - { package: Koa, dir: toggly-koa }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: Toggly.FeatureManagement.Node
        run: pnpm install

      - name: Build all packages
        working-directory: Toggly.FeatureManagement.Node
        run: pnpm -r build

      - name: Run tests with coverage
        working-directory: Toggly.FeatureManagement.Node/${{ matrix.config.dir }}
        run: pnpm test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always() && matrix.node-version == '20.x'
        with:
          name: coverage-Node-${{ matrix.config.package }}
          path: |
            Toggly.FeatureManagement.Node/${{ matrix.config.dir }}/coverage/
            Toggly.FeatureManagement.Node/${{ matrix.config.dir }}/coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  smoke-test:
    name: Smoke Test ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: Angular
            path: Toggly.FeatureManagement.Angular
            smoke-cmd: npm test -- ngx-feature-flags-toggly --watch=false --browsers=ChromeHeadless --ts-config=projects/ngx-feature-flags-toggly/tsconfig.smoke.spec.json --include="projects/ngx-feature-flags-toggly/src/lib/smoke.spec.ts" --include="projects/ngx-feature-flags-toggly/src/lib/smoke-ws.spec.ts"
          - sdk: React
            path: Toggly.FeatureManagement.React
            smoke-cmd: npx jest --config jest.smoke.config.js --runInBand --forceExit
          - sdk: Vue
            path: Toggly.FeatureManagement.Vue/vue-feature-flags-toggly
            smoke-cmd: npx vitest run --config vitest.smoke.config.ts src/__tests__/smoke.spec.ts src/__tests__/smoke-ws.spec.ts
          - sdk: Svelte
            path: Toggly.FeatureManagement.Svelte/svelte-feature-flags-toggly
            smoke-cmd: npx vitest run --config vitest.smoke.config.ts src/__tests__/smoke.spec.ts src/__tests__/smoke-ws.spec.ts
          - sdk: Astro
            path: Toggly.FeatureManagement.Astro
            smoke-cmd: npx vitest run --config vitest.smoke.config.ts src/__tests__/smoke.spec.ts src/__tests__/smoke-ws.spec.ts
          - sdk: JavaScript
            path: Toggly.FeatureManagement.Javascript/feature_flags_toggly
            smoke-cmd: npx jest spec/smoke.test.ts spec/smoke-ws.test.ts --runInBand --forceExit --testPathIgnorePatterns='/node_modules/'
          - sdk: Docusaurus
            path: toggly-docusaurus-edge-sdk/libs/docusaurus-plugin
            smoke-cmd: npm run build && node smoke.mjs && node smoke-ws.mjs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Build shared toggly-hooks-types package
        working-directory: toggly-hooks-types
        run: npm ci || npm install && npm run build

      - name: Build shared toggly-signed-defs package
        working-directory: toggly-signed-defs
        run: (npm ci || npm install) && npm run build

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: npm ci || npm install

      - name: Run smoke test
        timeout-minutes: 2
        working-directory: ${{ matrix.path }}
        env:
          TOGGLY_SMOKE_APP_KEY_FRONTEND: ${{ secrets.TOGGLY_SMOKE_APP_KEY_FRONTEND }}
        run: ${{ matrix.smoke-cmd }}

  smoke-test-node-server:
    name: Smoke Test Node Server Core
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: Toggly.FeatureManagement.Node
        run: pnpm install

      - name: Build all packages
        working-directory: Toggly.FeatureManagement.Node
        run: pnpm -r build

      - name: Run node-core smoke test
        timeout-minutes: 2
        working-directory: Toggly.FeatureManagement.Node/toggly-node-core
        env:
          TOGGLY_SMOKE_APP_KEY_BACKEND: ${{ secrets.TOGGLY_SMOKE_APP_KEY_BACKEND }}
        run: pnpm vitest run --config vitest.smoke.config.ts tests/smoke.test.ts tests/smoke-ws.test.ts

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [test, test-node-server, dependency-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies for TypeScript analysis
        run: |
          # Install dependencies in each SDK so SonarQube can resolve tsconfig extends chains
          for dir in \
            Toggly.FeatureManagement.Angular \
            Toggly.FeatureManagement.React \
            "Toggly.FeatureManagement.Vue/vue-feature-flags-toggly" \
            "Toggly.FeatureManagement.Vue/vue-feature-flags-toggly/example" \
            "Toggly.FeatureManagement.Svelte/svelte-feature-flags-toggly" \
            Toggly.FeatureManagement.Astro \
            "Toggly.FeatureManagement.Javascript/feature_flags_toggly" \
            toggly-hooks-types \
            toggly-clarity-hook \
            toggly-ga4-hook \
            toggly-appinsights-hook; do
            echo "Installing dependencies in $dir"
            npm install --ignore-scripts --no-audit --no-fund --prefix "$dir" || true
          done
          # Install pnpm workspaces (all sub-packages resolved in one pass)
          echo "Installing Node.js server SDK dependencies"
          pnpm install --ignore-scripts --dir Toggly.FeatureManagement.Node || true
          echo "Installing toggly-docusaurus-edge-sdk workspace dependencies"
          pnpm install --ignore-scripts --dir toggly-docusaurus-edge-sdk || true
        continue-on-error: true

      - name: Download all coverage reports
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-artifacts/
        continue-on-error: true

      - name: Organize coverage files
        run: |
          mkdir -p coverage
          # Map SDK names to repo-root-relative paths (must match matrix.path)
          declare -A SDK_PATHS=(
            ["Angular"]="Toggly.FeatureManagement.Angular"
            ["React"]="Toggly.FeatureManagement.React"
            ["Vue"]="Toggly.FeatureManagement.Vue/vue-feature-flags-toggly"
            ["Svelte"]="Toggly.FeatureManagement.Svelte/svelte-feature-flags-toggly"
            ["Astro"]="Toggly.FeatureManagement.Astro"
            ["JavaScript"]="Toggly.FeatureManagement.Javascript/feature_flags_toggly"
            ["Docusaurus"]="toggly-docusaurus-edge-sdk/libs/docusaurus-plugin"
            ["Clarity-Hook"]="toggly-clarity-hook"
            ["GA4-Hook"]="toggly-ga4-hook"
            ["AppInsights-Hook"]="toggly-appinsights-hook"
            ["Hooks-Types"]="toggly-hooks-types"
            ["Node-Core"]="Toggly.FeatureManagement.Node/toggly-node-core"
            ["Node-Express"]="Toggly.FeatureManagement.Node/toggly-express"
            ["Node-Fastify"]="Toggly.FeatureManagement.Node/toggly-fastify"
            ["Node-Hono"]="Toggly.FeatureManagement.Node/toggly-hono"
            ["Node-Koa"]="Toggly.FeatureManagement.Node/toggly-koa"
          )
          find coverage-artifacts -name "lcov.info" -type f | while read file; do
            sdk_name=$(echo "$file" | sed 's|coverage-artifacts/coverage-||' | sed 's|/.*||')
            prefix="${SDK_PATHS[$sdk_name]}"
            if [ -n "$prefix" ]; then
              # Rewrite SF: paths to be relative to repo root so Sonar can match them
              sed "s|SF:|SF:${prefix}/|g" "$file" > "coverage/${sdk_name}-lcov.info"
            else
              cp "$file" "coverage/${sdk_name}-lcov.info" || true
            fi
          done
          echo "Coverage files:"
          ls -la coverage/ || echo "No coverage files found"
          echo "Sample paths from lcov files:"
          grep "^SF:" coverage/*.info 2>/dev/null | head -20 || true
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-javascript
            -Dsonar.organization=ops-ai
            -Dsonar.projectName="Toggly SDKs - JavaScript/TypeScript"
            -Dsonar.sources=Toggly.FeatureManagement.Angular,Toggly.FeatureManagement.React,Toggly.FeatureManagement.Vue,Toggly.FeatureManagement.Svelte,Toggly.FeatureManagement.Astro,toggly-docusaurus-edge-sdk,Toggly.FeatureManagement.Javascript,Toggly.FeatureManagement.Node,toggly-hooks-types,toggly-clarity-hook,toggly-ga4-hook,toggly-appinsights-hook
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/example/**,**/example-app/**,**/example-expo/**,**/examples/**,**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,**/coverage/**,**/*.config.js,**/*.config.ts,**/*.conf.js,Toggly.FeatureManagement.ReactNative/**,Toggly.FeatureManagement.Gatsby/**,Toggly.FeatureManagement.Next/**,Toggly.FeatureManagement.Nuxt/**,Toggly.FeatureManagement.Remix/**,Toggly.FeatureManagement.Css/**,Toggly.FeatureManagement.Wordpress/**,toggly-ruby/**,toggly-rust/**
            -Dsonar.coverage.exclusions=**/example/**,**/example-app/**,**/example-expo/**,**/examples/**,**/Demo.*/**,**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,**/*.config.js,**/*.config.ts,**/*.conf.js,**/*.vue,toggly-docusaurus-edge-sdk/cloudflare/**,toggly-docusaurus-edge-sdk/libs/core/**,toggly-docusaurus-edge-sdk/libs/docusaurus-plugin/src/**,toggly-hooks-types/reference/**
            -Dsonar.cpd.exclusions=**/ws-sync.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/*-lcov.info
            -Dsonar.typescript.lcov.reportPaths=coverage/*-lcov.info
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx
        continue-on-error: true

      - name: Download Dependency Check report (for SonarQube Server)
        uses: actions/download-artifact@v4
        with:
          name: dependency-check-report-javascript
          path: dependency-check-reports/
        continue-on-error: true

      - name: SonarQube Server Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-javascript
            -Dsonar.projectName="Toggly SDKs - JavaScript/TypeScript"
            -Dsonar.sources=Toggly.FeatureManagement.Angular,Toggly.FeatureManagement.React,Toggly.FeatureManagement.Vue,Toggly.FeatureManagement.Svelte,Toggly.FeatureManagement.Astro,toggly-docusaurus-edge-sdk,Toggly.FeatureManagement.Javascript,Toggly.FeatureManagement.Node,toggly-hooks-types,toggly-clarity-hook,toggly-ga4-hook,toggly-appinsights-hook
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/example/**,**/example-app/**,**/example-expo/**,**/examples/**,**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,**/coverage/**,**/*.config.js,**/*.config.ts,**/*.conf.js,Toggly.FeatureManagement.ReactNative/**,Toggly.FeatureManagement.Gatsby/**,Toggly.FeatureManagement.Next/**,Toggly.FeatureManagement.Nuxt/**,Toggly.FeatureManagement.Remix/**,Toggly.FeatureManagement.Css/**,Toggly.FeatureManagement.Wordpress/**,toggly-ruby/**,toggly-rust/**
            -Dsonar.coverage.exclusions=**/example/**,**/example-app/**,**/example-expo/**,**/examples/**,**/Demo.*/**,**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,**/*.config.js,**/*.config.ts,**/*.conf.js,**/*.vue,toggly-docusaurus-edge-sdk/cloudflare/**,toggly-docusaurus-edge-sdk/libs/core/**,toggly-docusaurus-edge-sdk/libs/docusaurus-plugin/src/**,toggly-hooks-types/reference/**
            -Dsonar.cpd.exclusions=**/ws-sync.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/*-lcov.info
            -Dsonar.typescript.lcov.reportPaths=coverage/*-lcov.info
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx
            -Dsonar.dependencyCheck.reportPath=dependency-check-reports/dependency-check-report.xml
        continue-on-error: true

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache OWASP Dependency Check database
        uses: actions/cache@v4
        with:
          path: /home/runner/OWASP-Dependency-Check/data/
          key: dependency-check-db-${{ runner.os }}-v6
          restore-keys: |
            dependency-check-db-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'toggly-sdks-javascript'
          path: >
            Toggly.FeatureManagement.Angular
            Toggly.FeatureManagement.React
            Toggly.FeatureManagement.Vue
            Toggly.FeatureManagement.Svelte
            Toggly.FeatureManagement.Astro
            Toggly.FeatureManagement.Javascript
            Toggly.FeatureManagement.Node
            toggly-docusaurus-edge-sdk
            toggly-hooks-types
            toggly-clarity-hook
            toggly-ga4-hook
            toggly-appinsights-hook
          format: 'ALL'
          args: >-
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableExperimental
            --disableAssembly
            --disableRubygems
            --disableBundleAudit
            --disablePyPkg
            --disablePyDist
        continue-on-error: true

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report-javascript
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
        continue-on-error: true

  summary:
    name: Analysis Summary
    runs-on: ubuntu-latest
    needs: [test, test-node-server, smoke-test, smoke-test-node-server, sonar, dependency-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify required jobs passed
        uses: ./.github/actions/verify-required-jobs
        with:
          needs-json: ${{ toJSON(needs) }}
          required-jobs: test,test-node-server,smoke-test,smoke-test-node-server

      - name: Check test results
        run: |
          echo "## JavaScript/TypeScript SDK Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend SDKs" >> $GITHUB_STEP_SUMMARY
          echo "- Angular" >> $GITHUB_STEP_SUMMARY
          echo "- React" >> $GITHUB_STEP_SUMMARY
          echo "- Vue" >> $GITHUB_STEP_SUMMARY
          echo "- Svelte" >> $GITHUB_STEP_SUMMARY
          echo "- Astro" >> $GITHUB_STEP_SUMMARY
          echo "- JavaScript (vanilla)" >> $GITHUB_STEP_SUMMARY
          echo "- Docusaurus" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Node.js Server SDKs" >> $GITHUB_STEP_SUMMARY
          echo "- @ops-ai/toggly-node-core" >> $GITHUB_STEP_SUMMARY
          echo "- @ops-ai/toggly-express" >> $GITHUB_STEP_SUMMARY
          echo "- @ops-ai/toggly-fastify" >> $GITHUB_STEP_SUMMARY
          echo "- @ops-ai/toggly-hono" >> $GITHUB_STEP_SUMMARY
          echo "- @ops-ai/toggly-koa" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Utilities" >> $GITHUB_STEP_SUMMARY
          echo "- Hooks Types" >> $GITHUB_STEP_SUMMARY
          echo "- Clarity Hook" >> $GITHUB_STEP_SUMMARY
          echo "- GA4 Hook" >> $GITHUB_STEP_SUMMARY
          echo "- Application Insights Hook" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarCloud for detailed results: https://sonarcloud.io/project/overview?id=toggly-sdks-javascript" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarQube Server for detailed results: ${{ secrets.SONAR_HOST_URL }}/dashboard?id=toggly-sdks-javascript" >> $GITHUB_STEP_SUMMARY
