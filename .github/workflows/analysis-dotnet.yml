name: .NET SDKs - Tests & Analysis

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.NET/**'
      - 'Toggly.CLI/**'
      - '.github/workflows/analysis-dotnet.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.NET/**'
      - 'Toggly.CLI/**'
      - '.github/workflows/analysis-dotnet.yml'
  workflow_dispatch:

jobs:
  analyze:
    name: Build, Test & Analyze
    runs-on: ubuntu-latest
    needs: [dependency-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '5.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install tools
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Restore solution dependencies
        run: dotnet restore Toggly.FeatureManagement.NET/Toggly.FeatureManagement.sln

      - name: Restore additional test dependencies
        run: |
          dotnet restore Toggly.FeatureManagement.NET/Toggly.FeatureManagement.Web.Tests/Toggly.FeatureManagement.Web.Tests.csproj
          dotnet restore Toggly.FeatureManagement.NET/Toggly.FeatureManagement.Storage.DistributedCache.Tests/Toggly.FeatureManagement.Storage.DistributedCache.Tests.csproj
          dotnet restore Toggly.FeatureManagement.NET/Toggly.FeatureManagement.Hangfire.Tests/Toggly.FeatureManagement.Hangfire.Tests.csproj
          dotnet restore Toggly.FeatureManagement.NET/Toggly.FeatureManagement.NSwag.Tests/Toggly.FeatureManagement.NSwag.Tests.csproj
          dotnet restore Toggly.FeatureManagement.NET/Toggly.Storage.Dapper.Tests/Toggly.Storage.Dapper.Tests.csproj
          dotnet restore Toggly.FeatureManagement.NET/Toggly.Storage.EntityFramework.Tests/Toggly.Storage.EntityFramework.Tests.csproj
          dotnet restore Toggly.FeatureManagement.NET/Toggly.Storage.MongoDB.Tests/Toggly.Storage.MongoDB.Tests.csproj
        continue-on-error: true

      # ── SonarCloud ──────────────────────────────────────────────────────────

      - name: Begin SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"toggly-sdks-dotnet" \
            "/n:Toggly SDKs - .NET" \
            /o:"ops-ai" \
            /v:"${{ steps.gitversion.outputs.semVer }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.projectBaseDir="${GITHUB_WORKSPACE}/Toggly.FeatureManagement.NET" \
            /d:sonar.cs.opencover.reportsPaths="${GITHUB_WORKSPACE}/TestResults/**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="${GITHUB_WORKSPACE}/TestResults/**/*.trx" \
            /d:sonar.coverageReportPaths="${GITHUB_WORKSPACE}/coverage-report/SonarQube.xml" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/examples/**,**/Benchmarks/**" \
            /d:sonar.coverage.exclusions="**/*Tests*.cs,**/examples/**,**/Benchmarks/**" \
            /d:sonar.test.inclusions="**/*Tests*.cs"

      - name: Build solution
        run: dotnet build Toggly.FeatureManagement.NET/Toggly.FeatureManagement.sln --no-restore -c Release

      - name: Build additional test projects
        run: |
          dotnet build Toggly.FeatureManagement.NET/Toggly.FeatureManagement.Web.Tests/Toggly.FeatureManagement.Web.Tests.csproj -c Release
          dotnet build Toggly.FeatureManagement.NET/Toggly.FeatureManagement.Storage.DistributedCache.Tests/Toggly.FeatureManagement.Storage.DistributedCache.Tests.csproj -c Release
          dotnet build Toggly.FeatureManagement.NET/Toggly.FeatureManagement.Hangfire.Tests/Toggly.FeatureManagement.Hangfire.Tests.csproj -c Release
          dotnet build Toggly.FeatureManagement.NET/Toggly.FeatureManagement.NSwag.Tests/Toggly.FeatureManagement.NSwag.Tests.csproj -c Release
          dotnet build Toggly.FeatureManagement.NET/Toggly.Storage.Dapper.Tests/Toggly.Storage.Dapper.Tests.csproj -c Release
          dotnet build Toggly.FeatureManagement.NET/Toggly.Storage.EntityFramework.Tests/Toggly.Storage.EntityFramework.Tests.csproj -c Release
          dotnet build Toggly.FeatureManagement.NET/Toggly.Storage.MongoDB.Tests/Toggly.Storage.MongoDB.Tests.csproj -c Release
        continue-on-error: true

      - name: Run core tests
        run: |
          dotnet test Toggly.FeatureManagement.NET/Toggly.FeatureManagement.Tests/Toggly.FeatureManagement.Tests.csproj \
            --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=core-test-results.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
        continue-on-error: true

      - name: Run Web tests
        run: |
          dotnet test Toggly.FeatureManagement.NET/Toggly.FeatureManagement.Web.Tests/Toggly.FeatureManagement.Web.Tests.csproj \
            --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=web-test-results.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
        continue-on-error: true

      - name: Run DistributedCache storage tests
        run: |
          dotnet test Toggly.FeatureManagement.NET/Toggly.FeatureManagement.Storage.DistributedCache.Tests/Toggly.FeatureManagement.Storage.DistributedCache.Tests.csproj \
            --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=distributedcache-test-results.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
        continue-on-error: true

      - name: Run Hangfire tests
        run: |
          dotnet test Toggly.FeatureManagement.NET/Toggly.FeatureManagement.Hangfire.Tests/Toggly.FeatureManagement.Hangfire.Tests.csproj \
            --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=hangfire-test-results.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
        continue-on-error: true

      - name: Run NSwag tests
        run: |
          dotnet test Toggly.FeatureManagement.NET/Toggly.FeatureManagement.NSwag.Tests/Toggly.FeatureManagement.NSwag.Tests.csproj \
            --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=nswag-test-results.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
        continue-on-error: true

      - name: Run Dapper storage tests
        run: |
          dotnet test Toggly.FeatureManagement.NET/Toggly.Storage.Dapper.Tests/Toggly.Storage.Dapper.Tests.csproj \
            --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=dapper-test-results.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
        continue-on-error: true

      - name: Run EntityFramework storage tests
        run: |
          dotnet test Toggly.FeatureManagement.NET/Toggly.Storage.EntityFramework.Tests/Toggly.Storage.EntityFramework.Tests.csproj \
            --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=ef-test-results.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
        continue-on-error: true

      - name: Run MongoDB storage tests
        run: |
          dotnet test Toggly.FeatureManagement.NET/Toggly.Storage.MongoDB.Tests/Toggly.Storage.MongoDB.Tests.csproj \
            --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=mongodb-test-results.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
        continue-on-error: true

      - name: Merge coverage reports
        run: |
          reportgenerator \
            -reports:"**/TestResults/**/coverage.opencover.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"SonarQube;Cobertura" \
            -assemblyfilters:"-*Tests*"
        continue-on-error: true

      - name: End SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      # ── SonarQube Server ────────────────────────────────────────────────────

      - name: Download Dependency Check report (for SonarQube Server)
        uses: actions/download-artifact@v4
        with:
          name: dependency-check-report-dotnet
          path: dependency-check-reports/
        continue-on-error: true

      - name: Begin SonarQube Server Scan
        env:
          SONAR_SERVER_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          dotnet sonarscanner begin \
            /k:"toggly-sdks-dotnet" \
            "/n:Toggly SDKs - .NET" \
            /v:"${{ steps.gitversion.outputs.semVer }}" \
            /d:sonar.host.url="${SONAR_HOST_URL}" \
            /d:sonar.token="${SONAR_SERVER_TOKEN}" \
            /d:sonar.projectBaseDir="${GITHUB_WORKSPACE}/Toggly.FeatureManagement.NET" \
            /d:sonar.cs.opencover.reportsPaths="${GITHUB_WORKSPACE}/TestResults/**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="${GITHUB_WORKSPACE}/TestResults/**/*.trx" \
            /d:sonar.coverageReportPaths="${GITHUB_WORKSPACE}/coverage-report/SonarQube.xml" \
            /d:sonar.dependencyCheck.reportPath="${GITHUB_WORKSPACE}/dependency-check-reports/dependency-check-report.xml" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/examples/**,**/Benchmarks/**" \
            /d:sonar.coverage.exclusions="**/*Tests*.cs,**/examples/**,**/Benchmarks/**" \
            /d:sonar.test.inclusions="**/*Tests*.cs"

      - name: Build solution (SonarQube Server)
        run: dotnet build Toggly.FeatureManagement.NET/Toggly.FeatureManagement.sln --no-restore -c Release

      - name: End SonarQube Server Scan
        env:
          SONAR_SERVER_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_SERVER_TOKEN}"

      # ── Artifacts ───────────────────────────────────────────────────────────

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            **/TestResults/**/coverage.opencover.xml
            coverage-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Test Summary
        if: always()
        run: |
          echo "## .NET SDK Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.gitversion.outputs.semVer }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages Analyzed" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.FeatureManagement (Core SDK)" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.FeatureManagement.Web" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.FeatureManagement.Hangfire" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.FeatureManagement.HealthChecks" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.FeatureManagement.NSwag" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.FeatureManagement.Storage.DistributedCache" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.FeatureManagement.Storage.RavenDB" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.Storage.Dapper" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.Storage.EntityFramework" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.Storage.MongoDB" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.Metrics.SystemMetrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "SonarCloud: https://sonarcloud.io/project/overview?id=toggly-sdks-dotnet" >> $GITHUB_STEP_SUMMARY
          echo "SonarQube Server: ${{ secrets.SONAR_HOST_URL }}/dashboard?id=toggly-sdks-dotnet" >> $GITHUB_STEP_SUMMARY

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache OWASP Dependency Check database
        uses: actions/cache@v4
        with:
          path: /home/runner/OWASP-Dependency-Check/data/
          key: dependency-check-db-${{ runner.os }}-v6
          restore-keys: |
            dependency-check-db-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'toggly-sdks-dotnet'
          path: 'Toggly.FeatureManagement.NET'
          format: 'ALL'
          args: >-
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableExperimental
            --disableRubygems
            --disableBundleAudit
            --disableNodeJS
            --disableNodeAudit
            --disablePyPkg
            --disablePyDist
        continue-on-error: true

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report-dotnet
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
        continue-on-error: true

  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore CLI dependencies
        run: dotnet restore Toggly.CLI/Toggly.CLI.csproj

      - name: Build CLI
        run: dotnet build Toggly.CLI/Toggly.CLI.csproj -c Release

      - name: CLI Build Summary
        run: echo "✅ CLI build completed successfully" >> $GITHUB_STEP_SUMMARY
