# SonarCloud Configuration for .NET SDKs
# This configuration can be used for local analysis

sonar.projectKey=toggly-sdks-dotnet
sonar.organization=ops-ai
sonar.projectName=Toggly SDKs - .NET

# Source and test separation
sonar.sources=.
sonar.tests=.

# Exclusions
sonar.exclusions=**/bin/**,**/obj/**,**/examples/**,**/Benchmarks/**,**/MlNetChangePointDetection/**,**/Demo.Mvc/**,**/*.Designer.cs,**/AssemblyInfo.cs

# Test inclusions
sonar.test.inclusions=**/*Tests.cs,**/*Test.cs

# Coverage exclusions
sonar.coverage.exclusions=**/*Tests.cs,**/examples/**,**/Benchmarks/**,**/Demo.Mvc/**

# Coverage report paths
sonar.cs.opencover.reportsPaths=**/coverage/**/coverage.opencover.xml,**/TestResults/**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/TestResults/**/*.trx

# Language version
sonar.cs.roslyn.ignoreIssues=false
