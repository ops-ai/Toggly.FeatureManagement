name = "toggly-docusaurus-edge-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Default (non-secret) variables. Override per-environment below.
# Secrets are NOT defined here — set them via `wrangler secret put` or the
# Cloudflare dashboard. Required secrets:
#   - TOGGLY_APP_KEY                 always required
#   - CF_ACCESS_CLIENT_ID            required — Pages branch aliases are gated by Cloudflare Access
#   - CF_ACCESS_CLIENT_SECRET        required — Pages branch aliases are gated by Cloudflare Access
[vars]
TOGGLY_API_BASE_URL = "https://definitions.toggly.io"
TOGGLY_ENVIRONMENT = "Production"
ORIGIN_BASE_URL = "https://main.toggly-docs.pages.dev"

# Production: docs.toggly.io
# Origin is the `main` branch alias of the toggly-docs Pages project. Branch
# alias URLs never 301 to the custom domain, so the worker fetches static
# assets without looping back through itself. Do not point production at
# `develop.*` — Cloudflare Access will redirect browsers to that hostname.
[env.production]
routes = [
  { pattern = "docs.toggly.io/*", zone_name = "toggly.io" },
]

[env.production.vars]
TOGGLY_API_BASE_URL = "https://definitions.toggly.io"
TOGGLY_ENVIRONMENT = "Production"
ORIGIN_BASE_URL = "https://main.toggly-docs.pages.dev"
WORKER_PUBLIC_HOST = "docs.toggly.io"

# Staging: staging-docs.toggly.io
# Origin is the `develop` branch alias so staging previews track the develop branch.
# If origin fetch fails with Access errors, ensure CF_ACCESS_* secrets are set
# on this Worker environment and the service token is allowed on the Access
# policy for `*.toggly-docs.pages.dev`.
[env.staging]
routes = [
  { pattern = "staging-docs.toggly.io/*", zone_name = "toggly.io" },
]

[env.staging.vars]
TOGGLY_API_BASE_URL = "https://definitions.toggly.io"
TOGGLY_ENVIRONMENT = "Production"
ORIGIN_BASE_URL = "https://develop.toggly-docs.pages.dev"
WORKER_PUBLIC_HOST = "staging-docs.toggly.io"
