name: Java SDK - Tests & Analysis

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.Java/**'
      - '.github/workflows/analysis-java.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      run_reporting:
        description: 'When false, skip Sonar and OWASP reporting jobs'
        type: boolean
        default: true

env:
  SDK_ROOT: Toggly.FeatureManagement.Java

defaults:
  run:
    working-directory: Toggly.FeatureManagement.Java

permissions:
  contents: read
  security-events: write

jobs:
  build:
    name: Build & Test (JDK ${{ matrix.java-version }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21, 25]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B clean package --file pom.xml

      - name: Run tests
        run: mvn -B test --file pom.xml

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-java-${{ matrix.java-version }}
          path: |
            ${{ env.SDK_ROOT }}/**/target/surefire-reports/*.xml
            ${{ env.SDK_ROOT }}/**/target/failsafe-reports/*.xml
          retention-days: 7
          if-no-files-found: ignore

  current-hosts:
    name: Packed Host Fixtures (JDK ${{ matrix.java-version }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: build
    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21, 25]
    services:
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build release JARs and run isolated hosts
        env:
          MAVEN_REPO_LOCAL: ${{ runner.temp }}/toggly-java-hosts-m2
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
        run: bash host-fixtures/run-current-hosts.sh

  smoke-test:
    name: Smoke Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run smoke tests
        timeout-minutes: 2
        env:
          TOGGLY_SMOKE_APP_KEY_BACKEND: ${{ secrets.TOGGLY_SMOKE_APP_KEY_BACKEND }}
        run: mvn -B test -pl toggly-core -Dtest=SmokeTest --file pom.xml

  code-quality:
    name: Code Quality
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run SpotBugs
        run: mvn -B compile spotbugs:check --file pom.xml

      - name: Run Checkstyle
        run: mvn -B compile checkstyle:check --file pom.xml

  coverage:
    name: Coverage
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests with JaCoCo coverage
        run: mvn -B verify -Pcoverage --file pom.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: java-coverage
          path: |
            ${{ env.SDK_ROOT }}/**/target/site/jacoco/jacoco.xml
            ${{ env.SDK_ROOT }}/**/target/jacoco.exec
          retention-days: 7
          if-no-files-found: ignore

  sonar:
    name: SonarQube Analysis
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [coverage, dependency-check]
    if: ${{ always() && (github.event_name != 'workflow_call' || inputs.run_reporting) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: java-coverage
          path: coverage-artifacts/
        continue-on-error: true

      - name: Build and run SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify -Pcoverage sonar:sonar \
            -Dsonar.projectKey=toggly-sdks-java \
            -Dsonar.organization=ops-ai \
            -Dsonar.projectName="Toggly SDKs - Java" \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.exclusions="**/target/**,**/test/**,**/host-fixtures/**" \
            -Dsonar.test.inclusions="**/test/**" \
            --file pom.xml || true
        continue-on-error: true

      - name: Download Dependency Check report (for SonarQube Server)
        uses: actions/download-artifact@v8
        with:
          name: dependency-check-report-java
          path: dependency-check-reports/
        continue-on-error: true

      - name: Run SonarQube Server analysis
        env:
          SONAR_SERVER_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B verify -Pcoverage sonar:sonar \
            -Dsonar.projectKey=toggly-sdks-java \
            -Dsonar.projectName="Toggly SDKs - Java" \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_SERVER_TOKEN}" \
            -Dsonar.exclusions="**/target/**,**/test/**,**/host-fixtures/**" \
            -Dsonar.test.inclusions="**/test/**" \
            -Dsonar.dependencyCheck.reportPath="${GITHUB_WORKSPACE}/dependency-check-reports/dependency-check-report.xml" \
            --file pom.xml || true
        continue-on-error: true

  dependency-check:
    name: OWASP Dependency Check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: ${{ github.event_name != 'workflow_call' || inputs.run_reporting }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache OWASP Dependency Check database
        uses: actions/cache@v6
        with:
          path: /home/runner/OWASP-Dependency-Check/data/
          key: dependency-check-db-${{ runner.os }}-v6
          restore-keys: |
            dependency-check-db-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'toggly-sdks-java'
          path: ${{ env.SDK_ROOT }}
          format: 'ALL'
          args: >-
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableExperimental
            --disableRubygems
            --disableBundleAudit
            --disableNodeJS
            --disableNodeAudit
            --disablePyPkg
            --disablePyDist

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report-java
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
        continue-on-error: true

  summary:
    name: Analysis Summary
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [build, current-hosts, smoke-test, code-quality, coverage, sonar, dependency-check]
    if: always()
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify required jobs passed
        uses: ./.github/actions/verify-required-jobs
        with:
          needs-json: ${{ toJSON(needs) }}
          required-jobs: build,current-hosts,smoke-test,code-quality,coverage,dependency-check

      - name: Generate summary
        run: |
          echo "## Java SDK Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Analysis workflow completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### JDK Versions Tested" >> $GITHUB_STEP_SUMMARY
          echo "- JDK 17" >> $GITHUB_STEP_SUMMARY
          echo "- JDK 21" >> $GITHUB_STEP_SUMMARY
          echo "- JDK 25" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "- Maven build and tests" >> $GITHUB_STEP_SUMMARY
          echo "- SpotBugs static analysis" >> $GITHUB_STEP_SUMMARY
          echo "- Checkstyle code style checks" >> $GITHUB_STEP_SUMMARY
          echo "- JaCoCo code coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarCloud for detailed results: https://sonarcloud.io/project/overview?id=toggly-sdks-java" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarQube Server for detailed results: ${{ secrets.SONAR_HOST_URL }}/dashboard?id=toggly-sdks-java" >> $GITHUB_STEP_SUMMARY
