name: Rust SDKs - Tests & Analysis

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'toggly-rust/**'
      - '.github/workflows/analysis-rust.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'toggly-rust/**'
      - '.github/workflows/analysis-rust.yml'
  workflow_dispatch:

env:
  SDK_ROOT: toggly-rust
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Test (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta, 1.88.0]
    defaults:
      run:
        working-directory: toggly-rust

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        continue-on-error: true

      - name: Build
        run: cargo build --all-targets --all-features

      - name: Run tests
        run: cargo test --all-features --workspace

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: toggly-rust

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run smoke tests
        timeout-minutes: 2
        env:
          TOGGLY_SMOKE_APP_KEY_BACKEND: ${{ secrets.TOGGLY_SMOKE_APP_KEY_BACKEND }}
        run: cargo test -p toggly --test smoke --test smoke_ws

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toggly-rust

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: ${{ env.SDK_ROOT }}/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toggly-rust

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -Dwarnings

  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toggly-rust

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Check MSRV
        run: cargo check --all-features --workspace

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toggly-rust

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit
        continue-on-error: true

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [coverage, dependency-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: rust-coverage
          path: ${{ env.SDK_ROOT }}/
        continue-on-error: true

      - name: Convert LCOV to SonarQube generic coverage format
        run: |
          python3 -c "
          import re, sys
          lcov_file = '${{ env.SDK_ROOT }}/lcov.info'
          output_file = '${{ env.SDK_ROOT }}/coverage-sonar.xml'
          try:
              with open(lcov_file) as f:
                  content = f.read()
          except FileNotFoundError:
              print('No lcov.info found, skipping conversion')
              sys.exit(0)

          files = {}
          current_file = None
          for line in content.split('\n'):
              if line.startswith('SF:'):
                  current_file = line[3:]
                  files[current_file] = {}
              elif line.startswith('DA:') and current_file:
                  parts = line[3:].split(',')
                  if len(parts) >= 2:
                      line_num = parts[0]
                      hits = parts[1]
                      files[current_file][line_num] = hits == '0'
              elif line == 'end_of_record':
                  current_file = None

          with open(output_file, 'w') as f:
              f.write('<coverage version=\"1\">\n')
              for filepath, lines in files.items():
                  f.write(f'  <file path=\"{filepath}\">\n')
                  for line_num, not_covered in sorted(lines.items(), key=lambda x: int(x[0])):
                      covered = 'false' if not_covered else 'true'
                      f.write(f'    <lineToCover lineNumber=\"{line_num}\" covered=\"{covered}\"/>\n')
                  f.write('  </file>\n')
              f.write('</coverage>\n')
          print(f'Converted {len(files)} files to SonarQube generic coverage format')
          "
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: ${{ env.SDK_ROOT }}
          args: >
            -Dsonar.projectKey=toggly-sdks-rust
            -Dsonar.organization=ops-ai
            -Dsonar.projectName="Toggly SDKs - Rust"
            -Dsonar.sources=.
            -Dsonar.exclusions=**/target/**,**/examples/**,**/*_test.rs
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*_test.rs,**/tests/**
            -Dsonar.coverageReportPaths=coverage-sonar.xml
        continue-on-error: true

      - name: Download Dependency Check report (for SonarQube Server)
        uses: actions/download-artifact@v4
        with:
          name: dependency-check-report-rust
          path: dependency-check-reports/
        continue-on-error: true

      - name: SonarQube Server Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: ${{ env.SDK_ROOT }}
          args: >
            -Dsonar.projectKey=toggly-sdks-rust
            -Dsonar.projectName="Toggly SDKs - Rust"
            -Dsonar.sources=.
            -Dsonar.exclusions=**/target/**,**/examples/**,**/*_test.rs
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*_test.rs,**/tests/**
            -Dsonar.coverageReportPaths=coverage-sonar.xml
            -Dsonar.dependencyCheck.reportPath=../dependency-check-reports/dependency-check-report.xml
        continue-on-error: true

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache OWASP Dependency Check database
        uses: actions/cache@v4
        with:
          path: /home/runner/OWASP-Dependency-Check/data/
          key: dependency-check-db-${{ runner.os }}-v6
          restore-keys: |
            dependency-check-db-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'toggly-sdks-rust'
          path: ${{ env.SDK_ROOT }}
          format: 'ALL'
          args: >-
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableExperimental
            --disableAssembly
            --disableRubygems
            --disableBundleAudit
            --disableNodeJS
            --disableNodeAudit
            --disablePyPkg
            --disablePyDist
        continue-on-error: true

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report-rust
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
        continue-on-error: true

  summary:
    name: Analysis Summary
    runs-on: ubuntu-latest
    needs: [test, smoke-test, coverage, docs, msrv, security, sonar, dependency-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify required jobs passed
        uses: ./.github/actions/verify-required-jobs
        with:
          needs-json: ${{ toJSON(needs) }}
          required-jobs: test,smoke-test,coverage,docs,msrv,security

      - name: Generate summary
        working-directory: .
        run: |
          echo "## Rust SDK Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Analysis workflow completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "- Tests executed across stable, beta, and MSRV (1.85)" >> $GITHUB_STEP_SUMMARY
          echo "- Code coverage collected (cargo-llvm-cov)" >> $GITHUB_STEP_SUMMARY
          echo "- Code formatting checked (cargo fmt)" >> $GITHUB_STEP_SUMMARY
          echo "- Static analysis completed (clippy)" >> $GITHUB_STEP_SUMMARY
          echo "- Security audit completed (cargo-audit)" >> $GITHUB_STEP_SUMMARY
          echo "- Documentation build verified" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages Analyzed" >> $GITHUB_STEP_SUMMARY
          echo "- toggly (Core)" >> $GITHUB_STEP_SUMMARY
          echo "- toggly-actix" >> $GITHUB_STEP_SUMMARY
          echo "- toggly-axum" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarCloud for detailed results: https://sonarcloud.io/project/overview?id=toggly-sdks-rust" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarQube Server for detailed results: ${{ secrets.SONAR_HOST_URL }}/dashboard?id=toggly-sdks-rust" >> $GITHUB_STEP_SUMMARY
