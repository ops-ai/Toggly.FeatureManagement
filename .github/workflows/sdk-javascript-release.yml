name: JavaScript SDK - Build & Publish

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    defaults:
      run:
        working-directory: Toggly.FeatureManagement.Javascript/feature_flags_toggly

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Check if version was manually bumped
        id: check_version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          cd $GITHUB_WORKSPACE
          PREVIOUS_VERSION=$(git show HEAD~1:Toggly.FeatureManagement.Javascript/feature_flags_toggly/package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf-8')).version" || echo "$CURRENT_VERSION")

          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "previous_version=$PREVIOUS_VERSION" >> $GITHUB_OUTPUT

          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "manually_bumped=true" >> $GITHUB_OUTPUT
            echo "Version was manually bumped from $PREVIOUS_VERSION to $CURRENT_VERSION"
          else
            echo "manually_bumped=false" >> $GITHUB_OUTPUT
            echo "No manual version bump detected"
          fi

      - name: Bump version (if not manually bumped)
        id: auto_version
        if: steps.check_version.outputs.manually_bumped == 'false'
        run: |
          BUMP_TYPE="${{ github.event.inputs.bump_type || 'patch' }}"
          echo "Bumping $BUMP_TYPE version..."

          NEW_VERSION=$(npm version $BUMP_TYPE --no-git-tag-version)
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumped to version $NEW_VERSION"

      - name: Set version output (manual bump)
        id: manual_version
        if: steps.check_version.outputs.manually_bumped == 'true'
        run: |
          echo "new_version=v${{ steps.check_version.outputs.current_version }}" >> $GITHUB_OUTPUT

      - name: Set final version
        id: version
        run: |
          if [ "${{ steps.check_version.outputs.manually_bumped }}" == "true" ]; then
            echo "new_version=${{ steps.manual_version.outputs.new_version }}" >> $GITHUB_OUTPUT
          else
            echo "new_version=${{ steps.auto_version.outputs.new_version }}" >> $GITHUB_OUTPUT
          fi

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        if: steps.check_version.outputs.manually_bumped == 'false'
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "${{ steps.import_gpg.outputs.name }}"
          git config user.email "${{ steps.import_gpg.outputs.email }}"

          git add Toggly.FeatureManagement.Javascript/feature_flags_toggly/package.json
          git add Toggly.FeatureManagement.Javascript/feature_flags_toggly/package-lock.json

          BUMP_TYPE="${{ github.event.inputs.bump_type || 'patch' }}"
          git commit -S -m "Bumped JavaScript SDK to ${{ steps.version.outputs.new_version }} ($BUMP_TYPE) [skip ci]"

          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if git pull --rebase --autostash origin develop; then
              if git push origin develop; then
                echo "Successfully pushed version bump"
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Retry attempt $RETRY_COUNT of $MAX_RETRIES..."
              sleep 2
            fi
          done

          echo "Failed to push after $MAX_RETRIES attempts"
          exit 1

      - name: Publish summary
        if: always()
        run: |
          echo "## JavaScript SDK Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ steps.version.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Package**: @ops-ai/feature-flags-toggly" >> $GITHUB_STEP_SUMMARY
          echo "**Bump Type**: ${{ github.event.inputs.bump_type || 'patch' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View on NPM](https://www.npmjs.com/package/@ops-ai/feature-flags-toggly)" >> $GITHUB_STEP_SUMMARY
