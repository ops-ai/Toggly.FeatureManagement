name: .NET SDKs - Tests & Analysis

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.NET/**'
      - 'Toggly.CLI/**'
      - 'Toggly.FeatureManagement.Blazor/**'
      - '.github/workflows/analysis-dotnet.yml'
      - '.github/package-registry/**'
      - '.github/workflows/sdk-dotnet-release.yml'
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.razor'
      - '**/wwwroot/*.js'
      - '**/*.runsettings'
      - '**/Directory.Build.props'
      - '**/.editorconfig'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.NET/**'
      - 'Toggly.CLI/**'
      - 'Toggly.FeatureManagement.Blazor/**'
      - '.github/workflows/analysis-dotnet.yml'
      - '.github/package-registry/**'
      - '.github/workflows/sdk-dotnet-release.yml'
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.razor'
      - '**/wwwroot/*.js'
      - '**/*.runsettings'
      - '**/Directory.Build.props'
      - '**/.editorconfig'
  workflow_dispatch:

jobs:
  analyze:
    name: Build, Test & Analyze
    runs-on: ubuntu-latest
    needs: [dependency-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Setup Node.js for shared package governance
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Validate all declared .NET sources
        id: dotnet_inventory
        run: |
          node .github/package-registry/dotnet-ci.mjs validate
          echo "sources=$(node .github/package-registry/dotnet-ci.mjs source-inclusions)" >> "$GITHUB_OUTPUT"

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4
        with:
          versionSpec: '6.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install tools
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Restore solution dependencies
        run: dotnet restore Toggly.FeatureManagement.NET/Toggly.FeatureManagement.sln

      - name: Restore additional test dependencies
        run: |
          dotnet restore Toggly.FeatureManagement.NET/Toggly.FeatureManagement.Web.Tests/Toggly.FeatureManagement.Web.Tests.csproj
          dotnet restore Toggly.FeatureManagement.NET/Toggly.FeatureManagement.Storage.DistributedCache.Tests/Toggly.FeatureManagement.Storage.DistributedCache.Tests.csproj
          dotnet restore Toggly.FeatureManagement.NET/Toggly.FeatureManagement.Hangfire.Tests/Toggly.FeatureManagement.Hangfire.Tests.csproj
          dotnet restore Toggly.FeatureManagement.NET/Toggly.FeatureManagement.NSwag.Tests/Toggly.FeatureManagement.NSwag.Tests.csproj
          dotnet restore Toggly.FeatureManagement.NET/Toggly.Storage.Dapper.Tests/Toggly.Storage.Dapper.Tests.csproj
          dotnet restore Toggly.FeatureManagement.NET/Toggly.Storage.EntityFramework.Tests/Toggly.Storage.EntityFramework.Tests.csproj
          dotnet restore Toggly.FeatureManagement.NET/Toggly.Storage.MongoDB.Tests/Toggly.Storage.MongoDB.Tests.csproj
          dotnet restore Toggly.FeatureManagement.NET/Toggly.FeatureManagement.Storage.RavenDB.Tests/Toggly.FeatureManagement.Storage.RavenDB.Tests.csproj
          dotnet restore Toggly.FeatureManagement.NET/Toggly.Metrics.SystemMetrics.Tests/Toggly.Metrics.SystemMetrics.Tests.csproj
        continue-on-error: true

      # ── SonarCloud ──────────────────────────────────────────────────────────

      - name: Begin SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"toggly-sdks-dotnet" \
            "/n:Toggly SDKs - .NET" \
            /o:"ops-ai" \
            /v:"${{ steps.gitversion.outputs.semVer }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.projectBaseDir="${GITHUB_WORKSPACE}" \
            /d:sonar.inclusions="${{ steps.dotnet_inventory.outputs.sources }}" \
            /d:sonar.javascript.lcov.reportPaths="${GITHUB_WORKSPACE}/Toggly.FeatureManagement.*/coverage/lcov.info" \
            /d:sonar.cs.opencover.reportsPaths="${GITHUB_WORKSPACE}/TestResults/**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="${GITHUB_WORKSPACE}/TestResults/**/*.trx" \
            /d:sonar.coverageReportPaths="${GITHUB_WORKSPACE}/coverage-report/SonarQube.xml" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/examples/**,**/Benchmarks/**" \
            /d:sonar.coverage.exclusions="**/*Tests*.cs,**/examples/**,**/Benchmarks/**" \
            /d:sonar.test.inclusions="**/*Tests*.cs"

      - name: Build solution
        run: dotnet build Toggly.FeatureManagement.NET/Toggly.FeatureManagement.sln --no-restore -c Release

      - name: Build additional test projects
        run: |
          dotnet build Toggly.FeatureManagement.NET/Toggly.FeatureManagement.Web.Tests/Toggly.FeatureManagement.Web.Tests.csproj -c Release
          dotnet build Toggly.FeatureManagement.NET/Toggly.FeatureManagement.Storage.DistributedCache.Tests/Toggly.FeatureManagement.Storage.DistributedCache.Tests.csproj -c Release
          dotnet build Toggly.FeatureManagement.NET/Toggly.FeatureManagement.Hangfire.Tests/Toggly.FeatureManagement.Hangfire.Tests.csproj -c Release
          dotnet build Toggly.FeatureManagement.NET/Toggly.FeatureManagement.NSwag.Tests/Toggly.FeatureManagement.NSwag.Tests.csproj -c Release
          dotnet build Toggly.FeatureManagement.NET/Toggly.Storage.Dapper.Tests/Toggly.Storage.Dapper.Tests.csproj -c Release
          dotnet build Toggly.FeatureManagement.NET/Toggly.Storage.EntityFramework.Tests/Toggly.Storage.EntityFramework.Tests.csproj -c Release
          dotnet build Toggly.FeatureManagement.NET/Toggly.Storage.MongoDB.Tests/Toggly.Storage.MongoDB.Tests.csproj -c Release
          dotnet build Toggly.FeatureManagement.NET/Toggly.FeatureManagement.Storage.RavenDB.Tests/Toggly.FeatureManagement.Storage.RavenDB.Tests.csproj -c Release
          dotnet build Toggly.FeatureManagement.NET/Toggly.Metrics.SystemMetrics.Tests/Toggly.Metrics.SystemMetrics.Tests.csproj -c Release

      - name: Run core tests
        run: |
          dotnet test Toggly.FeatureManagement.NET/Toggly.FeatureManagement.Tests/Toggly.FeatureManagement.Tests.csproj \
            --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=core-test-results.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Run Web tests
        run: |
          dotnet test Toggly.FeatureManagement.NET/Toggly.FeatureManagement.Web.Tests/Toggly.FeatureManagement.Web.Tests.csproj \
            --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=web-test-results.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Run DistributedCache storage tests
        run: |
          dotnet test Toggly.FeatureManagement.NET/Toggly.FeatureManagement.Storage.DistributedCache.Tests/Toggly.FeatureManagement.Storage.DistributedCache.Tests.csproj \
            --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=distributedcache-test-results.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Run Hangfire tests
        run: |
          dotnet test Toggly.FeatureManagement.NET/Toggly.FeatureManagement.Hangfire.Tests/Toggly.FeatureManagement.Hangfire.Tests.csproj \
            --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=hangfire-test-results.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Run NSwag tests
        run: |
          dotnet test Toggly.FeatureManagement.NET/Toggly.FeatureManagement.NSwag.Tests/Toggly.FeatureManagement.NSwag.Tests.csproj \
            --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=nswag-test-results.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Run Dapper storage tests
        run: |
          dotnet test Toggly.FeatureManagement.NET/Toggly.Storage.Dapper.Tests/Toggly.Storage.Dapper.Tests.csproj \
            --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=dapper-test-results.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Run EntityFramework storage tests
        run: |
          dotnet test Toggly.FeatureManagement.NET/Toggly.Storage.EntityFramework.Tests/Toggly.Storage.EntityFramework.Tests.csproj \
            --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=ef-test-results.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Run MongoDB storage tests
        run: |
          dotnet test Toggly.FeatureManagement.NET/Toggly.Storage.MongoDB.Tests/Toggly.Storage.MongoDB.Tests.csproj \
            --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=mongodb-test-results.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Run RavenDB storage tests
        run: |
          dotnet test Toggly.FeatureManagement.NET/Toggly.FeatureManagement.Storage.RavenDB.Tests/Toggly.FeatureManagement.Storage.RavenDB.Tests.csproj \
            --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=ravendb-test-results.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Run SystemMetrics tests
        run: |
          dotnet test Toggly.FeatureManagement.NET/Toggly.Metrics.SystemMetrics.Tests/Toggly.Metrics.SystemMetrics.Tests.csproj \
            --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=systemmetrics-test-results.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Test every additional .NET family and enforce coverage
        run: node .github/package-registry/dotnet-ci.mjs test-families

      - name: Merge coverage reports
        run: |
          reportgenerator \
            -reports:"**/TestResults/**/coverage.opencover.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"SonarQube;Cobertura" \
            -assemblyfilters:"-*Tests*"
        continue-on-error: true

      - name: End SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      # ── SonarQube Server ────────────────────────────────────────────────────

      - name: Download Dependency Check report (for SonarQube Server)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dependency-check-report-dotnet
          path: dependency-check-reports/
        continue-on-error: true

      - name: Begin SonarQube Server Scan
        env:
          SONAR_SERVER_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          for attempt in 1 2 3; do
            if dotnet sonarscanner begin \
              /k:"toggly-sdks-dotnet" \
              "/n:Toggly SDKs - .NET" \
              /v:"${{ steps.gitversion.outputs.semVer }}" \
              /d:sonar.host.url="${SONAR_HOST_URL}" \
              /d:sonar.token="${SONAR_SERVER_TOKEN}" \
              /d:sonar.projectBaseDir="${GITHUB_WORKSPACE}" \
            /d:sonar.inclusions="${{ steps.dotnet_inventory.outputs.sources }}" \
              /d:sonar.javascript.lcov.reportPaths="${GITHUB_WORKSPACE}/Toggly.FeatureManagement.*/coverage/lcov.info" \
              /d:sonar.cs.opencover.reportsPaths="${GITHUB_WORKSPACE}/TestResults/**/coverage.opencover.xml" \
              /d:sonar.cs.vstest.reportsPaths="${GITHUB_WORKSPACE}/TestResults/**/*.trx" \
              /d:sonar.coverageReportPaths="${GITHUB_WORKSPACE}/coverage-report/SonarQube.xml" \
              /d:sonar.dependencyCheck.reportPath="${GITHUB_WORKSPACE}/dependency-check-reports/dependency-check-report.xml" \
              /d:sonar.exclusions="**/bin/**,**/obj/**,**/examples/**,**/Benchmarks/**" \
              /d:sonar.coverage.exclusions="**/*Tests*.cs,**/examples/**,**/Benchmarks/**" \
              /d:sonar.test.inclusions="**/*Tests*.cs"; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "SonarQube Server scan initialization failed after 3 attempts"
              exit 1
            fi

            sleep_seconds=$((attempt * 10))
            echo "SonarQube Server scan initialization failed (attempt ${attempt}), retrying in ${sleep_seconds}s..."
            sleep "${sleep_seconds}"
          done

      - name: Build solution (SonarQube Server)
        run: dotnet build Toggly.FeatureManagement.NET/Toggly.FeatureManagement.sln --no-restore -c Release

      - name: Build every additional .NET family inside the server scanner
        run: node .github/package-registry/dotnet-ci.mjs build-families

      - name: End SonarQube Server Scan
        env:
          SONAR_SERVER_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_SERVER_TOKEN}"

      # ── Artifacts ───────────────────────────────────────────────────────────

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-results
          path: TestResults/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-reports
          path: |
            **/TestResults/**/coverage.opencover.xml
            coverage-report/
            Toggly.FeatureManagement.*/coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Test Summary
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        if: always()
        run: |
          echo "## .NET SDK Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.gitversion.outputs.semVer }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages Analyzed" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.FeatureManagement (Core SDK)" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.FeatureManagement.Web" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.FeatureManagement.Hangfire" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.FeatureManagement.HealthChecks" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.FeatureManagement.NSwag" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.FeatureManagement.Storage.DistributedCache" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.FeatureManagement.Storage.RavenDB" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.Storage.Dapper" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.Storage.EntityFramework" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.Storage.MongoDB" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.Metrics.SystemMetrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "SonarCloud: https://sonarcloud.io/project/overview?id=toggly-sdks-dotnet" >> $GITHUB_STEP_SUMMARY
          echo "SonarQube Server: ${SONAR_HOST_URL}/dashboard?id=toggly-sdks-dotnet" >> $GITHUB_STEP_SUMMARY

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache OWASP Dependency Check database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /home/runner/OWASP-Dependency-Check/data/
          key: dependency-check-db-${{ runner.os }}-v6
          restore-keys: |
            dependency-check-db-${{ runner.os }}-

      - name: Setup Node.js for shared package governance
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Select all declared .NET dependency scan roots
        id: dotnet_roots
        run: echo "args=$(node .github/package-registry/dotnet-ci.mjs scan-args)" >> "$GITHUB_OUTPUT"

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c # main
        with:
          project: 'toggly-sdks-dotnet'
          path: 'Toggly.FeatureManagement.NET'
          format: 'ALL'
          args: >-
            ${{ steps.dotnet_roots.outputs.args }}
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableExperimental
            --disableRubygems
            --disableBundleAudit
            --disableNodeJS
            --disableNodeAudit
            --disablePyPkg
            --disablePyDist
        continue-on-error: true

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: dependency-check-report-dotnet
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
        continue-on-error: true

  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore CLI dependencies
        run: dotnet restore Toggly.CLI/Toggly.CLI.csproj

      - name: Build CLI
        run: dotnet build Toggly.CLI/Toggly.CLI.csproj -c Release

      - name: CLI Build Summary
        run: echo "✅ CLI build completed successfully" >> $GITHUB_STEP_SUMMARY

  pack-packages:
    name: Pack NuGet packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Setup Node.js for shared package governance
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Pack all declared NuGet projects
        run: node .github/package-registry/dotnet-ci.mjs pack

      - name: Verify packed metadata for every .NET family
        env:
          NUGET_ALL_PACK_DIR: nuget-analysis-pack
        run: node --test .github/package-registry/dotnet-inventory.test.mjs

      - name: Upload NuGet packages and symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget-packages
          path: nuget-analysis-pack/*.*nupkg
          if-no-files-found: error
          retention-days: 7

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore smoke tests
        run: dotnet restore Toggly.FeatureManagement.NET/Toggly.FeatureManagement.SmokeTests/Toggly.FeatureManagement.SmokeTests.csproj

      - name: Run smoke tests
        timeout-minutes: 3
        env:
          TOGGLY_SMOKE_APP_KEY_BACKEND: ${{ secrets.TOGGLY_SMOKE_APP_KEY_BACKEND }}
        run: dotnet test Toggly.FeatureManagement.NET/Toggly.FeatureManagement.SmokeTests/Toggly.FeatureManagement.SmokeTests.csproj -c Release --logger "trx;LogFileName=smoke-test-results.trx" --blame-hang-timeout 90s --blame-hang-dump-type none

  blazor-runtime:
    name: Blazor .NET ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - sdk: '8.0.x'
            framework: net8.0
          - sdk: '10.0.x'
            framework: net10.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            ${{ matrix.sdk }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: dotnet test Toggly.FeatureManagement.Blazor/tests/Toggly.FeatureManagement.Blazor.Tests -c Release -p:TestFramework=${{ matrix.framework }} --collect:"XPlat Code Coverage" --settings Toggly.FeatureManagement.Blazor/coverage.runsettings --results-directory TestResults/blazor
      - run: python3 Toggly.FeatureManagement.Blazor/check-coverage.py TestResults/blazor
      - run: bash Toggly.FeatureManagement.Blazor/test-browser.sh
      - run: |
          dotnet pack Toggly.FeatureManagement.Blazor/src/Toggly.FeatureManagement.Blazor -c Release -p:ContinuousIntegrationBuild=true -o blazor-pack
          dotnet pack Toggly.FeatureManagement.Blazor/src/Toggly.FeatureManagement.Blazor.Server -c Release -p:ContinuousIntegrationBuild=true -o blazor-pack
      - run: NUGET_BLAZOR_PACK_DIR=blazor-pack node --test .github/package-registry/verify-nuget-blazor.test.mjs
      - name: Compile packed artifact consumer
        run: |
          dotnet restore Toggly.FeatureManagement.Blazor/examples/BlazorHost --source "${GITHUB_WORKSPACE}/blazor-pack" --source https://api.nuget.org/v3/index.json
