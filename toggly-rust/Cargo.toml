[workspace]
resolver = "2"
members = [
    "toggly",
    "toggly-macros",
    "toggly-actix",
    "toggly-axum",
    "toggly-rocket",
]

[workspace.package]
version = "0.3.1"
authors = ["Toggly <support@toggly.io>"]
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ops-ai/Toggly.FeatureManagement"
homepage = "https://toggly.io"
documentation = "https://docs.toggly.io/sdks/rust"
keywords = ["toggly", "feature-flags", "feature-toggles", "ab-testing", "experiments"]
categories = ["web-programming", "development-tools"]

[workspace.dependencies]
# Pinned transitive dep: time >=0.3.46 uses edition 2024 and requires Rust 1.88+
time = ">=0.3.7, <0.3.46"

# Core dependencies
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
thiserror = "1.0"
async-trait = "0.1"
parking_lot = "0.12"
dashmap = "5.5"

# Logging/Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Metrics
metrics = "0.22"
prometheus = "0.13"

# Framework integrations
actix-web = ">=4.4, <4.13"
axum = "0.7"
rocket = "0.5"

# Testing
mockito = "1.2"
tokio-test = "0.4"
wiremock = "0.5"
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# Workspace crates
toggly = { version = "0.3.0", path = "toggly" }
toggly-macros = { version = "0.2.0", path = "toggly-macros" }
