[package]
name = "toggly"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "High-performance Rust SDK for Toggly feature flags"
readme = "../README.md"

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]
# Local Prometheus / `metrics` crate integration — not Toggly gRPC export.
metrics = ["dep:metrics", "dep:prometheus"]
# Batched Usage.SendStats + Metrics.SendMetrics via tonic/prost.
# Also gates build-dep tonic-build so feature-off stays free of prost tooling.
telemetry = [
    "dep:tonic",
    "dep:prost",
    "dep:prost-types",
    "dep:tower",
    "dep:tonic-build",
]

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
tracing = { workspace = true }

# Optional local Prometheus metrics
metrics = { workspace = true, optional = true }
prometheus = { workspace = true, optional = true }

# Optional Toggly usage / business-metrics gRPC export
tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }
tower = { workspace = true, optional = true }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Hash functions for percentage rollouts + signed definitions verify
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.21"
p256 = { version = "0.13", features = ["ecdsa"] }
ecdsa = { version = "0.16", features = ["verifying", "arithmetic"] }
rand = "0.8"
regex = "1.10"
hex = "0.4"

# WebSocket live updates
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
url = "2.5"

[build-dependencies]
tonic-build = { version = "0.12", optional = true }

[dev-dependencies]
tokio-test = { workspace = true }
wiremock = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
