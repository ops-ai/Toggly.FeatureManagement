  # Summary job
  summary:
    if: always()
    needs: [publish-core, publish-react-native, publish-storage-async, publish-storage-mmkv]
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## React Native SDK Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| @ops-ai/react-native-toggly-core | ${{ needs.publish-core.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| @ops-ai/react-native-toggly | ${{ needs.publish-react-native.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| @ops-ai/react-native-toggly-storage-async | ${{ needs.publish-storage-async.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| @ops-ai/react-native-toggly-storage-mmkv | ${{ needs.publish-storage-mmkv.result }} |" >> $GITHUB_STEP_SUMMARY
