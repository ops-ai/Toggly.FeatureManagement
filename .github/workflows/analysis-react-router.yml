name: React Router SDK - Tests & Analysis

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.ReactRouter/**'
      - 'toggly-eval/**'
      - 'toggly-segments/**'
      - 'toggly-signed-defs/**'
      - 'toggly-hooks-types/**'
      - 'toggly-local-gates/**'
      - '.github/workflows/analysis-react-router.yml'
      - '.github/workflows/analysis-react-router.test.mjs'
      - '.github/actions/verify-required-jobs/**'
      - '.github/actions/build-shared-js-deps/**'
      - '.github/actions/upload-shared-js-deps/**'
      - '.github/actions/download-shared-js-deps/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      run_reporting:
        description: 'When false, skip Sonar and OWASP reporting jobs'
        type: boolean
        default: true

env:
  SDK_ROOT: Toggly.FeatureManagement.ReactRouter
  PKG: react-router-toggly

permissions:
  contents: read
  security-events: write

jobs:
  build-shared-js-deps:
    name: Build shared JS deps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build shared packages
        uses: ./.github/actions/build-shared-js-deps
        with:
          packages: signed-defs,eval,hooks-types,local-gates,segments
          node-version: '20.x'

      - name: Upload shared package dist artifacts
        uses: ./.github/actions/upload-shared-js-deps

  build-and-test:
    name: Test (Node ${{ matrix.node-version }})
    needs: [build-shared-js-deps]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ env.SDK_ROOT }}/${{ env.PKG }}/package-lock.json

      - name: Restore shared JS deps
        uses: ./.github/actions/download-shared-js-deps

      - name: Verify React Router analysis workflow contract
        if: ${{ matrix.node-version == '20.x' }}
        run: node --test .github/workflows/analysis-react-router.test.mjs

      - name: Install dependencies with local client-telemetry
        uses: ./.github/actions/install-local-client-telemetry
        with:
          package-dir: ${{ env.SDK_ROOT }}/${{ env.PKG }}

      - name: Type check
        working-directory: ${{ env.SDK_ROOT }}/${{ env.PKG }}
        run: npm run typecheck

      - name: Build
        working-directory: ${{ env.SDK_ROOT }}/${{ env.PKG }}
        run: npm run build

      - name: Run tests with coverage
        working-directory: ${{ env.SDK_ROOT }}/${{ env.PKG }}
        run: npm run test:coverage

      - name: Upload coverage (Node 20 only)
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-react-router
          path: ${{ env.SDK_ROOT }}/${{ env.PKG }}/coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  packed-host:
    name: Packed ${{ matrix.host }} (Node ${{ matrix.node-version }})
    needs: [build-shared-js-deps]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: router7-react18
            node-version: '20'
          - host: router8-react19
            node-version: '22'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ env.SDK_ROOT }}/${{ env.PKG }}/package-lock.json

      - name: Restore shared JS deps
        uses: ./.github/actions/download-shared-js-deps

      - name: Install dependencies with local client-telemetry
        uses: ./.github/actions/install-local-client-telemetry
        with:
          package-dir: ${{ env.SDK_ROOT }}/${{ env.PKG }}

      - name: Verify packed host
        working-directory: ${{ env.SDK_ROOT }}/${{ env.PKG }}
        env:
          HOST: ${{ matrix.host }}
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:hosts

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [build-shared-js-deps, build-and-test, packed-host, dependency-check]
    if: ${{ always() && toJSON(inputs.run_reporting) != 'false' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'

      - name: Restore shared JS deps
        if: needs.build-shared-js-deps.result == 'success'
        uses: ./.github/actions/download-shared-js-deps

      - name: Install dependencies for TypeScript analysis
        working-directory: ${{ env.SDK_ROOT }}/${{ env.PKG }}
        run: npm ci || npm install
        continue-on-error: true

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          name: coverage-react-router
          path: coverage-artifacts/
        continue-on-error: true

      - name: Organize coverage files
        run: |
          mkdir -p coverage
          if [ -f "coverage-artifacts/lcov.info" ]; then
            sed "s|SF:|SF:${{ env.SDK_ROOT }}/${{ env.PKG }}/|g" \
              coverage-artifacts/lcov.info > coverage/all-lcov.info
          fi
          ls -la coverage/ || true
        continue-on-error: true

      - name: Resolve Sonar project version
        id: sonar_version
        uses: ./.github/actions/sonar-project-version
        with:
          manifest: Toggly.FeatureManagement.ReactRouter/react-router-toggly/package.json
          suffix: ${{ vars.SONAR_PROJECT_VERSION_SUFFIX }}

      - name: Validate SonarCloud credentials
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "${SONAR_TOKEN}" || { echo "SonarCloud token is required"; exit 1; }

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-react-router
            -Dsonar.projectVersion=${{ steps.sonar_version.outputs.version }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.organization=ops-ai
            -Dsonar.projectName="Toggly SDKs - React Router"
            -Dsonar.sources=${{ env.SDK_ROOT }}/${{ env.PKG }}/src
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/*.test.mjs,**/tests/**/*.cjs,**/*.config.js,**/*.config.ts,**/fixtures/**
            -Dsonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/*.test.mjs,**/tests/**/*.cjs,**/*.config.js,**/*.config.ts,**/fixtures/**
            -Dsonar.javascript.lcov.reportPaths=coverage/all-lcov.info
            -Dsonar.tests=${{ env.SDK_ROOT }}/${{ env.PKG }}/tests
            -Dsonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/*.test.mjs

      - name: Download Dependency Check report
        if: ${{ !cancelled() && (success() || failure()) }}
        uses: actions/download-artifact@v8
        with:
          name: dependency-check-report-react-router
          path: dependency-check-reports/
        continue-on-error: true

      - name: Validate SonarQube Server credentials
        id: validate-sonarqube-server-credentials
        if: ${{ !cancelled() && (success() || failure()) }}
        env:
          SONAR_SERVER_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: test -n "${SONAR_SERVER_TOKEN}" && test -n "${SONAR_HOST_URL}" || { echo "SonarQube Server credentials are required"; exit 1; }

      - name: SonarQube Server Scan
        if: ${{ !cancelled() && (success() || failure()) && steps.validate-sonarqube-server-credentials.outcome == 'success' }}
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-react-router
            -Dsonar.projectVersion=${{ steps.sonar_version.outputs.version }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.projectName="Toggly SDKs - React Router"
            -Dsonar.sources=${{ env.SDK_ROOT }}/${{ env.PKG }}/src
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/*.test.mjs,**/tests/**/*.cjs,**/*.config.js,**/*.config.ts,**/fixtures/**
            -Dsonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/*.test.mjs,**/tests/**/*.cjs,**/*.config.js,**/*.config.ts,**/fixtures/**
            -Dsonar.javascript.lcov.reportPaths=coverage/all-lcov.info
            -Dsonar.tests=${{ env.SDK_ROOT }}/${{ env.PKG }}/tests
            -Dsonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/*.test.mjs
            -Dsonar.dependencyCheck.reportPath=dependency-check-reports/dependency-check-report.xml

  dependency-check:
    name: OWASP Dependency Check
    if: ${{ toJSON(inputs.run_reporting) != 'false' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache OWASP Dependency Check database
        uses: actions/cache@v6
        with:
          path: /home/runner/OWASP-Dependency-Check/data/
          key: dependency-check-db-${{ runner.os }}-v6
          restore-keys: |
            dependency-check-db-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'toggly-sdks-react-router'
          path: ${{ env.SDK_ROOT }}
          format: 'ALL'
          args: >-
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableExperimental
            --disableAssembly
            --disableRubygems
            --disableBundleAudit
            --disablePyPkg
            --disablePyDist
            --disableNodeAudit
            --exclude '**/host-fixtures/**'
            --exclude '**/node_modules/**'
            --exclude '**/packaging/**'

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report-react-router
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
        continue-on-error: true

  summary:
    name: Analysis Summary
    runs-on: ubuntu-latest
    needs: [build-shared-js-deps, build-and-test, packed-host, sonar, dependency-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify required jobs passed
        uses: ./.github/actions/verify-required-jobs
        with:
          needs-json: ${{ toJSON(needs) }}
          required-jobs: build-shared-js-deps,build-and-test,packed-host,sonar,dependency-check
          allow-skipped: ${{ (toJSON(inputs.run_reporting) == 'false' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'sonar,dependency-check' || 'none' }}

      - name: Generate summary
        if: ${{ always() }}
        env:
          SHARED_DEPS_RESULT: ${{ needs.build-shared-js-deps.result }}
          BUILD_RESULT: ${{ needs.build-and-test.result }}
          PACKED_HOST_RESULT: ${{ needs.packed-host.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          DEPENDENCY_CHECK_RESULT: ${{ needs.dependency-check.result }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
          RUN_REPORTING: ${{ toJSON(inputs.run_reporting) }}
        run: |
          {
            echo "## React Router SDK Analysis Summary"
            echo ""
            echo "Shared JS dependencies: ${SHARED_DEPS_RESULT}"
            echo "Build and tests: ${BUILD_RESULT}"
            echo "Packed hosts: ${PACKED_HOST_RESULT}"
            echo "Sonar: ${SONAR_RESULT}"
            echo "OWASP: ${DEPENDENCY_CHECK_RESULT}"
            if [ "${RUN_REPORTING}" = "false" ]; then
              echo "Reporting was explicitly disabled with run_reporting=false; authenticated Sonar gates were not checked."
            elif [ "${FORK_PR}" = "true" ]; then
              echo "Credentialed SonarCloud and SonarQube Server scans were skipped for this fork PR; authenticated Sonar gates were not checked. OWASP reporting was also skipped."
            fi
            echo ""
            echo "### Package Analyzed"
            echo "- @ops-ai/react-router-toggly"
            echo ""
            echo "### Node.js Versions Tested"
            echo "- 18.x, 20.x, 22.x"
            echo ""
            echo "### Packed Hosts"
            echo "- router7-react18 (Node 20)"
            echo "- router8-react19 (Node 22)"
          } >> "$GITHUB_STEP_SUMMARY"
