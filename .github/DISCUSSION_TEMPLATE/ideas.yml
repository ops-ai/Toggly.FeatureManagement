title: "[Idea] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Share a feature idea or improvement for Toggly Feature Management.
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: Who benefits and what problem does it solve?
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Possible approach (optional)
      description: Any thoughts on how this could work?
