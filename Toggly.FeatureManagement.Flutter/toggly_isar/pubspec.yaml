name: feature_flags_toggly_isar
description: Isar database persistence backend for the Toggly Flutter SDK (feature_flags_toggly), enabling offline feature flag, variant, and JWKS caching.
version: 0.5.0
homepage: https://docs.toggly.io/
repository: https://github.com/ops-ai/Toggly.FeatureManagement

environment:
  sdk: '>=2.18.2 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  feature_flags_toggly: '>=1.9.0 <2.0.0'
  # Community-maintained fork of Isar v3 (the original isar package is no longer
  # maintained). API-compatible; import is package:isar_community/isar.dart.
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: '>=2.0.0 <3.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=2.0.0 <7.0.0"
  lints: ">=2.0.1 <7.0.0"
  build_runner: '>=2.3.0 <3.0.0'
  isar_community_generator: ^3.3.2

flutter:
