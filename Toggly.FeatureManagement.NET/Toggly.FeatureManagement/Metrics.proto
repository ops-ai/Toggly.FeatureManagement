syntax = "proto3";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Toggly.Web";

package Metrics;

service Metrics {
    // Accepts a business metric
    rpc SendMetrics(MetricStat) returns (MetricResult);
}

// The request message containing the metric.
message MetricStat {
    string appKey = 1;
    string environment = 2;
    google.protobuf.Timestamp time = 3;
    repeated MetricStatMessage stats = 4;
    repeated MetricCounterMessage counters = 5;
    repeated MetricObservationMessage observations = 6;
	optional string instanceName = 7;
}

message MetricStatMessage {
	string metric = 1;
	int32 enabledCount = 2 [deprecated = true]; //total count for metric if feature is not specified, otherwise metric count when feature is enabled
	int32 disabledCount = 3 [deprecated = true]; //optional metric count when feature is disabled
	optional string feature = 4; //optional feature referenced for subcount
	double value = 5 [deprecated = true]; //value for metric if feature is not specified, otherwise value when feature is enabled
	optional double valueDisabled = 6 [deprecated = true]; //value when feature is disabled
	
	// Multi-variate support - Key: variant name (e.g., "enabled", "control", "variant_a"), Value: metric value
	map<string, double> variantValues = 7;
}

message MetricCounterMessage {
	string metric = 1;
	int32 enabledCount = 2 [deprecated = true]; //total count for metric if feature is not specified, otherwise metric count when feature is enabled
	int32 disabledCount = 3 [deprecated = true]; //optional metric count when feature is disabled
	optional string feature = 4; //optional feature referenced for subcount
	double value = 5 [deprecated = true]; //value for metric if feature is not specified, otherwise value when feature is enabled
	optional double valueDisabled = 6 [deprecated = true]; //value when feature is disabled
	
	// Multi-variate support - Key: variant name (e.g., "enabled", "control", "variant_a"), Value: metric value
	map<string, double> variantValues = 7;
}

message MetricObservationMessage {
	google.protobuf.Timestamp time = 1;
	string metric = 2;
	int32 enabledCount = 3 [deprecated = true]; //total count for metric if feature is not specified, otherwise metric count when feature is enabled
	int32 disabledCount = 4 [deprecated = true]; //optional metric count when feature is disabled
	optional string feature = 5; //optional feature referenced for subcount
	double value = 6 [deprecated = true]; //value for metric if feature is not specified, otherwise value when feature is enabled
	optional double valueDisabled = 7 [deprecated = true]; //value when feature is disabled
	
	// Multi-variate support - Key: variant name (e.g., "enabled", "control", "variant_a"), Value: metric value
	map<string, double> variantValues = 8;
}

message MetricResult {
	int32 count = 1;
}