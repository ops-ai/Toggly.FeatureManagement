name: Node.js Server SDKs - Build & Publish

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type for all packages'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      packages:
        description: 'Packages to release (comma-separated: core,express,fastify,hono,koa or "all")'
        required: false
        default: 'all'
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set package matrix
        id: set-matrix
        run: |
          PACKAGES="${{ github.event.inputs.packages || 'all' }}"

          if [ "$PACKAGES" == "all" ]; then
            MATRIX='["toggly-node-core","toggly-express","toggly-fastify","toggly-hono","toggly-koa"]'
          else
            # Convert comma-separated to JSON array, adding toggly- prefix
            MATRIX=$(echo "$PACKAGES" | sed 's/core/toggly-node-core/g; s/express/toggly-express/g; s/fastify/toggly-fastify/g; s/hono/toggly-hono/g; s/koa/toggly-koa/g' | tr ',' '\n' | jq -R . | jq -s .)
          fi

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Building packages: $MATRIX"

  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18.x', '20.x', '22.x']
    defaults:
      run:
        working-directory: Toggly.FeatureManagement.Node

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build all packages
        run: pnpm -r build

      - name: Run all tests
        run: pnpm -r test

  publish:
    runs-on: ubuntu-latest
    needs: [prepare, build-and-test]
    environment: npm-publish
    strategy:
      fail-fast: false
      max-parallel: 1  # Publish sequentially to handle dependencies
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        working-directory: Toggly.FeatureManagement.Node

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}
          fetch-depth: 2  # Need previous commit for version check

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build all packages
        run: pnpm -r build

      - name: Bump version
        id: version
        working-directory: Toggly.FeatureManagement.Node/${{ matrix.package }}
        run: |
          BUMP_TYPE="${{ github.event.inputs.bump_type || 'patch' }}"
          NEW_VERSION=$(npm version $BUMP_TYPE --no-git-tag-version)
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumped ${{ matrix.package }} to version $NEW_VERSION"

      - name: Publish to npm
        working-directory: Toggly.FeatureManagement.Node/${{ matrix.package }}
        run: npm publish --provenance --access public || npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "${{ steps.import_gpg.outputs.name }}"
          git config user.email "${{ steps.import_gpg.outputs.email }}"

          git add Toggly.FeatureManagement.Node/${{ matrix.package }}/package.json

          BUMP_TYPE="${{ github.event.inputs.bump_type || 'patch' }}"
          git commit -S -m "Bumped ${{ matrix.package }} to ${{ steps.version.outputs.new_version }} ($BUMP_TYPE) [skip ci]"

          MAX_RETRIES=5
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            git fetch origin develop
            if ! git rebase origin/develop; then
              git rebase --abort 2>/dev/null || true
              sleep 3
              RETRY_COUNT=$((RETRY_COUNT + 1))
              continue
            fi

            if git push origin develop; then
              echo "Successfully pushed version bump for ${{ matrix.package }}"
              exit 0
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Push failed, attempt $RETRY_COUNT of $MAX_RETRIES"
            sleep 3
          done

          echo "Failed to push after $MAX_RETRIES attempts"
          exit 1

  summary:
    runs-on: ubuntu-latest
    needs: [prepare, publish]
    if: always()
    steps:
      - name: Create summary
        run: |
          echo "## Node.js Server SDK Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Released Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          PACKAGES='${{ needs.prepare.outputs.matrix }}'
          echo "$PACKAGES" | jq -r '.[]' | while read pkg; do
            echo "- @ops-ai/$pkg" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Bump type: ${{ github.event.inputs.bump_type || 'patch' }}" >> $GITHUB_STEP_SUMMARY
