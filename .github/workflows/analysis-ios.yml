name: iOS SDK - Analysis

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.iOS/**'
      - 'Package.swift'
      - '.github/scripts/verify-swift-distribution*'
      - '.github/workflows/analysis-ios.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      run_reporting:
        description: 'When false, skip Sonar and OWASP reporting jobs'
        type: boolean
        default: true

env:
  SDK_ROOT: Toggly.FeatureManagement.iOS

permissions:
  contents: read
  security-events: write

jobs:
  build-and-test:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        xcode: ['16.1', '16.2', '16.4']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show Swift version
        run: swift --version

      - name: Verify root Swift distribution
        timeout-minutes: 10
        run: |
          python3 .github/scripts/verify-swift-distribution.test.py
          python3 .github/scripts/verify-swift-distribution.py --repository "https://github.com/${{ github.repository }}.git" --revision "$(git rev-parse HEAD)" --consumer-target arm64-apple-ios14.0-simulator --consumer-sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"

      - name: Resolve package dependencies
        working-directory: ${{ env.SDK_ROOT }}
        run: swift package resolve

      - name: Build all packages
        working-directory: ${{ env.SDK_ROOT }}
        run: swift build -v

      - name: Run tests
        working-directory: ${{ env.SDK_ROOT }}
        run: swift test -v

      - name: Provision iOS simulator for coverage
        if: matrix.xcode == '16.4'
        run: |
          runtime="$(xcrun simctl list runtimes -j | python3 -c 'import json, sys; print(next((r["identifier"] for r in json.load(sys.stdin)["runtimes"] if ".SimRuntime.iOS-" in r["identifier"] and r.get("isAvailable")), ""))')"
          if [ -z "$runtime" ]; then
            xcodebuild -downloadPlatform iOS
            runtime="$(xcrun simctl list runtimes -j | python3 -c 'import json, sys; print(next((r["identifier"] for r in json.load(sys.stdin)["runtimes"] if ".SimRuntime.iOS-" in r["identifier"] and r.get("isAvailable")), ""))')"
          fi
          test -n "$runtime"
          device="$(xcrun simctl create 'Toggly Coverage iPhone' 'iPhone 16' "$runtime")"
          echo "IOS_COVERAGE_DEVICE_ID=$device" >> "$GITHUB_ENV"

      - name: Run iOS simulator tests with coverage
        if: matrix.xcode == '16.4'
        working-directory: ${{ env.SDK_ROOT }}
        run: |
          xcodebuild test \
            -scheme Toggly-Package \
            -destination "platform=iOS Simulator,id=$IOS_COVERAGE_DEVICE_ID" \
            -enableCodeCoverage YES \
            -derivedDataPath "$RUNNER_TEMP/ios-derived" \
            -resultBundlePath "$RUNNER_TEMP/ios-coverage.xcresult" \
            -quiet

      - name: Export simulator coverage for all four products
        if: matrix.xcode == '16.4'
        working-directory: ${{ env.SDK_ROOT }}
        run: |
          python3 scripts/xccov-to-sonar.py \
            "$RUNNER_TEMP/ios-coverage.xcresult" \
            coverage.lcov \
            coverage-generic.xml

      - name: Upload coverage to Codecov
        if: matrix.xcode == '16.4'
        uses: codecov/codecov-action@v7
        with:
          file: ${{ env.SDK_ROOT }}/coverage.lcov
          flags: ios-sdk
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: matrix.xcode == '16.4'
        uses: actions/upload-artifact@v7
        with:
          name: ios-coverage
          path: |
            ${{ env.SDK_ROOT }}/coverage.lcov
            ${{ env.SDK_ROOT }}/coverage-generic.xml
          retention-days: 7
          if-no-files-found: error

  lint:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        working-directory: ${{ env.SDK_ROOT }}
        run: swiftlint lint --reporter github-actions-logging || true

      - name: Generate SwiftLint report for SonarQube
        working-directory: ${{ env.SDK_ROOT }}
        run: |
          swiftlint lint 2>/dev/null \
            | sed "s|${GITHUB_WORKSPACE}/||g" \
            > swiftlint-report.txt || true

      - name: Upload SwiftLint report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-swiftlint
          path: ${{ env.SDK_ROOT }}/swiftlint-report.txt
          retention-days: 7
          if-no-files-found: ignore

  smoke-test:
    name: Smoke Test
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Resolve package dependencies
        working-directory: ${{ env.SDK_ROOT }}
        run: swift package resolve

      - name: Run smoke tests
        timeout-minutes: 2
        working-directory: ${{ env.SDK_ROOT }}
        env:
          TOGGLY_SMOKE_APP_KEY_FRONTEND: ${{ secrets.TOGGLY_SMOKE_APP_KEY_FRONTEND }}
        run: swift test -v --filter SmokeTests

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    if: ${{ toJSON(inputs.run_reporting) != 'false' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: 'toggly-sdks-ios'
          path: ${{ env.SDK_ROOT }}
          format: 'XML'
          out: 'dependency-check-reports'
          args: >
            --disableAssembly
            --disableRubygems
            --disableBundleAudit
            --disableNodeJS
            --disableNodeAudit
            --disablePyPkg
            --disablePyDist

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report-ios
          path: dependency-check-reports/
          retention-days: 7
          if-no-files-found: ignore

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [build-and-test, lint, smoke-test, dependency-check]
    if: ${{ always() && toJSON(inputs.run_reporting) != 'false' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: ios-coverage
          path: ${{ env.SDK_ROOT }}/sonar-reports/

      - name: Download SwiftLint report
        uses: actions/download-artifact@v8
        with:
          name: ios-swiftlint
          path: ${{ env.SDK_ROOT }}/sonar-reports/
        continue-on-error: true

      - name: Download Dependency Check report
        uses: actions/download-artifact@v8
        with:
          name: dependency-check-report-ios
          path: ${{ env.SDK_ROOT }}/sonar-reports/
        continue-on-error: true

      - name: Debug coverage report
        working-directory: ${{ env.SDK_ROOT }}
        run: |
          echo "=== Files in sonar-reports ==="
          ls -la sonar-reports/ || true
          echo "=== LCOV SF lines ==="
          grep '^SF:' sonar-reports/coverage.lcov | head -20 || true
        continue-on-error: true

      - name: Resolve Sonar project version
        id: sonar_version
        uses: ./.github/actions/sonar-project-version
        with:
          manifest: Toggly.FeatureManagement.iOS/TogglyCore/Sources/TogglyCore.swift
          suffix: ${{ vars.SONAR_PROJECT_VERSION_SUFFIX }}

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: ${{ env.SDK_ROOT }}
          args: >
            -Dsonar.projectKey=toggly-sdks-ios
            -Dsonar.projectVersion=${{ steps.sonar_version.outputs.version }}
            -Dsonar.organization=ops-ai
            -Dsonar.projectName="Toggly SDKs - iOS"
            -Dsonar.sources=TogglyCore/Sources,TogglySwiftUI/Sources,TogglyUIKit/Sources,TogglyCombine/Sources
            -Dsonar.tests=TogglyCore/Tests,TogglyCombine/Tests,TogglySwiftUI/Tests,TogglyUIKit/Tests
            -Dsonar.exclusions=**/.build/**,**/Package.resolved
            -Dsonar.coverageReportPaths=sonar-reports/coverage-generic.xml
            -Dsonar.swift.swiftlint.report=sonar-reports/swiftlint-report.txt
            -Dsonar.issue.ignore.multicriteria=kidSha1
            -Dsonar.issue.ignore.multicriteria.kidSha1.ruleKey=swift:S4790
            -Dsonar.issue.ignore.multicriteria.kidSha1.resourceKey=**/SignedDefsVerify.swift
            -Dsonar.qualitygate.wait=true

      - name: SonarQube Server Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: ${{ env.SDK_ROOT }}
          args: >
            -Dsonar.projectKey=toggly-sdks-ios
            -Dsonar.projectVersion=${{ steps.sonar_version.outputs.version }}
            -Dsonar.projectName="Toggly SDKs - iOS"
            -Dsonar.language=swift
            -Dsonar.sources=TogglyCore/Sources,TogglySwiftUI/Sources,TogglyUIKit/Sources,TogglyCombine/Sources
            -Dsonar.tests=TogglyCore/Tests,TogglyCombine/Tests,TogglySwiftUI/Tests,TogglyUIKit/Tests
            -Dsonar.exclusions=**/.build/**,**/Package.resolved
            -Dsonar.swift.file.suffixes=swift
            -Dsonar.coverageReportPaths=sonar-reports/coverage-generic.xml
            -Dsonar.swift.swiftlint.report=sonar-reports/swiftlint-report.txt
            -Dsonar.dependencyCheck.reportPath=sonar-reports/dependency-check-report.xml
            -Dsonar.issue.ignore.multicriteria=kidSha1
            -Dsonar.issue.ignore.multicriteria.kidSha1.ruleKey=swift:S4790
            -Dsonar.issue.ignore.multicriteria.kidSha1.resourceKey=**/SignedDefsVerify.swift
            -Dsonar.qualitygate.wait=true

  build-platforms:
    runs-on: macos-15
    strategy:
      matrix:
        destination:
          - 'generic/platform=iOS Simulator'
          - 'platform=macOS'
          - 'generic/platform=tvOS Simulator'
          - 'generic/platform=watchOS Simulator'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Build for platform
        working-directory: ${{ env.SDK_ROOT }}
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme Toggly-Package \
            -destination '${{ matrix.destination }}' \
            -skipPackagePluginValidation \
            | xcpretty

  summary:
    name: Analysis Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, lint, smoke-test, dependency-check, sonar, build-platforms]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify required jobs passed
        uses: ./.github/actions/verify-required-jobs
        with:
          needs-json: ${{ toJSON(needs) }}
          required-jobs: build-and-test,lint,smoke-test,dependency-check,sonar,build-platforms
          allow-skipped: ${{ toJSON(inputs.run_reporting) == 'false' && 'sonar,dependency-check' || 'none' }}
