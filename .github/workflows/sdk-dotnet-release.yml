name: .NET SDKs - Build & Publish

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'publish = all manifests; auto_bump = legacy server family only, other packages keep their manifests'
        type: choice
        default: publish
        options: [publish, auto_bump]
      bump_type:
        description: 'Legacy server-family bump only when release_mode is auto_bump'
        type: choice
        default: patch
        options: [patch, minor, major]
      packages:
        description: 'Exact package IDs, legacy aliases, family names, or all (dependencies included)'
        type: string
        default: all
      prerelease:
        description: 'Mark GitHub releases as prereleases'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dotnet-sdk-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            9.0.x
            10.0.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Resolve selected package manifest versions
        id: plan
        env:
          PACKAGES: ${{ inputs.packages }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: node .github/package-registry/dotnet-release-plan.mjs
      - name: Build, test and check family coverage
        if: steps.plan.outputs.publish == 'true'
        run: node .github/package-registry/dotnet-ci.mjs test release-candidate/plan.json
      - name: Pack each selected manifest version
        if: steps.plan.outputs.publish == 'true'
        run: |
          node .github/package-registry/dotnet-ci.mjs pack release-candidate/plan.json
          node .github/package-registry/dotnet-ci.mjs verify-pack release-candidate/plan.json
      - name: Retain validated artifacts and version decisions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dotnet-release-candidate
          path: release-candidate/
          if-no-files-found: error

  publish:
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: nuget-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dotnet-release-candidate
          path: release-candidate/
      - name: Install signing tool
        run: dotnet tool install --global NuGetKeyVaultSignTool
      - name: Import signing CA certificate chain
        run: |
          if [ -z "$NUGET_SIGN_CA_CHAIN_B64" ]; then
            echo "Missing required secret: NUGET_SIGN_CA_CHAIN_B64"
            echo "Provide PEM text or base64-encoded PEM/CER chain (root + intermediates) used by the signing certificate."
            exit 1
          fi

          # Support both raw PEM and base64-encoded content in the secret.
          RAW_CHAIN_PATH="/tmp/toggly-signing-chain-input.pem"
          if [[ "$NUGET_SIGN_CA_CHAIN_B64" == *"BEGIN CERTIFICATE"* ]]; then
            printf '%s\n' "$NUGET_SIGN_CA_CHAIN_B64" > "$RAW_CHAIN_PATH"
          elif printf '%s' "$NUGET_SIGN_CA_CHAIN_B64" | base64 --decode > "$RAW_CHAIN_PATH" 2>/tmp/toggly-ca-b64.err; then
            echo "Decoded CA chain from base64 secret"
          else
            echo "Failed to parse NUGET_SIGN_CA_CHAIN_B64 as base64."
            cat /tmp/toggly-ca-b64.err
            exit 1
          fi

          # Convert DER to PEM when only a single DER cert is provided.
          if ! grep -q "BEGIN CERTIFICATE" "$RAW_CHAIN_PATH"; then
            if ! openssl x509 -inform DER -in "$RAW_CHAIN_PATH" -out "$RAW_CHAIN_PATH" 2>/dev/null; then
              echo "The provided CA chain is neither PEM nor DER certificate content."
              exit 1
            fi
          fi

          # Split a PEM bundle into one-cert-per-file for update-ca-certificates.
          rm -f /tmp/toggly-signing-ca-*.crt
          awk '
            /-----BEGIN CERTIFICATE-----/ { cert++; out=sprintf("/tmp/toggly-signing-ca-%02d.crt", cert) }
            cert > 0 { print > out }
            /-----END CERTIFICATE-----/ { close(out) }
          ' "$RAW_CHAIN_PATH"

          CERT_COUNT=$(ls /tmp/toggly-signing-ca-*.crt 2>/dev/null | wc -l)
          if [ "$CERT_COUNT" -eq 0 ]; then
            echo "No valid certificates found in provided CA chain."
            exit 1
          fi

          sudo rm -f /usr/local/share/ca-certificates/toggly-signing-ca-*.crt
          for cert in /tmp/toggly-signing-ca-*.crt; do
            sudo cp "$cert" "/usr/local/share/ca-certificates/$(basename "$cert")"
            sudo chmod 644 "/usr/local/share/ca-certificates/$(basename "$cert")"
          done

          sudo update-ca-certificates
        env:
          NUGET_SIGN_CA_CHAIN_B64: ${{ secrets.NUGET_SIGN_CA_CHAIN_B64 }}


      - name: Sign packages and symbols with paced HTTPS timestamps
        working-directory: release-candidate
        env:
          AZURE_KEY_VAULT_URL: ${{ secrets.NUGET_SIGN_VAULT_URL }}
          AZURE_KEY_VAULT_CLIENT_ID: ${{ secrets.NUGET_SIGN_CLIENT_ID }}
          AZURE_KEY_VAULT_CLIENT_SECRET: ${{ secrets.NUGET_SIGN_CLIENT_SECRET }}
          AZURE_KEY_VAULT_TENANT_ID: ${{ secrets.NUGET_SIGN_TENANT_ID }}
          AZURE_KEY_VAULT_CERTIFICATE: ${{ secrets.NUGET_SIGN_CERTIFICATE }}
        run: |
          for artifact in ./nupkgs/*.nupkg ./nupkgs/*.snupkg; do
            test -f "$artifact"
            NuGetKeyVaultSignTool sign "$artifact" \
              --file-digest sha256 \
              --timestamp-rfc3161 https://timestamp.sectigo.com \
              --timestamp-digest sha256 \
              --azure-key-vault-url "$AZURE_KEY_VAULT_URL" \
              --azure-key-vault-client-id "$AZURE_KEY_VAULT_CLIENT_ID" \
              --azure-key-vault-tenant-id "$AZURE_KEY_VAULT_TENANT_ID" \
              --azure-key-vault-client-secret "$AZURE_KEY_VAULT_CLIENT_SECRET" \
              --azure-key-vault-certificate "$AZURE_KEY_VAULT_CERTIFICATE"
            # Sectigo requires spacing between all timestamp requests.
            sleep 15
          done
      - name: NuGet login (OIDC)
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          # Trust-policy creator, not the package-owner organization.
          user: opsai
      - name: Publish in dependency order
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: node .github/package-registry/dotnet-publish.mjs release-candidate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-dotnet-packages
          path: release-candidate/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-dotnet-packages
          path: release-candidate/
      - name: Import existing GPG signing identity
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
      - name: Preserve legacy server manifest bump
        env:
          GIT_AUTHOR_NAME: ${{ steps.import_gpg.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.import_gpg.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.import_gpg.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.import_gpg.outputs.email }}
        run: |
          if test -f release-candidate/Directory.Build.props; then
            cp release-candidate/Directory.Build.props Toggly.FeatureManagement.NET/Directory.Build.props
            git add Toggly.FeatureManagement.NET/Directory.Build.props
            git commit -S -m "Bump legacy .NET server manifest (auto_bump) [skip ci]"
            for attempt in 1 2 3; do
              if git pull --rebase origin develop && git push origin HEAD:develop; then
                break
              fi
              git rebase --abort 2>/dev/null || true
              if test "$attempt" -eq 3; then exit 1; fi
              sleep 2
            done
          fi
      - name: Create signed checksums and family releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          cd release-candidate/nupkgs
          sha256sum *.nupkg *.snupkg | sort -k2 > ../SHA256SUMS
          cd ..
          gpg --batch --yes --detach-sign --armor SHA256SUMS
          cd ..
          node .github/package-registry/dotnet-release-notes.mjs release-candidate
          node .github/package-registry/dotnet-create-releases.mjs release-candidate
