name: Node.js Server SDKs - Build & Publish

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'publish = use manifest version; auto_bump = legacy CI bump'
        required: false
        default: 'publish'
        type: choice
        options:
          - publish
          - auto_bump
      bump_type:
        description: 'Bump type (only used when release_mode is auto_bump)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      packages:
        description: 'Packages to release (comma-separated: core,express,fastify,hono,koa or "all")'
        required: false
        default: 'all'
        type: string

permissions:
  contents: write
  id-token: write

env:
  SDK_ROOT: Toggly.FeatureManagement.Node

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set package matrix
        id: set-matrix
        run: |
          PACKAGES="${{ github.event.inputs.packages || 'all' }}"

          if [ "$PACKAGES" == "all" ]; then
            MATRIX='["toggly-node-core","toggly-express","toggly-fastify","toggly-hono","toggly-koa"]'
          else
            MATRIX=$(echo "$PACKAGES" | sed 's/core/toggly-node-core/g; s/express/toggly-express/g; s/fastify/toggly-fastify/g; s/hono/toggly-hono/g; s/koa/toggly-koa/g' | tr ',' '\n' | jq -R . | jq -s .)
          fi

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Building packages: $MATRIX"

  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18.x', '20.x', '22.x']
    defaults:
      run:
        working-directory: ${{ env.SDK_ROOT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build all packages
        run: pnpm -r build

      - name: Run all tests
        run: pnpm -r test

  publish:
    runs-on: ubuntu-latest
    needs: [prepare, build-and-test]
    environment: npm-publish
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ env.SDK_ROOT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build all packages
        run: pnpm -r build

      - name: Read npm package name
        id: pkg
        working-directory: ${{ env.SDK_ROOT }}/${{ matrix.package }}
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT

      - name: Resolve release version
        id: release
        uses: ./.github/actions/resolve-release-version
        with:
          manifest_path: ${{ env.SDK_ROOT }}/${{ matrix.package }}/package.json
          registry: npm
          package_name: ${{ steps.pkg.outputs.name }}
          release_mode: ${{ github.event.inputs.release_mode || 'publish' }}
          bump_type: ${{ github.event.inputs.bump_type || 'patch' }}

      - name: Publish to npm
        if: steps.release.outputs.action == 'publish'
        working-directory: ${{ env.SDK_ROOT }}/${{ matrix.package }}
        run: npm publish --provenance --access public || npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        if: steps.release.outputs.action == 'publish' && steps.release.outputs.manifest_changed == 'true'
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "${{ steps.import_gpg.outputs.name }}"
          git config user.email "${{ steps.import_gpg.outputs.email }}"

          git add ${{ env.SDK_ROOT }}/${{ matrix.package }}/package.json

          git commit -S -m "Bumped ${{ matrix.package }} to v${{ steps.release.outputs.version }} (auto_bump) [skip ci]"

          MAX_RETRIES=5
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            git fetch origin develop
            if ! git rebase origin/develop; then
              git rebase --abort 2>/dev/null || true
              sleep 3
              RETRY_COUNT=$((RETRY_COUNT + 1))
              continue
            fi

            if git push origin develop; then
              echo "Successfully pushed version bump for ${{ matrix.package }}"
              exit 0
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            sleep 3
          done

          echo "Failed to push after $MAX_RETRIES attempts"
          exit 1

      - name: Package summary
        if: always()
        run: |
          echo "### ${{ matrix.package }}" >> $GITHUB_STEP_SUMMARY
          echo "- Action: ${{ steps.release.outputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ steps.release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Reason: ${{ steps.release.outputs.reason }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

  summary:
    runs-on: ubuntu-latest
    needs: [prepare, publish]
    if: always()
    steps:
      - name: Create summary
        run: |
          echo "## Node.js Server SDK Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Release mode: ${{ github.event.inputs.release_mode || 'publish' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          PACKAGES='${{ needs.prepare.outputs.matrix }}'
          echo "$PACKAGES" | jq -r '.[]' | while read pkg; do
            echo "- @ops-ai/$pkg" >> $GITHUB_STEP_SUMMARY
          done
