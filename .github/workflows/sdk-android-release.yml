name: Android SDK - Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  SDK_ROOT: Toggly.FeatureManagement.Android

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      bump_type: ${{ steps.version.outputs.bump_type }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version from bump type
        id: version
        run: |
          BUMP_TYPE="${{ github.event.inputs.bump_type || 'patch' }}"

          LATEST_TAG=$(git tag -l "android-sdk-v*" --sort=-version:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            CURRENT_VERSION="0.0.0"
          else
            CURRENT_VERSION="${LATEST_TAG#android-sdk-v}"
          fi

          BASE_VERSION="${CURRENT_VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

          case "$BUMP_TYPE" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
            *)
              echo "Invalid bump type: $BUMP_TYPE"
              exit 1
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"
          echo "New version: $NEW_VERSION"

      - name: Check if tag exists
        run: |
          if git rev-parse "android-sdk-v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag android-sdk-v${{ steps.version.outputs.version }} already exists"
            exit 1
          fi

  build-and-test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        working-directory: ${{ env.SDK_ROOT }}
        run: chmod +x gradlew

      - name: Build release
        working-directory: ${{ env.SDK_ROOT }}
        run: ./gradlew build -x test

      - name: Run tests
        working-directory: ${{ env.SDK_ROOT }}
        run: ./gradlew test

  publish:
    needs: [build-and-test, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        working-directory: ${{ env.SDK_ROOT }}
        run: chmod +x gradlew

      - name: Decode GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode > $HOME/secring.gpg

      - name: Publish to Maven Central
        working-directory: ${{ env.SDK_ROOT }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ needs.validate.outputs.version }}
        run: |
          ./gradlew publishAllPublicationsToMavenCentralRepository \
            -Pversion=${{ needs.validate.outputs.version }}

  release:
    needs: [publish, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Configure git
        run: |
          git config user.name "${{ steps.import_gpg.outputs.name }}"
          git config user.email "${{ steps.import_gpg.outputs.email }}"

      - name: Update version in gradle.properties
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          sed -i "s/^version=.*/version=$VERSION/" ${{ env.SDK_ROOT }}/gradle.properties

      - name: Commit version update
        run: |
          git add -A
          git commit -S -m "Released Android SDK v${{ needs.validate.outputs.version }} (${{ needs.validate.outputs.bump_type }}) [skip ci]" || echo "No changes to commit"
          git push origin develop

      - name: Create and push tag
        run: |
          git tag -s -m "Android SDK v${{ needs.validate.outputs.version }}" "android-sdk-v${{ needs.validate.outputs.version }}"
          git push origin "android-sdk-v${{ needs.validate.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-sdk-v${{ needs.validate.outputs.version }}
          name: Android SDK v${{ needs.validate.outputs.version }}
          body: |
            ## Android SDK v${{ needs.validate.outputs.version }}

            ### Installation

            Add the dependency to your `build.gradle.kts`:

            ```kotlin
            dependencies {
                // Core module (required)
                implementation("io.toggly:toggly-android-core:${{ needs.validate.outputs.version }}")

                // UI modules (pick what you need)
                implementation("io.toggly:toggly-compose:${{ needs.validate.outputs.version }}")  // Jetpack Compose
                implementation("io.toggly:toggly-views:${{ needs.validate.outputs.version }}")    // Android Views

                // Storage modules (pick one)
                implementation("io.toggly:toggly-room:${{ needs.validate.outputs.version }}")      // Room database
                implementation("io.toggly:toggly-datastore:${{ needs.validate.outputs.version }}") // DataStore
            }
            ```

            ### Modules

            | Module | Description |
            |--------|-------------|
            | `toggly-android-core` | Core feature flag functionality with Kotlin coroutines |
            | `toggly-compose` | Jetpack Compose support with composables and state |
            | `toggly-views` | Traditional Android Views with ViewBinding and ViewModel |
            | `toggly-room` | Room database storage adapter |
            | `toggly-datastore` | AndroidX DataStore storage adapter |

            ### Requirements

            - Android 7.0+ (API level 24+)
            - Kotlin 1.9+
            - Java 17+
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    needs: [release, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Android SDK Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bump type | ${{ needs.validate.outputs.bump_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | android-sdk-v${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-release | ${{ github.event.inputs.prerelease }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Maven Central Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- io.toggly:toggly-android-core:${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- io.toggly:toggly-compose:${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- io.toggly:toggly-views:${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- io.toggly:toggly-room:${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- io.toggly:toggly-datastore:${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
