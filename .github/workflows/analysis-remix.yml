name: Remix SDKs - Tests & Analysis

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.Remix/**'
      - 'toggly-eval/**'
      - 'toggly-signed-defs/**'
      - '.github/workflows/analysis-remix.yml'
      - '.github/actions/build-shared-js-deps/**'
      - '.github/actions/upload-shared-js-deps/**'
      - '.github/actions/download-shared-js-deps/**'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.Remix/**'
      - 'toggly-eval/**'
      - 'toggly-signed-defs/**'
      - '.github/workflows/analysis-remix.yml'
      - '.github/actions/build-shared-js-deps/**'
      - '.github/actions/upload-shared-js-deps/**'
      - '.github/actions/download-shared-js-deps/**'
  workflow_dispatch:

env:
  SDK_ROOT: Toggly.FeatureManagement.Remix

jobs:
  build-shared-js-deps:
    name: Build shared JS deps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build shared packages
        uses: ./.github/actions/build-shared-js-deps
        with:
          packages: signed-defs,eval
          node-version: '20.x'

      - name: Upload shared package dist artifacts
        uses: ./.github/actions/upload-shared-js-deps

  build-and-test:
    name: Test ${{ matrix.package }} (Node ${{ matrix.node-version }})
    needs: [build-shared-js-deps]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]
        package:
          - remix-toggly-core
          - remix-toggly-server
          - remix-toggly-client

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ env.SDK_ROOT }}/${{ matrix.package }}/package-lock.json

      - name: Restore shared JS deps
        uses: ./.github/actions/download-shared-js-deps

      - name: Install and build core package
        if: matrix.package != 'remix-toggly-core'
        working-directory: ${{ env.SDK_ROOT }}/remix-toggly-core
        run: npm ci && npm run build

      - name: Install dependencies
        working-directory: ${{ env.SDK_ROOT }}/${{ matrix.package }}
        run: npm ci

      - name: Type check
        working-directory: ${{ env.SDK_ROOT }}/${{ matrix.package }}
        run: npm run typecheck

      - name: Build
        working-directory: ${{ env.SDK_ROOT }}/${{ matrix.package }}
        run: npm run build

      - name: Run tests with coverage
        working-directory: ${{ env.SDK_ROOT }}/${{ matrix.package }}
        run: npm run test:coverage

      - name: Upload coverage (Node 20 only)
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-remix-${{ matrix.package }}
          path: ${{ env.SDK_ROOT }}/${{ matrix.package }}/coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  lint:
    name: Lint
    needs: [build-shared-js-deps]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'

      - name: Restore shared JS deps
        uses: ./.github/actions/download-shared-js-deps

      - name: Lint core
        working-directory: ${{ env.SDK_ROOT }}/remix-toggly-core
        run: npm ci && npm run lint --if-present
        continue-on-error: true

      - name: Lint server
        working-directory: ${{ env.SDK_ROOT }}/remix-toggly-server
        run: npm ci && npm run lint --if-present
        continue-on-error: true

      - name: Lint client
        working-directory: ${{ env.SDK_ROOT }}/remix-toggly-client
        run: npm ci && npm run lint --if-present
        continue-on-error: true

  smoke-test:
    name: Smoke Test
    needs: [build-shared-js-deps]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'

      - name: Restore shared JS deps
        uses: ./.github/actions/download-shared-js-deps

      - name: Build core package
        working-directory: ${{ env.SDK_ROOT }}/remix-toggly-core
        run: npm ci && npm run build

      - name: Run server smoke test
        timeout-minutes: 2
        working-directory: ${{ env.SDK_ROOT }}/remix-toggly-server
        env:
          TOGGLY_SMOKE_APP_KEY_BACKEND: ${{ secrets.TOGGLY_SMOKE_APP_KEY_BACKEND }}
        run: npm ci && npx jest tests/smoke.spec.ts tests/smoke-ws.spec.ts --runInBand --forceExit --testPathIgnorePatterns='/node_modules/'

      - name: Run client smoke test
        timeout-minutes: 2
        working-directory: ${{ env.SDK_ROOT }}/remix-toggly-client
        env:
          TOGGLY_SMOKE_APP_KEY_FRONTEND: ${{ secrets.TOGGLY_SMOKE_APP_KEY_FRONTEND }}
        run: npm ci && npx jest tests/smoke.spec.tsx --runInBand --forceExit --testPathIgnorePatterns='/node_modules/'

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [build-shared-js-deps, build-and-test, dependency-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'

      - name: Restore shared JS deps
        if: needs.build-shared-js-deps.result == 'success'
        uses: ./.github/actions/download-shared-js-deps

      - name: Install dependencies for TypeScript analysis
        run: |
          cd ${{ env.SDK_ROOT }}/remix-toggly-core && npm ci && npm run build && cd -
          cd ${{ env.SDK_ROOT }}/remix-toggly-server && npm ci && cd -
          cd ${{ env.SDK_ROOT }}/remix-toggly-client && npm ci && cd -
        continue-on-error: true

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-remix-*
          path: coverage-artifacts/
        continue-on-error: true

      - name: Organize coverage files
        run: |
          mkdir -p coverage
          for pkg in remix-toggly-core remix-toggly-server remix-toggly-client; do
            if [ -f "coverage-artifacts/coverage-remix-$pkg/lcov.info" ]; then
              sed "s|SF:|SF:${{ env.SDK_ROOT }}/$pkg/|g" \
                "coverage-artifacts/coverage-remix-$pkg/lcov.info" > "coverage/$pkg-lcov.info"
            fi
          done
          # Combine all individual lcov files into one explicit file.
          # SonarQube Server's JavaScript plugin does not support glob patterns in
          # sonar.javascript.lcov.reportPaths — a single explicit path is required.
          cat coverage/*-lcov.info >> coverage/all-lcov.info 2>/dev/null || true
          echo "Coverage files:"
          ls -la coverage/ || echo "No coverage files found"
          echo "Sample SF: paths:"
          grep "^SF:" coverage/all-lcov.info 2>/dev/null | head -10 || true
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-remix
            -Dsonar.organization=ops-ai
            -Dsonar.projectName="Toggly SDKs - Remix"
            -Dsonar.sources=${{ env.SDK_ROOT }}
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/*.config.js,**/*.config.ts
            -Dsonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/*.config.js,**/*.config.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/all-lcov.info
            -Dsonar.tests=${{ env.SDK_ROOT }}
            -Dsonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx
        continue-on-error: true

      - name: Download Dependency Check report (for SonarQube Server)
        uses: actions/download-artifact@v8
        with:
          name: dependency-check-report-remix
          path: dependency-check-reports/
        continue-on-error: true

      - name: SonarQube Server Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-remix
            -Dsonar.projectName="Toggly SDKs - Remix"
            -Dsonar.sources=${{ env.SDK_ROOT }}
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/*.config.js,**/*.config.ts
            -Dsonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/*.config.js,**/*.config.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/all-lcov.info
            -Dsonar.tests=${{ env.SDK_ROOT }}
            -Dsonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx
            -Dsonar.dependencyCheck.reportPath=dependency-check-reports/dependency-check-report.xml
        continue-on-error: true

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache OWASP Dependency Check database
        uses: actions/cache@v6
        with:
          path: /home/runner/OWASP-Dependency-Check/data/
          key: dependency-check-db-${{ runner.os }}-v6
          restore-keys: |
            dependency-check-db-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'toggly-sdks-remix'
          path: ${{ env.SDK_ROOT }}
          format: 'ALL'
          args: >-
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableExperimental
            --disableAssembly
            --disableRubygems
            --disableBundleAudit
            --disablePyPkg
            --disablePyDist
        continue-on-error: true

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report-remix
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
        continue-on-error: true

  summary:
    name: Analysis Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, lint, smoke-test, sonar, dependency-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify required jobs passed
        uses: ./.github/actions/verify-required-jobs
        with:
          needs-json: ${{ toJSON(needs) }}
          required-jobs: build-and-test,smoke-test

      - name: Generate summary
        run: |
          echo "## Remix SDK Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Analysis workflow completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages Analyzed" >> $GITHUB_STEP_SUMMARY
          echo "- @ops-ai/remix-toggly-core" >> $GITHUB_STEP_SUMMARY
          echo "- @ops-ai/remix-toggly-server" >> $GITHUB_STEP_SUMMARY
          echo "- @ops-ai/remix-toggly-client" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Node.js Versions Tested" >> $GITHUB_STEP_SUMMARY
          echo "- 18.x, 20.x, 22.x" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarCloud for detailed results: https://sonarcloud.io/project/overview?id=toggly-sdks-remix" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarQube Server for detailed results: ${{ secrets.SONAR_HOST_URL }}/dashboard?id=toggly-sdks-remix" >> $GITHUB_STEP_SUMMARY
