# SonarCloud Configuration for Go SDK
# This configuration can be used for local analysis

sonar.projectKey=toggly-sdks-go
sonar.organization=ops-ai
sonar.projectName=Toggly SDKs - Go

# Source directories
sonar.sources=.

# Test directories
sonar.tests=.

# Exclusions
sonar.exclusions=**/*_test.go,**/vendor/**,**/examples/**

# Test inclusions
sonar.test.inclusions=**/*_test.go

# Coverage report path (Go coverage format)
sonar.go.coverage.reportPaths=coverage.out

# Go module settings
sonar.go.modules.download.enabled=true

# Additional Go settings
sonar.go.tests.reportPaths=test-report.json
