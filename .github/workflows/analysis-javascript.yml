          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ needs.prepare.outputs.sonar_project_key }}
        run: |
          pr="${{ github.event.pull_request.number }}"
          echo "## SonarQube Server quality gate (${SONAR_PROJECT_KEY})" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$pr" ]; then
            status_url="${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}&pullRequest=${pr}"
            issues_url="${SONAR_HOST_URL}/api/issues/search?componentKeys=${SONAR_PROJECT_KEY}&pullRequest=${pr}&resolved=false&ps=20&s=SEVERITY&asc=false"
