name: Android SDK - Analysis

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.Android/**'
      - '.github/workflows/analysis-android.yml'
      - '.github/workflows/analysis-android.test.mjs'
  workflow_dispatch:
  workflow_call:
    inputs:
      run_reporting:
        description: 'When false, skip Sonar and OWASP reporting jobs'
        type: boolean
        default: true

env:
  SDK_ROOT: Toggly.FeatureManagement.Android

permissions:
  contents: read
  security-events: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        working-directory: ${{ env.SDK_ROOT }}
        run: chmod +x gradlew

      - name: Build all modules
        working-directory: ${{ env.SDK_ROOT }}
        run: ./gradlew build -x test

      - name: Run unit tests
        working-directory: ${{ env.SDK_ROOT }}
        run: ./gradlew test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-java-${{ matrix.java }}
          path: |
            ${{ env.SDK_ROOT }}/**/build/reports/tests/
            ${{ env.SDK_ROOT }}/**/build/test-results/

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js for workflow contract tests
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'

      - name: Verify Android analysis workflow contract
        run: node --test .github/workflows/analysis-android.test.mjs

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        working-directory: ${{ env.SDK_ROOT }}
        run: chmod +x gradlew

      - name: Run Android Lint
        working-directory: ${{ env.SDK_ROOT }}
        run: ./gradlew lint

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: ${{ env.SDK_ROOT }}/**/build/reports/lint-results*.html

  code-coverage:
    runs-on: macos-15-intel
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        working-directory: ${{ env.SDK_ROOT }}
        run: chmod +x gradlew

      - name: Run tests with coverage
        working-directory: ${{ env.SDK_ROOT }}
        run: |
          if ./gradlew tasks --all 2>/dev/null | grep -qE '( koverXmlReport|koverXmlReport )'; then
            ./gradlew testDebugUnitTest koverXmlReport
          else
            ./gradlew test
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test the public acceptance collector with coverage
        working-directory: ${{ env.SDK_ROOT }}/acceptance/public-telemetry-host
        run: |
          python -m pip install coverage==7.10.7
          python -m coverage run --parallel-mode --source=tool -m unittest discover -s tool -p 'test_*.py'
          python -m coverage combine
          python -m coverage report --omit='tool/test_*.py' --fail-under=80
          python -m coverage xml --omit='tool/test_*.py' -o coverage.xml

      - name: Measure public acceptance Activity coverage on Android API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          working-directory: Toggly.FeatureManagement.Android/acceptance/public-telemetry-host
          script: bash tool/run_android_coverage.sh

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ${{ env.SDK_ROOT }}/**/build/reports/kover/report.xml
          flags: android-sdk
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-coverage
          path: |
            ${{ env.SDK_ROOT }}/**/build/reports/kover/report.xml
            ${{ env.SDK_ROOT }}/acceptance/public-telemetry-host/app/build/reports/coverage/androidTest/debug/connected/report.xml
            ${{ env.SDK_ROOT }}/acceptance/public-telemetry-host/app/build/reports/androidTests/connected/device-diagnostics.txt
            ${{ env.SDK_ROOT }}/acceptance/public-telemetry-host/coverage.xml
          retention-days: 7
          if-no-files-found: ignore

  build-samples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        working-directory: ${{ env.SDK_ROOT }}
        run: chmod +x gradlew

      - name: Build release artifacts
        working-directory: ${{ env.SDK_ROOT }}
        run: ./gradlew assembleRelease

      - name: Verify AAR artifacts
        working-directory: ${{ env.SDK_ROOT }}
        run: |
          echo "Checking for AAR files..."
          find . -name "*.aar" -type f | head -20

  api-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        working-directory: ${{ env.SDK_ROOT }}
        run: chmod +x gradlew

      - name: Check API compatibility
        working-directory: ${{ env.SDK_ROOT }}
        run: |
          if ./gradlew tasks --all 2>/dev/null | grep -qE '(^apiCheck| apiCheck )'; then
            ./gradlew apiCheck
          else
            echo "apiCheck task not configured, skipping"
          fi

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        working-directory: ${{ env.SDK_ROOT }}
        run: chmod +x gradlew

      - name: Compile smoke tests
        working-directory: ${{ env.SDK_ROOT }}
        run: ./gradlew :toggly-android-core:compileDebugUnitTestKotlin

      - name: Run smoke test
        timeout-minutes: 2
        working-directory: ${{ env.SDK_ROOT }}
        env:
          TOGGLY_SMOKE_APP_KEY_FRONTEND: ${{ secrets.TOGGLY_SMOKE_APP_KEY_FRONTEND }}
        run: ./gradlew :toggly-android-core:testDebugUnitTest --tests "io.toggly.core.SmokeTest"

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    if: ${{ toJSON(inputs.run_reporting) != 'false' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: 'toggly-sdks-android'
          path: ${{ env.SDK_ROOT }}
          format: 'XML'
          out: 'dependency-check-reports'
          args: >
            --disableAssembly
            --disableRubygems
            --disableBundleAudit
            --disableNodeJS
            --disableNodeAudit
            --disablePyPkg
            --disablePyDist

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report-android
          path: dependency-check-reports/
          retention-days: 7
          if-no-files-found: ignore

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [code-coverage, smoke-test, dependency-check]
    if: ${{ always() && toJSON(inputs.run_reporting) != 'false' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: android-coverage
          path: coverage-artifacts/
        continue-on-error: true

      - name: Rebase Python coverage paths for Sonar
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path('coverage-artifacts/acceptance/public-telemetry-host/coverage.xml')
          source = Path(os.environ['GITHUB_WORKSPACE']) / os.environ['SDK_ROOT'] / 'acceptance/public-telemetry-host'
          tree = ET.parse(report)
          roots = tree.findall('./sources/source')
          if len(roots) != 1:
              raise ValueError('expected one Python coverage source root')
          for item in tree.findall('.//class'):
              if not (source / item.attrib['filename']).is_file():
                  raise FileNotFoundError(source / item.attrib['filename'])
          roots[0].text = str(source)
          tree.write(report, encoding='utf-8', xml_declaration=True)
          PY

      - name: Download Dependency Check report
        uses: actions/download-artifact@v8
        with:
          name: dependency-check-report-android
          path: dependency-check-reports/
        continue-on-error: true

      - name: Resolve Sonar project version
        id: sonar_version
        uses: ./.github/actions/sonar-project-version
        with:
          manifest: Toggly.FeatureManagement.Android/build.gradle.kts
          suffix: ${{ vars.SONAR_PROJECT_VERSION_SUFFIX }}

      - name: Validate SonarCloud credentials
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "${SONAR_TOKEN}" || { echo "SonarCloud token is required"; exit 1; }

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-android
            -Dsonar.projectVersion=${{ steps.sonar_version.outputs.version }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.organization=ops-ai
            -Dsonar.projectName="Toggly SDKs - Android"
            -Dsonar.sources=${{ env.SDK_ROOT }}
            -Dsonar.exclusions=**/build/**,**/test/**,**/androidTest/**,**/*.bak
            -Dsonar.test.inclusions=**/src/test/**,**/src/androidTest/**,**/tool/test_*.py
            -Dsonar.coverage.jacoco.xmlReportPaths=coverage-artifacts/**/build/reports/kover/report.xml,coverage-artifacts/**/build/reports/coverage/androidTest/debug/connected/report.xml
            -Dsonar.python.coverage.reportPaths=coverage-artifacts/**/coverage.xml

      - name: Validate SonarQube Server credentials
        id: validate-sonarqube-server-credentials
        if: ${{ !cancelled() && (success() || failure()) }}
        env:
          SONAR_SERVER_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: test -n "${SONAR_SERVER_TOKEN}" && test -n "${SONAR_HOST_URL}" || { echo "SonarQube Server credentials are required"; exit 1; }

      - name: SonarQube Server Scan
        if: ${{ !cancelled() && (success() || failure()) && steps.validate-sonarqube-server-credentials.outcome == 'success' }}
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-android
            -Dsonar.projectVersion=${{ steps.sonar_version.outputs.version }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.projectName="Toggly SDKs - Android"
            -Dsonar.sources=${{ env.SDK_ROOT }}
            -Dsonar.exclusions=**/build/**,**/test/**,**/androidTest/**,**/*.bak
            -Dsonar.test.inclusions=**/src/test/**,**/src/androidTest/**,**/tool/test_*.py
            -Dsonar.coverage.jacoco.xmlReportPaths=coverage-artifacts/**/build/reports/kover/report.xml,coverage-artifacts/**/build/reports/coverage/androidTest/debug/connected/report.xml
            -Dsonar.python.coverage.reportPaths=coverage-artifacts/**/coverage.xml
            -Dsonar.dependencyCheck.reportPath=dependency-check-reports/dependency-check-report.xml

      - name: Report SonarQube Server quality gate
        if: ${{ failure() }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          pr="${{ github.event.pull_request.number }}"
          host="${SONAR_HOST_URL%/}"
          if [ -n "$pr" ]; then
            status_url="${host}/api/qualitygates/project_status?projectKey=toggly-sdks-android&pullRequest=${pr}"
            issues_url="${host}/api/issues/search?componentKeys=toggly-sdks-android&pullRequest=${pr}&resolved=false&ps=20&s=SEVERITY&asc=false"
          else
            status_url="${host}/api/qualitygates/project_status?projectKey=toggly-sdks-android&branch=${GITHUB_REF_NAME}"
            issues_url="${host}/api/issues/search?componentKeys=toggly-sdks-android&branch=${GITHUB_REF_NAME}&resolved=false&ps=20&s=SEVERITY&asc=false"
          fi
          curl -sS -H "Accept: application/json" -H "Authorization: Bearer ${SONAR_TOKEN}" "$status_url" -o /tmp/sonar-qg.json || curl -sS -H "Accept: application/json" -u "${SONAR_TOKEN}:" "$status_url" -o /tmp/sonar-qg.json || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          raw = Path("/tmp/sonar-qg.json").read_text()
          try:
              data = json.loads(raw)
          except json.JSONDecodeError:
              print(raw[:500])
              raise SystemExit(0)
          status = data.get("projectStatus", {})
          print(f"Status: {status.get('status')}")
          for condition in status.get("conditions", []):
              print(
                  f"QG {condition.get('metricKey')} {condition.get('status')} "
                  f"actual={condition.get('actualValue')} threshold={condition.get('errorThreshold')}",
                  flush=True,
              )
          PY
          curl -sS -H "Accept: application/json" -H "Authorization: Bearer ${SONAR_TOKEN}" "$issues_url" \
            | python3 -c 'import json,sys; raw=sys.stdin.read();
          try: d=json.loads(raw)
          except Exception: print(raw[:300]); raise SystemExit(0)
          print("total", d.get("total"));
          [print(i.get("rule"), i.get("severity"), i.get("component","").split(":")[-1], i.get("line"), (i.get("message") or "")[:120]) for i in d.get("issues",[])]' || true
          exit 0

  summary:
    name: Analysis Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, lint, code-coverage, build-samples, api-compatibility, smoke-test, dependency-check, sonar]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify required jobs passed
        uses: ./.github/actions/verify-required-jobs
        with:
          needs-json: ${{ toJSON(needs) }}
          required-jobs: build-and-test,lint,code-coverage,build-samples,api-compatibility,smoke-test,dependency-check,sonar
          allow-skipped: ${{ (toJSON(inputs.run_reporting) == 'false' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'sonar,dependency-check' || 'none' }}

      - name: Generate summary
        if: ${{ always() }}
        env:
          BUILD_RESULT: ${{ needs.build-and-test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          COVERAGE_RESULT: ${{ needs.code-coverage.result }}
          SAMPLES_RESULT: ${{ needs.build-samples.result }}
          API_RESULT: ${{ needs.api-compatibility.result }}
          SMOKE_RESULT: ${{ needs.smoke-test.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          DEPENDENCY_CHECK_RESULT: ${{ needs.dependency-check.result }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
          RUN_REPORTING: ${{ toJSON(inputs.run_reporting) }}
        run: |
          {
            echo "## Android SDK Analysis Summary"
            echo ""
            echo "- Build and tests: ${BUILD_RESULT}"
            echo "- Lint: ${LINT_RESULT}"
            echo "- Coverage: ${COVERAGE_RESULT}"
            echo "- Samples: ${SAMPLES_RESULT}"
            echo "- API compatibility: ${API_RESULT}"
            echo "- Smoke test: ${SMOKE_RESULT}"
            echo "- Sonar: ${SONAR_RESULT}"
            echo "- OWASP: ${DEPENDENCY_CHECK_RESULT}"
            echo ""
            if [ "${RUN_REPORTING}" = "false" ]; then
              echo "Reporting was explicitly disabled; authenticated Sonar gates were not checked."
            elif [ "${FORK_PR}" = "true" ]; then
              echo "Credentialed SonarCloud and SonarQube Server scans were skipped for this fork PR; authenticated Sonar gates were not checked."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
