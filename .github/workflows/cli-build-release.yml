name: Build and Release CLI

on:
  push:
    branches:
      - develop
    paths:
      - 'Toggly.CLI/**'
      - '.github/workflows/cli-build-release.yml'
      - '.github/actions/resolve-release-version/**'
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'publish = use manifest version; auto_bump = legacy CI bump'
        required: false
        default: 'publish'
        type: choice
        options:
          - publish
          - auto_bump
      bump_type:
        description: 'Bump type (only used when release_mode is auto_bump)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: cli-build-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      action: ${{ steps.release.outputs.action }}
      reason: ${{ steps.release.outputs.reason }}
      manifest_changed: ${{ steps.release.outputs.manifest_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        uses: ./.github/actions/resolve-release-version
        with:
          manifest_path: Toggly.CLI/VERSION
          registry: none
          package_name: toggly-cli
          tag_prefix: cli-v
          release_mode: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode || 'publish' }}
          bump_type: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bump_type || 'patch' }}

  # CLI wraps Toggly.CLI.csproj; validate keeps this workflow's own build+publish
  # matrix as the gate (no separate analysis-*.yml exists for the CLI family).
  build:
    needs: validate
    if: needs.validate.outputs.action == 'publish'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact-name: toggly-cli-linux-x64
            binary-name: toggly-cli
          - os: ubuntu-latest
            rid: linux-arm64
            artifact-name: toggly-cli-linux-arm64
            binary-name: toggly-cli
          - os: windows-latest
            rid: win-x64
            artifact-name: toggly-cli-windows-x64
            binary-name: toggly-cli.exe
          - os: macos-latest
            rid: osx-x64
            artifact-name: toggly-cli-macos-x64
            binary-name: toggly-cli
          - os: macos-latest
            rid: osx-arm64
            artifact-name: toggly-cli-macos-arm64
            binary-name: toggly-cli

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Install dependencies (Linux ARM64)
        if: matrix.rid == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc-aarch64-linux-gnu zlib1g-dev

      - name: Restore dependencies
        run: dotnet restore Toggly.CLI/Toggly.CLI.csproj

      - name: Build and publish
        shell: bash
        run: |
          dotnet publish Toggly.CLI/Toggly.CLI.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained \
            -p:PublishSingleFile=true \
            -p:PublishAot=true \
            -p:PublishTrimmed=true \
            -p:InvariantGlobalization=true \
            -p:StripSymbols=false \
            -o ./publish/${{ matrix.rid }}

          cd ./publish/${{ matrix.rid }}
          TARGET_BIN="${{ matrix.binary-name }}"
          DEFAULT_BIN="Toggly.CLI"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            DEFAULT_BIN="Toggly.CLI.exe"
          fi

          if [[ ! -f "$TARGET_BIN" && -f "$DEFAULT_BIN" ]]; then
            mv "$DEFAULT_BIN" "$TARGET_BIN"
          elif [[ ! -f "$TARGET_BIN" ]]; then
            ls -R
            exit 1
          fi

      - name: Install AzureSignTool
        if: matrix.rid == 'win-x64'
        shell: bash
        run: |
          dotnet tool install --global AzureSignTool
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Sign Windows CLI with Authenticode
        if: matrix.rid == 'win-x64'
        shell: bash
        env:
          AZURE_KEY_VAULT_URL: ${{ secrets.NUGET_SIGN_VAULT_URL }}
          AZURE_KEY_VAULT_CLIENT_ID: ${{ secrets.NUGET_SIGN_CLIENT_ID }}
          AZURE_KEY_VAULT_CLIENT_SECRET: ${{ secrets.NUGET_SIGN_CLIENT_SECRET }}
          AZURE_KEY_VAULT_TENANT_ID: ${{ secrets.NUGET_SIGN_TENANT_ID }}
          AZURE_KEY_VAULT_CERTIFICATE: ${{ secrets.NUGET_SIGN_CERTIFICATE }}
        run: |
          set -euo pipefail
          missing=0
          for required in \
            AZURE_KEY_VAULT_URL \
            AZURE_KEY_VAULT_CLIENT_ID \
            AZURE_KEY_VAULT_CLIENT_SECRET \
            AZURE_KEY_VAULT_TENANT_ID \
            AZURE_KEY_VAULT_CERTIFICATE
          do
            if [ -z "${!required}" ]; then
              echo "Missing required NUGET_SIGN_* secret mapped to $required"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          EXE="./publish/${{ matrix.rid }}/${{ matrix.binary-name }}"
          test -f "$EXE"

          AzureSignTool sign \
            --azure-key-vault-url "$AZURE_KEY_VAULT_URL" \
            --azure-key-vault-client-id "$AZURE_KEY_VAULT_CLIENT_ID" \
            --azure-key-vault-client-secret "$AZURE_KEY_VAULT_CLIENT_SECRET" \
            --azure-key-vault-tenant-id "$AZURE_KEY_VAULT_TENANT_ID" \
            --azure-key-vault-certificate "$AZURE_KEY_VAULT_CERTIFICATE" \
            --file-digest sha256 \
            --timestamp-rfc3161 http://timestamp.digicert.com \
            --timestamp-digest sha256 \
            --description "Toggly CLI" \
            --description-url "https://docs.toggly.io/docs/using-toggly/cli" \
            --verbose \
            "$EXE"

      - name: Verify Authenticode signature
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature -FilePath "./publish/${{ matrix.rid }}/${{ matrix.binary-name }}"
          $sig | Format-List Status, StatusMessage, SignerCertificate
          if ($sig.Status -ne 'Valid') {
            throw "Authenticode status was $($sig.Status): $($sig.StatusMessage)"
          }

      - name: Create archive (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd ./publish/${{ matrix.rid }}
          chmod +x ${{ matrix.binary-name }}
          tar -czf ../../${{ matrix.artifact-name }}.tar.gz ${{ matrix.binary-name }}

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd ./publish/${{ matrix.rid }}
          Compress-Archive -Path ${{ matrix.binary-name }} -DestinationPath ../../${{ matrix.artifact-name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}.*
          retention-days: 30

  create-release:
    needs: [build, validate]
    if: needs.validate.outputs.action == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: toggly-cli-*
          merge-multiple: false

      - name: Import GPG key for checksum and commit signing
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Generate and GPG-sign SHA-256 checksums
        run: |
          find ./artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | sort -z \
            | while IFS= read -r -d '' f; do
                sha256sum "$f" | awk -v name="$(basename "$f")" '{ print $1 "  " name }'
              done > SHA256SUMS
          gpg --batch --yes --detach-sign --armor SHA256SUMS
          cat SHA256SUMS

      - name: Commit version bump
        if: needs.validate.outputs.manifest_changed == 'true'
        env:
          GIT_AUTHOR_NAME: ${{ steps.import_gpg.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.import_gpg.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.import_gpg.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.import_gpg.outputs.email }}
          CLI_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # validate wrote VERSION on a different runner; re-apply here before commit
          printf '%s\n' "$CLI_VERSION" > Toggly.CLI/VERSION
          git add Toggly.CLI/VERSION
          git commit -S -m "Bump CLI to v${CLI_VERSION} (auto_bump) [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin develop && git push origin HEAD:develop; then
              break
            fi
            git rebase --abort 2>/dev/null || true
            if test "$attempt" -eq 3; then exit 1; fi
            sleep 2
          done

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: cli-v${{ needs.validate.outputs.version }}
          name: Toggly CLI ${{ needs.validate.outputs.version }}
          body: |
            ## Toggly CLI ${{ needs.validate.outputs.version }}

            See the [CLI documentation](https://docs.toggly.io/docs/using-toggly/cli) for installation instructions.

            Release assets include `SHA256SUMS` and `SHA256SUMS.asc` (GPG-signed).
            Windows `toggly-cli.exe` is Authenticode-signed with the Opsai LLC
            GlobalSign code-signing certificate (Azure Key Vault / AzureSignTool).
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            SHA256SUMS
            SHA256SUMS.asc
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## CLI Release" >> $GITHUB_STEP_SUMMARY
          echo "| Action | ${{ needs.validate.outputs.action }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ needs.validate.outputs.reason }} |" >> $GITHUB_STEP_SUMMARY
