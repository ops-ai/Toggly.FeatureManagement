name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        package:
          - remix-toggly-core
          - remix-toggly-server
          - remix-toggly-client

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies for core package
        if: matrix.package != 'remix-toggly-core'
        working-directory: remix-toggly-core
        run: npm ci

      - name: Build core package
        if: matrix.package != 'remix-toggly-core'
        working-directory: remix-toggly-core
        run: npm run build

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Type check
        working-directory: ${{ matrix.package }}
        run: npm run typecheck

      - name: Build
        working-directory: ${{ matrix.package }}
        run: npm run build

      - name: Test
        working-directory: ${{ matrix.package }}
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ${{ matrix.package }}/coverage/lcov.info
          flags: ${{ matrix.package }}
          name: ${{ matrix.package }}-${{ matrix.node-version }}
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies (core)
        working-directory: remix-toggly-core
        run: npm ci

      - name: Lint (core)
        working-directory: remix-toggly-core
        run: npm run lint --if-present

      - name: Install dependencies (server)
        working-directory: remix-toggly-server
        run: npm ci

      - name: Lint (server)
        working-directory: remix-toggly-server
        run: npm run lint --if-present

      - name: Install dependencies (client)
        working-directory: remix-toggly-client
        run: npm ci

      - name: Lint (client)
        working-directory: remix-toggly-client
        run: npm run lint --if-present

  sonarqube:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install and build all packages
        run: |
          cd remix-toggly-core && npm ci && npm run build && npm run test:coverage && cd ..
          cd remix-toggly-server && npm ci && npm run build && npm run test:coverage && cd ..
          cd remix-toggly-client && npm ci && npm run build && npm run test:coverage && cd ..

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
