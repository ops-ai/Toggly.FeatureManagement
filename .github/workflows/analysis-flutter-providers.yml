name: Flutter Cache Providers - Tests & Analysis

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.Flutter/toggly_secure_storage/**'
      - 'Toggly.FeatureManagement.Flutter/toggly_disk/**'
      - 'Toggly.FeatureManagement.Flutter/toggly_sqlite/**'
      - 'Toggly.FeatureManagement.Flutter/toggly_isar/**'
      - 'Toggly.FeatureManagement.Flutter/toggly/**'
      - '.github/workflows/analysis-flutter-providers.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.Flutter/toggly_secure_storage/**'
      - 'Toggly.FeatureManagement.Flutter/toggly_disk/**'
      - 'Toggly.FeatureManagement.Flutter/toggly_sqlite/**'
      - 'Toggly.FeatureManagement.Flutter/toggly_isar/**'
      - 'Toggly.FeatureManagement.Flutter/toggly/**'
      - '.github/workflows/analysis-flutter-providers.yml'
  workflow_dispatch:

jobs:
  analyze:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: toggly_secure_storage
            package: feature_flags_toggly_secure_storage
            sonarKey: toggly-sdks-flutter-secure-storage
            sonarName: "Toggly SDKs - Flutter Secure Storage Cache"
            name: Secure Storage
          - dir: toggly_disk
            package: feature_flags_toggly_disk
            sonarKey: toggly-sdks-flutter-disk
            sonarName: "Toggly SDKs - Flutter Disk Cache"
            name: Disk
          - dir: toggly_sqlite
            package: feature_flags_toggly_sqlite
            sonarKey: toggly-sdks-flutter-sqlite
            sonarName: "Toggly SDKs - Flutter SQLite Cache"
            name: SQLite
          - dir: toggly_isar
            package: feature_flags_toggly_isar
            sonarKey: toggly-sdks-flutter-isar
            sonarName: "Toggly SDKs - Flutter Isar Cache"
            name: Isar

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SonarCloud

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      # The companion packages resolve the in-repo base SDK through their
      # committed pubspec_overrides.yaml (path: ../toggly), so no extra
      # override injection is required here.
      - name: Get dependencies
        working-directory: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
        run: flutter pub get

      - name: Run code generation (if needed)
        working-directory: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            flutter pub run build_runner build --delete-conflicting-outputs
          else
            echo "No build_runner found, skipping code generation"
          fi
        continue-on-error: true

      - name: Analyze code
        working-directory: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Check formatting
        working-directory: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
        run: dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true

      - name: Run tests with coverage
        working-directory: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
        run: flutter test --coverage --test-randomize-ordering-seed random
        continue-on-error: true

      - name: Display coverage summary
        working-directory: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
        run: |
          if [ -f "coverage/lcov.info" ]; then
            echo "Coverage file generated successfully"
            lcov --list coverage/lcov.info 2>/dev/null || echo "Install lcov for detailed coverage report"
          else
            echo "No coverage file generated"
          fi
        continue-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage-${{ matrix.dir }}
          path: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}/coverage/
          retention-days: 7
          if-no-files-found: warn

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
          args: >
            -Dsonar.projectKey=${{ matrix.sonarKey }}
            -Dsonar.organization=ops-ai
            -Dsonar.projectName=${{ matrix.sonarName }}
            -Dsonar.sources=lib
            -Dsonar.tests=test
            -Dsonar.exclusions=**/.*/**,**/example/**,**/*.g.dart,**/*.freezed.dart
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info
        continue-on-error: true

  dependency-check:
    name: OWASP Dependency Check (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - toggly_secure_storage
          - toggly_disk
          - toggly_sqlite
          - toggly_isar

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache OWASP Dependency Check database
        uses: actions/cache@v4
        with:
          path: /home/runner/OWASP-Dependency-Check/data/
          key: dependency-check-db-${{ runner.os }}-v6
          restore-keys: |
            dependency-check-db-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'toggly-sdks-flutter-${{ matrix.dir }}'
          path: 'Toggly.FeatureManagement.Flutter/${{ matrix.dir }}'
          format: 'ALL'
          args: >-
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableExperimental
            --disableAssembly
            --disableRubygems
            --disableBundleAudit
            --disableNodeJS
            --disableNodeAudit
            --disablePyPkg
            --disablePyDist
        continue-on-error: true

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report-${{ matrix.dir }}
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
        continue-on-error: true

  summary:
    name: Providers Analysis Summary
    runs-on: ubuntu-latest
    needs: [analyze, dependency-check]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## Flutter Cache Providers Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Matrixed analysis completed for all provider packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages" >> $GITHUB_STEP_SUMMARY
          echo "- feature_flags_toggly_secure_storage" >> $GITHUB_STEP_SUMMARY
          echo "- feature_flags_toggly_disk" >> $GITHUB_STEP_SUMMARY
          echo "- feature_flags_toggly_sqlite" >> $GITHUB_STEP_SUMMARY
          echo "- feature_flags_toggly_isar" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checks per package" >> $GITHUB_STEP_SUMMARY
          echo "- flutter analyze (static analysis)" >> $GITHUB_STEP_SUMMARY
          echo "- dart format check" >> $GITHUB_STEP_SUMMARY
          echo "- flutter test --coverage (shared conformance contract)" >> $GITHUB_STEP_SUMMARY
          echo "- SonarCloud scan (per-package project key)" >> $GITHUB_STEP_SUMMARY
          echo "- OWASP dependency check" >> $GITHUB_STEP_SUMMARY
