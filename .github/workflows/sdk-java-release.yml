name: Java SDK - Release

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'publish = use manifest version; auto_bump = legacy CI bump'
        required: false
        default: 'publish'
        type: choice
        options:
          - publish
          - auto_bump
      bump_type:
        description: 'Bump type (only used when release_mode is auto_bump)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  SDK_ROOT: Toggly.FeatureManagement.Java

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      action: ${{ steps.release.outputs.action }}
      reason: ${{ steps.release.outputs.reason }}
      manifest_version: ${{ steps.release.outputs.manifest_version }}
      registry_latest: ${{ steps.release.outputs.registry_latest }}
      manifest_changed: ${{ steps.release.outputs.manifest_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        uses: ./.github/actions/resolve-release-version
        with:
          manifest_path: ${{ env.SDK_ROOT }}/pom.xml
          manifest_type: pom
          registry: maven
          package_name: io.toggly:toggly-core
          release_mode: ${{ github.event.inputs.release_mode || 'publish' }}
          bump_type: ${{ github.event.inputs.bump_type || 'patch' }}

  build-and-test:
    needs: validate
    if: needs.validate.outputs.action == 'publish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Sync versions for auto_bump
        if: needs.validate.outputs.manifest_changed == 'true'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: bash .github/scripts/sync-java-sdk-version.sh "${{ env.SDK_ROOT }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        working-directory: ${{ env.SDK_ROOT }}
        run: mvn -B clean verify

  publish:
    needs: [build-and-test, validate]
    if: needs.validate.outputs.action == 'publish'
    runs-on: ubuntu-latest
    env:
      # Must be present for setup-java settings.xml AND for mvn deploy.
      MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Sync versions for auto_bump
        if: needs.validate.outputs.manifest_changed == 'true'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: bash .github/scripts/sync-java-sdk-version.sh "${{ env.SDK_ROOT }}"

      - name: Set up JDK 17 with Central credentials
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Publish to Maven Central
        working-directory: ${{ env.SDK_ROOT }}
        run: mvn -B -Prelease clean deploy

  release:
    needs: [publish, validate]
    if: needs.validate.outputs.action == 'publish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Configure git
        run: |
          git config user.name "${{ steps.import_gpg.outputs.name }}"
          git config user.email "${{ steps.import_gpg.outputs.email }}"

      - name: Commit version bump
        if: needs.validate.outputs.manifest_changed == 'true'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          bash .github/scripts/sync-java-sdk-version.sh "${{ env.SDK_ROOT }}"
          git add "${{ env.SDK_ROOT }}"
          git commit -S -m "Bumped Java SDK to v${VERSION} (auto_bump) [skip ci]"

          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if git pull --rebase --autostash origin develop; then
              if git push origin develop; then
                echo "Successfully pushed version bump"
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              sleep 2
            fi
          done

          echo "Failed to push after $MAX_RETRIES attempts"
          exit 1

      - name: Create and push tag
        run: |
          git tag -s -m "Java SDK v${{ needs.validate.outputs.version }}" "java-sdk-v${{ needs.validate.outputs.version }}"
          git push origin "java-sdk-v${{ needs.validate.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: java-sdk-v${{ needs.validate.outputs.version }}
          name: Java SDK v${{ needs.validate.outputs.version }}
          body: |
            ## Java SDK v${{ needs.validate.outputs.version }}

            ### Installation

            ```xml
            <dependency>
                <groupId>io.toggly</groupId>
                <artifactId>toggly-core</artifactId>
                <version>${{ needs.validate.outputs.version }}</version>
            </dependency>
            ```

            ### Modules

            | Module | Description |
            |--------|-------------|
            | `toggly-core` | Core feature flag SDK |
            | `toggly-spring-boot-starter` | Spring Boot auto-configuration |
            | `toggly-spring-mvc` | Spring MVC integration |
            | `toggly-spring-webflux` | Spring WebFlux integration |
            | `toggly-servlet` | Servlet filter integration |
            | `toggly-cache-caffeine` | Caffeine cache adapter |
            | `toggly-cache-redis` | Redis cache adapter |

            ### Requirements

            - Java 17+
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    needs: [release, validate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Java SDK Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Action | ${{ needs.validate.outputs.action }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Manifest | ${{ needs.validate.outputs.manifest_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry latest | ${{ needs.validate.outputs.registry_latest || 'none' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release mode | ${{ github.event.inputs.release_mode || 'publish' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ needs.validate.outputs.reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | java-sdk-v${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-release | ${{ github.event.inputs.prerelease }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Maven Central Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- io.toggly:toggly-parent:${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- io.toggly:toggly-core:${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- io.toggly:toggly-spring-boot-starter:${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- io.toggly:toggly-spring-mvc:${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- io.toggly:toggly-spring-webflux:${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- io.toggly:toggly-servlet:${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- io.toggly:toggly-cache-caffeine:${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- io.toggly:toggly-cache-redis:${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
