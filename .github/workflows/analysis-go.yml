name: Go SDK - Tests & Analysis

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'toggly-go/**'
      - 'toggly-go-mongodb-v2/**'
      - '.github/workflows/analysis-go.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      run_reporting:
        description: 'When false, skip Sonar and OWASP reporting jobs'
        type: boolean
        default: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toggly-go
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for SonarCloud
      
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: toggly-go/go.sum
      
      - name: Download dependencies
        run: go mod download
      
      - name: Verify dependencies
        run: go mod verify
      
      - name: Run go vet
        run: go vet ./...
      
      - name: Run gofmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files must be formatted with gofmt. Please run:"
            echo "  gofmt -w ."
            gofmt -d .
            exit 1
          fi
      
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=5m
          working-directory: toggly-go
      
      - name: Run tests with coverage
        run: go test -v -race -timeout 5m -coverprofile=coverage.out -covermode=atomic ./...
      
      - name: Display coverage
        run: go tool cover -func=coverage.out
      
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: toggly-go/coverage.out
          retention-days: 7

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: toggly-go

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: toggly-go/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run smoke tests
        timeout-minutes: 2
        env:
          TOGGLY_SMOKE_APP_KEY_BACKEND: ${{ secrets.TOGGLY_SMOKE_APP_KEY_BACKEND }}
        run: go test -v -run '^TestSmoke_' ./toggly

  current-runtime:
    name: Current Go 1.27 Runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toggly-go

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: toggly-go/go.sum

      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Build, vet, and test with the race detector
        run: |
          go build ./...
          go vet ./...
          go test -v -race -timeout 5m ./...

  mongodb-v2:
    name: MongoDB Driver v2 (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.24.x', '1.25.x']
    defaults:
      run:
        working-directory: toggly-go-mongodb-v2

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: toggly-go-mongodb-v2/go.sum

      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            gofmt -d .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=5m
          working-directory: toggly-go-mongodb-v2

      - name: Run tests with the race detector
        run: go test -v -race -timeout 5m ./...

  mongodb-v2-consumer:
    name: MongoDB Driver v2 Packed Module Consumer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go 1.25
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'

      - name: Build a consumer from the archived module contents
        shell: bash
        run: |
          set -euo pipefail
          adapter_dir="$RUNNER_TEMP/toggly-go-mongodb-v2"
          host_dir="$RUNNER_TEMP/toggly-go-mongodb-v2-host"
          mkdir -p "$adapter_dir" "$host_dir"
          git archive --format=tar HEAD:toggly-go-mongodb-v2 | tar -xf - -C "$adapter_dir"
          cat > "$host_dir/go.mod" <<EOF
          module example.com/toggly-go-mongodb-v2-host

          go 1.25.0

          require github.com/ops-ai/Toggly.FeatureManagement/toggly-go-mongodb-v2 v0.1.0

          replace github.com/ops-ai/Toggly.FeatureManagement/toggly-go-mongodb-v2 => $adapter_dir
          EOF
          cat > "$host_dir/main.go" <<'EOF'
          package main

          import (
              "context"

              "github.com/ops-ai/Toggly.FeatureManagement/toggly-go/toggly/snapshot"
              mongodbv2 "github.com/ops-ai/Toggly.FeatureManagement/toggly-go-mongodb-v2"
              "go.mongodb.org/mongo-driver/v2/mongo"
              "go.mongodb.org/mongo-driver/v2/mongo/options"
          )

          func main() {
              client, err := mongo.Connect(options.Client().ApplyURI("mongodb://localhost:27017"))
              if err != nil {
                  panic(err)
              }
              defer func() { _ = client.Disconnect(context.Background()) }()

              var provider snapshot.Provider = mongodbv2.NewMongoDBProvider(mongodbv2.MongoDBOptions{
                  Collection: client.Database("toggly").Collection("snapshots"),
              })
              _ = provider
          }
          EOF
          (
            cd "$host_dir"
            go mod tidy
            go mod verify
            go build ./...
            go test ./...
          )

  toggly-go-consumer:
    name: Current x/net Packed Module Consumer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'

      - name: Build a consumer with latest x/crypto and x/net
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="$RUNNER_TEMP/toggly-go"
          host_dir="$RUNNER_TEMP/toggly-go-host"
          mkdir -p "$sdk_dir" "$host_dir"
          git archive --format=tar HEAD:toggly-go | tar -xf - -C "$sdk_dir"
          cat > "$host_dir/go.mod" <<EOF
          module example.com/toggly-go-host

          go 1.27.0

          require github.com/ops-ai/Toggly.FeatureManagement/toggly-go v0.8.0

          replace github.com/ops-ai/Toggly.FeatureManagement/toggly-go => $sdk_dir
          EOF
          cat > "$host_dir/main.go" <<'EOF'
          package main

          import (
              "fmt"

              "github.com/ops-ai/Toggly.FeatureManagement/toggly-go/toggly"
          )

          func main() {
              fmt.Println(toggly.SDKUserAgent())
          }
          EOF
          (
            cd "$host_dir"
            go get github.com/ops-ai/Toggly.FeatureManagement/toggly-go@v0.8.0
            go get golang.org/x/crypto@latest golang.org/x/net@latest
            go mod tidy
            go build ./...
          )

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [test, dependency-check]
    if: ${{ always() && (github.event_name != 'workflow_call' || inputs.run_reporting) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: go-coverage
          path: toggly-go/
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: toggly-go
          args: >
            -Dsonar.projectKey=toggly-sdks-go
            -Dsonar.organization=ops-ai
            -Dsonar.projectName="Toggly SDKs - Go"
            -Dsonar.sources=.
            -Dsonar.exclusions=**/*_test.go,**/vendor/**,**/examples/**
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*_test.go
            -Dsonar.go.coverage.reportPaths=coverage.out
        continue-on-error: true

      - name: Download Dependency Check report (for SonarQube Server)
        uses: actions/download-artifact@v8
        with:
          name: dependency-check-report-go
          path: dependency-check-reports/
        continue-on-error: true

      - name: SonarQube Server Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: toggly-go
          args: >
            -Dsonar.projectKey=toggly-sdks-go
            -Dsonar.projectName="Toggly SDKs - Go"
            -Dsonar.sources=.
            -Dsonar.exclusions=**/*_test.go,**/vendor/**,**/examples/**
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*_test.go
            -Dsonar.go.coverage.reportPaths=coverage.out
            -Dsonar.dependencyCheck.reportPath=../dependency-check-reports/dependency-check-report.xml
        continue-on-error: true

  build:
    name: Build Examples
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toggly-go
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: toggly-go/go.sum
      
      - name: Build examples
        run: |
          if [ -d "examples" ]; then
            for example in examples/*.go; do
              if [ -f "$example" ]; then
                echo "Building $example"
                go build -v "$example"
              fi
            done
          else
            echo "No examples directory found"
          fi

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_call' || inputs.run_reporting }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache OWASP Dependency Check database
        uses: actions/cache@v6
        with:
          path: /home/runner/OWASP-Dependency-Check/data/
          key: dependency-check-db-${{ runner.os }}-v6
          restore-keys: |
            dependency-check-db-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'toggly-sdks-go'
          path: 'toggly-go'
          format: 'ALL'
          args: >-
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableExperimental
            --disableAssembly
            --disableRubygems
            --disableBundleAudit
            --disableNodeJS
            --disableNodeAudit
            --disablePyPkg
            --disablePyDist
        continue-on-error: true

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report-go
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
        continue-on-error: true

  summary:
    name: Analysis Summary
    runs-on: ubuntu-latest
    needs: [test, smoke-test, current-runtime, mongodb-v2, mongodb-v2-consumer, toggly-go-consumer, sonar, build, dependency-check]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify required jobs passed
        uses: ./.github/actions/verify-required-jobs
        with:
          needs-json: ${{ toJSON(needs) }}
          required-jobs: test,smoke-test,current-runtime,mongodb-v2,mongodb-v2-consumer,toggly-go-consumer,build

      - name: Generate summary
        working-directory: .
        run: |
          echo "## Go SDK Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Analysis workflow completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "- Tests executed with race detector" >> $GITHUB_STEP_SUMMARY
          echo "- Code coverage collected" >> $GITHUB_STEP_SUMMARY
          echo "- Code formatting checked (gofmt)" >> $GITHUB_STEP_SUMMARY
          echo "- Static analysis completed (golangci-lint)" >> $GITHUB_STEP_SUMMARY
          echo "- Go vet checks passed" >> $GITHUB_STEP_SUMMARY
          echo "- Go 1.27 current-runtime compatibility verified" >> $GITHUB_STEP_SUMMARY
          echo "- Archived toggly-go module compiled with latest x/crypto and x/net" >> $GITHUB_STEP_SUMMARY
          echo "- MongoDB Driver v2 adapter verified on Go 1.24 and 1.25" >> $GITHUB_STEP_SUMMARY
          echo "- Archived MongoDB Driver v2 module compiled in an external consumer" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages Tested" >> $GITHUB_STEP_SUMMARY
          echo "- toggly (core)" >> $GITHUB_STEP_SUMMARY
          echo "- togglyctx (context support)" >> $GITHUB_STEP_SUMMARY
          echo "- togglyhttp (HTTP integration)" >> $GITHUB_STEP_SUMMARY
          echo "- togglytemplate (template helpers)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarCloud for detailed results: https://sonarcloud.io/project/overview?id=toggly-sdks-go" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarQube Server for detailed results: ${{ secrets.SONAR_HOST_URL }}/dashboard?id=toggly-sdks-go" >> $GITHUB_STEP_SUMMARY
