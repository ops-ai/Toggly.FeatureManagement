name: Flutter SDKs - Tests & Analysis

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.Flutter/**'
      - '.github/workflows/analysis-flutter.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.Flutter/**'
      - '.github/workflows/analysis-flutter.yml'
  workflow_dispatch:

jobs:
  analyze:
    name: Test & Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Toggly.FeatureManagement.Flutter/toggly
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SonarCloud
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Verify dependencies
        run: flutter pub get --enforce-lockfile
      
      - name: Run code generation (if needed)
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            flutter pub run build_runner build --delete-conflicting-outputs
          else
            echo "No build_runner found, skipping code generation"
          fi
      
      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      
      - name: Run tests with coverage
        run: flutter test --coverage --test-randomize-ordering-seed random
      
      - name: Display coverage summary
        if: always()
        run: |
          if [ -f "coverage/lcov.info" ]; then
            echo "Coverage file generated successfully"
            lcov --list coverage/lcov.info 2>/dev/null || echo "Install lcov for detailed coverage report"
          else
            echo "No coverage file generated"
          fi
      
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: Toggly.FeatureManagement.Flutter/toggly/coverage/
          retention-days: 7
          if-no-files-found: warn

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [analyze, dependency-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        working-directory: Toggly.FeatureManagement.Flutter/toggly
        run: flutter pub get

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: flutter-coverage
          path: Toggly.FeatureManagement.Flutter/toggly/coverage/
        continue-on-error: true

      - name: Verify coverage file
        run: |
          if [ -f "Toggly.FeatureManagement.Flutter/toggly/coverage/lcov.info" ]; then
            echo "Coverage file found"
            ls -lh Toggly.FeatureManagement.Flutter/toggly/coverage/lcov.info
          else
            echo "Coverage file not found"
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: Toggly.FeatureManagement.Flutter/toggly
          args: >
            -Dsonar.projectKey=toggly-sdks-flutter
            -Dsonar.organization=ops-ai
            -Dsonar.projectName="Toggly SDKs - Flutter/Dart"
            -Dsonar.sources=lib
            -Dsonar.tests=test
            -Dsonar.exclusions=**/.*/**,**/example/**,**/benchmark/**,**/*.g.dart,**/*.freezed.dart
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info
        continue-on-error: true

      - name: Download Dependency Check report (for SonarQube Server)
        uses: actions/download-artifact@v4
        with:
          name: dependency-check-report-flutter
          path: dependency-check-reports/
        continue-on-error: true

      - name: SonarQube Server Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: Toggly.FeatureManagement.Flutter/toggly
          args: >
            -Dsonar.projectKey=toggly-sdks-flutter
            -Dsonar.projectName="Toggly SDKs - Flutter/Dart"
            -Dsonar.sources=lib
            -Dsonar.tests=test
            -Dsonar.exclusions=**/.*/**,**/example/**,**/benchmark/**,**/*.g.dart,**/*.freezed.dart
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info
            -Dsonar.dependencyCheck.reportPath=../../dependency-check-reports/dependency-check-report.xml
        continue-on-error: true

  build-platforms:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Web
            os: ubuntu-latest
            build-cmd: flutter build web
          - platform: Android
            os: ubuntu-latest
            build-cmd: flutter build apk --debug
          - platform: iOS
            os: macos-latest
            build-cmd: flutter build ios --debug --no-codesign
    defaults:
      run:
        working-directory: Toggly.FeatureManagement.Flutter/toggly/example
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Java (for Android)
        if: matrix.platform == 'Android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        if: matrix.platform == 'iOS'
        run: |
          cd ios
          pod install
      
      - name: Build ${{ matrix.platform }}
        run: ${{ matrix.build-cmd }}

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: Toggly.FeatureManagement.Flutter/toggly

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run smoke test
        timeout-minutes: 2
        env:
          TOGGLY_SMOKE_APP_KEY_FRONTEND: ${{ secrets.TOGGLY_SMOKE_APP_KEY_FRONTEND }}
        run: flutter test test/smoke_test.dart

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache OWASP Dependency Check database
        uses: actions/cache@v4
        with:
          path: /home/runner/OWASP-Dependency-Check/data/
          key: dependency-check-db-${{ runner.os }}-v6
          restore-keys: |
            dependency-check-db-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'toggly-sdks-flutter'
          path: 'Toggly.FeatureManagement.Flutter/toggly'
          format: 'ALL'
          args: >-
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableExperimental
            --disableAssembly
            --disableRubygems
            --disableBundleAudit
            --disableNodeJS
            --disableNodeAudit
            --disablePyPkg
            --disablePyDist
        continue-on-error: true

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report-flutter
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
        continue-on-error: true

  analyze-providers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: toggly_secure_storage
            package: feature_flags_toggly_secure_storage
            sonarKey: toggly-sdks-flutter-secure-storage
            sonarName: "Toggly SDKs - Flutter Secure Storage Cache"
            name: Secure Storage
          - dir: toggly_disk
            package: feature_flags_toggly_disk
            sonarKey: toggly-sdks-flutter-disk
            sonarName: "Toggly SDKs - Flutter Disk Cache"
            name: Disk
          - dir: toggly_sqlite
            package: feature_flags_toggly_sqlite
            sonarKey: toggly-sdks-flutter-sqlite
            sonarName: "Toggly SDKs - Flutter SQLite Cache"
            name: SQLite
          - dir: toggly_isar
            package: feature_flags_toggly_isar
            sonarKey: toggly-sdks-flutter-isar
            sonarName: "Toggly SDKs - Flutter Isar Cache"
            name: Isar

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SonarCloud

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      # Companion packages resolve the in-repo base SDK via pubspec_overrides.yaml.example.
      - name: Apply monorepo pubspec overrides
        working-directory: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
        run: |
          cp pubspec_overrides.yaml.example pubspec_overrides.yaml
          cp example/pubspec_overrides.yaml.example example/pubspec_overrides.yaml

      - name: Get dependencies
        working-directory: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
        run: flutter pub get

      - name: Run code generation (if needed)
        working-directory: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            flutter pub run build_runner build --delete-conflicting-outputs
          else
            echo "No build_runner found, skipping code generation"
          fi

      - name: Analyze code
        working-directory: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Check formatting
        working-directory: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run tests with coverage
        working-directory: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
        run: flutter test --coverage --test-randomize-ordering-seed random

      - name: Display coverage summary
        if: always()
        working-directory: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
        run: |
          if [ -f "coverage/lcov.info" ]; then
            echo "Coverage file generated successfully"
            lcov --list coverage/lcov.info 2>/dev/null || echo "Install lcov for detailed coverage report"
          else
            echo "No coverage file generated"
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage-${{ matrix.dir }}
          path: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}/coverage/
          retention-days: 7
          if-no-files-found: warn

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: Toggly.FeatureManagement.Flutter/${{ matrix.dir }}
          args: >
            -Dsonar.projectKey=${{ matrix.sonarKey }}
            -Dsonar.organization=ops-ai
            -Dsonar.projectName=${{ matrix.sonarName }}
            -Dsonar.sources=lib
            -Dsonar.tests=test
            -Dsonar.exclusions=**/.*/**,**/example/**,**/*.g.dart,**/*.freezed.dart
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info
        continue-on-error: true

  dependency-check-providers:
    name: OWASP Dependency Check (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - toggly_secure_storage
          - toggly_disk
          - toggly_sqlite
          - toggly_isar

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache OWASP Dependency Check database
        uses: actions/cache@v4
        with:
          path: /home/runner/OWASP-Dependency-Check/data/
          key: dependency-check-db-${{ runner.os }}-v6
          restore-keys: |
            dependency-check-db-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'toggly-sdks-flutter-${{ matrix.dir }}'
          path: 'Toggly.FeatureManagement.Flutter/${{ matrix.dir }}'
          format: 'ALL'
          args: >-
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableExperimental
            --disableAssembly
            --disableRubygems
            --disableBundleAudit
            --disableNodeJS
            --disableNodeAudit
            --disablePyPkg
            --disablePyDist
        continue-on-error: true

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report-${{ matrix.dir }}
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
        continue-on-error: true

  summary:
    name: Analysis Summary
    runs-on: ubuntu-latest
    needs: [analyze, sonar, build-platforms, smoke-test, dependency-check, analyze-providers, dependency-check-providers]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify required jobs passed
        uses: ./.github/actions/verify-required-jobs
        with:
          needs-json: ${{ toJSON(needs) }}
          required-jobs: analyze,build-platforms,smoke-test,analyze-providers

      - name: Generate summary
        working-directory: .
        run: |
          echo "## Flutter SDKs Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Analysis workflow completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages" >> $GITHUB_STEP_SUMMARY
          echo "- feature_flags_toggly (core SDK)" >> $GITHUB_STEP_SUMMARY
          echo "- feature_flags_toggly_secure_storage" >> $GITHUB_STEP_SUMMARY
          echo "- feature_flags_toggly_disk" >> $GITHUB_STEP_SUMMARY
          echo "- feature_flags_toggly_sqlite" >> $GITHUB_STEP_SUMMARY
          echo "- feature_flags_toggly_isar" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "- Unit tests executed" >> $GITHUB_STEP_SUMMARY
          echo "- Code coverage collected" >> $GITHUB_STEP_SUMMARY
          echo "- Static analysis completed (flutter analyze)" >> $GITHUB_STEP_SUMMARY
          echo "- Code formatting checked (dart format)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Platform Builds Tested (core SDK)" >> $GITHUB_STEP_SUMMARY
          echo "- Web" >> $GITHUB_STEP_SUMMARY
          echo "- Android" >> $GITHUB_STEP_SUMMARY
          echo "- iOS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarCloud for detailed results: https://sonarcloud.io/project/overview?id=toggly-sdks-flutter" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarQube Server for detailed results: ${{ secrets.SONAR_HOST_URL }}/dashboard?id=toggly-sdks-flutter" >> $GITHUB_STEP_SUMMARY
