name: iOS SDK - Release

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'publish = use manifest version; auto_bump = legacy CI bump'
        required: false
        default: 'publish'
        type: choice
        options:
          - publish
          - auto_bump
      bump_type:
        description: 'Bump type (only used when release_mode is auto_bump)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  SDK_ROOT: Toggly.FeatureManagement.iOS

jobs:
  validate:
    runs-on: macos-15
    outputs:
      version: ${{ steps.release.outputs.version }}
      action: ${{ steps.release.outputs.action }}
      reason: ${{ steps.release.outputs.reason }}
      manifest_version: ${{ steps.release.outputs.manifest_version }}
      registry_latest: ${{ steps.release.outputs.registry_latest }}
      manifest_changed: ${{ steps.release.outputs.manifest_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        uses: ./.github/actions/resolve-release-version
        with:
          manifest_path: ${{ env.SDK_ROOT }}/TogglyCore/Sources/TogglyCore.swift
          manifest_type: swift
          registry: none
          package_name: TogglyCore
          tag_prefix: ios-sdk-v
          release_mode: ${{ github.event.inputs.release_mode || 'publish' }}
          bump_type: ${{ github.event.inputs.bump_type || 'patch' }}

      - name: Sync package version constants
        if: steps.release.outputs.manifest_changed == 'true'
        run: |
          NEW_VERSION="${{ steps.release.outputs.version }}"
          sed -i "s/public let togglySwiftUIVersion = \".*\"/public let togglySwiftUIVersion = \"$NEW_VERSION\"/" \
            ${{ env.SDK_ROOT }}/TogglySwiftUI/Sources/TogglySwiftUI.swift
          sed -i "s/public let togglyUIKitVersion = \".*\"/public let togglyUIKitVersion = \"$NEW_VERSION\"/" \
            ${{ env.SDK_ROOT }}/TogglyUIKit/Sources/TogglyUIKit.swift
          sed -i "s/public let togglyCombineVersion = \".*\"/public let togglyCombineVersion = \"$NEW_VERSION\"/" \
            ${{ env.SDK_ROOT }}/TogglyCombine/Sources/TogglyCombine.swift

  build-and-test:
    needs: validate
    if: needs.validate.outputs.action == 'publish'
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.1.app

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve dependencies
        working-directory: ${{ env.SDK_ROOT }}
        run: swift package resolve

      - name: Build
        working-directory: ${{ env.SDK_ROOT }}
        run: swift build -c release

      - name: Run tests
        working-directory: ${{ env.SDK_ROOT }}
        run: swift test

  release:
    needs: [build-and-test, validate]
    if: needs.validate.outputs.action == 'publish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Configure git
        run: |
          git config user.name "${{ steps.import_gpg.outputs.name }}"
          git config user.email "${{ steps.import_gpg.outputs.email }}"

      - name: Commit version bump
        if: needs.validate.outputs.manifest_changed == 'true'
        run: |
          git add ${{ env.SDK_ROOT }}/TogglyCore/Sources/TogglyCore.swift
          git add ${{ env.SDK_ROOT }}/TogglySwiftUI/Sources/TogglySwiftUI.swift
          git add ${{ env.SDK_ROOT }}/TogglyUIKit/Sources/TogglyUIKit.swift
          git add ${{ env.SDK_ROOT }}/TogglyCombine/Sources/TogglyCombine.swift
          git commit -S -m "Bumped iOS SDK to v${{ needs.validate.outputs.version }} (auto_bump) [skip ci]"

          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if git pull --rebase --autostash origin develop; then
              if git push origin develop; then
                echo "Successfully pushed version bump"
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              sleep 2
            fi
          done

          echo "Failed to push after $MAX_RETRIES attempts"
          exit 1

      - name: Create and push tag
        run: |
          git tag -s -m "iOS SDK v${{ needs.validate.outputs.version }}" "ios-sdk-v${{ needs.validate.outputs.version }}"
          git push origin "ios-sdk-v${{ needs.validate.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-sdk-v${{ needs.validate.outputs.version }}
          name: iOS SDK v${{ needs.validate.outputs.version }}
          body: |
            ## iOS SDK v${{ needs.validate.outputs.version }}

            ### Installation

            #### Swift Package Manager

            Add the following to your `Package.swift`:

            ```swift
            dependencies: [
                .package(url: "https://github.com/ops-ai/Toggly.FeatureManagement.git", from: "${{ needs.validate.outputs.version }}")
            ]
            ```

            Or in Xcode: File → Add Package Dependencies → Enter the repository URL.

            ### Packages

            - **TogglyCore**: Core feature flag functionality
            - **TogglySwiftUI**: SwiftUI property wrappers and view modifiers
            - **TogglyUIKit**: UIKit extensions and utilities
            - **TogglyCombine**: Combine publishers for reactive patterns

            ### Requirements

            - iOS 14.0+
            - macOS 11.0+
            - tvOS 14.0+
            - watchOS 7.0+
            - Swift 5.5+
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    needs: [release, validate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## iOS SDK Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Action | ${{ needs.validate.outputs.action }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Manifest | ${{ needs.validate.outputs.manifest_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry latest | ${{ needs.validate.outputs.registry_latest || 'none' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release mode | ${{ github.event.inputs.release_mode || 'publish' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ needs.validate.outputs.reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ios-sdk-v${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-release | ${{ github.event.inputs.prerelease }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages Released" >> $GITHUB_STEP_SUMMARY
          echo "- TogglyCore" >> $GITHUB_STEP_SUMMARY
          echo "- TogglySwiftUI" >> $GITHUB_STEP_SUMMARY
          echo "- TogglyUIKit" >> $GITHUB_STEP_SUMMARY
          echo "- TogglyCombine" >> $GITHUB_STEP_SUMMARY
