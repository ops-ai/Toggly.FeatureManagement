[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toggly"
version = "0.2.1"
description = "Feature flag management SDK for Python - zero dependencies core library"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Toggly", email = "support@toggly.io"}
]
maintainers = [
    {name = "Toggly", email = "support@toggly.io"}
]
keywords = [
    "feature-flags",
    "feature-toggles",
    "feature-management",
    "toggly",
    "experimentation",
    "ab-testing",
    "rollout"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://toggly.io"
Documentation = "https://docs.toggly.io/sdks/python"
Repository = "https://github.com/ops-ai/toggly-sdks"
Changelog = "https://github.com/ops-ai/toggly-sdks/blob/main/Toggly.FeatureManagement.Python/toggly/CHANGELOG.md"

[project.optional-dependencies]
websocket = [
    "websocket-client>=1.6.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "websockets>=12.0",
    "websocket-client>=1.6.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toggly = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src/toggly --cov-report=xml --cov-report=term-missing"

[tool.mypy]
python_version = "3.8"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "C4", "SIM"]
ignore = ["D100", "D104"]

[tool.coverage.run]
source = ["src/toggly"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod"
]
