name: Flutter SDK - Tests & Analysis

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.Flutter/**'
      - '.github/workflows/analysis-flutter.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.Flutter/**'
      - '.github/workflows/analysis-flutter.yml'
  workflow_dispatch:

jobs:
  analyze:
    name: Test & Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Toggly.FeatureManagement.Flutter/toggly
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SonarCloud
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'
          cache: true
      
      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Verify dependencies
        run: flutter pub get --check
      
      - name: Run code generation (if needed)
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            flutter pub run build_runner build --delete-conflicting-outputs
          else
            echo "No build_runner found, skipping code generation"
          fi
        continue-on-error: true
      
      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true
      
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true
      
      - name: Run tests with coverage
        run: flutter test --coverage --test-randomize-ordering-seed random
        continue-on-error: true
      
      - name: Display coverage summary
        run: |
          if [ -f "coverage/lcov.info" ]; then
            echo "Coverage file generated successfully"
            lcov --list coverage/lcov.info 2>/dev/null || echo "Install lcov for detailed coverage report"
          else
            echo "No coverage file generated"
          fi
        continue-on-error: true
      
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: Toggly.FeatureManagement.Flutter/toggly/coverage/
          retention-days: 7
          if-no-files-found: warn

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: analyze
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: flutter-coverage
          path: Toggly.FeatureManagement.Flutter/toggly/coverage/
        continue-on-error: true

      - name: Verify coverage file
        run: |
          if [ -f "Toggly.FeatureManagement.Flutter/toggly/coverage/lcov.info" ]; then
            echo "Coverage file found"
            ls -lh Toggly.FeatureManagement.Flutter/toggly/coverage/lcov.info
          else
            echo "Coverage file not found"
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: Toggly.FeatureManagement.Flutter/toggly
          args: >
            -Dsonar.projectKey=toggly-sdks-flutter
            -Dsonar.organization=ops-ai
            -Dsonar.projectName=Toggly SDKs - Flutter/Dart
            -Dsonar.sources=lib
            -Dsonar.tests=test
            -Dsonar.exclusions=**/.*/**,**/example/**,**/benchmarks/**,**/*.g.dart,**/*.freezed.dart
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info
        continue-on-error: true

      - name: SonarQube Server Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: Toggly.FeatureManagement.Flutter/toggly
          args: >
            -Dsonar.projectKey=toggly-sdks-flutter
            -Dsonar.projectName=Toggly SDKs - Flutter/Dart
            -Dsonar.sources=lib
            -Dsonar.tests=test
            -Dsonar.exclusions=**/.*/**,**/example/**,**/benchmarks/**,**/*.g.dart,**/*.freezed.dart
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info
        continue-on-error: true

  build-platforms:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Web
            os: ubuntu-latest
            build-cmd: flutter build web
          - platform: Android
            os: ubuntu-latest
            build-cmd: flutter build apk --debug
          - platform: iOS
            os: macos-latest
            build-cmd: flutter build ios --debug --no-codesign
    defaults:
      run:
        working-directory: Toggly.FeatureManagement.Flutter/toggly/example
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'
          cache: true
      
      - name: Setup Java (for Android)
        if: matrix.platform == 'Android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build ${{ matrix.platform }}
        run: ${{ matrix.build-cmd }}
        continue-on-error: true

  summary:
    name: Analysis Summary
    runs-on: ubuntu-latest
    needs: [analyze, sonar, build-platforms]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## Flutter SDK Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Analysis workflow completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "- Unit tests executed" >> $GITHUB_STEP_SUMMARY
          echo "- Code coverage collected" >> $GITHUB_STEP_SUMMARY
          echo "- Static analysis completed (flutter analyze)" >> $GITHUB_STEP_SUMMARY
          echo "- Code formatting checked (dart format)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Platform Builds Tested" >> $GITHUB_STEP_SUMMARY
          echo "- Web" >> $GITHUB_STEP_SUMMARY
          echo "- Android" >> $GITHUB_STEP_SUMMARY
          echo "- iOS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarCloud for detailed results: https://sonarcloud.io/project/overview?id=toggly-sdks-flutter" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarQube Server for detailed results: ${{ secrets.SONAR_HOST_URL }}/dashboard?id=toggly-sdks-flutter" >> $GITHUB_STEP_SUMMARY
