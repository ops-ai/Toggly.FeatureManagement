[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toggly-fastapi"
version = "0.1.0"
description = "FastAPI integration for Toggly feature flag management"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Toggly", email = "support@toggly.io"}
]
maintainers = [
    {name = "Toggly", email = "support@toggly.io"}
]
keywords = [
    "feature-flags",
    "feature-toggles",
    "fastapi",
    "starlette",
    "toggly",
    "experimentation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]
requires-python = ">=3.9"
dependencies = [
    "toggly>=0.1.0",
    "fastapi>=0.100"
]

[project.urls]
Homepage = "https://toggly.io"
Documentation = "https://docs.toggly.io/sdks/python/fastapi"
Repository = "https://github.com/ops-ai/toggly-sdks"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toggly_fastapi = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/toggly_fastapi --cov-report=xml --cov-report=term-missing"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.9"
strict = true

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.coverage.run]
source = ["src/toggly_fastapi"]
branch = true
