name: Go SDK - Tests & Analysis

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'toggly-go/**'
      - '.github/workflows/analysis-go.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'toggly-go/**'
      - '.github/workflows/analysis-go.yml'
  workflow_dispatch:

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toggly-go
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SonarCloud
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
          cache-dependency-path: toggly-go/go.sum
      
      - name: Download dependencies
        run: go mod download
      
      - name: Verify dependencies
        run: go mod verify
      
      - name: Run go vet
        run: go vet ./...
      
      - name: Run gofmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files must be formatted with gofmt. Please run:"
            echo "  gofmt -w ."
            gofmt -d .
            exit 1
          fi
      
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.55.2
      
      - name: Run golangci-lint
        run: $(go env GOPATH)/bin/golangci-lint run --timeout=5m
        continue-on-error: true
      
      - name: Run tests with coverage
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
      
      - name: Display coverage
        run: go tool cover -func=coverage.out
      
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: toggly-go/coverage.out
          retention-days: 7

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: go-coverage
          path: toggly-go/
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: toggly-go
          args: >
            -Dsonar.projectKey=toggly-sdks-go
            -Dsonar.organization=ops-ai
            -Dsonar.projectName=Toggly SDKs - Go
            -Dsonar.sources=.
            -Dsonar.exclusions=**/*_test.go,**/vendor/**,**/examples/**
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*_test.go
            -Dsonar.go.coverage.reportPaths=coverage.out
        continue-on-error: true

      - name: SonarQube Server Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: toggly-go
          args: >
            -Dsonar.projectKey=toggly-sdks-go
            -Dsonar.projectName=Toggly SDKs - Go
            -Dsonar.sources=.
            -Dsonar.exclusions=**/*_test.go,**/vendor/**,**/examples/**
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*_test.go
            -Dsonar.go.coverage.reportPaths=coverage.out
        continue-on-error: true

  build:
    name: Build Examples
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toggly-go
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
          cache-dependency-path: toggly-go/go.sum
      
      - name: Build examples
        run: |
          if [ -d "examples" ]; then
            for example in examples/*.go; do
              if [ -f "$example" ]; then
                echo "Building $example"
                go build -v "$example" || echo "Failed to build $example"
              fi
            done
          else
            echo "No examples directory found"
          fi
        continue-on-error: true

  summary:
    name: Analysis Summary
    runs-on: ubuntu-latest
    needs: [test, sonar, build]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## Go SDK Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Analysis workflow completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "- Tests executed with race detector" >> $GITHUB_STEP_SUMMARY
          echo "- Code coverage collected" >> $GITHUB_STEP_SUMMARY
          echo "- Code formatting checked (gofmt)" >> $GITHUB_STEP_SUMMARY
          echo "- Static analysis completed (golangci-lint)" >> $GITHUB_STEP_SUMMARY
          echo "- Go vet checks passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages Tested" >> $GITHUB_STEP_SUMMARY
          echo "- toggly (core)" >> $GITHUB_STEP_SUMMARY
          echo "- togglyctx (context support)" >> $GITHUB_STEP_SUMMARY
          echo "- togglyhttp (HTTP integration)" >> $GITHUB_STEP_SUMMARY
          echo "- togglytemplate (template helpers)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarCloud for detailed results: https://sonarcloud.io/project/overview?id=toggly-sdks-go" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarQube Server for detailed results: ${{ secrets.SONAR_HOST_URL }}/dashboard?id=toggly-sdks-go" >> $GITHUB_STEP_SUMMARY
