# Dependabot policy for Toggly.FeatureManagement (OPS-693)
#
# Version updates stay inside declared SDK support ranges. Framework majors
# (Astro 6, Next 16, Nuxt 4, Spring Boot 4, uuid 10+, PerformanceCounter 6+, …) are product
# decisions, not bot merges. Example apps are excluded — they are not published.
#
# Do not set target-branch here: develop is the default branch. Setting
# target-branch would disable Dependabot security updates for that ecosystem.
# See https://docs.github.com/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2

updates:
  - package-ecosystem: npm
    directories:
      - "**/*"
    exclude-paths:
      - "**/example/**"
      - "**/examples/**"
      - "**/dist/**"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 8
    labels:
      - dependencies
    groups:
      npm-patch-and-minor:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: astro
        update-types: ["version-update:semver-major"]
      - dependency-name: nuxt
        update-types: ["version-update:semver-major"]
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: svelte
        update-types: ["version-update:semver-major"]
      - dependency-name: gatsby
        update-types: ["version-update:semver-major"]
      - dependency-name: vue
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@remix-run/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-router/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: uuid
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: hono
        update-types: ["version-update:semver-major"]
      - dependency-name: fastify
        update-types: ["version-update:semver-major"]

  # Covers every NuGet project, including Blazor. Extra nuget blocks for the
  # same target branch must stay disjoint from this glob (GitHub rejects overlap).
  - package-ecosystem: nuget
    directories:
      - "**/*"
    exclude-paths:
      - "**/examples/**"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      nuget-patch-and-minor:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: System.Diagnostics.PerformanceCounter
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gomod
    directories:
      - "**/*"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      go-patch-and-minor:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # grpc-go 1.81+ rewrites consumer go.mod files to 1.25+. Keep grpc
      # 1.80 until a coordinated bump. 1.81.1 slipped under >=1.82 (#524).
      - dependency-name: google.golang.org/grpc
        versions: [">=1.81.0"]
      - dependency-name: go.mongodb.org/mongo-driver/v2
        versions: [">=2.9.0"]

  - package-ecosystem: maven
    directories:
      - "**/*"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      maven-patch-and-minor:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # Maven names are groupId:artifactId. org.springframework* covers
      # org.springframework:*, org.springframework.boot:*, and other Spring
      # groupIds. The narrower org.springframework:* misses the Boot starter.
      - dependency-name: "org.springframework*"
        update-types: ["version-update:semver-major"]
      # Protobuf Java 3.x is in maintenance until 31 Mar 2027. 4.x is a
      # product decision (OPS-1011). grpc-java 1.84 still pins 3.25.x.
      - dependency-name: "com.google.protobuf:protobuf-java"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.google.protobuf:protoc"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: bundler
    directories:
      - "**/*"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      bundler-patch-and-minor:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # json 3 dropped quirks_mode. Rails 7.0–8.0 ActiveSupport still passes
      # it; rubocop 1.91 pulls json 3 into the lockfile (OPS-1011).
      - dependency-name: json
        versions: [">=3.0.0"]
      # json ignore does not stop this transitive (#516 / #486).
      - dependency-name: rubocop
        versions: [">=1.91.0"]

  - package-ecosystem: pip
    directories:
      - "**/*"
    exclude-paths:
      - "**/.pytest_cache/**"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      pip-patch-and-minor:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: flask
        update-types: ["version-update:semver-major"]
      - dependency-name: django
        update-types: ["version-update:semver-major"]
      - dependency-name: fastapi
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pub
    directories:
      - "**/*"
    exclude-paths:
      - "**/example/**"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      pub-patch-and-minor:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directories:
      - "**/*"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      cargo-patch-and-minor:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # Move the gRPC stack together (OPS-1011). Cargo 0.x 0.12→0.14 was
      # treated as a minor, so semver-major misses it (#512 / #514).
      - dependency-name: tonic
        versions: [">=0.13.0"]
      - dependency-name: tonic-build
        versions: [">=0.13.0"]
      - dependency-name: prost
        versions: [">=0.14.0"]
      - dependency-name: prost-types
        versions: [">=0.14.0"]
      # 0.30 pulls rustls 0.23, which needs an explicit CryptoProvider.
      - dependency-name: tokio-tungstenite
        update-types: ["version-update:semver-major"]
      # Isolated 0.x majors that leave sibling crates behind (OPS-1011).
      - dependency-name: syn
        update-types: ["version-update:semver-major"]
      - dependency-name: ecdsa
        update-types: ["version-update:semver-major"]
      - dependency-name: sha1
        update-types: ["version-update:semver-major"]
      # toggly-axum is 0.7; toggly-axum08 already covers 0.8 (#517).
      - dependency-name: axum
        versions: [">=0.8.0"]

  - package-ecosystem: gradle
    directories:
      - "**/*"
    exclude-paths:
      - "**/example/**"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      gradle-patch-and-minor:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # Android toolchain floor: AGP 8.7 / Gradle 8.10 / Kotlin 2.0 (OPS-872).
      # Kotlin 2.1+, AGP 8.13+/9, Gradle 9, and maven-publish 0.31+ are
      # deliberate upgrades. 0.34 already removed SonatypeHost.CENTRAL_PORTAL
      # (OPS-1011).
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.android.library"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.jetbrains.kotlin.*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.google.devtools.ksp"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.vanniktech.maven.publish"
        versions: [">=0.31.0"]
      # Compose BOM 2026.09.00 ships Compose 1.12, which requires AGP 9.1.
      - dependency-name: "androidx.compose:compose-bom"
        versions: [">=2026.01.00"]
      # androidx.core 1.19+ requires AGP 9.1 / compileSdk 37
      - dependency-name: "androidx.core:core-ktx"
        versions: [">=1.19.0"]
      - dependency-name: "androidx.core:core"
        versions: [">=1.19.0"]
      # kotlinx-coroutines 1.11+ ships Kotlin 2.2 metadata
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines-*"
        versions: [">=1.11.0"]
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-serialization-*"
        versions: [">=1.8.0"]
      # mockk 1.14 / Hilt 2.60 / Room 2.8 pull Kotlin 2.2 metadata while the
      # SDK compiles with Kotlin 2.0 (#519).
      - dependency-name: "io.mockk:mockk"
        versions: [">=1.14.0"]
      - dependency-name: "com.google.dagger:hilt-android"
        versions: [">=2.54.0"]
      - dependency-name: "com.google.dagger.hilt.android"
        versions: [">=2.54.0"]
      - dependency-name: "androidx.room:*"
        versions: [">=2.7.0"]

  - package-ecosystem: swift
    directory: "/Toggly.FeatureManagement.iOS"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
