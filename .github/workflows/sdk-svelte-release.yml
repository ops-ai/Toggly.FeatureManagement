name: Svelte SDK - Build & Publish

on:
  push:
    branches:
      - develop
    paths:
      - 'Toggly.FeatureManagement.Svelte/**'
      - '.github/workflows/sdk-svelte-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    defaults:
      run:
        working-directory: Toggly.FeatureManagement.Svelte/svelte-feature-flags-toggly

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Bump patch version
        id: version
        run: |
          # Bump version and capture the new version
          NEW_VERSION=$(npm version patch --no-git-tag-version)
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumped to version $NEW_VERSION"

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "${{ steps.import_gpg.outputs.name }}"
          git config user.email "${{ steps.import_gpg.outputs.email }}"
          git add Toggly.FeatureManagement.Svelte/svelte-feature-flags-toggly/package.json Toggly.FeatureManagement.Svelte/svelte-feature-flags-toggly/package-lock.json
          git commit -S -m "Bumped Svelte SDK to ${{ steps.version.outputs.new_version }} [skip ci]"
          git pull --rebase
          git push
