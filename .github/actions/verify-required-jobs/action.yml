name: Verify required jobs passed
description: >-
  Fail when any required upstream job failed, was cancelled, or is missing.
  Intentionally skipped reporting jobs (OWASP when run_reporting is false)
  may be listed in allow-skipped.

inputs:
  needs-json:
    description: JSON string from toJSON(needs)
    required: true
  required-jobs:
    description: Comma-separated job IDs that must succeed (e.g. test,smoke-test)
    required: true
  allow-skipped:
    description: >-
      Comma-separated job IDs that may be skipped (default: OWASP jobs that
      release workflows omit via run_reporting: false)
    required: false
    default: dependency-check,dependency-check-providers

runs:
  using: composite
  steps:
    - name: Verify required jobs passed
      shell: bash
      env:
        NEEDS_JSON: ${{ inputs.needs-json }}
        REQUIRED_JOBS: ${{ inputs.required-jobs }}
        ALLOW_SKIPPED: ${{ inputs.allow-skipped }}
      run: node "${GITHUB_ACTION_PATH}/verify-required-jobs.mjs"
