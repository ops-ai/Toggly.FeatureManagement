name: Android SDK - Release

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'publish = use manifest version; auto_bump = legacy CI bump'
        required: false
        default: 'publish'
        type: choice
        options:
          - publish
          - auto_bump
      bump_type:
        description: 'Bump type (only used when release_mode is auto_bump)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  SDK_ROOT: Toggly.FeatureManagement.Android

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      action: ${{ steps.release.outputs.action }}
      reason: ${{ steps.release.outputs.reason }}
      manifest_version: ${{ steps.release.outputs.manifest_version }}
      registry_latest: ${{ steps.release.outputs.registry_latest }}
      manifest_changed: ${{ steps.release.outputs.manifest_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        uses: ./.github/actions/resolve-release-version
        with:
          manifest_path: ${{ env.SDK_ROOT }}/build.gradle.kts
          manifest_type: gradle_kts
          registry: none
          package_name: io.toggly:toggly-android-core
          tag_prefix: android-sdk-v
          release_mode: ${{ github.event.inputs.release_mode || 'publish' }}
          bump_type: ${{ github.event.inputs.bump_type || 'patch' }}

  build-and-test:
    needs: validate
    if: needs.validate.outputs.action == 'publish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        working-directory: ${{ env.SDK_ROOT }}
        run: chmod +x gradlew

      - name: Build release
        working-directory: ${{ env.SDK_ROOT }}
        run: ./gradlew build -x test

      - name: Run tests
        working-directory: ${{ env.SDK_ROOT }}
        run: ./gradlew test

  publish:
    needs: [build-and-test, validate]
    if: needs.validate.outputs.action == 'publish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        working-directory: ${{ env.SDK_ROOT }}
        run: chmod +x gradlew

      - name: Decode GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          # Same secret is ASCII-armored for crazy-max/ghaction-import-gpg.
          # Older Android steps assumed base64; accept both.
          if printf '%s' "$GPG_PRIVATE_KEY" | grep -q "BEGIN PGP"; then
            printf '%s\n' "$GPG_PRIVATE_KEY" > "$HOME/secring.gpg"
          else
            printf '%s' "$GPG_PRIVATE_KEY" | base64 --decode > "$HOME/secring.gpg"
          fi

      - name: Publish to Maven Central
        working-directory: ${{ env.SDK_ROOT }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ needs.validate.outputs.version }}
        run: |
          ./gradlew publishAllPublicationsToMavenCentralRepository \
            -Pversion=${{ needs.validate.outputs.version }}

  release:
    needs: [publish, validate]
    if: needs.validate.outputs.action == 'publish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Configure git
        run: |
          git config user.name "${{ steps.import_gpg.outputs.name }}"
          git config user.email "${{ steps.import_gpg.outputs.email }}"

      - name: Commit version bump
        if: needs.validate.outputs.manifest_changed == 'true'
        run: |
          git add ${{ env.SDK_ROOT }}/build.gradle.kts
          git commit -S -m "Bumped Android SDK to v${{ needs.validate.outputs.version }} (auto_bump) [skip ci]"

          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if git pull --rebase --autostash origin develop; then
              if git push origin develop; then
                echo "Successfully pushed version bump"
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              sleep 2
            fi
          done

          echo "Failed to push after $MAX_RETRIES attempts"
          exit 1

      - name: Create and push tag
        run: |
          git tag -s -m "Android SDK v${{ needs.validate.outputs.version }}" "android-sdk-v${{ needs.validate.outputs.version }}"
          git push origin "android-sdk-v${{ needs.validate.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-sdk-v${{ needs.validate.outputs.version }}
          name: Android SDK v${{ needs.validate.outputs.version }}
          body: |
            ## Android SDK v${{ needs.validate.outputs.version }}

            ### Installation

            Add the dependency to your `build.gradle.kts`:

            ```kotlin
            dependencies {
                // Core module (required)
                implementation("io.toggly:toggly-android-core:${{ needs.validate.outputs.version }}")

                // UI modules (pick what you need)
                implementation("io.toggly:toggly-compose:${{ needs.validate.outputs.version }}")  // Jetpack Compose
                implementation("io.toggly:toggly-views:${{ needs.validate.outputs.version }}")    // Android Views

                // Storage modules (pick one)
                implementation("io.toggly:toggly-room:${{ needs.validate.outputs.version }}")      // Room database
                implementation("io.toggly:toggly-datastore:${{ needs.validate.outputs.version }}") // DataStore
            }
            ```

            ### Modules

            | Module | Description |
            |--------|-------------|
            | `toggly-android-core` | Core feature flag functionality with Kotlin coroutines |
            | `toggly-compose` | Jetpack Compose support with composables and state |
            | `toggly-views` | Traditional Android Views with ViewBinding and ViewModel |
            | `toggly-room` | Room database storage adapter |
            | `toggly-datastore` | AndroidX DataStore storage adapter |

            ### Requirements

            - Android 7.0+ (API level 24+)
            - Kotlin 1.9+
            - Java 17+
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    needs: [release, validate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Android SDK Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Action | ${{ needs.validate.outputs.action }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Manifest | ${{ needs.validate.outputs.manifest_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry latest | ${{ needs.validate.outputs.registry_latest || 'none' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release mode | ${{ github.event.inputs.release_mode || 'publish' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ needs.validate.outputs.reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | android-sdk-v${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-release | ${{ github.event.inputs.prerelease }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Maven Central Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- io.toggly:toggly-android-core:${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- io.toggly:toggly-compose:${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- io.toggly:toggly-views:${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- io.toggly:toggly-room:${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- io.toggly:toggly-datastore:${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
