name: JavaScript/TypeScript SDKs - Tests & Analysis
# OPS-1765: Angular host script-only pushes still need this workflow path matched.
# OPS-1765: keep path-filter PR triggers healthy when only Angular scripts change

concurrency:
  group: >-
    javascript-aggregate-${{
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) ||
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && format('develop-{0}', github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha) ||
      format('run-{0}', github.run_id)
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - develop
    paths:
      - 'Toggly.FeatureManagement.Angular/**'
      - 'Toggly.FeatureManagement.React/**'
      - 'tests/react-consumer-fixtures/**'
      - 'tests/docusaurus-consumer-fixtures/**'
      - 'Toggly.FeatureManagement.Vue/**'
      - 'Toggly.FeatureManagement.Svelte/**'
      - 'Toggly.FeatureManagement.SvelteKit/**'
      - 'Toggly.FeatureManagement.Solid/**'
      - 'Toggly.FeatureManagement.Astro/**'
      - 'Toggly.FeatureManagement.Gatsby/**'
      - 'toggly-docusaurus-edge-sdk/**'
      - 'Toggly.FeatureManagement.Javascript/**'
      - 'Toggly.FeatureManagement.Node/**'
      - 'Toggly.FeatureManagement.NestJS/**'
      - 'toggly-eval/**'
      - 'toggly-segments/**'
      - 'toggly-local-gates/**'
      - 'toggly-hooks-types/**'
      - 'toggly-client-telemetry/**'
      - 'tests/frontend-telemetry/**'
      - '.github/package-registry/analysis-js-filter.mjs'
      - 'toggly-signed-defs/**'
      - 'toggly-clarity-hook/**'
      - 'toggly-ga4-hook/**'
      - 'toggly-appinsights-hook/**'
      - '.github/workflows/analysis-javascript.yml'
      - '.github/scripts/javascript-sonar-aggregate.mjs'
      - '.github/scripts/organize-js-coverage*.mjs'
      - '.github/actions/build-shared-js-deps/**'
      - '.github/actions/upload-shared-js-deps/**'
      - '.github/actions/download-shared-js-deps/**'
      - '.github/actions/overlay-shared-js-deps/**'
      - '.github/workflows/javascript-aggregate-release-gate.yml'
      - '.github/workflows/verify-javascript-aggregate-release-gate.yml'
      - '.github/workflows/sdk-*-release.yml'
      - '.github/scripts/wait-javascript-aggregate-analysis.mjs'
      - '.github/package-registry/javascript-aggregate-release-gate-contract.test.mjs'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.Angular/**'
      - 'Toggly.FeatureManagement.React/**'
      - 'tests/react-consumer-fixtures/**'
      - 'tests/docusaurus-consumer-fixtures/**'
      - 'Toggly.FeatureManagement.Vue/**'
      - 'Toggly.FeatureManagement.Svelte/**'
      - 'Toggly.FeatureManagement.SvelteKit/**'
      - 'Toggly.FeatureManagement.Solid/**'
      - 'Toggly.FeatureManagement.Astro/**'
      - 'Toggly.FeatureManagement.Gatsby/**'
      - 'toggly-docusaurus-edge-sdk/**'
      - 'Toggly.FeatureManagement.Javascript/**'
      - 'Toggly.FeatureManagement.Node/**'
      - 'Toggly.FeatureManagement.NestJS/**'
      - 'toggly-eval/**'
      - 'toggly-segments/**'
      - 'toggly-local-gates/**'
      - 'toggly-hooks-types/**'
      - 'toggly-client-telemetry/**'
      - 'tests/frontend-telemetry/**'
      - '.github/package-registry/analysis-js-filter.mjs'
      - 'toggly-signed-defs/**'
      - 'toggly-clarity-hook/**'
      - 'toggly-ga4-hook/**'
      - 'toggly-appinsights-hook/**'
      - '.github/workflows/analysis-javascript.yml'
      - '.github/scripts/javascript-sonar-aggregate.mjs'
      - '.github/scripts/organize-js-coverage*.mjs'
      - '.github/actions/build-shared-js-deps/**'
      - '.github/actions/upload-shared-js-deps/**'
      - '.github/actions/download-shared-js-deps/**'
      - '.github/actions/overlay-shared-js-deps/**'
      - '.github/workflows/javascript-aggregate-release-gate.yml'
      - '.github/workflows/verify-javascript-aggregate-release-gate.yml'
      - '.github/workflows/sdk-*-release.yml'
      - '.github/scripts/wait-javascript-aggregate-analysis.mjs'
      - '.github/package-registry/javascript-aggregate-release-gate-contract.test.mjs'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact commit SHA to analyze (release gate dispatch)'
        required: false
        type: string

permissions:
  contents: read
  security-events: write

env:
  CHECKOUT_REF: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' && inputs.target_sha || github.sha }}

jobs:
  prepare:
    name: Prepare analysis filter
    runs-on: ubuntu-latest
    outputs:
      filter: ${{ steps.filter.outputs.filter }}
      need_shared_deps: ${{ steps.filter.outputs.need_shared_deps }}
      run_test: ${{ steps.filter.outputs.run_test }}
      run_test_node_server: ${{ steps.filter.outputs.run_test_node_server }}
      run_smoke_test: ${{ steps.filter.outputs.run_smoke_test }}
      run_smoke_test_node_server: ${{ steps.filter.outputs.run_smoke_test_node_server }}
      run_solidstart_host: ${{ steps.filter.outputs.run_solidstart_host }}
      run_test_current_browser_hosts: ${{ steps.filter.outputs.run_test_current_browser_hosts }}
      run_test_docusaurus_host: ${{ steps.filter.outputs.run_test_docusaurus_host }}
      run_test_astro_hosts: ${{ steps.filter.outputs.run_test_astro_hosts }}
      required_jobs: ${{ steps.filter.outputs.required_jobs }}
      test_matrix: ${{ steps.filter.outputs.test_matrix }}
      browser_host_matrix: ${{ steps.filter.outputs.browser_host_matrix }}
      sonar_project_key: ${{ steps.sonar_aggregate.outputs.sonar_project_key }}
      sonar_project_name: ${{ steps.sonar_aggregate.outputs.sonar_project_name }}
      sonar_sources: ${{ steps.sonar_aggregate.outputs.sonar_sources }}
      sonar_tests: ${{ steps.sonar_aggregate.outputs.sonar_tests }}
      sonar_manifest: ${{ steps.sonar_aggregate.outputs.sonar_manifest }}
      owasp_scan_paths: ${{ steps.sonar_aggregate.outputs.owasp_scan_paths }}
      sonar_npm_install_dirs: ${{ steps.sonar_aggregate.outputs.sonar_npm_install_dirs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - name: Resolve full SDK analysis matrix
        id: filter
        run: node .github/package-registry/analysis-js-filter.mjs all

      - name: Resolve aggregate Sonar configuration
        id: sonar_aggregate
        run: node .github/scripts/javascript-sonar-aggregate.mjs

  build-shared-js-deps:
    name: Build shared JS deps
    needs: [prepare]
    if: needs.prepare.outputs.need_shared_deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Build shared packages
        uses: ./.github/actions/build-shared-js-deps
        with:
          packages: hooks-types,signed-defs,eval,segments

      - name: Verify shared signed definitions and consumers
        working-directory: toggly-signed-defs
        run: |
          npm run test:coverage
          npm run typecheck
          npm run test:consumer
          printf '%s\n' 'coverage-Signed-Defs' > coverage/artifact-name.txt

      - name: Upload signed definitions coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-Signed-Defs
          path: toggly-signed-defs/coverage/
          retention-days: 7
          if-no-files-found: error

      - name: Install browser for JWKS CORS regression
        run: |
          npm install --prefix "$RUNNER_TEMP/toggly-jwks-browser" --no-save --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/toggly-jwks-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: Verify signed JWKS requests with real browser CORS
        working-directory: toggly-signed-defs
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/toggly-jwks-browser/node_modules/playwright/index.mjs
        run: npm run test:browser

      - name: Upload shared package dist artifacts
        uses: ./.github/actions/upload-shared-js-deps

  test:
    name: Test ${{ matrix.sdk }}
    needs: [prepare, build-shared-js-deps]
    if: |
      always() &&
      needs.prepare.outputs.run_test == 'true' &&
      (needs.prepare.outputs.need_shared_deps != 'true' || needs.build-shared-js-deps.result == 'success')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.test_matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0  # Full history for SonarCloud

      # NestJS / SvelteKit need pnpm to build in-repo toggly-node-core.
      - name: Install pnpm
        if: matrix.sdk == 'NestJS' || matrix.sdk == 'SvelteKit'
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version || 'lts/*' }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.path }}/package*.json

      - name: Restore shared JS deps
        if: needs.prepare.outputs.need_shared_deps == 'true'
        uses: ./.github/actions/download-shared-js-deps

      # SvelteKit links file: toggly-node-core; build dist before npm ci resolves the link.
      - name: Build unpublished Node server deps for SvelteKit
        if: matrix.sdk == 'SvelteKit'
        run: |
          set -euo pipefail
          (cd toggly-segments && (npm ci || npm install) && npm run build)
          (cd toggly-eval && (npm ci || npm install) && npm run build)
          (cd Toggly.FeatureManagement.Node && pnpm install --frozen-lockfile && pnpm --filter @ops-ai/toggly-node-core build)

      - name: Install locked SolidJS or SvelteKit dependencies
        if: matrix.sdk == 'SolidJS' || matrix.sdk == 'SvelteKit'
        uses: ./.github/actions/install-local-client-telemetry
        with:
          package-dir: ${{ matrix.path }}

      - name: Install locked standalone package dependencies
        if: matrix.sdk == 'Gatsby' || matrix.sdk == 'Client-Core'
        uses: ./.github/actions/install-local-client-telemetry
        with:
          package-dir: ${{ matrix.path }}

      - name: Install locked Client-Telemetry / Evaluator / Local-Gates dependencies
        if: matrix.sdk == 'Client-Telemetry' || matrix.sdk == 'Evaluator' || matrix.sdk == 'Local-Gates'
        working-directory: ${{ matrix.path }}
        run: npm ci

      - name: Install dependencies
        if: matrix.sdk != 'SolidJS' && matrix.sdk != 'SvelteKit' && matrix.sdk != 'Gatsby' && matrix.sdk != 'Client-Telemetry' && matrix.sdk != 'Client-Core' && matrix.sdk != 'Evaluator' && matrix.sdk != 'Local-Gates' && matrix.sdk != 'NestJS'
        uses: ./.github/actions/install-local-client-telemetry
        with:
          package-dir: ${{ matrix.path }}

      # NestJS depends on unpublished @ops-ai/toggly-node-core from this PR.
      # OPS-1696 packed tarball paths use absolute RUNNER_TEMP artifacts
      # Build via pnpm, then install packed tarballs (pnpm pack rewrites workspace
      # protocol) so npm does not see workspace:^ or wait for registry publish.
      - name: Install NestJS with in-repo toggly-node-core
        if: matrix.sdk == 'NestJS'
        run: |
          set -euo pipefail
          EVAL_DIR="$GITHUB_WORKSPACE/toggly-eval"
          SEGMENTS_DIR="$GITHUB_WORKSPACE/toggly-segments"
          NODE_WS="$GITHUB_WORKSPACE/Toggly.FeatureManagement.Node"
          (cd "$EVAL_DIR" && (npm ci || npm install) && npm run build)
          (cd "$SEGMENTS_DIR" && (npm ci || npm install) && npm run build)
          (cd "$NODE_WS" && pnpm install --frozen-lockfile && pnpm --filter @ops-ai/toggly-node-core build)
          # pnpm 9 rejects --filter pack (Unknown option: recursive); pack in-package.
          (cd "$NODE_WS/toggly-node-core" && pnpm pack --pack-destination "$RUNNER_TEMP")
          CORE_TGZ="$(ls -1 "$RUNNER_TEMP"/ops-ai-toggly-node-core-*.tgz | head -1)"
          test -f "$CORE_TGZ"
          echo "TOGGLY_TEST_CORE_TARBALL=$CORE_TGZ" >> "$GITHUB_ENV"
          (cd "$EVAL_DIR" && npm pack --pack-destination "$RUNNER_TEMP" >/dev/null)
          EVAL_TGZ="$(ls -1 "$RUNNER_TEMP"/ops-ai-toggly-eval-*.tgz | head -1)"
          test -f "$EVAL_TGZ"
          echo "TOGGLY_TEST_EVAL_TARBALL=$EVAL_TGZ" >> "$GITHUB_ENV"
          (cd "$SEGMENTS_DIR" && npm pack --pack-destination "$RUNNER_TEMP" >/dev/null)
          SEGMENTS_TGZ="$(ls -1 "$RUNNER_TEMP"/ops-ai-toggly-segments-*.tgz | head -1)"
          test -f "$SEGMENTS_TGZ"
          echo "TOGGLY_TEST_SEGMENTS_TARBALL=$SEGMENTS_TGZ" >> "$GITHUB_ENV"
          cd Toggly.FeatureManagement.NestJS
          # --no-save: do not rewrite package.json to file:../../_temp paths
          # (npm pack in check-packed would otherwise ship those broken relatives).
          npm install --no-save "$CORE_TGZ" "$EVAL_TGZ" "$SEGMENTS_TGZ"

      - name: Overlay shared JS deps into node_modules
        if: >
          needs.prepare.outputs.need_shared_deps == 'true' &&
          matrix.sdk != 'SolidJS' &&
          matrix.sdk != 'SvelteKit' &&
          matrix.sdk != 'Client-Telemetry' &&
          matrix.sdk != 'Client-Core' &&
          matrix.sdk != 'Local-Gates' &&
          matrix.sdk != 'NestJS'
        uses: ./.github/actions/overlay-shared-js-deps
        with:
          package-dir: ${{ matrix.path }}

      - name: Build package (if needed)
        working-directory: ${{ matrix.path }}
        run: npm run build --if-present

      - name: Run TypeScript type check
        working-directory: ${{ matrix.path }}
        run: npm run typecheck --if-present

      - name: Run linter
        if: matrix.has-lint == true
        working-directory: ${{ matrix.path }}
        run: npm run lint

      - name: Select system Chrome for packed Client Core
        if: matrix.sdk == 'Client-Core'
        run: |
          test -x /usr/bin/google-chrome
          echo "CHROME_BIN=/usr/bin/google-chrome" >> "$GITHUB_ENV"

      - name: Run tests with coverage
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.test-cmd }}

      - name: Verify packed React consumers in Chrome
        if: matrix.sdk == 'React'
        working-directory: ${{ matrix.path }}
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          test -x "$CHROME_BIN"
          npm run test:consumers

      - name: Verify packed Angular consumers in Chrome
        if: matrix.sdk == 'Angular'
        working-directory: ${{ matrix.path }}
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          test -x "$CHROME_BIN"
          npm run test:hosts

      - name: Install Chromium for packed SvelteKit host
        if: matrix.sdk == 'SvelteKit'
        working-directory: ${{ matrix.path }}
        run: npx playwright install --with-deps chromium

      - name: Verify packed SvelteKit host
        if: matrix.sdk == 'SvelteKit'
        working-directory: ${{ matrix.path }}
        run: npm run test:host

      - name: Require unit test coverage report
        if: matrix.sdk != 'Docusaurus'
        working-directory: ${{ matrix.path }}
        run: find coverage -name lcov.info -size +0c -print -quit | grep -q .

      - name: Label coverage artifact
        if: matrix.sdk != 'Docusaurus'
        working-directory: ${{ matrix.path }}
        run: printf '%s\n' 'coverage-${{ matrix.sdk }}' > coverage/artifact-name.txt

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: matrix.sdk != 'Docusaurus'
        with:
          name: coverage-${{ matrix.sdk }}
          path: ${{ matrix.path }}/coverage/
          retention-days: 7
          if-no-files-found: error

  test-docusaurus-host:
    name: Current Docusaurus packed production host (Node 24)
    needs: [prepare]
    if: needs.prepare.outputs.run_test_docusaurus_host == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: |
            toggly-docusaurus-edge-sdk/libs/docusaurus-plugin/package-lock.json
            toggly-docusaurus-edge-sdk/cloudflare/pages-function/package-lock.json
      - name: Install locked plugin dependencies
        working-directory: toggly-docusaurus-edge-sdk/libs/docusaurus-plugin
        run: npm ci
      - name: Verify plugin types and coverage
        working-directory: toggly-docusaurus-edge-sdk/libs/docusaurus-plugin
        run: npm run typecheck && npm run test:coverage
      - name: Label Docusaurus plugin coverage artifact
        working-directory: toggly-docusaurus-edge-sdk/libs/docusaurus-plugin
        run: |
          test -s coverage/lcov.info
          printf '%s\n' 'coverage-Docusaurus' > coverage/artifact-name.txt
      - name: Upload Docusaurus plugin coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-Docusaurus
          path: toggly-docusaurus-edge-sdk/libs/docusaurus-plugin/coverage/
          retention-days: 7
          if-no-files-found: error
      - name: Install locked Pages Function dependencies
        working-directory: toggly-docusaurus-edge-sdk/cloudflare/pages-function
        run: npm ci
      - name: Verify Pages Function types, lint, and runtime coverage
        working-directory: toggly-docusaurus-edge-sdk/cloudflare/pages-function
        run: npm run typecheck && npm run lint && npm run test:coverage
      - name: Label Pages Function coverage artifact
        working-directory: toggly-docusaurus-edge-sdk/cloudflare/pages-function
        run: |
          test -s coverage/lcov.info
          printf '%s\n' 'coverage-Docusaurus-Pages' > coverage/artifact-name.txt
      - name: Upload Pages Function coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-Docusaurus-Pages
          path: toggly-docusaurus-edge-sdk/cloudflare/pages-function/coverage/
          retention-days: 7
          if-no-files-found: error
      - name: Verify packed Docusaurus production and browser gates
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/docusaurus-consumer-fixtures/packed-host.mjs

  test-astro-hosts:
    name: Astro ${{ matrix.astro-major }} packed host (Node 24)
    needs: [prepare]
    if: needs.prepare.outputs.run_test_astro_hosts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        astro-major: ['5', '6', '7']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: Toggly.FeatureManagement.Astro/package-lock.json

      - name: Build toggly-segments
        run: |
          set -euo pipefail
          (cd toggly-segments && (npm ci || npm install) && npm run build)

      - name: Install locked Astro SDK dependencies
        working-directory: Toggly.FeatureManagement.Astro
        run: npm ci

      - name: Build Astro SDK
        working-directory: Toggly.FeatureManagement.Astro
        run: npm run build

      - name: Install Chromium for packed Astro host
        working-directory: Toggly.FeatureManagement.Astro
        run: npx --yes @playwright/test@1.61.1 install --with-deps chromium

      - name: Verify packed Astro ${{ matrix.astro-major }} host
        working-directory: Toggly.FeatureManagement.Astro
        env:
          ASTRO_MAJOR: ${{ matrix.astro-major }}
        run: npm run test:host

  test-current-browser-hosts:
    name: Current ${{ matrix.host.sdk }} packed host (Node ${{ matrix.node-version }})
    needs: [prepare]
    if: needs.prepare.outputs.run_test_current_browser_hosts == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.browser_host_matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Install pnpm
        if: matrix.host.sdk == 'SvelteKit'
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ${{ matrix.host.path }}/package-lock.json

      - name: Build unpublished Node server deps
        if: matrix.host.sdk == 'SvelteKit'
        run: |
          set -euo pipefail
          (cd toggly-segments && (npm ci || npm install) && npm run build)
          (cd toggly-eval && (npm ci || npm install) && npm run build)
          (cd Toggly.FeatureManagement.Node && pnpm install --frozen-lockfile && pnpm --filter @ops-ai/toggly-node-core build)

      - name: Install locked dependencies with local client-telemetry
        uses: ./.github/actions/install-local-client-telemetry
        with:
          package-dir: ${{ matrix.host.path }}

      - name: Install Chromium for packed SvelteKit host
        if: matrix.host.browser
        working-directory: ${{ matrix.host.path }}
        run: npx playwright install --with-deps chromium

      - name: Verify packed host
        working-directory: ${{ matrix.host.path }}
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:host

  test-node-server:
    name: Test Node.js Server ${{ matrix.config.package }} (Node ${{ matrix.node-version }})
    needs: [prepare, build-shared-js-deps]
    if: |
      always() &&
      needs.prepare.outputs.run_test_node_server == 'true' &&
      (needs.prepare.outputs.need_shared_deps != 'true' || needs.build-shared-js-deps.result == 'success')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18.x', '20.x', '22.x']
        config:
          - { package: Core, dir: toggly-node-core }
          - { package: Express, dir: toggly-express }
          - { package: Fastify, dir: toggly-fastify }
          - { package: Hono, dir: toggly-hono }
          - { package: Koa, dir: toggly-koa }
        include:
          # Exercise the explicit ECDSA hash contract on the current Node runtime.
          - node-version: '24.x'
            config: { package: Core, dir: toggly-node-core }
          # Exercise packed current framework hosts on maintained Node lines.
          - node-version: '24.x'
            config: { package: Express, dir: toggly-express }
          - node-version: '24.x'
            config: { package: Hono, dir: toggly-hono }
          - node-version: '26.x'
            config: { package: Express, dir: toggly-express }
          - node-version: '26.x'
            config: { package: Hono, dir: toggly-hono }

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      # Install pnpm before setup-node so action-setup uses the runner Node,
      # not matrix Node 18 (pnpm/action-setup@v6 @pnpm/exe breaks on 18).
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: Toggly.FeatureManagement.Node/pnpm-lock.yaml

      - name: Restore shared JS deps
        uses: ./.github/actions/download-shared-js-deps

      - name: Install dependencies
        working-directory: Toggly.FeatureManagement.Node
        run: pnpm install

      - name: Overlay shared JS deps into pnpm store
        if: needs.prepare.outputs.need_shared_deps == 'true'
        uses: ./.github/actions/overlay-shared-js-deps
        with:
          pnpm-store-dir: Toggly.FeatureManagement.Node

      - name: Build all packages
        working-directory: Toggly.FeatureManagement.Node
        run: pnpm -r build

      - name: Run tests with coverage
        working-directory: Toggly.FeatureManagement.Node/${{ matrix.config.dir }}
        run: pnpm test:coverage

      - name: Run packed host compatibility fixture
        if: (matrix.config.package == 'Fastify' && matrix.node-version == '20.x') || ((matrix.node-version == '24.x' || matrix.node-version == '26.x') && (matrix.config.package == 'Express' || matrix.config.package == 'Hono'))
        working-directory: Toggly.FeatureManagement.Node/${{ matrix.config.dir }}
        run: pnpm test:hosts

      - name: Label coverage artifact
        if: matrix.node-version == '20.x'
        working-directory: Toggly.FeatureManagement.Node/${{ matrix.config.dir }}
        run: |
          test -s coverage/lcov.info
          printf '%s\n' 'coverage-Node-${{ matrix.config.package }}' > coverage/artifact-name.txt

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: matrix.node-version == '20.x'
        with:
          name: coverage-Node-${{ matrix.config.package }}
          path: Toggly.FeatureManagement.Node/${{ matrix.config.dir }}/coverage/
          retention-days: 7
          if-no-files-found: error

  smoke-test:
    name: Smoke Test ${{ matrix.sdk }}
    needs: [prepare, build-shared-js-deps]
    if: |
      always() &&
      needs.prepare.outputs.run_smoke_test == 'true' &&
      (needs.prepare.outputs.need_shared_deps != 'true' || needs.build-shared-js-deps.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: Angular
            path: Toggly.FeatureManagement.Angular
            smoke-cmd: npm test -- ngx-feature-flags-toggly --watch=false --browsers=ChromeHeadless --ts-config=projects/ngx-feature-flags-toggly/tsconfig.smoke.spec.json --include="projects/ngx-feature-flags-toggly/src/lib/smoke.spec.ts" --include="projects/ngx-feature-flags-toggly/src/lib/smoke-ws.spec.ts"
          - sdk: React
            path: Toggly.FeatureManagement.React
            smoke-cmd: npx jest --config jest.smoke.config.js --runInBand --forceExit
          - sdk: Vue
            path: Toggly.FeatureManagement.Vue/vue-feature-flags-toggly
            smoke-cmd: npx vitest run --config vitest.smoke.config.ts src/__tests__/smoke.spec.ts src/__tests__/smoke-ws.spec.ts
          - sdk: Svelte
            path: Toggly.FeatureManagement.Svelte/svelte-feature-flags-toggly
            smoke-cmd: npx vitest run --config vitest.smoke.config.ts src/__tests__/smoke.spec.ts src/__tests__/smoke-ws.spec.ts
          - sdk: Astro
            path: Toggly.FeatureManagement.Astro
            smoke-cmd: npx vitest run --config vitest.smoke.config.ts src/__tests__/smoke.spec.ts src/__tests__/smoke-ws.spec.ts
          - sdk: JavaScript
            path: Toggly.FeatureManagement.Javascript/feature_flags_toggly
            smoke-cmd: npx jest spec/smoke.test.ts spec/smoke-ws.test.ts --runInBand --forceExit --testPathIgnorePatterns='/node_modules/'
          - sdk: Docusaurus
            path: toggly-docusaurus-edge-sdk/libs/docusaurus-plugin
            smoke-cmd: npm run build && node smoke.mjs && node smoke-ws.mjs

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Restore shared JS deps
        uses: ./.github/actions/download-shared-js-deps

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: npm ci || npm install

      - name: Overlay shared JS deps into node_modules
        uses: ./.github/actions/overlay-shared-js-deps
        with:
          package-dir: ${{ matrix.path }}

      - name: Run smoke test
        timeout-minutes: 2
        working-directory: ${{ matrix.path }}
        env:
          TOGGLY_SMOKE_APP_KEY_FRONTEND: ${{ secrets.TOGGLY_SMOKE_APP_KEY_FRONTEND }}
        run: ${{ matrix.smoke-cmd }}

  smoke-test-node-server:
    name: Smoke Test Node Server Core
    needs: [prepare, build-shared-js-deps]
    if: |
      always() &&
      needs.prepare.outputs.run_smoke_test_node_server == 'true' &&
      (needs.prepare.outputs.need_shared_deps != 'true' || needs.build-shared-js-deps.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: Toggly.FeatureManagement.Node/pnpm-lock.yaml

      - name: Restore shared JS deps
        uses: ./.github/actions/download-shared-js-deps

      - name: Install dependencies
        working-directory: Toggly.FeatureManagement.Node
        run: pnpm install

      - name: Overlay shared JS deps into pnpm store
        if: needs.prepare.outputs.need_shared_deps == 'true'
        uses: ./.github/actions/overlay-shared-js-deps
        with:
          pnpm-store-dir: Toggly.FeatureManagement.Node

      - name: Build all packages
        working-directory: Toggly.FeatureManagement.Node
        run: pnpm -r build

      - name: Run node-core smoke test
        timeout-minutes: 2
        working-directory: Toggly.FeatureManagement.Node/toggly-node-core
        env:
          TOGGLY_SMOKE_APP_KEY_BACKEND: ${{ secrets.TOGGLY_SMOKE_APP_KEY_BACKEND }}
        run: pnpm vitest run --config vitest.smoke.config.ts tests/smoke.test.ts tests/smoke-ws.test.ts

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [prepare, build-shared-js-deps, test, test-node-server, test-docusaurus-host, dependency-check]
    if: |
      always() &&
      (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0  # Full history for better analysis

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Restore shared JS deps
        if: needs.build-shared-js-deps.result == 'success'
        uses: ./.github/actions/download-shared-js-deps

      - name: Install dependencies for TypeScript analysis
        env:
          SONAR_NPM_INSTALL_DIRS: ${{ needs.prepare.outputs.sonar_npm_install_dirs }}
        run: |
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            echo "Installing dependencies in $dir"
            npm install --ignore-scripts --no-audit --no-fund --prefix "$dir" || true
          done <<< "$SONAR_NPM_INSTALL_DIRS"
          echo "Installing Node.js server SDK dependencies"
          pnpm install --ignore-scripts --dir Toggly.FeatureManagement.Node || true
          echo "Installing toggly-docusaurus-edge-sdk workspace dependencies"
          pnpm install --ignore-scripts --dir toggly-docusaurus-edge-sdk || true
        continue-on-error: true

      - name: Download all coverage reports
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-artifacts/

      - name: Organize coverage files
        env:
          REQUIRE_FULL_JS_COVERAGE: 'true'
        run: node .github/scripts/organize-js-coverage.mjs

      - name: Resolve Sonar project version
        id: sonar_version
        uses: ./.github/actions/sonar-project-version
        with:
          manifest: ${{ needs.prepare.outputs.sonar_manifest }}
          suffix: ${{ vars.SONAR_PROJECT_VERSION_SUFFIX }}

      - name: Validate SonarCloud credentials
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
