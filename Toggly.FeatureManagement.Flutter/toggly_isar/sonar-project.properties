# SonarCloud Configuration for the Toggly Isar cache provider
# This configuration can be used for local analysis

sonar.projectKey=toggly-sdks-flutter-isar
sonar.organization=ops-ai
sonar.projectName=Toggly SDKs - Flutter Isar Cache

# Source and test directories
sonar.sources=lib
sonar.tests=test

# Exclusions
sonar.exclusions=**/.*/**,**/example/**,**/*.g.dart,**/*.freezed.dart,**/*.config.dart,**/android/**,**/ios/**,**/web/**,**/linux/**,**/macos/**,**/windows/**

# Coverage report path (LCOV format)
sonar.dart.lcov.reportPaths=coverage/lcov.info

# Language settings
sonar.sourceEncoding=UTF-8

# Dart/Flutter specific settings
sonar.language=dart
