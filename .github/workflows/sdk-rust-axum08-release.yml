name: Rust Axum 0.8 SDK - Build & Publish

on:
  push:
    branches:
      - develop
    paths:
      - 'toggly-rust/toggly-axum08/**'
      - '.github/workflows/sdk-rust-axum08-release.yml'
      - '.github/workflows/analysis-rust.yml'
      - '.github/actions/resolve-release-version/**'
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'publish = use the package manifest version'
        required: false
        default: 'publish'
        type: choice
        options:
          - publish

permissions:
  contents: write
  id-token: write
  security-events: write

concurrency:
  group: rust-axum08-sdk-release
  cancel-in-progress: false

env:
  SDK_ROOT: toggly-rust
  PACKAGE: toggly-axum08
  MANIFEST: toggly-rust/toggly-axum08/Cargo.toml

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.release.outputs.action }}
    steps:
      - uses: actions/checkout@v7
      - id: release
        uses: ./.github/actions/resolve-release-version
        with:
          manifest_path: ${{ env.MANIFEST }}
          registry: crates
          package_name: toggly-axum08
          release_mode: publish

  # toggly-axum08 is covered by analysis-rust.yml's shared workspace test job.
  gates:
    needs: validate
    if: needs.validate.outputs.action == 'publish'
    uses: ./.github/workflows/analysis-rust.yml
    with:
      run_reporting: false
    secrets: inherit

  release:
    needs: [validate, gates]
    if: needs.validate.outputs.action == 'publish' && needs.gates.result == 'success'
    runs-on: ubuntu-latest
    environment: crates-publish
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates_auth
      - name: Publish Axum 0.8 adapter
        working-directory: toggly-rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token }}
        run: cargo publish -p toggly-axum08
