# SonarQube Configuration for React Router Toggly SDK
sonar.projectKey=toggly-sdks-react-router
sonar.projectName=Toggly SDKs - React Router
sonar.projectVersion=1.0.1
sonar.sources=react-router-toggly/src
sonar.tests=react-router-toggly/tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/fixtures/**
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=react-router-toggly/coverage/lcov.info
sonar.typescript.tsconfigPaths=react-router-toggly/tsconfig.json
sonar.sourceEncoding=UTF-8
sonar.cpd.exclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx
