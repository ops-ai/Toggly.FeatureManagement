name: Elixir SDK family - native analysis
on:
  pull_request:
    branches: [develop, main]
    paths: ['toggly-elixir/**', 'docs/filter-parity/**', '.github/workflows/analysis-elixir.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      run_reporting:
        description: 'When false, skip Sonar and OWASP reporting jobs'
        type: boolean
        default: true
permissions:
  contents: read
  security-events: write
jobs:
  native-analysis:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toggly-elixir
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          elixir-version: '1.20.4'
      - run: mix deps.get --check-locked
      - run: mix hex.audit
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - name: Test generic coverage exporter
        run: elixir tools/sonar_coverage_test.exs
      - name: Export native coverage for every package
        run: mix test --cover --export-coverage sonar
      # Export mode skips Mix's threshold check. Enforce each package's
      # unchanged threshold before exporting or uploading any report.
      - name: Enforce per-package native coverage gates
        run: mix cmd mix test.coverage
      - name: Generate Sonar generic coverage artifacts
        run: elixir -r tools/sonar_coverage.ex -e 'Toggly.SonarCoverage.run()'
      - name: Build all standalone Hex artifacts
        run: python3 tools/build-packages.py
      - uses: actions/upload-artifact@v7
        with:
          name: elixir-native-coverage-and-packages
          if-no-files-found: error
          path: |
            toggly-elixir/apps/*/cover/
            toggly-elixir/apps/*/*.tar
      - name: Analysis scope
        run: echo 'Native Elixir format, compiler, ExUnit and >90% coverage gates passed. SonarCloud has no native Elixir analyzer; no Sonar verdict is claimed.' >> "$GITHUB_STEP_SUMMARY"
