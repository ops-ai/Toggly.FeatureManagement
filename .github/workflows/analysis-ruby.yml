name: Ruby SDKs - Tests & Analysis

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'toggly-ruby/**'
      - '.github/workflows/analysis-ruby.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'toggly-ruby/**'
      - '.github/workflows/analysis-ruby.yml'
  workflow_dispatch:

env:
  SDK_ROOT: toggly-ruby

jobs:
  test-core:
    name: Test toggly (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ${{ env.SDK_ROOT }}/toggly

      - name: Run tests
        working-directory: ${{ env.SDK_ROOT }}/toggly
        run: bundle exec rspec --format documentation

      - name: Upload coverage (Ruby 3.3 only)
        if: matrix.ruby == '3.3'
        uses: actions/upload-artifact@v4
        with:
          name: ruby-coverage-core
          path: ${{ env.SDK_ROOT }}/toggly/coverage/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ${{ env.SDK_ROOT }}/toggly

      - name: Run smoke tests
        timeout-minutes: 2
        working-directory: ${{ env.SDK_ROOT }}/toggly
        env:
          TOGGLY_SMOKE_APP_KEY_BACKEND: ${{ secrets.TOGGLY_SMOKE_APP_KEY_BACKEND }}
          DISABLE_SIMPLECOV: "true"
        run: bundle exec rspec spec/toggly/smoke_spec.rb --format documentation

  test-rails:
    name: Test toggly-rails (Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails }})
    runs-on: ubuntu-latest
    env:
      RAILS_VERSION: "~> ${{ matrix.rails }}"
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4']
        rails: ['7.0', '7.1', '7.2', '8.0']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          working-directory: ${{ env.SDK_ROOT }}/toggly-rails

      - name: Install dependencies
        working-directory: ${{ env.SDK_ROOT }}/toggly-rails
        run: |
          bundle config set frozen false
          bundle install --jobs 4

      - name: Run tests
        working-directory: ${{ env.SDK_ROOT }}/toggly-rails
        run: bundle exec rspec --format documentation
        continue-on-error: true

      - name: Upload coverage (Ruby 3.3, Rails 8.0 only)
        if: matrix.ruby == '3.3' && matrix.rails == '8.0'
        uses: actions/upload-artifact@v4
        with:
          name: ruby-coverage-rails
          path: ${{ env.SDK_ROOT }}/toggly-rails/coverage/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  test-cache:
    name: Test toggly-cache (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4']

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ${{ env.SDK_ROOT }}/toggly-cache

      - name: Run tests
        working-directory: ${{ env.SDK_ROOT }}/toggly-cache
        run: bundle exec rspec --format documentation
        env:
          REDIS_URL: redis://localhost:6379
        continue-on-error: true

      - name: Upload coverage (Ruby 3.3 only)
        if: matrix.ruby == '3.3'
        uses: actions/upload-artifact@v4
        with:
          name: ruby-coverage-cache
          path: ${{ env.SDK_ROOT }}/toggly-cache/coverage/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ${{ env.SDK_ROOT }}/toggly

      - name: Run RuboCop on toggly
        working-directory: ${{ env.SDK_ROOT }}/toggly
        run: bundle exec rubocop --parallel

      - name: Install toggly-rails dependencies
        working-directory: ${{ env.SDK_ROOT }}/toggly-rails
        run: bundle install --jobs 4

      - name: Run RuboCop on toggly-rails
        working-directory: ${{ env.SDK_ROOT }}/toggly-rails
        run: bundle exec rubocop --parallel

      - name: Install toggly-cache dependencies
        working-directory: ${{ env.SDK_ROOT }}/toggly-cache
        run: bundle install --jobs 4

      - name: Run RuboCop on toggly-cache
        working-directory: ${{ env.SDK_ROOT }}/toggly-cache
        run: bundle exec rubocop --parallel

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [test-core, test-rails, test-cache, dependency-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download core coverage
        uses: actions/download-artifact@v4
        with:
          name: ruby-coverage-core
          path: coverage-artifacts/core/
        continue-on-error: true

      - name: Download rails coverage
        uses: actions/download-artifact@v4
        with:
          name: ruby-coverage-rails
          path: coverage-artifacts/rails/
        continue-on-error: true

      - name: Download cache coverage
        uses: actions/download-artifact@v4
        with:
          name: ruby-coverage-cache
          path: coverage-artifacts/cache/
        continue-on-error: true

      - name: Organize coverage files
        run: |
          mkdir -p coverage
          for pkg in core rails cache; do
            json=$(find coverage-artifacts/$pkg -name "coverage.json" 2>/dev/null | head -1)
            if [ -n "$json" ]; then
              cp "$json" "coverage/$pkg-coverage.json"
              echo "Found coverage for $pkg: $json"
            else
              echo "No coverage found for $pkg"
            fi
          done
          echo "Coverage files:"
          ls -la coverage/ || echo "No coverage files found"
        continue-on-error: true

      - name: Convert coverage format for SonarQube
        run: |
          for pkg in core rails cache; do
            file="coverage/${pkg}-coverage.json"
            if [ -f "$file" ]; then
              tmp=$(mktemp)
              # Convert {lines: [...], branches: {...}} per-file values to flat arrays,
              # which is the format the SonarQube Ruby sensor parses correctly.
              jq '.coverage |= with_entries(.value |= if type == "object" and has("lines") then .lines else . end)' \
                "$file" > "$tmp" && mv "$tmp" "$file"
              echo "Converted ${pkg} coverage format"
              first=$(jq -r '.coverage | keys[0]' "$file")
              echo "  Sample path: $first"
              echo "  Sample lines (first 5): $(jq -c '.coverage[.coverage | keys[0]][:5]' "$file")"
            else
              echo "No coverage file for ${pkg}"
            fi
          done
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-ruby
            -Dsonar.organization=ops-ai
            -Dsonar.projectName="Toggly SDKs - Ruby"
            -Dsonar.sources=${{ env.SDK_ROOT }}
            -Dsonar.exclusions=**/vendor/**,**/spec/**,**/test/**,**/coverage/**,**/*.gemspec
            -Dsonar.tests=${{ env.SDK_ROOT }}
            -Dsonar.test.inclusions=**/spec/**,**/test/**
            -Dsonar.ruby.coverage.reportPaths=coverage/core-coverage.json,coverage/rails-coverage.json,coverage/cache-coverage.json
            -Dsonar.verbose=true
        continue-on-error: true

      - name: Download Dependency Check report (for SonarQube Server)
        uses: actions/download-artifact@v4
        with:
          name: dependency-check-report-ruby
          path: dependency-check-reports/
        continue-on-error: true

      - name: SonarQube Server Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-ruby
            -Dsonar.projectName="Toggly SDKs - Ruby"
            -Dsonar.sources=${{ env.SDK_ROOT }}
            -Dsonar.exclusions=**/vendor/**,**/spec/**,**/test/**,**/coverage/**,**/*.gemspec
            -Dsonar.tests=${{ env.SDK_ROOT }}
            -Dsonar.test.inclusions=**/spec/**,**/test/**
            -Dsonar.ruby.coverage.reportPaths=coverage/core-coverage.json,coverage/rails-coverage.json,coverage/cache-coverage.json
            -Dsonar.dependencyCheck.reportPath=dependency-check-reports/dependency-check-report.xml
            -Dsonar.verbose=true
        continue-on-error: true

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache OWASP Dependency Check database
        uses: actions/cache@v4
        with:
          path: /home/runner/OWASP-Dependency-Check/data/
          key: dependency-check-db-${{ runner.os }}-v6
          restore-keys: |
            dependency-check-db-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'toggly-sdks-ruby'
          path: ${{ env.SDK_ROOT }}
          format: 'ALL'
          args: >-
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableExperimental
            --disableAssembly
            --disableNodeJS
            --disableNodeAudit
            --disablePyPkg
            --disablePyDist
        continue-on-error: true

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report-ruby
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
        continue-on-error: true

  summary:
    name: Analysis Summary
    runs-on: ubuntu-latest
    needs: [test-core, smoke-test, test-rails, test-cache, lint, sonar, dependency-check]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## Ruby SDK Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Analysis workflow completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages Analyzed" >> $GITHUB_STEP_SUMMARY
          echo "- toggly (Core)" >> $GITHUB_STEP_SUMMARY
          echo "- toggly-rails" >> $GITHUB_STEP_SUMMARY
          echo "- toggly-cache" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Ruby Versions Tested" >> $GITHUB_STEP_SUMMARY
          echo "- 3.2, 3.3, 3.4" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Rails Versions Tested" >> $GITHUB_STEP_SUMMARY
          echo "- 7.0, 7.1, 7.2, 8.0" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarCloud for detailed results: https://sonarcloud.io/project/overview?id=toggly-sdks-ruby" >> $GITHUB_STEP_SUMMARY
          echo "Check SonarQube Server for detailed results: ${{ secrets.SONAR_HOST_URL }}/dashboard?id=toggly-sdks-ruby" >> $GITHUB_STEP_SUMMARY
