name: Go SDK - Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  SDK_ROOT: toggly-go

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      bump_type: ${{ steps.version.outputs.bump_type }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version from bump type
        id: version
        run: |
          BUMP_TYPE="${{ github.event.inputs.bump_type || 'patch' }}"

          LATEST_TAG=$(git tag -l "toggly-go/v*" --sort=-version:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            CURRENT_VERSION="0.0.0"
          else
            CURRENT_VERSION="${LATEST_TAG#toggly-go/v}"
          fi

          BASE_VERSION="${CURRENT_VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

          case "$BUMP_TYPE" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
            *)
              echo "Invalid bump type: $BUMP_TYPE"
              exit 1
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"
          echo "New version: $NEW_VERSION"

      - name: Check if tag exists
        run: |
          if git rev-parse "toggly-go/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag toggly-go/v${{ steps.version.outputs.version }} already exists"
            exit 1
          fi

  build-and-test:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.22', '1.23', '1.24']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        working-directory: ${{ env.SDK_ROOT }}
        run: go mod download

      - name: Verify dependencies
        working-directory: ${{ env.SDK_ROOT }}
        run: go mod verify

      - name: Build
        working-directory: ${{ env.SDK_ROOT }}
        run: go build ./...

      - name: Run tests
        working-directory: ${{ env.SDK_ROOT }}
        run: go test -v -race ./...
        continue-on-error: true

      - name: Vet
        working-directory: ${{ env.SDK_ROOT }}
        run: go vet ./...
        continue-on-error: true

  release:
    needs: [build-and-test, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Configure git
        run: |
          git config user.name "${{ steps.import_gpg.outputs.name }}"
          git config user.email "${{ steps.import_gpg.outputs.email }}"

      - name: Create and push tag
        run: |
          # Go modules in subdirectories use <subdir>/vX.Y.Z tag format
          git tag -s -m "Go SDK v${{ needs.validate.outputs.version }}" "toggly-go/v${{ needs.validate.outputs.version }}"
          git push origin "toggly-go/v${{ needs.validate.outputs.version }}"

      - name: Request Go module proxy update
        run: |
          GOPROXY=https://proxy.golang.org GO111MODULE=on \
            go list -m github.com/ops-ai/Toggly.FeatureManagement/toggly-go@v${{ needs.validate.outputs.version }} || true
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: toggly-go/v${{ needs.validate.outputs.version }}
          name: Go SDK v${{ needs.validate.outputs.version }}
          body: |
            ## Go SDK v${{ needs.validate.outputs.version }}

            ### Installation

            ```bash
            go get github.com/ops-ai/Toggly.FeatureManagement/toggly-go@v${{ needs.validate.outputs.version }}
            ```

            ### Features

            - Feature flag evaluation with targeting rules
            - Multiple storage backends (Redis, MongoDB, SQLite, PostgreSQL)
            - gRPC real-time metrics streaming
            - WebSocket support for live definition updates

            ### Requirements

            - Go 1.22+

            ### Links

            - [pkg.go.dev](https://pkg.go.dev/github.com/ops-ai/Toggly.FeatureManagement/toggly-go)
            - [Documentation](https://docs.toggly.io/docs/sdks/go)
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    needs: [release, validate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Go SDK Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bump type | ${{ needs.validate.outputs.bump_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | toggly-go/v${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Module | github.com/ops-ai/Toggly.FeatureManagement/toggly-go |" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-release | ${{ github.event.inputs.prerelease }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View on pkg.go.dev](https://pkg.go.dev/github.com/ops-ai/Toggly.FeatureManagement/toggly-go)" >> $GITHUB_STEP_SUMMARY
