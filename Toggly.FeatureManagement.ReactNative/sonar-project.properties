# SonarCloud Configuration for React Native SDK
# This configuration can be used for local analysis

sonar.projectKey=toggly-sdks-react-native
sonar.organization=ops-ai
sonar.projectName=Toggly SDKs - React Native

# Source directories (all packages)
sonar.sources=libs

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/example/**,**/example-expo/**,**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,**/coverage/**,**/*.config.js

# Coverage exclusions
sonar.coverage.exclusions=**/example/**,**/example-expo/**,**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,**/*.config.js

# Test inclusions
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx

# Coverage report paths (LCOV format)
sonar.javascript.lcov.reportPaths=coverage/*-lcov.info
sonar.typescript.lcov.reportPaths=coverage/*-lcov.info

# Language settings
sonar.sourceEncoding=UTF-8
