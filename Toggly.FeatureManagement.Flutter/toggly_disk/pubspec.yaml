version: 0.5.0
homepage: https://docs.toggly.io/
repository: https://github.com/ops-ai/Toggly.FeatureManagement

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  feature_flags_toggly: '>=2.0.0 <3.0.0'
  path: '>=1.8.0 <2.0.0'
  path_provider: '>=2.0.0 <3.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=3.0.0 <7.0.0'
  lints: '>=2.1.1 <7.0.0'

