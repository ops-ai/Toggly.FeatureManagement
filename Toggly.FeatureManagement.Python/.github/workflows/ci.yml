name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Lint toggly
        run: ruff check toggly/src

      - name: Lint toggly-django
        run: ruff check toggly-django/src

      - name: Lint toggly-flask
        run: ruff check toggly-flask/src

      - name: Lint toggly-fastapi
        run: ruff check toggly-fastapi/src

      - name: Lint toggly-cache
        run: ruff check toggly-cache/src

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install mypy
        run: pip install mypy

      - name: Install dependencies
        run: |
          pip install -e toggly/
          pip install django flask fastapi starlette redis pymemcache

      - name: Type check toggly
        run: mypy toggly/src --ignore-missing-imports

      - name: Type check toggly-cache
        run: mypy toggly-cache/src --ignore-missing-imports

  test-core:
    name: Test Core (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd toggly
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          cd toggly
          pytest tests/ -v --cov=src/toggly --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: toggly/coverage.xml
          flags: core
          name: toggly-core

  test-django:
    name: Test Django (Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        django-version: ["4.2", "5.0", "5.1"]
        exclude:
          - python-version: "3.8"
            django-version: "5.0"
          - python-version: "3.9"
            django-version: "5.0"
          - python-version: "3.8"
            django-version: "5.1"
          - python-version: "3.9"
            django-version: "5.1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e toggly/
          pip install django==${{ matrix.django-version }}.*
          cd toggly-django
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          cd toggly-django
          pytest tests/ -v --cov=src/toggly_django --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11' && matrix.django-version == '5.0'
        uses: codecov/codecov-action@v4
        with:
          file: toggly-django/coverage.xml
          flags: django
          name: toggly-django

  test-flask:
    name: Test Flask (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e toggly/
          cd toggly-flask
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          cd toggly-flask
          pytest tests/ -v --cov=src/toggly_flask --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: toggly-flask/coverage.xml
          flags: flask
          name: toggly-flask

  test-fastapi:
    name: Test FastAPI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e toggly/
          cd toggly-fastapi
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          cd toggly-fastapi
          pytest tests/ -v --cov=src/toggly_fastapi --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: toggly-fastapi/coverage.xml
          flags: fastapi
          name: toggly-fastapi

  test-cache:
    name: Test Cache (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e toggly/
          cd toggly-cache
          pip install -e ".[all,dev]"

      - name: Run tests
        run: |
          cd toggly-cache
          pytest tests/ -v --cov=src/toggly_cache --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: toggly-cache/coverage.xml
          flags: cache
          name: toggly-cache

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      memcached:
        image: memcached:1.6
        ports:
          - 11211:11211
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install all packages
        run: |
          pip install -e toggly/
          pip install -e toggly-cache/[all]
          pip install -e toggly-django/
          pip install -e toggly-flask/
          pip install -e toggly-fastapi/
          pip install pytest pytest-asyncio

      - name: Run integration tests
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          MEMCACHED_HOST: localhost
          MEMCACHED_PORT: 11211
        run: |
          echo "Integration tests would run here"
          # pytest tests/integration/ -v

  build:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: [lint, test-core, test-django, test-flask, test-fastapi, test-cache]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: pip install build twine

      - name: Build toggly
        run: |
          cd toggly
          python -m build
          twine check dist/*

      - name: Build toggly-django
        run: |
          cd toggly-django
          python -m build
          twine check dist/*

      - name: Build toggly-flask
        run: |
          cd toggly-flask
          python -m build
          twine check dist/*

      - name: Build toggly-fastapi
        run: |
          cd toggly-fastapi
          python -m build
          twine check dist/*

      - name: Build toggly-cache
        run: |
          cd toggly-cache
          python -m build
          twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            toggly/dist/
            toggly-django/dist/
            toggly-flask/dist/
            toggly-fastapi/dist/
            toggly-cache/dist/
