name: iOS SDK - Analysis

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.iOS/**'
      - '.github/workflows/analysis-ios.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.iOS/**'
      - '.github/workflows/analysis-ios.yml'
  workflow_dispatch:

env:
  SDK_ROOT: Toggly.FeatureManagement.iOS

jobs:
  build-and-test:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        xcode: ['16.1', '16.2']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show Swift version
        run: swift --version

      - name: Resolve package dependencies
        working-directory: ${{ env.SDK_ROOT }}
        run: swift package resolve

      - name: Build all packages
        working-directory: ${{ env.SDK_ROOT }}
        run: swift build -v

      - name: Run tests
        working-directory: ${{ env.SDK_ROOT }}
        run: |
          if [ "${{ matrix.xcode }}" = "16.1" ]; then
            swift test -v --enable-code-coverage
          else
            swift test -v
          fi

      - name: Generate code coverage report
        if: matrix.xcode == '16.1'
        working-directory: ${{ env.SDK_ROOT }}
        run: |
          xcrun llvm-cov export \
            .build/debug/TogglyPackageTests.xctest/Contents/MacOS/TogglyPackageTests \
            -instr-profile .build/debug/codecov/default.profdata \
            -format lcov \
            -ignore-filename-regex '.build|Tests' \
            2>/dev/null \
            | sed "s|${GITHUB_WORKSPACE}/${SDK_ROOT}/||g" \
            | sed "s|${GITHUB_WORKSPACE}/||g" \
            > coverage.lcov || true
          echo "=== LCOV SF lines (first 20) ==="
          grep '^SF:' coverage.lcov | head -20 || true

      - name: Upload coverage to Codecov
        if: matrix.xcode == '16.1'
        uses: codecov/codecov-action@v4
        with:
          file: ${{ env.SDK_ROOT }}/coverage.lcov
          flags: ios-sdk
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: matrix.xcode == '16.1'
        uses: actions/upload-artifact@v4
        with:
          name: ios-coverage
          path: ${{ env.SDK_ROOT }}/coverage.lcov
          retention-days: 7
          if-no-files-found: ignore

  lint:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        working-directory: ${{ env.SDK_ROOT }}
        run: swiftlint lint --reporter github-actions-logging || true

      - name: Generate SwiftLint report for SonarQube
        working-directory: ${{ env.SDK_ROOT }}
        run: |
          swiftlint lint 2>/dev/null \
            | sed "s|${GITHUB_WORKSPACE}/||g" \
            > swiftlint-report.txt || true

      - name: Upload SwiftLint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-swiftlint
          path: ${{ env.SDK_ROOT }}/swiftlint-report.txt
          retention-days: 7
          if-no-files-found: ignore

  smoke-test:
    name: Smoke Test
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Resolve package dependencies
        working-directory: ${{ env.SDK_ROOT }}
        run: swift package resolve

      - name: Run smoke tests
        timeout-minutes: 2
        working-directory: ${{ env.SDK_ROOT }}
        env:
          TOGGLY_SMOKE_APP_KEY_FRONTEND: ${{ secrets.TOGGLY_SMOKE_APP_KEY_FRONTEND }}
        run: swift test -v --filter SmokeTests

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: 'toggly-sdks-ios'
          path: ${{ env.SDK_ROOT }}
          format: 'XML'
          out: 'dependency-check-reports'
          args: >
            --disableAssembly
            --disableRubygems
            --disableBundleAudit
            --disableNodeJS
            --disableNodeAudit
            --disablePyPkg
            --disablePyDist
        continue-on-error: true

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report-ios
          path: dependency-check-reports/
          retention-days: 7
          if-no-files-found: ignore

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [build-and-test, lint, smoke-test, dependency-check]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: ios-coverage
          path: ${{ env.SDK_ROOT }}/sonar-reports/
        continue-on-error: true

      - name: Download SwiftLint report
        uses: actions/download-artifact@v4
        with:
          name: ios-swiftlint
          path: ${{ env.SDK_ROOT }}/sonar-reports/
        continue-on-error: true

      - name: Download Dependency Check report
        uses: actions/download-artifact@v4
        with:
          name: dependency-check-report-ios
          path: ${{ env.SDK_ROOT }}/sonar-reports/
        continue-on-error: true

      - name: Debug coverage report
        working-directory: ${{ env.SDK_ROOT }}
        run: |
          echo "=== Files in sonar-reports ==="
          ls -la sonar-reports/ || true
          echo "=== LCOV SF lines ==="
          grep '^SF:' sonar-reports/coverage.lcov | head -20 || true
        continue-on-error: true

      - name: Convert LCOV to Cobertura XML
        working-directory: ${{ env.SDK_ROOT }}
        run: |
          pip install lcov_cobertura 2>/dev/null
          if [ -f sonar-reports/coverage.lcov ]; then
            lcov_cobertura sonar-reports/coverage.lcov -b . -o sonar-reports/coverage.xml
            python3 scripts/lcov-to-sonar.py sonar-reports/coverage.lcov sonar-reports/coverage-generic.xml
            echo "=== Cobertura filename attributes ==="
            grep 'filename=' sonar-reports/coverage.xml | head -20 || true
          else
            echo "WARNING: coverage.lcov not found in sonar-reports/"
          fi
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: ${{ env.SDK_ROOT }}
          args: >
            -Dsonar.projectKey=toggly-sdks-ios
            -Dsonar.organization=ops-ai
            -Dsonar.projectName="Toggly SDKs - iOS"
            -Dsonar.sources=TogglyCore/Sources,TogglySwiftUI/Sources,TogglyUIKit/Sources,TogglyCombine/Sources
            -Dsonar.tests=TogglyCore/Tests,TogglyCombine/Tests,TogglySwiftUI/Tests,TogglyUIKit/Tests
            -Dsonar.exclusions=**/.build/**,**/Package.resolved
            -Dsonar.swift.coverage.reportPaths=sonar-reports/coverage.lcov
            -Dsonar.coverageReportPaths=sonar-reports/coverage-generic.xml
            -Dsonar.swift.swiftlint.report=sonar-reports/swiftlint-report.txt
        continue-on-error: true

      - name: SonarQube Server Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: ${{ env.SDK_ROOT }}
          args: >
            -Dsonar.projectKey=toggly-sdks-ios
            -Dsonar.projectName="Toggly SDKs - iOS"
            -Dsonar.language=swift
            -Dsonar.sources=TogglyCore/Sources,TogglySwiftUI/Sources,TogglyUIKit/Sources,TogglyCombine/Sources
            -Dsonar.tests=TogglyCore/Tests,TogglyCombine/Tests,TogglySwiftUI/Tests,TogglyUIKit/Tests
            -Dsonar.exclusions=**/.build/**,**/Package.resolved
            -Dsonar.swift.file.suffixes=swift
            -Dsonar.swift.coverage.reportPattern=sonar-reports/coverage*.xml
            -Dsonar.swift.swiftlint.report=sonar-reports/swiftlint-report.txt
            -Dsonar.dependencyCheck.reportPath=sonar-reports/dependency-check-report.xml
        continue-on-error: true

  build-platforms:
    runs-on: macos-15
    strategy:
      matrix:
        destination:
          - 'platform=iOS Simulator,name=iPhone 16,OS=18.1'
          - 'platform=macOS'
          - 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=18.1'
          - 'platform=watchOS Simulator,name=Apple Watch Series 10 (46mm),OS=11.1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.1.app

      - name: Build for platform
        working-directory: ${{ env.SDK_ROOT }}
        run: |
          xcodebuild build \
            -scheme Toggly-Package \
            -destination '${{ matrix.destination }}' \
            -skipPackagePluginValidation \
            | xcpretty || true
