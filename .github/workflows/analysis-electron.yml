name: Electron SDK - Tests & Analysis

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.Electron/**'
      - 'toggly-segments/**'
      - '.github/workflows/analysis-electron.yml'
      - '.github/workflows/analysis-electron.test.mjs'
      - '.github/actions/verify-required-jobs/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      run_reporting:
        description: 'When false, skip Sonar and OWASP reporting jobs'
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Test Electron SDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: Toggly.FeatureManagement.Electron/package-lock.json

      - name: Verify Electron analysis workflow contract
        run: node --test .github/workflows/analysis-electron.test.mjs

      - name: Build toggly-segments
        run: |
          set -euo pipefail
          (cd toggly-segments && (npm ci || npm install) && npm run build)

      - name: Install dependencies
        working-directory: Toggly.FeatureManagement.Electron
        run: npm ci || npm install

      - name: Build package
        working-directory: Toggly.FeatureManagement.Electron
        run: npm run build

      - name: Run TypeScript type check
        working-directory: Toggly.FeatureManagement.Electron
        run: npm run typecheck --if-present

      - name: Run tests with coverage
        working-directory: Toggly.FeatureManagement.Electron
        # The preload fixture creates a real BrowserWindow. Xvfb supplies the
        # display server on Ubuntu so Electron retains its normal multiprocess
        # browser path instead of using a single-process test-only fallback.
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npm run test:coverage

      - name: Run packed Electron floor and current hosts
        working-directory: Toggly.FeatureManagement.Electron
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npm run test:hosts

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-Electron
          path: |
            Toggly.FeatureManagement.Electron/coverage/
            Toggly.FeatureManagement.Electron/coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [test, dependency-check]
    if: ${{ always() && toJSON(inputs.run_reporting) != 'false' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all coverage reports
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-artifacts/
        continue-on-error: true

      - name: Organize coverage files
        run: |
          mkdir -p coverage
          find coverage-artifacts -name "lcov.info" -type f | while read -r file; do
            sed "s|SF:|SF:Toggly.FeatureManagement.Electron/|g" "$file" > "coverage/Electron-lcov.info"
          done
          echo "Coverage files:"
          ls -la coverage/ || echo "No coverage files found"
        continue-on-error: true

      - name: Resolve Sonar project version
        id: sonar_version
        uses: ./.github/actions/sonar-project-version
        with:
          manifest: Toggly.FeatureManagement.Electron/package.json
          suffix: ${{ vars.SONAR_PROJECT_VERSION_SUFFIX }}

      - name: Validate SonarCloud credentials
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "${SONAR_TOKEN}" || { echo "SonarCloud token is required"; exit 1; }

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-electron
            -Dsonar.projectVersion=${{ steps.sonar_version.outputs.version }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.organization=ops-ai
            -Dsonar.projectName="Toggly SDKs - Electron"
            -Dsonar.sources=Toggly.FeatureManagement.Electron/src
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/example/**,**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,**/coverage/**,**/*.config.js,**/*.config.ts
            -Dsonar.coverage.exclusions=**/example/**,**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,**/*.config.js,**/*.config.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/*-lcov.info
            -Dsonar.typescript.lcov.reportPaths=coverage/*-lcov.info
            -Dsonar.tests=Toggly.FeatureManagement.Electron/tests
            -Dsonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx

      - name: Download Dependency Check report
        if: ${{ success() || failure() }}
        uses: actions/download-artifact@v8
        with:
          name: dependency-check-report-electron
          path: dependency-check-reports/
        continue-on-error: true

      - name: Validate SonarQube Server credentials
        id: validate-sonarqube-server-credentials
        if: ${{ success() || failure() }}
        env:
          SONAR_SERVER_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: test -n "${SONAR_SERVER_TOKEN}" && test -n "${SONAR_HOST_URL}" || { echo "SonarQube Server credentials are required"; exit 1; }

      - name: SonarQube Server Scan
        if: ${{ (success() || failure()) && steps.validate-sonarqube-server-credentials.outcome == 'success' }}
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-electron
            -Dsonar.projectVersion=${{ steps.sonar_version.outputs.version }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.projectName="Toggly SDKs - Electron"
            -Dsonar.sources=Toggly.FeatureManagement.Electron/src
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/example/**,**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,**/coverage/**,**/*.config.js,**/*.config.ts
            -Dsonar.coverage.exclusions=**/example/**,**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,**/*.config.js,**/*.config.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/*-lcov.info
            -Dsonar.typescript.lcov.reportPaths=coverage/*-lcov.info
            -Dsonar.tests=Toggly.FeatureManagement.Electron/tests
            -Dsonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx
            -Dsonar.dependencyCheck.reportPath=dependency-check-reports/dependency-check-report.xml

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    if: ${{ toJSON(inputs.run_reporting) != 'false' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache OWASP Dependency Check database
        uses: actions/cache@v6
        with:
          path: /home/runner/OWASP-Dependency-Check/data/
          key: dependency-check-db-${{ runner.os }}-v6
          restore-keys: |
            dependency-check-db-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'toggly-sdks-electron'
          path: 'Toggly.FeatureManagement.Electron'
          format: 'ALL'
          args: >-
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableExperimental
            --disableAssembly
            --disableRubygems
            --disableBundleAudit
            --disablePyPkg
            --disablePyDist
            --disableNodeAudit
            --exclude '**/host-fixtures/**'
            --exclude '**/node_modules/**'
            --exclude '**/packaging/**'

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report-electron
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
        continue-on-error: true

  summary:
    name: Analysis Summary
    runs-on: ubuntu-latest
    needs: [test, sonar, dependency-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify required jobs passed
        uses: ./.github/actions/verify-required-jobs
        with:
          needs-json: ${{ toJSON(needs) }}
          required-jobs: test,sonar,dependency-check
          allow-skipped: ${{ (toJSON(inputs.run_reporting) == 'false' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'sonar,dependency-check' || 'none' }}

      - name: Check test results
        if: ${{ always() }}
        env:
          TEST_RESULT: ${{ needs.test.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          DEPENDENCY_CHECK_RESULT: ${{ needs.dependency-check.result }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
          RUN_REPORTING: ${{ toJSON(inputs.run_reporting) }}
        run: |
          {
            echo "## Electron SDK Analysis Summary"
            echo ""
            echo "Tests: ${TEST_RESULT}"
            echo "Sonar: ${SONAR_RESULT}"
            echo "OWASP: ${DEPENDENCY_CHECK_RESULT}"
            if [ "${RUN_REPORTING}" = "false" ]; then
              echo "Reporting was explicitly disabled with run_reporting=false; authenticated Sonar gates were not checked."
            elif [ "${FORK_PR}" = "true" ]; then
              echo "Credentialed SonarCloud and SonarQube Server scans were skipped for this fork PR; authenticated Sonar gates were not checked. OWASP reporting was also skipped."
            fi
            echo ""
            echo "### Packages Analyzed"
            echo "- @ops-ai/electron-feature-flags-toggly"
            echo ""
            echo "SonarCloud: https://sonarcloud.io/project/overview?id=toggly-sdks-electron"
          } >> "$GITHUB_STEP_SUMMARY"
