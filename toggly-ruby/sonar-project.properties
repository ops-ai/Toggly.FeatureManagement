# SonarQube Configuration for Toggly Ruby SDK

sonar.projectKey=toggly-ruby
sonar.projectName=Toggly Ruby SDK
sonar.projectVersion=0.1.0

# Source paths
sonar.sources=toggly/lib,toggly-rails/lib,toggly-cache/lib

# Test paths
sonar.tests=toggly/spec,toggly-rails/spec,toggly-cache/spec

# Encoding
sonar.sourceEncoding=UTF-8

# Ruby language
sonar.language=ruby

# Coverage reports
sonar.ruby.coverage.reportPaths=toggly/coverage/.resultset.json,toggly-rails/coverage/.resultset.json,toggly-cache/coverage/.resultset.json

# Exclusions
sonar.exclusions=**/spec/**,**/vendor/**,**/*.gemspec

# Test exclusions
sonar.test.exclusions=**/spec/**

# Quality gate
sonar.qualitygate.wait=true
