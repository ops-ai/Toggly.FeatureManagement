name: .NET SDKs - Build & Publish

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'publish = use manifest version; auto_bump = legacy CI bump'
        required: false
        default: 'publish'
        type: choice
        options:
          - publish
          - auto_bump
      bump_type:
        description: 'Bump type (only used when release_mode is auto_bump)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      packages:
        description: 'Packages to release (comma-separated or "all")'
        required: false
        default: 'all'
        type: string
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  SDK_ROOT: Toggly.FeatureManagement.NET
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      action: ${{ steps.release.outputs.action }}
      reason: ${{ steps.release.outputs.reason }}
      manifest_version: ${{ steps.release.outputs.manifest_version }}
      registry_latest: ${{ steps.release.outputs.registry_latest }}
      manifest_changed: ${{ steps.release.outputs.manifest_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        uses: ./.github/actions/resolve-release-version
        with:
          manifest_path: ${{ env.SDK_ROOT }}/Directory.Build.props
          manifest_type: props
          registry: nuget
          package_name: Toggly.FeatureManagement
          release_mode: ${{ github.event.inputs.release_mode || 'publish' }}
          bump_type: ${{ github.event.inputs.bump_type || 'patch' }}

  build-and-test:
    needs: validate
    if: needs.validate.outputs.action == 'publish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        working-directory: ${{ env.SDK_ROOT }}
        run: dotnet restore Toggly.FeatureManagement.sln

      - name: Build solution
        working-directory: ${{ env.SDK_ROOT }}
        run: dotnet build Toggly.FeatureManagement.sln -c Release --no-restore -p:Version=${{ needs.validate.outputs.version }}

      - name: Run tests
        working-directory: ${{ env.SDK_ROOT }}
        run: dotnet test Toggly.FeatureManagement.sln -c Release --no-build

  publish:
    needs: [build-and-test, validate]
    if: needs.validate.outputs.action == 'publish'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - project: Toggly.FeatureManagement
            name: Core
          - project: Toggly.FeatureManagement.Web
            name: Web
          - project: Toggly.FeatureManagement.Storage.RavenDB
            name: Storage.RavenDB
          - project: Toggly.FeatureManagement.Storage.DistributedCache
            name: Storage.DistributedCache
          - project: Toggly.FeatureManagement.Hangfire
            name: Hangfire
          - project: Toggly.FeatureManagement.HealthChecks
            name: HealthChecks
          - project: Toggly.FeatureManagement.NSwag
            name: NSwag
          - project: Toggly.Storage.MongoDB
            name: Storage.MongoDB
          - project: Toggly.Storage.Dapper
            name: Storage.Dapper
          - project: Toggly.Storage.EntityFramework
            name: Storage.EntityFramework
          - project: Toggly.Metrics.SystemMetrics
            name: Metrics.SystemMetrics

    steps:
      - name: Check if package should be published
        id: should_publish
        run: |
          PACKAGES="${{ github.event.inputs.packages || 'all' }}"
          if [ "$PACKAGES" == "all" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
          elif echo "$PACKAGES" | grep -qi "${{ matrix.name }}"; then
            echo "publish=true" >> $GITHUB_OUTPUT
          else
            echo "publish=false" >> $GITHUB_OUTPUT
            echo "Skipping ${{ matrix.name }} (not in selected packages)"
          fi

      - name: Checkout code
        if: steps.should_publish.outputs.publish == 'true'
        uses: actions/checkout@v7

      - name: Setup .NET
        if: steps.should_publish.outputs.publish == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Install NuGetKeyVaultSignTool
        if: steps.should_publish.outputs.publish == 'true'
        run: dotnet tool install --global NuGetKeyVaultSignTool

      - name: Restore dependencies
        if: steps.should_publish.outputs.publish == 'true'
        working-directory: ${{ env.SDK_ROOT }}
        run: dotnet restore ${{ matrix.project }}/${{ matrix.project }}.csproj

      - name: Build project for packing
        if: steps.should_publish.outputs.publish == 'true'
        working-directory: ${{ env.SDK_ROOT }}
        run: |
          dotnet build ${{ matrix.project }}/${{ matrix.project }}.csproj \
            -c Release \
            --no-restore \
            -p:Version=${{ needs.validate.outputs.version }}

      - name: Pack NuGet package
        if: steps.should_publish.outputs.publish == 'true'
        working-directory: ${{ env.SDK_ROOT }}
        run: |
          dotnet pack ${{ matrix.project }}/${{ matrix.project }}.csproj \
            -c Release \
            --no-build \
            --no-restore \
            -p:Version=${{ needs.validate.outputs.version }} \
            -p:PackageVersion=${{ needs.validate.outputs.version }} \
            -p:ContinuousIntegrationBuild=true \
            --output ./nupkgs

      - name: Import signing CA certificate chain
        if: steps.should_publish.outputs.publish == 'true'
        run: |
          if [ -z "$NUGET_SIGN_CA_CHAIN_B64" ]; then
            echo "Missing required secret: NUGET_SIGN_CA_CHAIN_B64"
            echo "Provide PEM text or base64-encoded PEM/CER chain (root + intermediates) used by the signing certificate."
            exit 1
          fi

          # Support both raw PEM and base64-encoded content in the secret.
          RAW_CHAIN_PATH="/tmp/toggly-signing-chain-input.pem"
          if [[ "$NUGET_SIGN_CA_CHAIN_B64" == *"BEGIN CERTIFICATE"* ]]; then
            printf '%s\n' "$NUGET_SIGN_CA_CHAIN_B64" > "$RAW_CHAIN_PATH"
          elif printf '%s' "$NUGET_SIGN_CA_CHAIN_B64" | base64 --decode > "$RAW_CHAIN_PATH" 2>/tmp/toggly-ca-b64.err; then
            echo "Decoded CA chain from base64 secret"
          else
            echo "Failed to parse NUGET_SIGN_CA_CHAIN_B64 as base64."
            cat /tmp/toggly-ca-b64.err
            exit 1
          fi

          # Convert DER to PEM when only a single DER cert is provided.
          if ! grep -q "BEGIN CERTIFICATE" "$RAW_CHAIN_PATH"; then
            if ! openssl x509 -inform DER -in "$RAW_CHAIN_PATH" -out "$RAW_CHAIN_PATH" 2>/dev/null; then
              echo "The provided CA chain is neither PEM nor DER certificate content."
              exit 1
            fi
          fi

          # Split a PEM bundle into one-cert-per-file for update-ca-certificates.
          rm -f /tmp/toggly-signing-ca-*.crt
          awk '
            /-----BEGIN CERTIFICATE-----/ { cert++; out=sprintf("/tmp/toggly-signing-ca-%02d.crt", cert) }
            cert > 0 { print > out }
            /-----END CERTIFICATE-----/ { close(out) }
          ' "$RAW_CHAIN_PATH"

          CERT_COUNT=$(ls /tmp/toggly-signing-ca-*.crt 2>/dev/null | wc -l)
          if [ "$CERT_COUNT" -eq 0 ]; then
            echo "No valid certificates found in provided CA chain."
            exit 1
          fi

          sudo rm -f /usr/local/share/ca-certificates/toggly-signing-ca-*.crt
          for cert in /tmp/toggly-signing-ca-*.crt; do
            sudo cp "$cert" "/usr/local/share/ca-certificates/$(basename "$cert")"
            sudo chmod 644 "/usr/local/share/ca-certificates/$(basename "$cert")"
          done

          sudo update-ca-certificates
        env:
          NUGET_SIGN_CA_CHAIN_B64: ${{ secrets.NUGET_SIGN_CA_CHAIN_B64 }}

      - name: Sign NuGet packages
        id: sign_packages
        if: steps.should_publish.outputs.publish == 'true'
        working-directory: ${{ env.SDK_ROOT }}
        run: |
          NuGetKeyVaultSignTool sign ./nupkgs/*.nupkg \
            --file-digest sha256 \
            --timestamp-rfc3161 http://timestamp.globalsign.com/tsa/r6advanced1 \
            --timestamp-digest sha256 \
            --azure-key-vault-url "$AZURE_KEY_VAULT_URL" \
            --azure-key-vault-client-id "$AZURE_KEY_VAULT_CLIENT_ID" \
            --azure-key-vault-tenant-id "$AZURE_KEY_VAULT_TENANT_ID" \
            --azure-key-vault-client-secret "$AZURE_KEY_VAULT_CLIENT_SECRET" \
            --azure-key-vault-certificate "$AZURE_KEY_VAULT_CERTIFICATE"
        env:
          AZURE_KEY_VAULT_URL: ${{ secrets.NUGET_SIGN_VAULT_URL }}
          AZURE_KEY_VAULT_CLIENT_ID: ${{ secrets.NUGET_SIGN_CLIENT_ID }}
          AZURE_KEY_VAULT_CLIENT_SECRET: ${{ secrets.NUGET_SIGN_CLIENT_SECRET }}
          AZURE_KEY_VAULT_TENANT_ID: ${{ secrets.NUGET_SIGN_TENANT_ID }}
          AZURE_KEY_VAULT_CERTIFICATE: ${{ secrets.NUGET_SIGN_CERTIFICATE }}

      - name: Publish to NuGet
        if: steps.should_publish.outputs.publish == 'true'
        working-directory: ${{ env.SDK_ROOT }}
        run: |
          PACKAGE_TO_PUSH=$(ls ./nupkgs/*.${{ needs.validate.outputs.version }}.nupkg 2>/dev/null | head -n 1)
          if [ -z "$PACKAGE_TO_PUSH" ]; then
            echo "No .nupkg found for version ${{ needs.validate.outputs.version }} in ./nupkgs"
            ls -la ./nupkgs || true
            exit 1
          fi

          echo "Pushing package: $PACKAGE_TO_PUSH"
          dotnet nuget push "$PACKAGE_TO_PUSH" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  release:
    needs: [publish, validate]
    if: needs.validate.outputs.action == 'publish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Configure git
        run: |
          git config user.name "${{ steps.import_gpg.outputs.name }}"
          git config user.email "${{ steps.import_gpg.outputs.email }}"

      - name: Commit version bump
        if: needs.validate.outputs.manifest_changed == 'true'
        run: |
          git add ${{ env.SDK_ROOT }}/Directory.Build.props
          git commit -S -m "Bumped .NET SDK to v${{ needs.validate.outputs.version }} (auto_bump) [skip ci]"

          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if git pull --rebase --autostash origin develop; then
              if git push origin develop; then
                echo "Successfully pushed version bump"
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              sleep 2
            fi
          done

          echo "Failed to push after $MAX_RETRIES attempts"
          exit 1

      - name: Create and push tag
        run: |
          git tag -s -m ".NET SDK v${{ needs.validate.outputs.version }}" "dotnet-sdk-v${{ needs.validate.outputs.version }}"
          git push origin "dotnet-sdk-v${{ needs.validate.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dotnet-sdk-v${{ needs.validate.outputs.version }}
          name: .NET SDK v${{ needs.validate.outputs.version }}
          body: |
            ## .NET SDK v${{ needs.validate.outputs.version }}

            ### Installation

            ```bash
            dotnet add package Toggly.FeatureManagement --version ${{ needs.validate.outputs.version }}
            ```

            ### NuGet Packages

            | Package | Description |
            |---------|-------------|
            | `Toggly.FeatureManagement` | Core feature management extending Microsoft.FeatureManagement |
            | `Toggly.FeatureManagement.Web` | ASP.NET Core filters for browser, language, country, OS targeting |
            | `Toggly.FeatureManagement.Storage.RavenDB` | RavenDB storage provider |
            | `Toggly.FeatureManagement.Storage.DistributedCache` | Distributed cache storage provider |
            | `Toggly.FeatureManagement.Hangfire` | Hangfire background job integration |
            | `Toggly.FeatureManagement.HealthChecks` | Health check integration |
            | `Toggly.FeatureManagement.NSwag` | NSwag/OpenAPI integration |
            | `Toggly.Storage.MongoDB` | MongoDB storage provider |
            | `Toggly.Storage.Dapper` | Dapper storage provider |
            | `Toggly.Storage.EntityFramework` | Entity Framework storage provider |
            | `Toggly.Metrics.SystemMetrics` | System metrics collection |

            ### Requirements

            - .NET Standard 2.1 / .NET Core 3.1 / .NET 5.0–10.0
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    needs: [publish, release, validate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## .NET SDK Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Action | ${{ needs.validate.outputs.action }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Manifest | ${{ needs.validate.outputs.manifest_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry latest | ${{ needs.validate.outputs.registry_latest || 'none' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release mode | ${{ github.event.inputs.release_mode || 'publish' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ needs.validate.outputs.reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | dotnet-sdk-v${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Packages | ${{ github.event.inputs.packages || 'all' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-release | ${{ github.event.inputs.prerelease }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published Packages" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.FeatureManagement" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.FeatureManagement.Web" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.FeatureManagement.Storage.RavenDB" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.FeatureManagement.Storage.DistributedCache" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.FeatureManagement.Hangfire" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.FeatureManagement.HealthChecks" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.FeatureManagement.NSwag" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.Storage.MongoDB" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.Storage.Dapper" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.Storage.EntityFramework" >> $GITHUB_STEP_SUMMARY
          echo "- Toggly.Metrics.SystemMetrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View on NuGet](https://www.nuget.org/packages?q=Toggly.FeatureManagement)" >> $GITHUB_STEP_SUMMARY
