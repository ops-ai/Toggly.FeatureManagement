name: React Native SDKs - Tests & Analysis

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.ReactNative/**'
      - '.github/workflows/analysis-react-native.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.ReactNative/**'
      - '.github/workflows/analysis-react-native.yml'
  workflow_dispatch:

jobs:
  test:
    name: Test ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: Core
            path: Toggly.FeatureManagement.ReactNative/libs/core
            test-cmd: npm test
          - sdk: React-Native
            path: Toggly.FeatureManagement.ReactNative/libs/react-native
            test-cmd: npm test
          - sdk: Storage-Async
            path: Toggly.FeatureManagement.ReactNative/libs/storage-async
            test-cmd: npm run typecheck
          - sdk: Storage-MMKV
            path: Toggly.FeatureManagement.ReactNative/libs/storage-mmkv
            test-cmd: npm run typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install core dependencies (for other packages)
        if: matrix.sdk != 'Core'
        working-directory: Toggly.FeatureManagement.ReactNative/libs/core
        run: npm ci || npm install

      - name: Build core package (for other packages)
        if: matrix.sdk != 'Core'
        working-directory: Toggly.FeatureManagement.ReactNative/libs/core
        run: npm run build

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: npm ci || npm install

      - name: Build package
        working-directory: ${{ matrix.path }}
        run: npm run build --if-present

      - name: Run TypeScript type check
        working-directory: ${{ matrix.path }}
        run: npm run typecheck --if-present

      - name: Run tests with coverage
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.test-cmd }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.sdk }}
          path: |
            ${{ matrix.path }}/coverage/
            ${{ matrix.path }}/coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [test, dependency-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all coverage reports
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-artifacts/
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install dependencies for TypeScript analysis
        run: |
          npm ci --prefix Toggly.FeatureManagement.ReactNative/libs/core || npm install --prefix Toggly.FeatureManagement.ReactNative/libs/core
          npm run build --prefix Toggly.FeatureManagement.ReactNative/libs/core
          npm ci --prefix Toggly.FeatureManagement.ReactNative/libs/react-native || npm install --prefix Toggly.FeatureManagement.ReactNative/libs/react-native
          npm ci --prefix Toggly.FeatureManagement.ReactNative/libs/storage-async || npm install --prefix Toggly.FeatureManagement.ReactNative/libs/storage-async
          npm ci --prefix Toggly.FeatureManagement.ReactNative/libs/storage-mmkv || npm install --prefix Toggly.FeatureManagement.ReactNative/libs/storage-mmkv
        continue-on-error: true

      - name: Organize coverage files
        run: |
          mkdir -p coverage
          declare -A SDK_PATHS=(
            ["Core"]="Toggly.FeatureManagement.ReactNative/libs/core"
            ["React-Native"]="Toggly.FeatureManagement.ReactNative/libs/react-native"
            ["Storage-Async"]="Toggly.FeatureManagement.ReactNative/libs/storage-async"
            ["Storage-MMKV"]="Toggly.FeatureManagement.ReactNative/libs/storage-mmkv"
          )
          find coverage-artifacts -name "lcov.info" -type f | while read file; do
            sdk_name=$(echo "$file" | sed 's|coverage-artifacts/coverage-||' | sed 's|/.*||')
            prefix="${SDK_PATHS[$sdk_name]}"
            if [ -n "$prefix" ]; then
              sed "s|SF:|SF:${prefix}/|g" "$file" > "coverage/${sdk_name}-lcov.info"
            else
              cp "$file" "coverage/${sdk_name}-lcov.info" || true
            fi
          done
          echo "Coverage files:"
          ls -la coverage/ || echo "No coverage files found"
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-react-native
            -Dsonar.organization=ops-ai
            -Dsonar.projectName="Toggly SDKs - React Native"
            -Dsonar.sources=Toggly.FeatureManagement.ReactNative/libs
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/example/**,**/example-expo/**,**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,**/coverage/**,**/*.config.js
            -Dsonar.coverage.exclusions=**/example/**,**/example-expo/**,**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,**/*.config.js
            -Dsonar.javascript.lcov.reportPaths=coverage/*-lcov.info
            -Dsonar.typescript.lcov.reportPaths=coverage/*-lcov.info
            -Dsonar.tests=Toggly.FeatureManagement.ReactNative/libs
            -Dsonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx
        continue-on-error: true

      - name: Download Dependency Check report (for SonarQube Server)
        uses: actions/download-artifact@v8
        with:
          name: dependency-check-report-react-native
          path: dependency-check-reports/
        continue-on-error: true

      - name: SonarQube Server Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-react-native
            -Dsonar.projectName="Toggly SDKs - React Native"
            -Dsonar.sources=Toggly.FeatureManagement.ReactNative/libs
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/example/**,**/example-expo/**,**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,**/coverage/**,**/*.config.js
            -Dsonar.coverage.exclusions=**/example/**,**/example-expo/**,**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,**/*.config.js
            -Dsonar.javascript.lcov.reportPaths=coverage/*-lcov.info
            -Dsonar.typescript.lcov.reportPaths=coverage/*-lcov.info
            -Dsonar.tests=Toggly.FeatureManagement.ReactNative/libs
            -Dsonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx
            -Dsonar.dependencyCheck.reportPath=dependency-check-reports/dependency-check-report.xml
        continue-on-error: true

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache OWASP Dependency Check database
        uses: actions/cache@v6
        with:
          path: /home/runner/OWASP-Dependency-Check/data/
          key: dependency-check-db-${{ runner.os }}-v6
          restore-keys: |
            dependency-check-db-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'toggly-sdks-react-native'
          path: 'Toggly.FeatureManagement.ReactNative'
          format: 'ALL'
          args: >-
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableExperimental
            --disableAssembly
            --disableRubygems
            --disableBundleAudit
            --disablePyPkg
            --disablePyDist
        continue-on-error: true

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report-react-native
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
        continue-on-error: true

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: Toggly.FeatureManagement.ReactNative/libs/core/package-lock.json

      - name: Install core dependencies
        working-directory: Toggly.FeatureManagement.ReactNative/libs/core
        run: npm ci || npm install

      - name: Run core smoke test
        timeout-minutes: 2
        working-directory: Toggly.FeatureManagement.ReactNative/libs/core
        env:
          TOGGLY_SMOKE_APP_KEY_FRONTEND: ${{ secrets.TOGGLY_SMOKE_APP_KEY_FRONTEND }}
        run: npx jest tests/smoke.test.ts tests/smoke-ws.test.ts --runInBand --forceExit --testPathIgnorePatterns='/node_modules/'

  summary:
    name: Analysis Summary
    runs-on: ubuntu-latest
    needs: [test, smoke-test, sonar, dependency-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify required jobs passed
        uses: ./.github/actions/verify-required-jobs
        with:
          needs-json: ${{ toJSON(needs) }}
          required-jobs: test,smoke-test

      - name: Check test results
        run: |
          echo "## React Native SDK Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Analysis workflow completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages Analyzed" >> $GITHUB_STEP_SUMMARY
          echo "- @ops-ai/react-native-toggly-core" >> $GITHUB_STEP_SUMMARY
          echo "- @ops-ai/react-native-toggly" >> $GITHUB_STEP_SUMMARY
          echo "- @ops-ai/react-native-toggly-storage-async" >> $GITHUB_STEP_SUMMARY
          echo "- @ops-ai/react-native-toggly-storage-mmkv" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "SonarCloud: https://sonarcloud.io/project/overview?id=toggly-sdks-react-native" >> $GITHUB_STEP_SUMMARY
