name: Release Java SDK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true

defaults:
  run:
    working-directory: Toggly.FeatureManagement.Java

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Set release version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          fi
          mvn -B versions:set -DnewVersion=$VERSION
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build and test
        run: mvn -B clean verify --file pom.xml

      - name: Publish to Maven Central
        run: |
          mvn -B deploy \
            -DskipTests \
            -P release \
            --file pom.xml
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create GitHub release artifacts
        run: |
          mkdir -p release-artifacts
          cp toggly-core/target/toggly-core-*.jar release-artifacts/
          cp toggly-spring-boot-starter/target/toggly-spring-boot-starter-*.jar release-artifacts/
          cp toggly-spring-mvc/target/toggly-spring-mvc-*.jar release-artifacts/
          cp toggly-spring-webflux/target/toggly-spring-webflux-*.jar release-artifacts/
          cp toggly-servlet/target/toggly-servlet-*.jar release-artifacts/
          cp toggly-cache-caffeine/target/toggly-cache-caffeine-*.jar release-artifacts/
          cp toggly-cache-redis/target/toggly-cache-redis-*.jar release-artifacts/

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: java-sdk-${{ env.VERSION }}
          path: Toggly.FeatureManagement.Java/release-artifacts/
