name: React Router SDK - Tests & Analysis

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.ReactRouter/**'
      - 'toggly-eval/**'
      - 'toggly-signed-defs/**'
      - 'toggly-hooks-types/**'
      - 'toggly-local-gates/**'
      - '.github/workflows/analysis-react-router.yml'
      - '.github/actions/build-shared-js-deps/**'
      - '.github/actions/upload-shared-js-deps/**'
      - '.github/actions/download-shared-js-deps/**'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'Toggly.FeatureManagement.ReactRouter/**'
      - 'toggly-eval/**'
      - 'toggly-signed-defs/**'
      - 'toggly-hooks-types/**'
      - 'toggly-local-gates/**'
      - '.github/workflows/analysis-react-router.yml'
      - '.github/actions/build-shared-js-deps/**'
      - '.github/actions/upload-shared-js-deps/**'
      - '.github/actions/download-shared-js-deps/**'
  workflow_dispatch:

env:
  SDK_ROOT: Toggly.FeatureManagement.ReactRouter
  PKG: react-router-toggly

jobs:
  build-shared-js-deps:
    name: Build shared JS deps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build shared packages
        uses: ./.github/actions/build-shared-js-deps
        with:
          packages: signed-defs,eval,hooks-types,local-gates
          node-version: '20.x'

      - name: Upload shared package dist artifacts
        uses: ./.github/actions/upload-shared-js-deps

  build-and-test:
    name: Test (Node ${{ matrix.node-version }})
    needs: [build-shared-js-deps]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ env.SDK_ROOT }}/${{ env.PKG }}/package-lock.json

      - name: Restore shared JS deps
        uses: ./.github/actions/download-shared-js-deps

      - name: Install dependencies
        working-directory: ${{ env.SDK_ROOT }}/${{ env.PKG }}
        run: npm ci || npm install

      - name: Type check
        working-directory: ${{ env.SDK_ROOT }}/${{ env.PKG }}
        run: npm run typecheck

      - name: Build
        working-directory: ${{ env.SDK_ROOT }}/${{ env.PKG }}
        run: npm run build

      - name: Run tests with coverage
        working-directory: ${{ env.SDK_ROOT }}/${{ env.PKG }}
        run: npm run test:coverage

      - name: Upload coverage (Node 20 only)
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-react-router
          path: ${{ env.SDK_ROOT }}/${{ env.PKG }}/coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  packed-host:
    name: Packed ${{ matrix.host }} (Node ${{ matrix.node-version }})
    needs: [build-shared-js-deps]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: router7-react18
            node-version: '20'
          - host: router8-react19
            node-version: '22'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ env.SDK_ROOT }}/${{ env.PKG }}/package-lock.json

      - name: Restore shared JS deps
        uses: ./.github/actions/download-shared-js-deps

      - name: Install dependencies
        working-directory: ${{ env.SDK_ROOT }}/${{ env.PKG }}
        run: npm ci || npm install

      - name: Verify packed host
        working-directory: ${{ env.SDK_ROOT }}/${{ env.PKG }}
        env:
          HOST: ${{ matrix.host }}
        run: npm run test:hosts

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [build-shared-js-deps, build-and-test, packed-host, dependency-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'

      - name: Restore shared JS deps
        if: needs.build-shared-js-deps.result == 'success'
        uses: ./.github/actions/download-shared-js-deps

      - name: Install dependencies for TypeScript analysis
        working-directory: ${{ env.SDK_ROOT }}/${{ env.PKG }}
        run: npm ci || npm install
        continue-on-error: true

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          name: coverage-react-router
          path: coverage-artifacts/
        continue-on-error: true

      - name: Organize coverage files
        run: |
          mkdir -p coverage
          if [ -f "coverage-artifacts/lcov.info" ]; then
            sed "s|SF:|SF:${{ env.SDK_ROOT }}/${{ env.PKG }}/|g" \
              coverage-artifacts/lcov.info > coverage/all-lcov.info
          fi
          ls -la coverage/ || true
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-react-router
            -Dsonar.organization=ops-ai
            -Dsonar.projectName="Toggly SDKs - React Router"
            -Dsonar.sources=${{ env.SDK_ROOT }}/${{ env.PKG }}/src
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/*.test.mjs,**/tests/**/*.cjs,**/*.config.js,**/*.config.ts,**/fixtures/**
            -Dsonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/*.test.mjs,**/tests/**/*.cjs,**/*.config.js,**/*.config.ts,**/fixtures/**
            -Dsonar.javascript.lcov.reportPaths=coverage/all-lcov.info
            -Dsonar.tests=${{ env.SDK_ROOT }}/${{ env.PKG }}/tests
            -Dsonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/*.test.mjs
        continue-on-error: true

      - name: Download Dependency Check report
        uses: actions/download-artifact@v8
        with:
          name: dependency-check-report-react-router
          path: dependency-check-reports/
        continue-on-error: true

      - name: SonarQube Server Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SERVER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=toggly-sdks-react-router
            -Dsonar.projectName="Toggly SDKs - React Router"
            -Dsonar.sources=${{ env.SDK_ROOT }}/${{ env.PKG }}/src
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/*.test.mjs,**/tests/**/*.cjs,**/*.config.js,**/*.config.ts,**/fixtures/**
            -Dsonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/*.test.mjs,**/tests/**/*.cjs,**/*.config.js,**/*.config.ts,**/fixtures/**
            -Dsonar.javascript.lcov.reportPaths=coverage/all-lcov.info
            -Dsonar.tests=${{ env.SDK_ROOT }}/${{ env.PKG }}/tests
            -Dsonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/*.test.mjs
            -Dsonar.dependencyCheck.reportPath=dependency-check-reports/dependency-check-report.xml
        continue-on-error: true

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache OWASP Dependency Check database
        uses: actions/cache@v6
        with:
          path: /home/runner/OWASP-Dependency-Check/data/
          key: dependency-check-db-${{ runner.os }}-v6
          restore-keys: |
            dependency-check-db-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'toggly-sdks-react-router'
          path: ${{ env.SDK_ROOT }}
          format: 'ALL'
          args: >-
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableExperimental
            --disableAssembly
            --disableRubygems
            --disableBundleAudit
            --disablePyPkg
            --disablePyDist
        continue-on-error: true

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report-react-router
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
        continue-on-error: true

  summary:
    name: Analysis Summary
    runs-on: ubuntu-latest
    needs: [build-shared-js-deps, build-and-test, packed-host, sonar, dependency-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify required jobs passed
        uses: ./.github/actions/verify-required-jobs
        with:
          needs-json: ${{ toJSON(needs) }}
          required-jobs: build-shared-js-deps,build-and-test,packed-host

      - name: Generate summary
        run: |
          echo "## React Router SDK Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Analysis workflow completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Package Analyzed" >> $GITHUB_STEP_SUMMARY
          echo "- @ops-ai/react-router-toggly" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Node.js Versions Tested" >> $GITHUB_STEP_SUMMARY
          echo "- 18.x, 20.x, 22.x" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packed Hosts" >> $GITHUB_STEP_SUMMARY
          echo "- router7-react18 (Node 20)" >> $GITHUB_STEP_SUMMARY
          echo "- router8-react19 (Node 22)" >> $GITHUB_STEP_SUMMARY
