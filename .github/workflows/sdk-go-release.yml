name: Go SDK - Release

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'publish = use manifest version; auto_bump = legacy CI bump'
        required: false
        default: 'publish'
        type: choice
        options:
          - publish
          - auto_bump
      bump_type:
        description: 'Bump type (only used when release_mode is auto_bump)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  SDK_ROOT: toggly-go

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      action: ${{ steps.release.outputs.action }}
      reason: ${{ steps.release.outputs.reason }}
      manifest_version: ${{ steps.release.outputs.manifest_version }}
      registry_latest: ${{ steps.release.outputs.registry_latest }}
      manifest_changed: ${{ steps.release.outputs.manifest_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        uses: ./.github/actions/resolve-release-version
        with:
          manifest_path: ${{ env.SDK_ROOT }}/VERSION
          registry: none
          package_name: toggly-go
          tag_prefix: go-sdk-v
          release_mode: ${{ github.event.inputs.release_mode || 'publish' }}
          bump_type: ${{ github.event.inputs.bump_type || 'patch' }}

  build-and-test:
    needs: validate
    if: needs.validate.outputs.action == 'publish'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.22', '1.23', '1.24']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        working-directory: ${{ env.SDK_ROOT }}
        run: go mod download

      - name: Verify dependencies
        working-directory: ${{ env.SDK_ROOT }}
        run: go mod verify

      - name: Build
        working-directory: ${{ env.SDK_ROOT }}
        run: go build ./...

      - name: Run tests
        working-directory: ${{ env.SDK_ROOT }}
        run: go test -v -race ./...
        continue-on-error: true

      - name: Vet
        working-directory: ${{ env.SDK_ROOT }}
        run: go vet ./...
        continue-on-error: true

  release:
    needs: [build-and-test, validate]
    if: needs.validate.outputs.action == 'publish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Configure git
        run: |
          git config user.name "${{ steps.import_gpg.outputs.name }}"
          git config user.email "${{ steps.import_gpg.outputs.email }}"

      - name: Commit version bump
        if: needs.validate.outputs.manifest_changed == 'true'
        run: |
          git add ${{ env.SDK_ROOT }}/VERSION
          git commit -S -m "Bumped Go SDK to v${{ needs.validate.outputs.version }} (auto_bump) [skip ci]"

          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if git pull --rebase --autostash origin develop; then
              if git push origin develop; then
                echo "Successfully pushed version bump"
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              sleep 2
            fi
          done

          echo "Failed to push after $MAX_RETRIES attempts"
          exit 1

      - name: Create and push tag
        run: |
          # Go modules in subdirectories use <subdir>/vX.Y.Z tag format
          git tag -s -m "Go SDK v${{ needs.validate.outputs.version }}" "toggly-go/v${{ needs.validate.outputs.version }}"
          git push origin "toggly-go/v${{ needs.validate.outputs.version }}"

      - name: Request Go module proxy update
        run: |
          GOPROXY=https://proxy.golang.org GO111MODULE=on \
            go list -m github.com/ops-ai/Toggly.FeatureManagement/toggly-go@v${{ needs.validate.outputs.version }} || true
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: toggly-go/v${{ needs.validate.outputs.version }}
          name: Go SDK v${{ needs.validate.outputs.version }}
          body: |
            ## Go SDK v${{ needs.validate.outputs.version }}

            ### Installation

            ```bash
            go get github.com/ops-ai/Toggly.FeatureManagement/toggly-go@v${{ needs.validate.outputs.version }}
            ```

            ### Features

            - Feature flag evaluation with targeting rules
            - Multiple storage backends (Redis, MongoDB, SQLite, PostgreSQL)
            - gRPC real-time metrics streaming
            - WebSocket support for live definition updates

            ### Requirements

            - Go 1.22+

            ### Links

            - [pkg.go.dev](https://pkg.go.dev/github.com/ops-ai/Toggly.FeatureManagement/toggly-go)
            - [Documentation](https://docs.toggly.io/docs/sdks/go)
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    needs: [release, validate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Go SDK Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Action | ${{ needs.validate.outputs.action }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Manifest | ${{ needs.validate.outputs.manifest_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry latest | ${{ needs.validate.outputs.registry_latest || 'none' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release mode | ${{ github.event.inputs.release_mode || 'publish' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ needs.validate.outputs.reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | toggly-go/v${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Module | github.com/ops-ai/Toggly.FeatureManagement/toggly-go |" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-release | ${{ github.event.inputs.prerelease }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View on pkg.go.dev](https://pkg.go.dev/github.com/ops-ai/Toggly.FeatureManagement/toggly-go)" >> $GITHUB_STEP_SUMMARY
