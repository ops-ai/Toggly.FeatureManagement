name: React Native SDK - Build & Publish All Packages

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'publish = use manifest version; auto_bump = legacy CI bump'
        required: false
        default: 'publish'
        type: choice
        options:
          - publish
          - auto_bump
      bump_type:
        description: 'Bump type (only used when release_mode is auto_bump)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      packages:
        description: 'Packages to release'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - core
          - react-native
          - storage-async
          - storage-mmkv

permissions:
  contents: write
  id-token: write

env:
  SDK_ROOT: Toggly.FeatureManagement.ReactNative/libs
  CORE_MANIFEST: Toggly.FeatureManagement.ReactNative/libs/core/package.json

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.release.outputs.action }}
      version: ${{ steps.release.outputs.version }}
      reason: ${{ steps.release.outputs.reason }}
      manifest_changed: ${{ steps.release.outputs.manifest_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve release version
        id: release
        uses: ./.github/actions/resolve-release-version
        with:
          manifest_path: ${{ env.CORE_MANIFEST }}
          registry: npm
          package_name: '@ops-ai/react-native-toggly-core'
          release_mode: ${{ github.event.inputs.release_mode || 'publish' }}
          bump_type: ${{ github.event.inputs.bump_type || 'patch' }}

      - name: Sync monorepo package versions
        if: steps.release.outputs.manifest_changed == 'true'
        run: |
          TARGET="${{ steps.release.outputs.version }}"
          for pkg in react-native storage-async storage-mmkv; do
            cd "${{ env.SDK_ROOT }}/$pkg"
            npm version "$TARGET" --no-git-tag-version --allow-same-version
          done

  publish:
    needs: validate
    if: needs.validate.outputs.action == 'publish'
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish selected packages
        run: |
          set -euo pipefail
          SELECTION="${{ github.event.inputs.packages || 'all' }}"
          TARGET="${{ needs.validate.outputs.version }}"

          publish_pkg() {
            local dir="$1"
            local npm_name="$2"
            local needs_core="$3"

            if [ "$SELECTION" != "all" ] && [ "$SELECTION" != "$dir" ]; then
              echo "Skipping $dir (not selected)"
              return 0
            fi

            echo "=== Publishing $dir ($npm_name) ==="
            cd "$GITHUB_WORKSPACE/${{ env.SDK_ROOT }}/$dir"

            VER=$(node -p "require('./package.json').version")
            if [ "$VER" != "$TARGET" ]; then
              echo "Note: $dir is at $VER (core resolved $TARGET); publishing this package's own version"
            fi

            if [ "$needs_core" = "true" ]; then
              cd "$GITHUB_WORKSPACE/${{ env.SDK_ROOT }}/core"
              npm ci || npm install
              npm run build
              cd "$GITHUB_WORKSPACE/${{ env.SDK_ROOT }}/$dir"
            fi

            npm ci || npm install
            npm run build
            npm test

            if npm view "${npm_name}@${VER}" version >/dev/null 2>&1; then
              echo "Skipping ${npm_name}@${VER} (already published)"
            else
              npm publish --provenance --access public || npm publish --access public
            fi
          }

          publish_pkg core @ops-ai/react-native-toggly-core false
          publish_pkg react-native @ops-ai/react-native-toggly true
          publish_pkg storage-async @ops-ai/react-native-toggly-storage-async true
          publish_pkg storage-mmkv @ops-ai/react-native-toggly-storage-mmkv true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        if: needs.validate.outputs.manifest_changed == 'true'
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "${{ steps.import_gpg.outputs.name }}"
          git config user.email "${{ steps.import_gpg.outputs.email }}"
          for pkg in core react-native storage-async storage-mmkv; do
            git add ${{ env.SDK_ROOT }}/$pkg/package.json
            git add ${{ env.SDK_ROOT }}/$pkg/package-lock.json 2>/dev/null || true
          done
          git commit -S -m "Bumped React Native SDK to v${{ needs.validate.outputs.version }} (auto_bump) [skip ci]"
          git pull --rebase --autostash origin develop && git push origin develop

  summary:
    if: always()
    needs: [validate, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## React Native SDK Release" >> $GITHUB_STEP_SUMMARY
          echo "| Action | ${{ needs.validate.outputs.action }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.validate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ needs.validate.outputs.reason }} |" >> $GITHUB_STEP_SUMMARY
